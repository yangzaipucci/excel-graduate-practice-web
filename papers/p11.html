%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":10,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"企业业务数据属于公司运营的核心数据（  ）。","answer":["A"],"dataset_description":null,"id":"p11:10","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>企业业务数据属于公司运营的核心数据\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"企业运营的业务数据","paragraphs":["订单、销售、生产、库存、物流等业务数据直接记录企业经营活动，是运营分析和决策的重要基础，因此题干判对。","它们仍可能存在缺失、口径差异或权限限制，重要不等于所有数据天然准确或可以随意使用。"],"warning":""},"attachments":[]},{"number":11,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"市场调查数据属于外部结构化数据（  ）。","answer":["A"],"dataset_description":null,"id":"p11:11","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>市场调查数据属于外部结构化数据\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据结构、数据库与存储","paragraphs":["结构化数据具有明确模式，如关系表的行列；半结构化数据有标签或键等组织方式，如 JSON、XML；非结构化数据如图片、音视频和自由文本。来源内部或外部与结构类型是两个不同维度。","NoSQL 常包括键值、文档、列族和图等模型，不是只能存文本或只能用表格。关系数据库以表和关系为主要模型，数据模型与物理存储方式不能混为一谈。","存储需兼顾容量扩展、检索效率、备份恢复、权限和安全；加密主要保护保密性，不能单靠更严格加密来解决容量增长。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"来源和结构分开看；NoSQL 不只键值一种。","source":""},"attachments":[]},{"number":12,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"迭代性在数据处理中指的是通过指定执行操作次数或步骤（  ）。","answer":["B"],"dataset_description":null,"id":"p11:12","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>迭代性在数据处理中指的是通过指定执行操作次数或步骤\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":13,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"市场份额、客户满意度、市场增长率用于反映企业在市场中的竞争力和发展潜力，利用数据图形能够直观展示它们的分布（  ）。","answer":["A"],"dataset_description":null,"id":"p11:13","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>市场份额、客户满意度、市场增长率用于反映企业在市场中的竞争力和发展潜力，利用数据图形能够直观展示它们的分布（ &nbsp;）。\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":14,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"饼图可以判断增加广告投放是否能有效提升销售额（  ）。","answer":["B"],"dataset_description":null,"id":"p11:14","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>饼图可以判断增加广告投放是否能有效提升销售额\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":15,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"定距尺度不仅可以做数字的加减,还可以做数字的乘除（  ）。","answer":["B"],"dataset_description":null,"id":"p11:15","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>定距尺度不仅可以做数字的加减,还可以做数字的乘除\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":16,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"一个统计指标应包括指标名称和指标数值（  ）。","answer":["A"],"dataset_description":null,"id":"p11:16","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>一个统计指标应包括指标名称和指标数值\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":17,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"计量尺度水平高级的类型可以用低级类型的分析方法（  ）。","answer":["A"],"dataset_description":null,"id":"p11:17","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>计量尺度水平\u003cspan>高级的类型可以用低级类型的分析方法\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"相对指标就是质量指标（  ）。","answer":["B"],"dataset_description":null,"id":"p11:18","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>相对指标就是质量指标\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"卡方分布的期望和方差都等于2倍自由度（ ）。","answer":["B"],"dataset_description":null,"id":"p11:19","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>卡方分布的期望和方差都等于2倍自由度（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"无论样本容量多大，简单随机抽样都不会偏向（  ）。","answer":["B"],"dataset_description":null,"id":"p11:20","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>无论样本容量多大，简单随机抽样都不会偏向（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"变异性是指构成总体的单位在同质性之外的其他方面要有差异（  ）。","answer":["A"],"dataset_description":null,"id":"p11:21","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>变异性是指构成总体的单位在同质性之外的其他方面要有差异（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"登记性误差属于错误判断事实或错误登记事实而发生的误差（  ）。","answer":["A"],"dataset_description":null,"id":"p11:22","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>登记性误差属于错误判断事实或错误登记事实而发生的误差（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本均值抽样分布的标准差等于总体标准差（  ）。","answer":["B"],"dataset_description":null,"id":"p11:23","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>样本均值抽样分布的标准差等于总体标准差\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本容量越小,总体离散程度越小,抽样误差越小（  ）。","answer":["B"],"dataset_description":null,"id":"p11:24","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>样本容量越小,总体离散程度越小,抽样误差越小\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"与简单随机抽样相比，整群抽样的工作量更大一些（  ）。","answer":["B"],"dataset_description":null,"id":"p11:25","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>与简单随机抽样相比，\u003c/span>\u003cspan>整群抽样的\u003c/span>\u003cspan>工作量\u003c/span>\u003cspan>更大一些\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"分层随机抽样在实际抽样调查中广泛使用，在相同样本容量的情况下，比纯随机抽样的精度低（  ）。","answer":["B"],"dataset_description":null,"id":"p11:26","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>分层随机抽样在实际抽样调查中广泛使用，在相同样本容量的情况下，比纯随机抽样的精度低（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"抽签法规定总体中的所有个体编号必须从1到N。","answer":["B"],"dataset_description":null,"id":"p11:27","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>抽签法规定总体中的所有个体编号必须从1到N。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"在判断抽样中，调查人员可根据他们的专业知识选择个体（  ）。","answer":["A"],"dataset_description":null,"id":"p11:28","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>在判断抽样中，调查人员可根据他们的专业知识选择个体（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"参数估计是根据样本估计总体的未知参数（ ）。","answer":["A"],"dataset_description":null,"id":"p11:29","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>参数估计是根据样本估计总体的未知参数（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"检验的临界值是根据p值来确定的（ ）。","answer":["B"],"dataset_description":null,"id":"p11:30","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>检验的\u003c/span>\u003cspan>临界值是根据\u003c/span>\u003cspan>p值\u003c/span>\u003cspan>来确定的\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"备择假设为\">\"形式的检验为左侧检验（ ）。","answer":["B"],"dataset_description":null,"id":"p11:31","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>备择假设为&quot;&gt;&quot;形式的检验为左侧检验（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"如果计算出的卡方值大于临界值,无法接受原假设（ ）。","answer":["A"],"dataset_description":null,"id":"p11:32","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>如果计算出的卡方值大于临界值,无法接受原假设\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"卡方统计量在左侧超越了显著水平，说明数据拟合的“特别不好”（ ）。","answer":["B"],"dataset_description":null,"id":"p11:33","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>卡方统计量在左侧超越了显著水平，说明数据拟合的“特别不好”\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"显著性水平越小，犯第一类错误的概率越小，但犯第二类错误的概率则随之增大（ ）。","answer":["A"],"dataset_description":null,"id":"p11:34","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>显著性水平越小，犯第一类错误的概率越小，但犯第二类错误的概率则随之增大（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验的两类错误","paragraphs":["第一类错误是原假设 H₀ 为真却拒绝它，也叫弃真，其概率通常用 α 表示。第二类错误是 H₀ 为假却未拒绝它，也叫取伪，其概率用 β 表示，检验功效为 1−β。","在样本量、效应大小和检验方案等条件固定时，降低 α 常会增加 β。增加有效样本量可以改善检验功效，不能说两类错误在任何情况下都固定互补或相加等于1。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"弃真 α；取伪 β；功效 1−β。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":35,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"云计算的服务可以不依赖网络（ ）。","answer":["B"],"dataset_description":null,"id":"p11:35","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>云计算的服务可以不依赖网络（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":36,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"由于大数据的数据量大导致价值隐藏在海量的数据中,使得大数据往往表现为“数据价值高,价值密度低”的情况（ ）。","answer":["A"],"dataset_description":null,"id":"p11:36","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>由于大数据的数据量大导致价值隐藏在海量的数据中,使得大数据往往表现为“数据价值高,价值密度低”的情况（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":37,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"网络是大数据最重要的来源之一，网络数据是真实的（ ）。","answer":["B"],"dataset_description":null,"id":"p11:37","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>网络是大数据最重要的来源之一，网络数据是真实的（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":38,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"约束条件的存在可以使得问题更加符合实际情况,避免优化模型得到不切实际的解（ ）。","answer":["A"],"dataset_description":null,"id":"p11:38","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>约束条件的存在可以使得问题更加符合实际情况,避免优化模型得到不切实际的解\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":39,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"多元回归中的系数一定是正的（  ）。","answer":["B"],"dataset_description":null,"id":"p11:39","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>多元回归中的系数一定是正的（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"相关关系一定是因果关系（ ）。","answer":["B"],"dataset_description":null,"id":"p11:40","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>相关关系一定是因果关系（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"协方差与相关系数","paragraphs":["协方差 Cov(X,Y)=E[(X−EX)(Y−EY)] 表示共同变化方向，但大小受单位影响。相关系数 r=Cov(X,Y)/(σXσY) 消除量纲，范围在−1到1之间，绝对值越大表示线性相关越强。","r>0 为同向，r\u003c0 为反向，r≈0 只表示线性关系弱，并不排除非线性关系，更不能推出独立；相关也不等于因果。","协方差矩阵对称，对角线是各变量方差，非对角线是成对协方差；方差非负，协方差可以为负。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"r 看符号和绝对值；相关≠因果，零相关≠没关系。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"以下不属于统计工作环节的是（  ）。","answer":["C"],"dataset_description":null,"id":"p11:41","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下不属于统计工作环节的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>统计设计\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>统计调查\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>统计报告\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>统计分析\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计工作的基本环节","paragraphs":["教材常按统计设计、统计调查、统计整理、统计分析划分工作环节；统计报告通常是分析的成果和表达形式。","在这套分类口径中，“统计报告”不是与其他环节并列的基本环节，选 C。不能据此理解为统计工作不需要报告。"],"warning":""},"attachments":[]},{"number":42,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下列关于数据筛选的描述，正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p11:42","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于数据筛选的描述，正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"满足条件的数据显示出来，而删除掉不满足条件的数据"},{"label":"B","html":"不满足条件的数据用另外一个表格保存"},{"label":"C","html":"不满足条件的数据暂时隐藏起来，只显示满足条件的数据"},{"label":"D","html":"将满足条件的数据重点显示"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：不满足条件的数据暂时隐藏起来，只显示满足条件的数据”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":43,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下列关于数据的说法,正确的是(  )。","answer":["B"],"dataset_description":null,"id":"p11:43","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于数据的说法,正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据是一种能量"},{"label":"B","html":"数据是对事物的描述"},{"label":"C","html":"数据是一种能源"},{"label":"D","html":"数据是一种物质"}],"explanation":{"topic":"数据是对事物的描述","paragraphs":["数据以数字、文字、图像、声音等符号记录事物的属性和事件，是对事物的描述，因此选 B。","数据常被比喻为资源或生产要素，但在本题定义上不能直接等同于物理意义的能量、能源或物质。"],"warning":""},"attachments":[]},{"number":44,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"下面对市场机会的分析观点中,正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p11:44","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下面对市场机会的分析观点中,正确的是( &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"潜在的吸引力"},{"label":"B","html":"成功的可能性"},{"label":"C","html":"成功的可能性和潜在的吸引力"},{"label":"D","html":"潜在的吸引力大,但成功的可能性小"}],"explanation":{"topic":"本题解析","paragraphs":["机会是否值得把握，既看市场的潜在吸引力，也看企业成功可能性，所以选 C。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"只讲吸引力，遗漏企业能否成功抓住机会。"},{"label":"B","selected":false,"reason":"只讲成功概率，遗漏机会本身是否足够有价值。"},{"label":"C","selected":true,"reason":"应同时评价机会价值与本企业成功可能性，两者缺一不可。"},{"label":"D","selected":false,"reason":"描述了一种高吸引力、低成功率的组合，不是完整的评价维度。"}]},"attachments":[]},{"number":45,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"为了识别和捕捉市场机会,数据分析人员利用数据分析手段对当前市场机会进行挖掘，筛选出需要分析的市场机会，那么它属于哪个类别（   ）。","answer":["A"],"dataset_description":null,"id":"p11:45","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>为了识别和捕捉市场机会,数据分析人员利用数据分析手段对当前市场机会进行挖掘，筛选出需要分析的市场机会，那么它属于哪个类别（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"细分定位"},{"label":"B","html":"外部环境"},{"label":"C","html":"主要特征"},{"label":"D","html":"内部组成"}],"explanation":{"topic":"本题解析","paragraphs":["题干强调挖掘并筛选值得进一步分析的市场机会，按题库的问题构建分类属于细分定位，选 A。"],"warning":"","optionAnalysis":[{"label":"A","selected":true,"reason":"题干强调挖掘、筛选机会，把宽泛问题收缩到可分析范围，按题库归为细分定位。"},{"label":"B","selected":false,"reason":"外部环境描述机会来源，未直接表达题干的筛选定位动作。"},{"label":"C","selected":false,"reason":"主要特征侧重描述对象，不是本题筛选机会的分类。"},{"label":"D","selected":false,"reason":"内部组成侧重拆解结构，不对应本题市场机会筛选。"}]},"attachments":[]},{"number":46,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"客户数据应当反映客户的基本情況，企业客户的数据中,姓名、性别、电子信箱等属于（   ）。","answer":["C"],"dataset_description":null,"id":"p11:46","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>客户数据应当反映客户的基本情況，企业客户的数据中,姓名、性别、电子信箱等属于（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"行为数据"},{"label":"B","html":"交易数据"},{"label":"C","html":"属性数据"},{"label":"D","html":"关系数据"}],"explanation":{"topic":"本题解析","paragraphs":["姓名、性别、邮箱描述客户自身基本特征，属于属性数据，选 C。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"行为应是访问、点击等动作，姓名性别不是动作。"},{"label":"B","selected":false,"reason":"交易应是订单、支付等记录，邮箱本身不是交易。"},{"label":"C","selected":true,"reason":"姓名、性别、邮箱描述客户本身的基本特征，属于属性。"},{"label":"D","selected":false,"reason":"关系数据描述人与人或客户与组织的联系，不是这里的基本资料。"}]},"attachments":[]},{"number":47,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在市场调查中，首要的工作是(    )。","answer":["B"],"dataset_description":null,"id":"p11:47","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>在市场调查中，首要的工作是( &nbsp; &nbsp;)。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"调查对象的确定"},{"label":"B","html":"调查问题确定和达到的目标"},{"label":"C","html":"调查方法选择与设计"},{"label":"D","html":"数据收集"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：调查问题确定和达到的目标”。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"下列图表中,可以清晰的反映出数据变化趋势的是（   ） 。","answer":["C"],"dataset_description":null,"id":"p11:48","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列图表中,可以清晰的反映出数据变化趋势的是（ &nbsp; ） 。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"直方图"},{"label":"B","html":"饼图"},{"label":"C","html":"折线图"},{"label":"D","html":"散点图"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：折线图”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"下面关于条形图的说法中，描述错误的是(   ) 。","answer":["D"],"dataset_description":null,"id":"p11:49","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下面关于条形图的说法中，描述错误的是( &nbsp; ) 。\u003c/span>\u003c/p>","options":[{"label":"A","html":"条形图是横置的柱形图"},{"label":"B","html":"条形图适用于矩形条数量过多的场景"},{"label":"C","html":"条形图可以反映不同分类数据间的差异"},{"label":"D","html":"条形图不能反映数据的多少"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：条形图不能反映数据的多少”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"下列符合定距尺度定义的是（    ）。","answer":["C"],"dataset_description":null,"id":"p11:50","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列符合定距尺度定义的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"人的成长阶段可以分为少年，青年，中年，老年"},{"label":"B","html":"佛教、基督教、伊斯兰教"},{"label":"C","html":"30℃和20℃相差10℃，-30℃和-20℃也是相差10℃"},{"label":"D","html":"根据产品的等级分为：优质、次品、残次品"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：30℃和20℃相差10℃，-30℃和-20℃也是相差10℃”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"总量指标包括时期指标和时点指标,下列选项中属于时期指标的是（   ）。","answer":["C"],"dataset_description":null,"id":"p11:51","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>总量指标包括时期指标和时点指标,下列选项中属于时期指标的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"物价指数"},{"label":"B","html":"固定资产总值"},{"label":"C","html":"产品产量"},{"label":"D","html":"年末人口数"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：产品产量”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"在企业中数据分析师对企业的一些业务指标进行统计,下列业务指标中能用数量表示的是（   ）。","answer":["C"],"dataset_description":null,"id":"p11:52","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>在企业中数据分析师对企业的一些业务指标进行统计,下列业务指标中能用数量表示的是（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"文化程度"},{"label":"B","html":"职业"},{"label":"C","html":"月工资"},{"label":"D","html":"行业"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：月工资”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"关于定距数据中两个数值的差值的说法，哪一个选项是正确的（    ）？","answer":["A"],"dataset_description":null,"id":"p11:53","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于定距数据中两个数值的差值的说法，哪一个选项是正确的（ &nbsp; &nbsp;）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"有意义"},{"label":"B","html":"无意义"},{"label":"C","html":"有时有意义,有时无意义"},{"label":"D","html":"无法判断是否有意义"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：有意义”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在大型调查时最常采用的一种抽样方法是（  ）。","answer":["A"],"dataset_description":null,"id":"p11:54","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>在大型调查时最常采用的一种抽样方法是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>多阶段抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>分层抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>单纯随机抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>系统抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：多阶段抽样”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于判断取样，以下描述不正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p11:55","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于判断取样，以下描述不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>由市场调查的专家依据自己的判断来选取样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>按照调查人员需要来选定样本的方法可以降低抽样误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>较好地满足了特殊的调查需要\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>调查人员的主观判断出现偏差导致判断抽样会发生较大的误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：按照调查人员需要来选定样本的方法可以降低抽样误差”。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于非参数统计量的是（  ）。","answer":["D"],"dataset_description":null,"id":"p11:56","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下不属于非参数统计量的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>中位数统计量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>百分位数统计量\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>比例统计量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>方差统计量\u003c/span>\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：方差统计量”。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于抽样调查的说法，正确的有（  ）。","answer":["B"],"dataset_description":null,"id":"p11:57","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于抽样调查的说法，正确的有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样调查具有周期性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样调查具有经济\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样调查一般需要规定统一的标准调查时间\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样调查只适用于某些特定领域\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样调查的经济性","paragraphs":["抽样调查只调查总体中的一部分单位，相比普查通常节省人力、物力和时间，因此 B 所说的经济性是其常见优点。","抽样调查不必都按固定周期开展，也不只适用于少数特定领域。是否设定统一标准时点取决于调查对象和设计，不能把普查的安排一概作为所有抽样调查的必要条件。"],"warning":""},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于描述总体平均数的指标是（  ）。","answer":["C"],"dataset_description":null,"id":"p11:58","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下不属于描述总体平均数的指标是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体算术平均数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体几何平均数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体众数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体加权平均数\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：总体众数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于卡方值统计量的描述不正确的是（   ）。","answer":["A"],"dataset_description":null,"id":"p11:59","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于卡方值统计量的描述不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"卡方值越大,表明实际观察次数与理论次数越接近"},{"label":"B","html":"卡方值=0,表示实际观察次数与理论次数完全吻合"},{"label":"C","html":"卡方值是度量实际观测次数与理论次数偏离程度的一个统计量"},{"label":"D","html":"卡方检验中,自由度为1时,需要对卡方值作连续性矫正"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：卡方值越大,表明实际观察次数与理论次数越接近”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于任意抽样的描述，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p11:60","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于任意抽样的描述，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>以便利为原则\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>具有\u003c/span>\u003cspan>偶然性\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>具有\u003c/span>\u003cspan>随意性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>成本高\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：成本高”。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计误差说法，正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p11:61","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于统计误差说法，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>系统误差影响稳定性,不影响准确性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>系统误差影响准确性,也影响准确性\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随机误差影响稳定性,不影响准确性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>随机误差影响稳定性,也影响准确性\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：随机误差影响稳定性,不影响准确性”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计量不正确是（  ）。","answer":["B"],"dataset_description":null,"id":"p11:62","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于统计量不正确是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>对样本数据进行分析的变量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>描述单个总体单位\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>检验总体参数的变量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>具有统计平均的意义\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：描述单个总体单位”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"一致性是指当样本的容量充分大时,样本统计量（   ）","answer":["D"],"dataset_description":null,"id":"p11:63","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>一致性是指当样本的容量充分大时,样本统计量（ &nbsp; ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"小于总体参数"},{"label":"B","html":"等于总体参数"},{"label":"C","html":"大于总体参数"},{"label":"D","html":"充分靠近总体参数"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：充分靠近总体参数”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在样本容量等于1的情况下，样本均值的抽样分布服从近似正态分布的条件是（ ）。","answer":["D"],"dataset_description":null,"id":"p11:64","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>在样本容量等于1的情况下，样本均值的抽样分布服从近似正态分布的条件是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体是任意分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体分布是对称的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>仅仅当总体数值为正时\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>仅当总体时正态分布时\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：仅当总体时正态分布时”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"调查中所产生的登记性误差是（  ）。","answer":["C"],"dataset_description":nu el":"A","html":"层内个体差异小，层间差异大"},{"label":"B","html":"层内个体差异大，层间差异小"},{"label":"C","html":"层内个体差异小，层间差异小"},{"label":"D","html":"层内个体差异大，层间差异大"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：层内个体差异小，层间差异大”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在计算标准误的公式中，如果抽样容量 n 固定，则（   ）。","answer":["B"],"dataset_description":null,"id":"p11:68","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>在计算标准误的公式中，如果抽样容量 n 固定，则（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"均值抽样误差与n的平方根成正比"},{"label":"B","html":"均值抽样误差与n的平方根成反比"},{"label":"C","html":"均值的抽样误差与标准差成反比"},{"label":"D","html":"均值的抽样误差与标准差和n的平方根都成正比"}],"explanation":{"topic":"标准误与标准差","paragraphs":["标准差描述一组观测值彼此有多分散；标准误描述一个统计量在重复抽样时有多波动，是统计量抽样分布的标准差。二者研究对象不同。","均值的标准误为 σ/√n，σ 未知时常以 s/√n 估计。其他条件相同，样本越大或总体越同质，标准误越小。样本量扩大到原来的4倍，标准误才缩小到一半。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：均值抽样误差与n的平方根成反比”。"],"tip":"标准差看个体差异；标准误看估计稳定性。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"某高校有2000名学生，其中男生占60%，女生占40%,文科学生和理科学生各占50%,用定额抽样方法依上述二个变量抽取一个规模为100人的样本，以下正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p11:69","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>某高校有2000名学生，其中男生占60%，女生占40%,文科学生和理科学生各占50%,用定额抽样方法依上述二个变量抽取一个规模为100人的样本，以下正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>样本中包含文科男30人，理科女20人\u003c/p>"},{"label":"B","html":"\u003cp>样本中包含文科男35人，理科女15人\u003c/p>"},{"label":"C","html":"\u003cp>样本中包含文科男25人，理科女25人\u003c/p>"},{"label":"D","html":"\u003cp>样本中包含文科男40人，理科女10人\u003c/p>"}],"explanation":{"topic":"双变量定额的条件","paragraphs":["样本100人，若按性别边际配额，应有男60、女40；按专业边际配额，文科50、理科50。","若额外假定性别与专业按比例交叉分配，文科男为100×60%×50%=30，理科女为100×40%×50%=20，与 A 一致。"],"warning":"仅给出两组边际比例，不能唯一确定交叉配额。A 需额外的独立或比例分配假设；原题条件不足，不能把30和20视为必然结论。"},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例的抽样分布,说法错误的是（ ）","answer":["A"],"dataset_description":null,"id":"p11:70","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于样本比例的抽样分布,说法错误的是（ ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本比例的均值等于样本比例的标准差"},{"label":"B","html":"样本比例的均值等于总体比例的均值"},{"label":"C","html":"如果总体比例为0.5，则样本比例的抽样分布图形是对称的"},{"label":"D","html":"如果总体比例偏离0.5，只要样本量足够大，则样本比例的抽样分布仍可近似正态分布"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：样本比例的均值等于样本比例的标准差”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在统计学中，误差描述了观测值与真实值之间的差异，以下说法不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p11:71","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>在统计学中，误差描述了观测值与真实值之间的差异，以下\u003cspan>说法\u003c/span>\u003cspan>不正确\u003c/span>\u003cspan>的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>系统误差是由非随机因素引起\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>系统误差通常\u003c/span>是可预测的、有规律的\u003c/p>"},{"label":"C","html":"\u003cp>随机误差在测量或观测过程中是不可避免的\u003c/p>"},{"label":"D","html":"\u003cp>随机误差是非独立的、可预测的\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：随机误差是非独立的、可预测的”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":72,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于样本平均数抽样分布说法，正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p11:72","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于样本平均数抽样分布说法，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样分布的均值不等于总体平均数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本容量相同且抽样方式相同，反复地抽取样本，获得平均数的分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>按照不相同的抽样方式，反复地抽取样本，获得平均数的分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>按照不相等的样本容量，反复地抽取样本，获得平均数的分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：样本容量相同且抽样方式相同，反复地抽取样本，获得平均数的分布”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":73,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"大样本下的样本比例的抽样分布服从（ ）。","answer":["A"],"dataset_description":null,"id":"p11:73","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>大样本下的样本比例的抽样分布服从（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"正态分布"},{"label":"B","html":"t分布"},{"label":"C","html":"F分布"},{"label":"D","html":"X2分布"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：正态分布”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于登记性误差的说法,正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p11:74","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于登记性误差的说法,正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>登记性误差主要是指在用样本数据进行推断时所产生的随机误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>登记性误差是调查者或被调查者的人为因素所造成的误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>登记性误差是不可以消除的\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>调查者造成的误差主要是有意虚报或虚报调查数据\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：登记性误差是调查者或被调查者的人为因素所造成的误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"总体的定义是指根据研究目的确定的（  ）。","answer":["C"],"dataset_description":null,"id":"p11:75","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>总体的定义是指根据研究目的确定的（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>所有样本的全体\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>观察单位的全体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>根据研究目的确定的同质观察单位的全体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>观察单位某种变异的集合\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：根据研究目的确定的同质观察单位的全体”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"构成总体的每个个体的特征是（ ）。","answer":["D"],"dataset_description":null,"id":"p11:76","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>构成\u003c/span>总体\u003cspan>的每个\u003c/span>个体\u003cspan>的\u003c/span>特征\u003cspan>是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>必须\u003c/span>完全相同\u003c/p>"},{"label":"B","html":"\u003cp>既可\u003cspan>以相同，\u003c/span>也可\u003cspan>以不同\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>完全不相同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>不\u003c/span>完全相同\u003cspan>但至少\u003c/span>有一个\u003cspan>方面相同\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：不完全相同但至少有一个方面相同”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"标准误的正确解释是（ ）。","answer":["A"],"dataset_description":null,"id":"p11:77","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>标准误的正确解释是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本均数的标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>标准差的平均数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>标准差的标准差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>统计量的标准差\u003c/span>\u003c/p>"}],"explanation":{"topic":"标准误与标准差","paragraphs":["标准差描述一组观测值彼此有多分散；标准误描述一个统计量在重复抽样时有多波动，是统计量抽样分布的标准差。二者研究对象不同。","均值的标准误为 σ/√n，σ 未知时常以 s/√n 估计。其他条件相同，样本越大或总体越同质，标准误越小。样本量扩大到原来的4倍，标准误才缩小到一半。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：样本均数的标准差”。"],"tip":"标准差看个体差异；标准误看估计稳定性。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"当样本容量足够大时，样本比例的抽样分布近似服从哪种分布？","answer":["A"],"dataset_description":null,"id":"p11:78","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>当样本容量足够大时，样本比例的抽样分布近似服从哪种分布？\u003c/p>\u003cp>\u003cbr>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>均匀分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>二项分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：正态分布”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于简单随机抽样的描述，错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p11:79","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于简单随机抽样的描述，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>每个样本单位被抽中的概率相等\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本单位之间完全独\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本间无一定的关联性和排斥性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>被抽取的样本的总体个数是无限的\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：被抽取的样本的总体个数是无限的”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"一个学校有1003位学生，现在需要从全校学生中采用随机起点等距抽样的方法抽取出100名学生作为调查样本，下列错误的做法是（  ）。","answer":["B"],"dataset_description":null,"id":"p11:80","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cstrong> \u003c/strong>\u003cspan>一个学校有1003位学生，现在需要从全校学生中采用随机起点等距抽样的方法抽取出100名学生作为调查样本，\u003c/span>\u003cspan>下列错误的做法是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>将随机剔除3名学生后的1000名学生随机分为100个组\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>保留3名学生，将其编入到最后面组\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本距离近似10\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>每隔10个编号抽取1个样本\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：保留3名学生，将其编入到最后面组”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"反映抽样指标与总体指标之间抽样误差可能范围的指标是（ ）。","answer":["B"],"dataset_description":null,"id":"p11:81","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>反映抽样指标与总体指标之间抽样误差可能范围的指标是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样平均误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样极限误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样误差系数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>概率度\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：抽样极限误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本方差的抽样分布服从（ ）。","answer":["A"],"dataset_description":null,"id":"p11:82","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>样本方差的抽样分布服从（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>均匀分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>未知分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：正态分布”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"对于相关系数的描述，以下哪种说法正确（  ）。","answer":["B"],"dataset_description":null,"id":"p11:83","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>对于相关系数的描述，以下哪种说法正确（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>相关系数越接近0，相关性程度越高\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>相关系数的绝对值越大，相关性的程度越高\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>相关系数越接近-1,相关度越弱\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>相关系数越接近1,相关度越弱\u003c/span>\u003c/p>"}],"explanation":{"topic":"协方差与相关系数","paragraphs":["协方差 Cov(X,Y)=E[(X−EX)(Y−EY)] 表示共同变化方向，但大小受单位影响。相关系数 r=Cov(X,Y)/(σXσY) 消除量纲，范围在−1到1之间，绝对值越大表示线性相关越强。","r>0 为同向，r\u003c0 为反向，r≈0 只表示线性关系弱，并不排除非线性关系，更不能推出独立；相关也不等于因果。","协方差矩阵对称，对角线是各变量方差，非对角线是成对协方差；方差非负，协方差可以为负。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：相关系数的绝对值越大，相关性的程度越高”。"],"tip":"r 看符号和绝对值；相关≠因果，零相关≠没关系。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"无限总体是指（  ）。","answer":["C"],"dataset_description":null,"id":"p11:84","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>无限总体是指（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>包含单位很多的总体\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>包含单位较多的单位\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>包含单位很多，且难以计数的总体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>单位不加限制的总体\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：包含单位很多，且难以计数的总体”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下述关于抽样误差的说法，哪一个选项是错误的（ ）。","answer":["D"],"dataset_description":null,"id":"p11:85","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下述关于抽样误差的说法，哪一个选项是错误的（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"抽样误差无法避免"},{"label":"B","html":"抽样误差与总体分布有关，总体方差越大，抽样误差就越大"},{"label":"C","html":"抽样误差与样本容量有关"},{"label":"D","html":"在其他条件相同情况下，样本量越大，抽样误差就越大"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：在其他条件相同情况下，样本量越大，抽样误差就越大”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于统计总体大量性的说法，正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p11:86","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下面关于统计总体大量性的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>少数单位组成\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>许多单位组成\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>个别事物也能构成总体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>要求具有绝对单位数量\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：许多单位组成”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"所谓（   ）就是进行推断时的可靠程度的大小。","answer":["B"],"dataset_description":null,"id":"p11:87","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>所谓（ &nbsp; ）就是进行推断时的可靠程度的大小。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可信度"},{"label":"B","html":"置信度"},{"label":"C","html":"置信区间"},{"label":"D","html":"区间估计"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：置信度”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布的说法错误的是（ ）。","answer":["C"],"dataset_description":null,"id":"p11:88","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于F分布的说法错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F分布有分母的自由度\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布有分子自由度\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F分布应该集中在0左右\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>F分布的概率密度函数在整个轴上呈偏态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：F分布应该集中在0左右”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本容量越小,抽样误差（   ）","answer":["C"],"dataset_description":null,"id":"p11:89","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>样本容量越小,抽样误差（ &nbsp; ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"不变"},{"label":"B","html":"越小"},{"label":"C","html":"越大"},{"label":"D","html":"无规律"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：越大”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":90,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于统计量的有效性，错误的是（  ）。","answer":["C"],"dataset_description":null,"id":"p11:90","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于统计量的有效性，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>统计量的值越靠近目标，效果越有效\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>这个“靠近”可以用方差来衡量\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>有效性和无偏性是相同的概念\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>如果系统误差在可接受的范围内，有效性高也是不错的选择\u003c/span>\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：有效性和无偏性是相同的概念”。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":91,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"从服从正态分布的无限总体抽取样本,当样本容量增大时,样本均值的数学期望（ ）和标准差（ ）。","answer":["B"],"dataset_description":null,"id":"p11:91","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>从服从正态分布的无限总体抽取样本,当样本容量增大时,样本均值的数学期望（ ）和标准差（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>保持不变；增加\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>保持不变；减小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>增加;保持不变\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>减小;保持不变\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：保持不变；减小”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于样本量叙述正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p11:92","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于样本量叙述正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本量宜大不宜小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本量是否足够大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本量足量就好\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本量大小由调查可行性决定\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：样本量足量就好”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于临界点的说法正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p11:93","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于临界点的说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"临界值越大，则对应的不确定性因素越敏感"},{"label":"B","html":"临界值越小，则对应的不确定性因素越敏感"},{"label":"C","html":"临界点百分比越大，则对应的不确定性因素越敏感"},{"label":"D","html":"临界点百分比越小，则对应的不确定性因素越敏感"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：临界点百分比越小，则对应的不确定性因素越敏感”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下述对矩估计法的表述，错误的选项是（   ）。","answer":["B"],"dataset_description":null,"id":"p11:94","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下述对矩估计法的表述，错误的选项是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"矩估计法直观，简便，不需要知道总体的分布"},{"label":"B","html":"矩估计法不需要总体原点矩的存在"},{"label":"C","html":"如果原点矩不存在，则无法使用矩估计法"},{"label":"D","html":"矩估计法可以实现对总体数学期望和方差进行估计"}],"explanation":{"topic":"矩估计与样本矩","paragraphs":["k 阶原点矩是 E(Xᵏ)，样本原点矩为 ΣXᵢᵏ/n；k 阶中心矩围绕均值计算，样本中心矩为 Σ(Xᵢ−X̄)ᵏ/n。第一阶原点矩就是样本均值，第一阶中心矩为0。","矩估计把总体矩中的未知参数与对应样本矩相等，解出参数估计。它属于点估计，不是根据“最可能产生数据”的原则选参数，后者属于极大似然估计。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：矩估计法不需要总体原点矩的存在”。"],"tip":"原点矩围绕0；中心矩围绕均值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{
