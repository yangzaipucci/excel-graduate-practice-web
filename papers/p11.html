paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：原假设H0，通常是希望出现的结果”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于假说演绎法的叙述，错误的是（ ）","answer":["A"],"dataset_description":null,"id":"p11:100","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于假说演绎法的叙述，错误的是（ ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan> \u003c/span>无论实验结果与预期结论是否相符，不影响假说的正确性\u003c/p>"},{"label":"B","html":"\u003cp>通过实验检验演绎推理的结论\u003c/p>"},{"label":"C","html":"\u003cp>实验结果与预期结论相符，只能说明假说在该实验条件下成立，不能完全证明其绝对正确\u003c/p>"},{"label":"D","html":"\u003cp>在观察和分析基础上提出问题，通过推理提出解释问题的假说\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：无论实验结果与预期结论是否相符，不影响假说的正确性”。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":101,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"进行假设检验时，对选取的统计量说法，不正确的是(   )。","answer":["B"],"dataset_description":null,"id":"p11:101","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>进行假设检验时，对选取的统计量说法，不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"是样本的函数"},{"label":"B","html":"不能包含总体分布中的任何参数"},{"label":"C","html":"可以包含总体分布中的已知参数"},{"label":"D","html":"其值可以由取定的样本值计算出来"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：不能包含总体分布中的任何参数”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":102,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于假设检验的陈述中，正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p11:102","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下面关于假设检验的陈述中，正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"假设检验中如果结果拒绝了原假设,就说明备择假设一定是对的"},{"label":"B","html":"假设检验中如果接受了原假设,则原假设就一定是对的"},{"label":"C","html":"当拒绝原假设时,只能认为接受它的根据尚不充分,而不能认为它绝对错误"},{"label":"D","html":"假设检验中如果接受了原假设,则备择假设一定错误"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：当拒绝原假设时,只能认为接受它的根据尚不充分,而不能认为它绝对错误”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于大数据叙述，不正确的一项是(    )。","answer":["D"],"dataset_description":null,"id":"p11:103","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于大数据叙述，不正确的一项是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>大数据通常指无法在可承受时间范围内用常规工具进行抓取、管理和处理的数据集合\u003c/p>"},{"label":"B","html":"\u003cp>大数据不仅包含海量数据，还包含多种复杂类型的数据\u003c/p>"},{"label":"C","html":"\u003cp>大数据的核心价值之一在于对海量数据进行及时有效的分析\u003c/p>"},{"label":"D","html":"\u003cp>大数据仅指数据量大，不涉及数据类型和速度等其他特征\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：大数据仅指数据量大，不涉及数据类型和速度等其他特征”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于云计算技术的发展与运用来源的说法，不正确的选项是（   ）。","answer":["D"],"dataset_description":null,"id":"p11:104","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp> \u003cspan>下列关于云计算技术的发展与运用来源的说法，不正确的选项是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"并行计算"},{"label":"B","html":"网格计算"},{"label":"C","html":"分布式计算"},{"label":"D","html":"超级计算"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：超级计算”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"大数据最显著的特征是（  ）。","answer":["D"],"dataset_description":null,"id":"p11:105","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>大数据最显著的特征是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"密度高"},{"label":"B","html":"类型多"},{"label":"C","html":"计算速度快"},{"label":"D","html":"数据规模大"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：数据规模大”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"云计算包括3种类型。面向所有用户提供服务，只要是注册付费的用户都可以使用，这种云计算属于（    ）。","answer":["C"],"dataset_description":null,"id":"p11:106","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>云计算包括3种类型。面向所有用户提供服务，只要是注册付费的用户都可以使用，这种云计算属于（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"独立云"},{"label":"B","html":"私有云"},{"label":"C","html":"公有云"},{"label":"D","html":"混合云"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：公有云”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于大数据的叙述中，（  ）是不恰当的。","answer":["D"],"dataset_description":null,"id":"p11:107","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于大数据的叙述中，（ &nbsp;）是不恰当的。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据是仅靠现有数据库管理工具或传统数据处理系统很难处理的大型而复杂的数据集"},{"label":"B","html":"大数据具有数据体量巨大、数据类型繁多、处理速度快等特性"},{"label":"C","html":"大数据的战略意义是实现数据的增值"},{"label":"D","html":"大数据研究中，数据之间的因果关系比关联关系更重要"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：大数据研究中，数据之间的因果关系比关联关系更重要”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于大数据存储容量单位的说法，错误的是（  ）。","answer":["C"],"dataset_description":null,"id":"p11:108","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于大数据存储容量单位的说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"一个汉字字符需要 2 个字节的存储空间"},{"label":"B","html":"基本存储容量单位是字节"},{"label":"C","html":"汉字字符存储空间要小于英文字符存储空间"},{"label":"D","html":"一个英文字符需要1 个字节的存储空间"}],"explanation":{"topic":"数据容量单位","paragraphs":["bit 是二进制位，byte 是字节，1 byte=8 bit。常见单位从小到大为 B、KB、MB、GB、TB、PB、EB、ZB、YB，不要把位与字节混为一谈。","严格的十进制前缀每级1000，二进制前缀 KiB、MiB、GiB 每级1024。教材和操作系统有时用 KB/MB 表示1024倍关系，做题时需结合选项约定，而不能认为两种口径永远相同。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：汉字字符存储空间要小于英文字符存储空间”。"],"tip":"B 与 b 不同；K→M→G→T→P→E。","source":""},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于决策树的错误描述是（  ）。","answer":["A"],"dataset_description":null,"id":"p11:109","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于决策树的错误描述是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"决策树本质上是一个循环结构"},{"label":"B","html":"根节点的位置一般位于顶部"},{"label":"C","html":"根节点没有输入，但有输出"},{"label":"D","html":"叶节点有输入，但无输出"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：决策树本质上是一个循环结构”。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列选项中，关于逻辑回归的说法不正确是（  ）。","answer":["C"],"dataset_description":null,"id":"p11:110","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列选项中，关于逻辑回归的说法不正确是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"逻辑回归是分类算法"},{"label":"B","html":"逻辑回归利用了回归的思想"},{"label":"C","html":"\u003cp>逻辑回归的决策边界一定是线性的\u003c/p>"},{"label":"D","html":"\u003cp>逻辑回归使用 Sigmoid 函数对线性结果做概率映射\u003c/p>"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：逻辑回归的决策边界一定是线性的”。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":111,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列有关梯度下降法的说法不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p11:111","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列有关梯度下降法的说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"梯度是标量仅有大小，没有方向"},{"label":"B","html":"梯度是一个向量"},{"label":"C","html":"一维搜索确定步长"},{"label":"D","html":"梯度下降法沿着负梯度方向进行下一步探索"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：梯度是标量仅有大小，没有方向”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":112,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"对一个求目标函数最大的混合整数规划问题，以下观点不正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p11:112","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>对一个求目标函数最大的混合整数规划问题，以下观点不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"其线性规划松弛问题的最优解可能是该整数规划问题的最优解"},{"label":"B","html":"该问题可行解的个数是有限的"},{"label":"C","html":"任一可行解的目标函数值不可能大于其线性规划松弛问题的目标函数值"},{"label":"D","html":"该问题可行解中可能存在不取整数值的变量"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：该问题可行解的个数是有限的”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下关于朴素贝叶斯说法，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p11:113","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于朴素贝叶斯说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"朴素贝叶斯是基于贝叶斯理论建立的一种用于简单分类的算法"},{"label":"B","html":"其前置模型是特征值条件独立"},{"label":"C","html":"基本思想是对于给定的待分类项，求解在此项出现的条件下，统计计算各个类别出现的概率，取出现最大概率的作为此待分类项类别"},{"label":"D","html":"对缺失数据比较敏感，算法比较简单，常用于文本分类，欺诈检测"}],"explanation":{"topic":"朴素贝叶斯分类","paragraphs":["贝叶斯分类按后验概率 P(类别|特征) 选择类别。朴素贝叶斯的“朴素”是给定类别后，各特征条件独立的假设，并非无条件要求所有特征彼此独立。","后验与“类别先验×各特征条件概率的乘积”成比例；取对数可避免很小概率连乘下溢，平滑可处理零频次。它既可二分类，也可多分类。","训练不需要复杂的迭代求最优边界，但预测仍需参数估计；相关特征可能削弱独立假设，不能据此断言算法完全不能用。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：对缺失数据比较敏感，算法比较简单，常用于文本分类，欺诈检测”。"],"tip":"给定类别后条件独立；先验×似然比后验。","source":""},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下关于最小二乘法的叙述，不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p11:114","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于最小二乘法的叙述，不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"它是使总离差的平方和最小的一种计算方法"},{"label":"B","html":"用最小二乘法求出的系数可以使回归直线更贴近实际情况"},{"label":"C","html":"由观察值使用最小二乘法求出的系数叫做回归系数"},{"label":"D","html":"根据最小二乘法求出回归系数，从而可以表示出回归直线方程，这个方程可以代表每个数据的准确值"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：根据最小二乘法求出回归系数，从而可以表示出回归直线方程，这个方程可以代表每个数据的准确值”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于逻辑回归算法，以下描述不正确的是（   ）。","answer":["B"],"dataset_description":null,"id":"p11:115","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于逻辑回归算法，以下描述不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"逻辑回归是一种有监督学习方法"},{"label":"B","html":"逻辑回归仅能解决二分类问题"},{"label":"C","html":"逻辑回归训练问题是凸优化问题"},{"label":"D","html":"逻辑回归训练问题能采用梯度下降策略求解"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：逻辑回归仅能解决二分类问题”。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于系统优化的叙述中,不正确的是 ( )。","answer":["C"],"dataset_description":null,"id":"p11:116","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于系统优化的叙述中,不正确的是 ( )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可以运用数学模型对问题进行优化"},{"label":"B","html":"系统优化时需要对结果进行完善和验证"},{"label":"C","html":"通过优化的目标与决策变量可以计算出满意解"},{"label":"D","html":"有时通过估算也可以实现系统优化"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：通过优化的目标与决策变量可以计算出满意解”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下关于分支界定法的说法，正确的是（  )。","answer":["B"],"dataset_description":null,"id":"p11:117","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于分支界定法的说法，正确的是（ &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"最大值问题的目标值是各分支的下界"},{"label":"B","html":"最大值问题的目标值是各分支的上界"},{"label":"C","html":"最小值问题的目标值是各分支的上界"},{"label":"D","html":"最小值问题的目标值是各分支的边界"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：最大值问题的目标值是各分支的上界”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"在我国法律体系中，效力等级仅次于宪法的是（   ）。","answer":["A"],"dataset_description":null,"id":"p11:118","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>在我国法律体系中，效力等级仅次于宪法的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"法律"},{"label":"B","html":"行政法规"},{"label":"C","html":"规章"},{"label":"D","html":"地方性法规"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：法律”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"《个人信息保护法》的通过时间（  ）。","answer":["C"],"dataset_description":null,"id":"p11:119","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>《个人信息保护法》的通过时间（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"2019"},{"label":"B","html":"2020"},{"label":"C","html":"2021"},{"label":"D","html":"2022"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：2021”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"在数字经济领域，网络效应和马太效应会造成赢家通吃的的现象，导致数据资源采集渠道被少数互联网巨头掌握，在逐利动机下，数据控制者拒绝数据开放共享，这被称之为（   ）。","answer":["C"],"dataset_description":null,"id":"p11:120","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>在数字经济领域，网络效应和马太效应会造成赢家通吃的的现象，导致数据资源采集渠道被少数互联网巨头掌握，在逐利动机下，数据控制者拒绝数据开放共享，这被称之为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据泄漏"},{"label":"B","html":"数据滥用"},{"label":"C","html":"数据垄断"},{"label":"D","html":"数据民主"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：数据垄断”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"加快数字化发展,建设数字中国。以下哪些内容是加快数字化发展建设数字中国中提出的任务（   ）。","answer":["B","C","D","E"],"dataset_description":null,"id":"p11:121","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>加快数字化发展,建设数字中国\u003c/span>\u003cspan>。\u003c/span>\u003cspan>以下哪些内容是加快数字化发展建设数字中国中提出的任务（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"打造网络经济新优势。"},{"label":"B","html":"加快数字社会建设步伐。"},{"label":"C","html":"提高数字政府建设水平。"},{"label":"D","html":"营造良好数字生态。"},{"label":"E","html":"打造数字经济新优势。"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、D、E。对应内容为“B：加快数字社会建设步伐。；C：提高数字政府建设水平。；D：营造良好数字生态。；E：打造数字经济新优势。”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"下列各项中，哪些是属于企业业务层面的指标（   ）？","answer":["D","E"],"dataset_description":null,"id":"p11:122","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列各项中，哪些是属于企业业务层面的指标（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"经营目标"},{"label":"B","html":"资产目标"},{"label":"C","html":"战略目标"},{"label":"D","html":"企业所有产品的销售目标"},{"label":"E","html":"企业产品在各地区的销售目标"}],"explanation":{"topic":"本题解析","paragraphs":["企业业务层将公司方向分解到具体产品和地区的销售目标，因此选 D、E。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"经营目标偏企业总体，未具体分解到产品或地区。"},{"label":"B","selected":false,"reason":"资产目标偏企业整体资源和财务目标。"},{"label":"C","selected":false,"reason":"战略目标属于更高层方向，尚未细化为业务目标。"},{"label":"D","selected":true,"reason":"按企业产品分解销售目标，体现业务层。"},{"label":"E","selected":true,"reason":"进一步按地区分解产品销售目标，仍体现具体业务层。"}]},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"下列选项中（     ）不是日期型数据","answer":["A","B","D","E"],"dataset_description":null,"id":"p11:123","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列选项中（ &nbsp; &nbsp; ）不是日期型数据\u003c/span>\u003c/p>","options":[{"label":"A","html":"@January10,2023@"},{"label":"B","html":"#January10,2023#"},{"label":"C","html":"”January10,2023”"},{"label":"D","html":"&January10;,2023"},{"label":"E","html":"*January10,2023*"}],"explanation":{"topic":"Excel 单元格、文件与基本操作","paragraphs":["Excel 的 A1 引用方式以字母表示列、数字表示行，例如 D4 表示第4列第4行，连续区域用冒号连接。现代 .xlsx 工作表共有1,048,576行、16,384列。","日期通常以序列数保存，显示格式只改变外观；时间是一天的小数部分，显示文本与真实日期值需区分。自动填充可快速生成日期序列。",".xlsx 是常见无宏工作簿格式，.xlsm 可保存宏，.xls 为旧格式。CSV/TXT 适合平面文本数据，通常不能完整保留多工作表、图表和格式。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、D、E。对应内容为“A：@January10,2023@；B：#January10,2023#；D：&January10,2023&；E：*January10,2023*”。多选题应检查所有选项，不能只选其中一项。"],"tip":"列字母、行数字；显示格式和单元格实际值分开看。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"下面属于定距尺度的有哪些（   ）。","answer":["A","B"],"dataset_description":null,"id":"p11:124","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下面属于定距尺度的有哪些（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"智商"},{"label":"B","html":"温度"},{"label":"C","html":"班级"},{"label":"D","html":"收入"},{"label":"E","html":"籍贯"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B。对应内容为“A：智商；B：温度”。多选题应检查所有选项，不能只选其中一项。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于简单随机抽样的观点，正确的是（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p11:125","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于简单随机抽样的观点，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本是从总体中逐个抽取的\u003c/span>\u003cspan> \u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽取的\u003c/span>\u003cspan>样本数小于等于样本总体的个数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本间无一定的关联性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>被抽取的样本的总体个数是有限的\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>每个样本单位被抽中的概率相\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：样本是从总体中逐个抽取的；B：抽取的样本数小于等于样本总体的个数；C：样本间无一定的关联性；D：被抽取的样本的总体个数是有限的；E：每个样本单位被抽中的概率相”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"样本均值的抽样分布与总体均值之间的关系，以下描述正确的是（ ）。","answer":["A","C"],"dataset_description":null,"id":"p11:126","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>样本均值的抽样分布与总体均值之间的关系，以下描述正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>在重复抽样条件下，样本均值的方差等于总体方差的1/n\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本方差等于总体方差的1/n\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本均值的期望值等于总体均值\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本均值恰好等于总体均值\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本均值的方差等于总体方差\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C。对应内容为“A：在重复抽样条件下，样本均值的方差等于总体方差的1/n；C：样本均值的期望值等于总体均值”。多选题应检查所有选项，不能只选其中一项。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于样本的说法,不正确的是（  ）。","answer":["A","D"],"dataset_description":null,"id":"p11:127","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下关于样本的说法,不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本容量不可以估计\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本来自的总体应该是同质的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本中应有足够的个体数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本来自的总体中不能有变异存在\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本是从总体中随机抽取的\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、D。对应内容为“A：样本容量不可以估计；D：样本来自的总体中不能有变异存在”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本统计量的抽样分布的观点,下面说法正确的是（   ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p11:128","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于样本统计量的抽样分布的观点,下面说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本统计量所有可能取值的概率分布"},{"label":"B","html":"统计量是随机变量"},{"label":"C","html":"不同样本，统计量取值不同"},{"label":"D","html":"包括期望和方差"},{"label":"E","html":"统计量是样本的函数"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：样本统计量所有可能取值的概率分布；B：统计量是随机变量；C：不同样本，统计量取值不同；D：包括期望和方差；E：统计量是样本的函数”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于非参数统计叙述中不正确的是（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p11:129","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于非参数统计叙述中不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>对总体分布类型有严格规定\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>适用范围较窄\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>要求总体服从特定的分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>要求\u003c/span>\u003cspan>样本量大\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>要求总体分布均匀\u003c/span>\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、C、D、E。对应内容为“A：对总体分布类型有严格规定；B：适用范围较窄；C：要求总体服从特定的分布；D：要求样本量大；E：要求总体分布均匀”。多选题应检查所有选项，不能只选其中一项。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计抽样的描述，正确的是（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p11:130","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于统计抽样的描述，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>能够\u003c/span>\u003cspan>精确地控制抽样风险\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>需要特殊的专业技能\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>能够\u003c/span>\u003cspan>高效地设计样本\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>能够\u003c/span>\u003cspan>定量评价样本的结果\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>需要增加额外费用\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：能够精确地控制抽样风险；B：需要特殊的专业技能；C：能够高效地设计样本；D：能够定量评价样本的结果；E：需要增加额外费用”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于非参数统计量的是（  ）。","answer":["A","B","C"],"dataset_description":null,"id":"p11:131","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下属于非参数统计量的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>中位数统计量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>百分位数统计量\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>比例统计量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>方差统计量\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>均值统计量\u003c/span>\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：中位数统计量；B：百分位数统计量；C：比例统计量”。多选题应检查所有选项，不能只选其中一项。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于分层抽样的说法，正确的是（  ）。","answer":["A","C","E"],"dataset_description":null,"id":"p11:132","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于分层抽样的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>适用于总体有足够的标志信息\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>适用于层内各单位的差异尽可能大，不同层之间各单位的差异尽可能小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>每层都要抽取一定的样本\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>估计量误差大于整群抽样\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>估计量误差小于简单随机抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、E。对应内容为“A：适用于总体有足够的标志信息；C：每层都要抽取一定的样本；E：估计量误差小于简单随机抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于总体和样本说法错误是（    ）。","answer":["D","E"],"dataset_description":null,"id":"p11:133","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于总体和样本说法错误是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"总体的指标称为参数"},{"label":"B","html":"\u003cp>样本的指标称为统计量\u003c/p>"},{"label":"C","html":"\u003cp>总体中随机抽取的部分观察单位组成了样本\u003c/p>"},{"label":"D","html":"\u003cp> 总体中随机抽取的部分观察单位的变量值组成了样本\u003c/p>"},{"label":"E","html":"\u003cp> 总体中随意抽取的部分观察单位的变量值组成了样本\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D、E。对应内容为“D：总体中随机抽取的部分观察单位的变量值组成了样本；E：总体中随意抽取的部分观察单位的变量值组成了样本”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下说法正确的有（  ）。","answer":["A","C","D"],"dataset_description":null,"id":"p11:134","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下说法正确的有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>对于无限总体而言，抽样总是可以认为是重复抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>对于无限总体而言，抽样总是可以认为是不重复抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>对于无限总体而言，它没有重复抽样和不重复抽样的区别\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>对于有限总体而言，它有重复抽样和不重复抽样的区别\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>以上说法均正确\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、D。对应内容为“A：对于无限总体而言，抽样总是可以认为是重复抽样；C：对于无限总体而言，它没有重复抽样和不重复抽样的区别；D：对于有限总体而言，它有重复抽样和不重复抽样的区别”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"统计推断是统计工作的主要内容之一，下列说法中正确的有(    )。","answer":["A","B","C","D"],"dataset_description":null,"id":"p11:135","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>统计推断是统计工作的主要内容之一，下列说法中正确的有( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"统计推断是通过样本信息来推断总体特征"},{"label":"B","html":"参数估计和假设检验是统计推断的两个重要方面"},{"label":"C","html":"参数估计是通过样本推断总体特征"},{"label":"D","html":"假设检验常用来判断样本与样本,样本与总体差异的引发原因"},{"label":"E","html":"假设检验是用来检验参数估计的准确程度"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：统计推断是通过样本信息来推断总体特征；B：参数估计和假设检验是统计推断的两个重要方面；C：参数估计是通过样本推断总体特征；D：假设检验常用来判断样本与样本,样本与总体差异的引发原因”。多选题应检查所有选项，不能只选其中一项。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于样本均值服从正态分布的观点,说法正确的是（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p11:136","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下列关于样本均值服从正态分布的观点,说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>总体分布是正态分布，样本量为30以上的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>总体分布是正态分布，样本量在20以下的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>总体分布是非正态分布，样本量为30以上的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>总体分布为未知分布，样本量为30以上的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>总体分布非正态分布，样本容量在30以下的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：总体分布是正态分布，样本量为30以上的抽样下，样本均值服从正态分布；B：总体分布是正态分布，样本量在20以下的抽样下，样本均值服从正态分布；C：总体分布是非正态分布，样本量为30以上的抽样下，样本均值服从正态分布；D：总体分布为未知分布，样本量为30以上的抽样下，样本均值服从正态分布”。多选题应检查所有选项，不能只选其中一项。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"下面关于数据安全防护技术的说法，正确的有（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p11:137","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>下面关于数据安全防护技术的说法，正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据漏扫"},{"label":"B","html":"数据库加密"},{"label":"C","html":"数据脱敏"},{"label":"D","html":"数据库安全运维"},{"label":"E","html":"数据清洗"}],"explanation":{"topic":"数据结构、数据库与存储","paragraphs":["结构化数据具有明确模式，如关系表的行列；半结构化数据有标签或键等组织方式，如 JSON、XML；非结构化数据如图片、音视频和自由文本。来源内部或外部与结构类型是两个不同维度。","NoSQL 常包括键值、文档、列族和图等模型，不是只能存文本或只能用表格。关系数据库以表和关系为主要模型，数据模型与物理存储方式不能混为一谈。","存储需兼顾容量扩展、检索效率、备份恢复、权限和安全；加密主要保护保密性，不能单靠更严格加密来解决容量增长。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：数据漏扫；B：数据库加密；C：数据脱敏；D：数据库安全运维”。多选题应检查所有选项，不能只选其中一项。"],"tip":"来源和结构分开看；NoSQL 不只键值一种。","source":""},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"关于聚类,下列说法正确的是（   ）。","answer":["A","B","D","E"],"dataset_description":null,"id":"p11:138","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>关于聚类,下列说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"聚类属于无监督算法"},{"label":"B","html":"聚类可用于数据预处理中的数据离散化"},{"label":"C","html":"聚类的划分原则是样本距离最小化"},{"label":"D","html":"聚类是根据数据相似度进行样本分组的方法"},{"label":"E","html":"聚类的算法训练样本往往都不含有标签"}],"explanation":{"topic":"聚类与 K 均值","paragraphs":["聚类是按相似性把对象分组的无监督学习，通常不依赖预先标好的类别。分类则学习已标注样本的类别规律，二者目标和训练信息不同。","K 均值先选 K 个中心，反复把样本分给最近中心，再以簇内均值更新中心，通常降低簇内平方距离和。需预先给 K，可能依赖初值、落入局部最优，对尺度和离群值敏感。","它偏好近似球状、尺度相近的数值簇，不能认为对任意形状、任意非数值数据都直接适用。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D、E。对应内容为“A：聚类属于无监督算法；B：聚类可用于数据预处理中的数据离散化；D：聚类是根据数据相似度进行样本分组的方法；E：聚类的算法训练样本往往都不含有标签”。多选题应检查所有选项，不能只选其中一项。"],"tip":"聚类无标签；K 均值：分配→更新，初值和尺度重要。","source":""},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"以下属于司法解释的有（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p11:139","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>以下属于司法解释的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"《关于审理使用人脸识别技术处理个人信息相关民事案件适用法律若干问题的规定》"},{"label":"B","html":"《关于审理利用信息网络侵害人身权益民事纠纷案件适用法律若干问题的规定》"},{"label":"C","html":"《关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》"},{"label":"D","html":"《关于办理非法利用信息网络、帮助信息网络犯罪活动等刑事案件适用法律若干问题的解释》"},{"label":"E","html":"《移动互联网应用程序信息服务管理规定》"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：《关于审理使用人脸识别技术处理个人信息相关民事案件适用法律若干问题的规定》；B：《关于审理利用信息网络侵害人身权益民事纠纷案件适用法律若干问题的规定》；C：《关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》；D：《关于办理非法利用信息网络、帮助信息网络犯罪活动等刑事案件适用法律若干问题的解释》”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"算法（  ）是一个重要的大数据伦理命题，因为其关涉人类的知情利益和主体地位。","answer":["A","B"],"dataset_description":null,"id":"p11:140","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>算法（ &nbsp;）是一个重要的大数据伦理命题，因为其关涉人类的知情利益和主体地位。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可解释性"},{"label":"B","html":"透明性"},{"label":"C","html":"安全性"},{"label":"D","html":"可控性"},{"label":"E","html":"可信赖性"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B。对应内容为“A：可解释性；B：透明性”。多选题应检查所有选项，不能只选其中一项。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“data10.xlsx”中表格“Sheet1”第4列的编号为（）。","answer":["A"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p11:141","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>文件“data10.xlsx”中表格“Sheet1”第4列的编号为（）。\u003c/p>","options":[{"label":"A","html":"D"},{"label":"B","html":"4"},{"label":"C","html":"四"},{"label":"D","html":"IV"}],"explanation":{"topic":"A1 引用中的列编号","paragraphs":["Excel 默认用字母编号列：第1列 A、第2列 B、第3列 C、第4列 D。因此第4列的编号是 D，选 A。","数字4是列的序号，不是 A1 样式显示的列名；IV 是旧版 Excel 的最后一列，不是第4列。"],"tip":"列用字母，行用数字。","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p11/data10.xlsx"}]},{"number":142,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":2,"question":"在Excel中将文件\"data10.xlsx\"的工作表\"Sheet1\"导出为JSON格式的方法是：","answer":["C"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p11:142","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>在Excel中将文件&quot;data10.xlsx&quot;的工作表&quot;Sheet1&quot;导出为JSON格式的方法是：\u003c/p>","options":[{"label":"A","html":"右键点击工作表标签，选择“另存为”，选择JSON格式并保存"},{"label":"B","html":"使用函数“TO_JSON”，指定工作表和输出位置即可转换为JSON格式"},{"label":"C","html":"在Excel中没有直接将工作表转换为JSON的功能，需要使用第三方插件或软件"},{"label":"D","html":"将工作表复制到记事本中，修改文件类型为JSON并保存"}],"explanation":{"topic":"工作表导出 JSON","paragraphs":["按题目所指的常规 Excel 桌面版“另存为”功能，JSON 不是标准工作表另存为类型，因此选 C：需要插件、脚本或其他转换工具。","CSV 是分隔文本而非 JSON；把文件后缀改成 .json 也不会自动生成 JSON 对象。不同版本或附加工具可能提供扩展导出能力。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p11/data10.xlsx"}]},{"number":143,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":3,"question":"文件“data10.xlsx”中的“Sheet1”中“classify”的异常值（数值大于5）的数据有几行（）。","answer":["C"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p11:143","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>文件“data10.xlsx”中的“Sheet1”中“classify”的异常值（数值大于5）的数据有几行（）。\u003c/p>","options":[{"label":"A","html":"2"},{"label":"B","html":"1"},{"label":"C","html":"0"},{"label":"D","html":"3"}],"explanation":{"topic":"按条件统计异常值","paragraphs":["classify 在 E 列，原素材最大值为3。使用 =COUNTIF(E2:E501,\">5\") 统计大于5的记录，结果0，选 C。","“大于5”不含等于5；本题数的是满足条件的数据行，不是缺失单元格数量。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p11/data10.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"data10.xlsx\"的工作表\"Sheet1\"中，计算高盛股票（GS.N）的中位数。请选择以下哪个选项作为正确答案？","answer":["A"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p11:144","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>在文件&quot;data10.xlsx&quot;的工作表&quot;Sheet1&quot;中，计算高盛股票（GS.N）的中位数。请选择以下哪个选项作为正确答案？\u003c/p>","options":[{"label":"A","html":"149.335"},{"label":"B","html":"119.335"},{"label":"C","html":"116.25"},{"label":"D","html":"118.25"}],"explanation":{"topic":"高盛股价中位数","paragraphs":["GS.N 位于 C 列，使用 =MEDIAN(C2:C501)，结果149.335，选 A。","500个数排序后，取第250与251个的平均；中位数对极端值通常比算术平均数更稳健。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p11/data10.xlsx"}]},{"number":145,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":5,"question":"文件“data10.xlsx”中的“Sheet1”中将A列Date按照“年-月”的方式，重新在F列中操作，列名为“年月”，使用函数TEXT将A列中的“年月日”转换为“年月”，数据格式为“yyyy-mm”。在新的工作表中创建数据透视图，轴(类别)选择“年月”，值（平均值项）选择“AMZN.O”，值（平均值项）选择“GS.N”，值（平均值项）选择“SPY”，” AMZN.O”最高的一月的“GS.N”和“SPY”分别为（）。","answer":["B"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p11:145","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>\u003cspan>文件“data10.xlsx”中的“Sheet1”中将A列Date按照“年-月”的方式，重新在F列中操作，列名为“年月”，使用函数TEXT将A列中的“年月日”转换为“年月”，数据格式为“yyyy-mm”。在新的工作表中创建数据透视图，轴(类别)选择“年月”，值（平均值项）选择“AMZN.O”，值（平均值项）选择“GS.N”，值（平均值项）选择“SPY”，” AMZN.O”最高的一月的“GS.N”和“SPY”分别为（）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"GS.N：200.47，SPY：120.82"},{"label":"B","html":"GS.N：100.47，SPY：120.82"},{"label":"C","html":"GS.N：120.47，SPY：120.82"},{"label":"D","html":"GS.N：140.47，SPY：120.82"}],"explanation":{"topic":"日期分组与数据透视分析","paragraphs":["用 TEXT 生成年月，以年月为行，对 AMZN.O、GS.N、SPY 同时求平均；按 AMZN.O 的月均值降序。","取 AMZN.O 月均值最高的那一月，在同一行读取 GS.N≈100.47、SPY≈120.82，选 B。这里不是三种资产各自最高月份的拼接。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p11/data10.xlsx"}]},{"number":146,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":6,"question":"假设在Excel文件\"data10.xlsx\"工作表\"Sheet2\"中，A1单元格到A10单元格中依次填写的是2023年1月1日到1月10日的日期。现在要计算这段时间内的工作天数，不包括周六周日，且需要排除2023年1月8日这一天，那么以下哪个公式可以达到目的？","answer":["C"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p11:146","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>假设在Excel文件&quot;data10.xlsx&quot;工作表&quot;Sheet2&quot;中，A1单元格到A10单元格中依次填写的是2023年1月1日到1月10日的日期。现在要计算这段时间内的工作天数，不包括周六周日，且需要排除2023年1月8日这一天，那么以下哪个公式可以达到目的？\u003c/p>","options":[{"label":"A","html":"\u003cp>=NETWORKDAYS(A1,A10)\u003c/p>"},{"label":"B","html":"\u003cp>=NETWORKDAYS(A1:A10)\u003c/p>"},{"label":"C","html":"\u003cp>=NETWORKDAYS(A1,A10,A8)\u003c/p>"},{"label":"D","html":"\u003cp>=NETWORKDAYS.INTL(A1:A10,{&quot;1/9/2023&quot;})\u003c/p>"}],"explanation":{"topic":"NETWORKDAYS 工作日计数","paragraphs":["NETWORKDAYS 包含起止日期，但剔除周末和指定假期。=NETWORKDAYS(A1,A10,A8) 明确排除 A8，符合题意，选 C。","2023年1月1日至10日的工作日是2、3、4、5、6、9、10日，共7天；1月8日本来就是周日。"],"tip":"","warning":"本题等值情况：即使不额外传入 A8，结果也为7。C 显式表达排除指定假期，不能说不带假期参数的公式在此例一定算错。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p11/data10.xlsx"}]},{"number":147,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":7,"question":"文件“data10.xlsx”中的“Sheet1”，date为横轴，查看“AMZN.O”数据分布的条形图，应为（）。","answer":["B"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p11:147","paperId":"p11","paperTitle":"研究生 Excel 冲刺题","question_html":"\u003cp>文件“data10.xlsx”中的“S   const PREFIX='excel-practice:v1:';
  function same(a,b){return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&[...a].sort().join('|')===[...b].sort().join('|');}
  function grade(questions,answers){
    const details=questions.map(q=>{const selected=Array.isArray(answers[q.id])?answers[q.id]:[];return {id:q.id,selected,correct:same(selected,q.answer),blank:selected.length===0};});
    const correct=details.filter(x=>x.correct).length,blank=details.filter(x=>x.blank).length;
    return {total:details.length,correct,blank,incorrect:details.length-correct-blank,score:details.length?Math.round(correct/details.length*10000)/100:0,details,wrongIds:details.filter(x=>!x.correct).map(x=>x.id)};
  }
  function updateWrongs(existing,questions,answers,now){
    const result=JSON.parse(JSON.stringify(existing||{}));
    for(const d of grade(questions,answers).details){
      const old=result[d.id];
      if(d.correct){if(old)result[d.id]={...old,masteredAt:now,lastReviewed:now,reviews:(old.reviews||0)+1};}
      else result[d.id]={id:d.id,wrongCount:(old?.wrongCount||0)+1,firstWrong:old?.firstWrong||now,lastWrong:now,lastReviewed:now,reviews:(old?.reviews||0)+1,masteredAt:null,lastSelection:d.selected};
    }
    return result;
  }
  function validAnswers(questions,answers){const out={};for(const q of questions){const allowed=new Set(q.options.map(o=>o.label));let selected=Array.isArray(answers?.[q.id])?[...new Set(answers[q.id])].filter(x=>allowed.has(x)):[];if(q.type!=='多选题')selected=selected.slice(0,1);if(selected.length)out[q.id]=selected;}return out;}
  return {PREFIX,same,grade,updateWrongs,validAnswers};
});

function clearWrongDialog(){showDialog('清空全部错题？','<p>将清空全部试卷的待复习错题、已掌握历史，以及未完成的错题重刷进度。此操作无法直接撤销。</p><p>各套试卷的考试进度、考试成绩和背题进度会保留。建议先导出备份。</p>','<button class="btn" data-action="export">先导出备份</button><button class="btn" data-action="close-dialog">取消</button><button class="btn danger" data-action="confirm-clear-wrongs">确认清空全部错题</button>');}

function masteredWrongs(paperId){const w=wrongs();return Object.keys(w).filter(id=>all[id]&&w[id].masteredAt&&(!paperId||all[id].paperId===paperId)).sort((a,b)=>w[b].masteredAt-w[a].masteredAt);}

function topbar(){const home=D.page==='paper'?'../index.html':'index.html',wrong=D.page==='paper'?'../wrongs.html':'wrongs.html';return `<header class="topbar"><a class="brand" href="${home}"><span class="mark">E</span><span>Excel 研习室</span></a><nav class="toplinks"><a href="${home}">全部试卷</a><a href="${wrong}">错题本</a></nav></header>`;}

}

const p=paper(),isWrong=D.page==='wrongs',active=activeWrongs(isWrong?null:p.id),mastered=masteredWrongs(isWrong?null:p.id),draft=safeState(read('session:'+scope,null));
root.innerHTML=`<div class="shell">${topbar()}<main class="intro"><div class="eyebrow">${isWrong?'专项复习':'独立试卷'}</div><h1>${isWrong?'我的错题本':esc(p.title)}</h1><p class="muted">${isWrong?'把做错的题，再认真做对一次。答对会标为已掌握，历史不丢失。':'背题模式直接学习答案和解析；考试模式隐藏答案，交卷后统一评分。两种模式分别保存进度。'}</p>${notice()}${isWrong?`<div class="wrong-stats"><span class="pill">待复习 ${active.length} 题</span><span class="pill">已掌握 ${mastered.length} 题</span></div>${draft&&!draft.submitted?`<div class="panel"><h2>上次的错题练习还没完成</h2><p class="muted">已答 ${Object.keys(draft.answers).length} / ${draft.ids.length} 题</p><button class="btn primary" data-action="resume">继续重刷</button></div>`:''}<div class="actions">${active.length?'<button class="btn primary" data-action="begin-wrongs">重刷全部待复习错题</button><button class="btn" data-action="study-wrongs">背错题 · 看解析</button>':''}</div>${!active.length?`<div class="empty">${mastered.length?'当前错题都已掌握。可以在下面把想复习的题重新加入。':'还没有错题。先去做一套试卷，交卷后会自动收录。'}</div>`:''}<div class="actions"><button class="btn danger" data-action="clear-wrongs">清空全部错题</button></div><div class="history-list"><h2>待复习题目</h2>${active.length?wrongHistory(active):'<p class="muted">暂无待复习题目</p>'}</div>${mastered.length?`<details class="panel"><summary>已掌握历史 · ${mastered.length} 题</summary>${wrongHistory(mastered)}</details>`:''}`:`${draft?`<div class="panel"><h2>${draft.submitted?'上次练习已交卷':'继续上次练习'}</h2><p class="muted">已答 ${Object.keys(draft.answers).length} / ${draft.ids.length} 题 · 用时 ${time(draft.elapsedMs)}</p><button class="btn primary" data-action="resume">${draft.submitted?'查看上次成绩':'继续作答'}</button></div>`:''}<div class="panel"><h2>开始一次新练习</h2><label class="choice"><input type="radio" name="range" value="all" checked>整套试卷 <small>148 题</small></label><label class="choice"><input type="radio" name="range" value="operations">只刷操作题 <small>第 141—148 题，共 8 题</small></label><div class="actions"><button class="btn primary" data-action="begin-study">背题模式 · 答案与解析</button><button class="btn" data-action="begin-paper">考试模式 · 开始作答</button>${active.length?`<button class="btn" data-action="begin-wrongs">本卷错题 · ${active.length}</button>`:''}</div></div>`}<div class="panel"><h2>本次计分规则</h2><p class="muted">每题等权，答对题数 ÷ 本次题数 × 100。多选题全部选对才得分，未答计 0 分。成绩为练习分，不采用原网站未核实的考试题型权重。</p></div><a href="${isWrong?'index.html':'../index.html'}">← 返回全部试卷</a></main></div>`;

function begin(ids,kind,confirmed=false){
studying=false;
if(!ids.length){toast('当前没有待复习错题');return;}
const old=safeState(read('session:'+scope,null));
if(old&&!old.submitted&&!confirmed){showDialog('开始新的练习？','<p>这会替换当前未交卷的作答进度。已保存的错题与历史成绩会继续保留。</p>','<button class="btn" data-action="close-dialog">保留当前进度</button><button class="btn primary" data-action="confirm-new">开始新练习</button>');pending={ids,kind};return;}

}

r)?'回答正确':selected.length?'回答错误':'未作答'}</b></p><p>你的答案：${selected.length?selected.join('、'):'未答'}<br>${q.explanation?.warning?'原站答案（请看核对提示）':'正确答案'}：${q.answer.join('、')}</p><small>答案来源：网站官方答案标记</small></div>${explanation(q)}`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="previous" ${state.index===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="grid">答题卡</button><button class="btn primary" data-action="next" ${show&&state.index===ids.length-1?'disabled':''}>${!show&&state.index===ids.length-1?'检查交卷':'下一题'}</button></nav>`;

function studyMove(n){studyIndex=Math.max(0,Math.min(studyIds.length-1,n));write('study:'+scope,{id:studyIds[studyIndex],at:Date.now()});renderStudy();window.scrollTo(0,0);}
function renderStudy(){const q=all[studyIds[studyIndex]];write('study:'+scope,{id:q.id,at:Date.now()});root.innerHTML=`<div class="shell"><header class="quiz-head"><div class="quiz-head-row"><div><div class="quiz-title">${esc(q.paperTitle)} · 背题模式</div><div class="quiz-meta">第 ${studyIndex+1} / ${studyIds.length} 题 · 背题不计分，不改变考试进度或错题状态</div></div><button class="btn small" data-action="intro">退出背题</button></div><div class="progress-track"><span style="width:${(studyIndex+1)/studyIds.length*100}%"></span></div></header><main class="question-wrap">${notice()}<div class="q-label"><span class="number">${q.number}</span><span class="pill">${esc(q.type)}</span></div><div class="q-source">${esc(q.book)} 第 ${q.chapter} 章</div>${q.dataset_description?`<details class="dataset"><summary>操作题说明与 Excel 素材</summary><p>${esc(q.dataset_description)}</p>${q.attachments.map(a=>`<a download href="${esc(a.href)}">下载 ${esc(a.name)} ↗</a>`).join('')}</details>`:''}<section class="question-text">${q.question_html}</section><div class="options">${q.options.map(o=>`<div class="option ${studyReveal&&q.answer.includes(o.label)?'is-correct':''}"><span class="option-letter">${esc(o.label)}</span><div class="option-content">${o.html}</div>${studyReveal&&q.answer.includes(o.label)?'<span class="option-tag">正确选项</span>':''}</div>`).join('')}</div><button class="btn" data-action="study-reveal">${studyReveal?'隐藏答案和解析 · 自测':'显示答案和解析'}</button>${studyReveal?`<div class="review-note"><b>${q.explanation?.warning?'原站答案（请看核对提示）':'正确答案'}：${q.answer.join('、')}</b></div>${explanation(q)}`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="study-prev" ${studyIndex===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="study-grid">背题目录</button><button class="btn primary" data-action="study-next" ${studyIndex===studyIds.length-1?'disabled':''}>下一题</button></nav>`;}

function exportProgress(){const backup={format:'excel-practice-backup',version:1,createdAt:Date.now(),entries:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(P))backup.entries[k.slice(P.length)]=JSON.parse(localStorage.getItem(k));}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Excel刷题进度与错题备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出，可保存到手机文件');}
async function importProgress(file){try{if(!file||file.size>10000000)throw Error('备份文件过大或未选择');const b=JSON.parse(await file.text());if(b.format!=='excel-practice-backup'||b.version!==1||!b.entries||typeof b.entries!=='object')throw Error('这不是本程序的备份文件');const checked={};for(const [k,v] of Object.entries(b.entries)){if(k==='wrongs'){if(!v||Array.isArray(v)||typeof v!=='object')throw Error('错题数据格式不正确');checked[k]={};for(const [id,w] of Object.entries(v)){if(!all[id]||w?.id!==id||!Number.isFinite(w.wrongCount)||w.wrongCount<1)throw Error('备份包含未知题目');checked[k][id]={id,wrongCount:w.wrongCount,firstWrong:Number(w.firstWrong)||Date.now(),lastWrong:Number(w.lastWrong)||Date.now(),lastReviewed:Number(w.lastReviewed)||Date.now(),reviews:Number(w.reviews)||0,masteredAt:w.masteredAt?Number(w.masteredAt):null,lastSelection:Array.isArray(w.lastSelection)?w.lastSelection.filter(x=>all[id].options.some(o=>o.label===x)):[]};}}else if(k.startsWith('study:')&&(papers.some(p=>k==='study:'+p.id)||k==='study:all-wrongs')){if(!v||!all[v.id])throw Error('背题进度格式不正确');checked[k]={id:v.id,at:Number(v.at)||Date.now()};}else if(k.startsWith('session:')&&(papers.some(p=>k==='session:'+p.id)||k==='session:all-wrongs')){if(v===null)continue;const s=safeState(v);if(!s)throw Error('作答进度格式不正确');checked[k]=s;}else if(k.startsWith('history:')&&(papers.some(p=>k==='history:'+p.id)||k==='history:all-wrongs')){if(!Array.isArray(v)||v.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100||!Number.isFinite(x.total)))throw Error('成绩记录格式不正确');checked[k]=v.slice(0,20);}}
pendingImport=checked;showDialog('导入备份',`<p>将导入 ${Object.keys(checked.wrongs||{}).length} 道错题历史，并恢复备份中的作答进度。</p><p class="muted">备份中的同名记录会覆盖当前记录。建议先导出当前备份。</p>`,'<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-import">确认导入</button>');}catch(e){toast('无法导入：'+e.message);}}
let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
