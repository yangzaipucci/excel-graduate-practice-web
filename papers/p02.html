对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：根据专业知识确定”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":95,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于假设检验的说法，错误的是（   ）。","answer":["B"],"dataset_description":null,"id":"p02:95","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于假设检验的说法，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"作出“接受原假设”决策时意味着没有充分的理由认为原假设是错误的"},{"label":"B","html":"作出“不能拒绝原假设”决策时意味着原假设正确"},{"label":"C","html":"作出“不能拒绝原假设”决策时可能会犯第二类错误"},{"label":"D","html":"作出“拒绝原假设”决策时可能会犯第一类错误"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：作出“不能拒绝原假设”决策时意味着原假设正确”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":96,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于假设检验的两类错误，下列说法不正确的有（    ）","answer":["B"],"dataset_description":null,"id":"p02:96","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于假设检验的两类错误，下列说法不正确的有（ &nbsp; &nbsp;）\u003c/span>\u003c/p>","options":[{"label":"A","html":"第一类错误被称为弃真错误"},{"label":"B","html":"第一类错误被称为取伪错误"},{"label":"C","html":"第二类错误是原假设不正确，但却被接受的错误"},{"label":"D","html":"第一类错误是原假设正确，但却被拒绝的错误"}],"explanation":{"topic":"假设检验的两类错误","paragraphs":["第一类错误是原假设 H₀ 为真却拒绝它，也叫弃真，其概率通常用 α 表示。第二类错误是 H₀ 为假却未拒绝它，也叫取伪，其概率用 β 表示，检验功效为 1−β。","在样本量、效应大小和检验方案等条件固定时，降低 α 常会增加 β。增加有效样本量可以改善检验功效，不能说两类错误在任何情况下都固定互补或相加等于1。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：第一类错误被称为取伪错误”。"],"tip":"弃真 α；取伪 β；功效 1−β。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":97,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"以下关于F检验法的说法正确的有（   ）。","answer":["C"],"dataset_description":null,"id":"p02:97","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下关于F检验法的说法正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>通过比较两组分别来自正态总体样本数据的方差S，来确定它们的方差是否有显著性差异\u003c/p>"},{"label":"B","html":"\u003cp>要在一定的置信度和相应的自由度的情况下查F值表\u003c/p>"},{"label":"C","html":"\u003cp>如果F统计值＞F临界值，说明方差存在显著性差异\u003c/p>"},{"label":"D","html":"\u003cp>如果F统计值＜F临界值，说明方差存在显著性差异\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：如果F统计值＞F临界值，说明方差存在显著性差异”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":98,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"当对正态总体均值检验时，如果总体方差未知，则应该进行（   ）。","answer":["C"],"dataset_description":null,"id":"p02:98","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>当对正态总体均值检验时，如果总体方差未知，则应该进行（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"Z检验"},{"label":"B","html":"F检验"},{"label":"C","html":"T检验"},{"label":"D","html":"卡方检验"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：T检验”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":99,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"拒绝域是用来判断是否接受原假设H0的数量界限，下面说法错误的是（   ）。","answer":["C"],"dataset_description":null,"id":"p02:99","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>拒绝域是用来判断是否接受原假设H\u003c/span>\u003cspan>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>的数量界限，下面说法错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"当由样本值计算的具有统计量落入该区域内，则拒绝原假设H\u003csub>0\u003c/sub>"},{"label":"B","html":"当由样本值计算的具有统计量落入该区域内，接受备择假设H\u003csub>1\u003c/sub>"},{"label":"C","html":"当计算的检验统计量落入该区域外，则不拒绝备择假设H\u003csub>1\u003c/sub>"},{"label":"D","html":"拒绝域的边界值称为临界值"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：当计算的检验统计量落入该区域外，则不拒绝备择假设H1”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于假设检验的说法中,下面正确的是(    )。","answer":["C"],"dataset_description":null,"id":"p02:100","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于假设检验的说法中,下面正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"做显著性检验的目的就是为了接受原假设"},{"label":"B","html":"一旦检验法选择正确,计算没有错误,就不会作出错误判断"},{"label":"C","html":"一旦样本容量一定,犯第一类错误和第二类错误的概率不可能同时减小"},{"label":"D","html":"显著性水平就是原假设为真时,接受原假设的概率"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：一旦样本容量一定,犯第一类错误和第二类错误的概率不可能同时减小”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":101,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于统计推断，下面说法正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p02:101","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于统计推断，下面说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"区间估计不属于统计推断的内容"},{"label":"B","html":"区间估计用于推断总体参数间是否有质的区别"},{"label":"C","html":"区间估计可以完全替代假设检验"},{"label":"D","html":"假设检验的结论是具有概率性的，存在犯错误的可能"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：假设检验的结论是具有概率性的，存在犯错误的可能”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":102,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"统计推断是用样本信息推断总体特征，这是指（    ），它是统计学的核心内容。","answer":["C"],"dataset_description":null,"id":"p02:102","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>统计推断是用样本信息推断总体特征，这是指（ &nbsp; &nbsp;），它是统计学的核心内容。\u003c/span>\u003c/p>","options":[{"label":"A","html":"总体参数的估计"},{"label":"B","html":"假设检验"},{"label":"C","html":"选项A和选项B"},{"label":"D","html":"选项A或选项B"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：选项A和选项B”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下面关于大数据特点的描述，正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p02:103","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下面关于大数据特点的描述，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据体量巨大，数据处理速度快，数据价值密度高"},{"label":"B","html":"数据处理速度快，数据真实，结构化数据为主"},{"label":"C","html":"数据体量巨大，数据处理速度快，数据真实"},{"label":"D","html":"数据体量巨大，数据真实，结构化数据为主"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：数据体量巨大，数据处理速度快，数据真实”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"关于大数据的典型特征，以下说法不正确的是（    )。","answer":["C"],"dataset_description":null,"id":"p02:104","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于大数据的典型特征，以下说法不正确的是（ &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"容量大"},{"label":"B","html":"速度快"},{"label":"C","html":"周期长"},{"label":"D","html":"价值密度低"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：周期长”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"云计算通常通过(     )来提供动态易扩展且经常是虚拟化的资源。","answer":["B"],"dataset_description":null,"id":"p02:105","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>云计算通常通过( &nbsp; &nbsp; )来提供动态易扩展且经常是虚拟化的资源。\u003c/span>\u003c/p>","options":[{"label":"A","html":"局域网"},{"label":"B","html":"互联网"},{"label":"C","html":"服务器"},{"label":"D","html":"软件"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：互联网”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于“大数据”特点的叙述，不正确的是(    )。","answer":["A"],"dataset_description":null,"id":"p02:106","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于“大数据”特点的叙述，不正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据的值特别巨大"},{"label":"B","html":"数据的量特别巨大"},{"label":"C","html":"数据的更新速度快"},{"label":"D","html":"数据的来源特别广"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：数据的值特别巨大”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于云计算的说法不正确的是(   )？","answer":["B"],"dataset_description":null,"id":"p02:107","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于云计算的说法不正确的是( &nbsp; )？\u003c/span>\u003c/p>","options":[{"label":"A","html":"云计算实现了IT业务模式的创新，对于云计算的运营方而言，可以通过云计算对外提供服务获取商业收益；对于云计算的使用方，可以实现按需灵活获取云计算的IT资源服务"},{"label":"B","html":"云计算的服务不可量化"},{"label":"C","html":"云计算按照建设部署模式，包括公有云、私有云、混合云"},{"label":"D","html":"云计算起源可以追溯到1961年斯坦福大学教授提出的思想理念"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：云计算的服务不可量化”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于数据降维的说法不正确的是（   ）。","answer":["A"],"dataset_description":null,"id":"p02:108","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于数据降维的说法不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"神经网络算法不能用于数据降维"},{"label":"B","html":"原始数据可能包含数以百/千/万计的属性，大部分情况下会有很多属性与任务不相关，是冗余的，数据降维可以提高数据质量，提升数据挖掘和机器学习的效率及精度"},{"label":"C","html":"数据降维的方法包括人工降维和自动降维，其中自动降维又分为维度规约和数据压缩"},{"label":"D","html":"维度规约又称又称特征选择, 就是要删除冗余无用的属性；被保留的属性仍保持原有的物理意义"}],"explanation":{"topic":"降维与特征表示","paragraphs":["降维将高维特征映射或筛选为较少维度，在尽量保留重要结构和信息的同时降低冗余、噪声与计算成本。通常是高维到低维，而不是反过来扩维。","特征选择保留原特征的子集；特征提取构造新特征，如主成分分析以方差方向构造线性组合。降维一般存在信息取舍，不能保证毫无信息损失或必然提高所有模型准确率。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：神经网络算法不能用于数据降维”。"],"tip":"降维减少特征维度；选择保留原列，提取产生新列。","source":""},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"对于线性规划问题，下列说法不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:109","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>对于线性规划问题，下列说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"线性规划问题可能没有可行解"},{"label":"B","html":"在图解法中，线性规划问题的可行域都是“凸”区域"},{"label":"C","html":"线性规划问题如有最优解，则最优解可以在可行域顶点上达到"},{"label":"D","html":"线性规划问题一般都有最优解"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：线性规划问题一般都有最优解”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"单纯形法需要解决的三个问题不包括（  ）。","answer":["D"],"dataset_description":null,"id":"p02:110","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>单纯形法需要解决的三个问题不包括（ 动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：非线性规划问题的最优解可能在可行域任意一点”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于非线性规划最优解的论述中，其中不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:113","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于非线性规划最优解的论述中，其中不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"非线性规划最优解满足所有约束条件"},{"label":"B","html":"非线性规划的最优解是使目标函数达到最优值的可行解"},{"label":"C","html":"非线性规划的最优解可以在可行域任何位置"},{"label":"D","html":"非线性规划的最优解是唯一的"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：非线性规划的最优解是唯一的”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于一维搜索方法的叙述,下列说法错误的是(  )。","answer":["C"],"dataset_description":null,"id":"p02:114","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于一维搜索方法的叙述,下列说法错误的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"黄金分割法是最常用的一维搜索试探方法"},{"label":"B","html":"在试探法中,确定试验点的位置时没有考虑函数值的分布"},{"label":"C","html":"当函数具有较好的解析性质时,试探法比插值法的效果好"},{"label":"D","html":"插值法中的牛顿法是利用一点的函数值、一阶导数值等构造二次函数的"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：当函数具有较好的解析性质时,试探法比插值法的效果好”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"如果采用方差分析法来推断某个因素对所考察的指标有无显著影响，如果该因素有K个水平，样本容量为N，则下列表述中错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p02:115","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>如果采用方差分析法来推断某个因素对所考察的指标有无显著影响，如果该因素有K个水平，样本容量为N，则下列表述中错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"检验统计量＝组间平方和/组内平方和"},{"label":"B","html":"组间均方差＝组间平方和/（K－1）"},{"label":"C","html":"检验统计量＝组间均方差/组内均方差"},{"label":"D","html":"检验统计量的分布为 F（K－1，N－K）"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：检验统计量＝组间平方和/组内平方和”。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下对于朴素贝叶斯算法说法，错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:116","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下对于朴素贝叶斯算法说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"适合多分类任务"},{"label":"B","html":"对大数据集的训练速度快"},{"label":"C","html":"属于生成模型"},{"label":"D","html":"特征有缺失值无法计算"}],"explanation":{"topic":"朴素贝叶斯分类","paragraphs":["贝叶斯分类按后验概率 P(类别|特征) 选择类别。朴素贝叶斯的“朴素”是给定类别后，各特征条件独立的假设，并非无条件要求所有特征彼此独立。","后验与“类别先验×各特征条件概率的乘积”成比例；取对数可避免很小概率连乘下溢，平滑可处理零频次。它既可二分类，也可多分类。","训练不需要复杂的迭代求最优边界，但预测仍需参数估计；相关特征可能削弱独立假设，不能据此断言算法完全不能用。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：特征有缺失值无法计算”。"],"tip":"给定类别后条件独立；先验×似然比后验。","source":""},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于线性规划模型的可行域，下面的叙述不正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p02:117","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于线性规划模型的可行域，下面的叙述不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 可行域是由一组线性不等式围成的区域\u003c/p>"},{"label":"B","html":"\u003cp>可行域一定是凸集\u003c/p>"},{"label":"C","html":"\u003cp>可行域一定是非空有界闭集\u003c/p>"},{"label":"D","html":"\u003cp>可行域的顶点对应基可行解\u003c/p>"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：可行域一定是非空有界闭集”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"在我国法律体系中，由国务院制定的法律规范，称之为（   ）。","answer":["B"],"dataset_description":null,"id":"p02:118","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在我国法律体系中，由国务院制定的法律规范，称之为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"法律"},{"label":"B","html":"行政法规"},{"label":"C","html":"宪法"},{"label":"D","html":"地方性法规"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：行政法规”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"以下不属于法的规范作用的是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:119","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下不属于法的规范作用的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"指引"},{"label":"B","html":"评价"},{"label":"C","html":"预测"},{"label":"D","html":"阶级统治"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：阶级统治”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"人类根本利益原则，是指人工智能和大数据应用应以实现人类根本利益为终极目标。不属于人类根本利益原则的是（   ）。","answer":["D"],"dataset_description":null,"id":"p02:120","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>人类根本利益原则，是指人工智能和大数据应用应以实现人类根本利益为终极目标。不属于人类根本利益原则的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"向善性"},{"label":"B","html":"保障人的尊严"},{"label":"C","html":"隐私保护"},{"label":"D","html":"实现商业价值最大化"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：实现商业价值最大化”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"下述关于商业智能（BI）的论述，正确的有(   )。","answer":["C","D"],"dataset_description":null,"id":"p02:121","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下述关于商业智能（BI）的论述，正确的有( &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"商业智能概念与决策支持系统完全不同。"},{"label":"B","html":"商业智能就是人工智能。"},{"label":"C","html":"商业智能可看作一类技术或解决方案的总称。"},{"label":"D","html":"数据挖掘是商业智能主要分析工具之一。"},{"label":"E","html":"联机分析系统是单维数据分析工具。"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C、D。对应内容为“C：商业智能可看作一类技术或解决方案的总称。；D：数据挖掘是商业智能主要分析工具之一。”。多选题应检查所有选项，不能只选其中一项。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"市场机会分析是发现企业新的利润增涨点的方法之一，对市场机会分析，主要应该考虑下列哪些因素（   ）。","answer":["C","D"],"dataset_description":null,"id":"p02:122","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>市场机会分析是发现企业新的利润增涨点的方法之一，对市场机会分析，主要应该考虑下列哪些因素（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"机会出现的可能性"},{"label":"B","html":"机会是否存在"},{"label":"C","html":"成功的可能性"},{"label":"D","html":"机会的吸引力"},{"label":"E","html":"机会到来的时间"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["经典市场机会评价矩阵用“潜在吸引力”和“企业成功的可能性”两轴，因此选 C、D。","A、B、E 可用于实际机会调查，但不是这道题所指的矩阵核心两轴。题库另有相似题选全项，需留意题干采用的口径。"],"warning":""},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"下列关于散点图应用的描述中，哪些是正确的（   ）？","answer":["A","B","D","E"],"dataset_description":null,"id":"p02:123","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于散点图应用的描述中，哪些是正确的（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"可以用来表现某个输出结果与某个输入因素之间的关系"},{"label":"B","html":"可以用来表现某个输出结果与另外某个输出结果之间的关系"},{"label":"C","html":"只适合用来表现出输出结果与输入因素之间的线性关系"},{"label":"D","html":"需要成对的搜集变量的数据值"},{"label":"E","html":"可以观察两组数据之间是否存在数量关联趋势"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D、E。对应内容为“A：可以用来表现某个输出结果与某个输入因素之间的关系；B：可以用来表现某个输出结果与另外某个输出结果之间的关系；D：需要成对的搜集变量的数据值；E：可以观察两组数据之间是否存在数量关联趋势”。多选题应检查所有选项，不能只选其中一项。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"下面关于定序数据的观点，哪些说法是正确的（    ）。","answer":["C","E"],"dataset_description":null,"id":"p02:124","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下面关于定序数据的观点，哪些说法是正确的（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"不能取负值"},{"label":"B","html":"“0”表示不存在或没有"},{"label":"C","html":"可以计算中位数"},{"label":"D","html":"可以计算算术平均数"},{"label":"E","html":"可以比较顺序"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C、E。对应内容为“C：可以计算中位数；E：可以比较顺序”。多选题应检查所有选项，不能只选其中一项。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列属于概率抽样的是（  ）。","answer":["A","B","D"],"dataset_description":null,"id":"p02:125","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列属于\u003c/span>\u003cspan>概率抽样\u003c/span>\u003cspan>的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体中的每个个体都有相等的被选中的机会\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样能较好代表总体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>个体\u003c/span>\u003cspan>被选中的机会都不相等\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样误差小于非\u003c/span>\u003cspan>概率抽样\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>不能获得估计值的精度\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：总体中的每个个体都有相等的被选中的机会；B：抽样能较好代表总体；D：抽样误差小于非概率抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计量的说法正确的是（  ）。","answer":["A","B","D"],"dataset_description":null,"id":"p02:126","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于统计量的说法正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>统计量都是样本函数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>统计量用于推断总体参数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>统计量不是随机变\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>统计量也是随机变量\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>统计量等于参数\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：统计量都是样本函数；B：统计量用于推断总体参数；D：统计量也是随机变量”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下可以用于描述数据离散程度的统计量是（  ）。","answer":["A","B","D","E"],"dataset_description":null,"id":"p02:127","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下可以用于描述数据离散程度的统计量是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>极差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>四分位间距\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>最大值\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>方差\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>标准偏差\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D、E。对应内容为“A：极差；B：四分位间距；D：方差；E：标准偏差”。多选题应检查所有选项，不能只选其中一项。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"有关样本均值抽样分布的说法，以下正确的是（ ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p02:128","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>有关样本均值抽样分布的说法，以下正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>随着样本容量的增加,样本均值的抽样分布趋于正态\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随着样本容量的增加,样本均值的抽样分布的方差趋于减小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本均值的抽样分布的方差与总体方差的大小有关\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正态总体抽样所得统计量都服从正态分布\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>E\u003c/span>\u003cspan>如果总体服从正态分布，那么样本均值的抽样分布也服从正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：随着样本容量的增加,样本均值的抽样分布趋于正态；B：随着样本容量的增加,样本均值的抽样分布的方差趋于减小；C：样本均值的抽样分布的方差与总体方差的大小有关；E：E如果总体服从正态分布，那么样本均值的抽样分布也服从正态分布”。多选题应检查所有选项，不能只选其中一项。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"常用的抽样调查方法主要有（   ）。","answer":["A","D","E"],"dataset_description":null,"id":"p02:129","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>常用的抽样调查方法主要有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"随机抽样"},{"label":"B","html":"分类抽样"},{"label":"C","html":"分组抽样"},{"label":"D","html":"等距抽样"},{"label":"E","html":"非随机抽样"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、D、E。对应内容为“A：随机抽样；D：等距抽样；E：非随机抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计量的说法正确的是（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p02:130","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于统计量的说法正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>估计同一总体参数的统计量可以有多个\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>统计量是样本的函数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>统计量不含有任何未知参数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>统计量是随机变量\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本抽取出来后，统计量的值是确定的\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：估计同一总体参数的统计量可以有多个；B：统计量是样本的函数；C：统计量不含有任何未知参数；D：统计量是随机变量；E：样本抽取出来后，统计量的值是确定的”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"描述样本集中位置的统计量有（   ）。","answer":["A","B","C"],"dataset_description":null,"id":"p02:131","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>描述样本集中位置的统计量有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本均值"},{"label":"B","html":"样本中位数"},{"label":"C","html":"样本众数"},{"label":"D","html":"样本方差"},{"label":"E","html":"样本标准差"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：样本均值；B：样本中位数；C：样本众数”。多选题应检查所有选项，不能只选其中一项。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"在一般情况下，以下关于调查研究中抽样误差大小的排序，错误的是（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p02:132","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在一般情况下，以下关于调查研究中抽样误差大小的排序，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"整群抽样≥系统抽样≥单纯随机抽样≥分层抽样"},{"label":"B","html":"系统抽样≥单纯随机抽样≥整群抽样≥分层抽样"},{"label":"C","html":"分层抽样≥系统抽样≥单纯随机抽样≥整群抽样"},{"label":"D","html":"整群抽样≥单纯随机抽样≥系统抽样≥分层抽样"},{"label":"E","html":"单纯随机抽样≥整群抽样≥分层抽样≥系统抽样"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、C、E。对应内容为“A：整群抽样≥系统抽样≥单纯随机抽样≥分层抽样；B：系统抽样≥单纯随机抽样≥整群抽样≥分层抽样；C：分层抽样≥系统抽样≥单纯随机抽样≥整群抽样；E：单纯随机抽样≥整群抽样≥分层抽样≥系统抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列哪些属于非概率抽样调查方法(  )？","answer":["A","B"],"dataset_description":null,"id":"p02:133","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列哪些属于非概率抽样调查方法( &nbsp;)？\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>滚雪球抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>判断抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分层抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>整群抽样\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>多阶段抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B。对应内容为“A：滚雪球抽样；B：判断抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于标准误,下列说法正确的是（ ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p02:134","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于标准误,下列说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>标准误是描述抽样分布离散程度的统计量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>标准误越小,样本对总体的代表性越强\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>标准误就是抽样误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>标准误越大,样本统计量与总体参数间的差异越小\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>标准误越大,用样本统计量推断总体参数可靠性越强\u003c/span>\u003c/p>"}],"explanation":{"topic":"标准误与标准差","paragraphs":["标准差描述一组观测值彼此有多分散；标准误描述一个统计量在重复抽样时有多波动，是统计量抽样分布的标准差。二者研究对象不同。","均值的标准误为 σ/√n，σ 未知时常以 s/√n 估计。其他条件相同，样本越大或总体越同质，标准误越小。样本量扩大到原来的4倍，标准误才缩小到一半。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：标准误是描述抽样分布离散程度的统计量；B：标准误越小,样本对总体的代表性越强；C：标准误就是抽样误差；E：标准误越大,用样本统计量推断总体参数可靠性越强”。多选题应检查所有选项，不能只选其中一项。"],"tip":"标准差看个体差异；标准误看估计稳定性。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"统计推断的内容不包括（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p02:135","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>统计推断的内容不包括（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"点估计和区间估计"},{"label":"B","html":"集中趋势与离散趋势指标"},{"label":"C","html":"统计描述和统计图表"},{"label":"D","html":"参数估计和假设检验"},{"label":"E","html":"参数估计和统计预测"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、C、E。对应内容为“A：点估计和区间估计；B：集中趋势与离散趋势指标；C：统计描述和统计图表；E：参数估计和统计预测”。多选题应检查所有选项，不能只选其中一项。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于假设检验方法的说法，正确的有（  ）。","answer":["A","C","D","E"],"dataset_description":null,"id":"p02:136","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下面关于假设检验方法的说法，正确的有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"是统计推断的核心"},{"label":"B","html":"利用一个样本信息判断另一个样本特征"},{"label":"C","html":"t检验、方差分析属于参数检验"},{"label":"D","html":"属于非参数检验"},{"label":"E","html":"把需要判断的总体特征称作假设"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、D、E。对应内容为“A：是统计推断的核心；C：t检验、方差分析属于参数检验；D：属于非参数检验；E：把需要判断的总体特征称作假设”。多选题应检查所有选项，不能只选其中一项。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"云计算包括哪3种典型的服务模式（    ）。","answer":["A","B","C"],"dataset_description":null,"id":"p02:137","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>云计算包括哪3种典型的服务模式（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"基础设施即服务"},{"label":"B","html":"软件即服务"},{"label":"C","html":"平台即服务"},{"label":"D","html":"机器即服务"},{"label":"E","html":"计算即服务"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：基础设施即服务；B：软件即服务；C：平台即服务”。多选题应检查所有选项，不能只选其中一项。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于整数线性规划的说法中,正确的有(   )。","answer":["B","C"],"dataset_description":null,"id":"p02:138","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于整数线性规划的说法中,正确的有( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"最优解可以是整数也可以是小数"},{"label":"B","html":"最优解只能是整数"},{"label":"C","html":"数学模型和线性规划基本相同"},{"label":"D","html":"约束条件与线性规划基本相同"},{"label":"E","html":"可行域与线性规划基本相同"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C。对应内容为“B：最优解只能是整数；C：数学模型和线性规划基本相同”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"法律关系的特征有（    ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p02:139","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>法律关系的特征有（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"根据法律规范建立的社会关系"},{"label":"B","html":"以权利义务为内容的社会关系"},{"label":"C","html":"体现意志性的特种社会关系"},{"label":"D","html":"法律关系形成后不再变化"},{"label":"E","html":"法律关系不能归于消灭"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：根据法律规范建立的社会关系；B：以权利义务为内容的社会关系；C：体现意志性的特种社会关系；D：法律关系形成后不再变化”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"算法风险的表现有（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p02:140","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>算法风险的表现有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"算法存在泄露风险"},{"label":"B","html":"算法从设计、训练到使用均面临可信赖性问题"},{"label":"C","html":"部分场景下的算法对随时可用的要求较高"},{"label":"D","html":"人工智能算法在许多场景的应用都与人身安全相关"},{"label":"E","html":"算法风险具有易发现、易防范的特点"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：算法存在泄露风险；B：算法从设计、训练到使用均面临可信赖性问题；C：部分场景下的算法对随时可用的要求较高；D：人工智能算法在许多场景的应用都与人身安全相关”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“data02.xlsx”中的工作簿文件扩展名为（）","answer":["A"],"dataset_description":"Excel表格文件“data02.xlsx”收集了北京的2022年的信息情况。工作表Sheet1包含5个特征数据：日期、白天天气、白天气温、昨天气温、前天气温。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，没操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p02:141","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>文件“data02.xlsx”中的工作簿文件扩展名为（）\u003c/p>","options":[{"label":"A","html":".xlsx"},{"label":"B","html":".xlsm"},{"label":"C","html":".xls"},{"label":"D","html":".docx"}],"explanation":{"topic":"工作簿文件扩展名","paragraphs":["题目给出的素材文件名以 .xlsx 结尾，因此扩展名是 .xlsx，选 A。",".xlsm 是启用宏的工作簿，.xls 是旧版工作簿，.docx 是 W 8.49，计数：372，求和：3075\u003c/p>"},{"label":"D","html":"\u003cp>平均值：8.59，计数：372，求和：3075\u003c/p>"}],"explanation":{"topic":"按阈值清洗昨天气温","paragraphs":["昨天气温在 D 列。先检查 =COUNTIF(D2:D372,\"\u003c-20\")，原素材没有小于-20的记录，因此不需替换。371个数值求和3075，均值约8.2884097，保留两位8.29，选 A。","可用 =AVERAGE(D2:D372) 与 =SUM(D2:D372) 复现。"],"tip":"","warning":"选项“计数372”包含表头；数值记录为371条。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data02.xlsx","href":"../materials/p02/data02.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"data02.xlsx\"的工作表\"Sheet1\"中，请计算2月白天气温的平均值，并选择下列正确的选项。","answer":["D"],"dataset_description":"Excel表格文件“data02.xlsx”收集了北京的2022年的信息情况。工作表Sheet1包含5个特征数据：日期、白天天气、白天气温、昨天气温、前天气温。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，没操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p02:144","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>在文件&quot;data02.xlsx&quot;的工作表&quot;Sheet1&quot;中，请计算2月白天气温的平均值，并选择下列正确的选项。\u003c/p>","options":[{"label":"A","html":"白天气温均值为-5.057142857"},{"label":"B","html":"白天气温均值为-5.157142857"},{"label":"C","html":"白天气温均值为-5.257142857"},{"label":"D","html":"白天气温均值为-5.357142857"}],"explanation":{"topic":"按月份求白天气温均值","paragraphs":["日期在 A 列、白天气温在 C 列。只筛选2022年2月，使用 =AVERAGEIFS(C2:C372,A2:A372,\">=\"&DATE(2022,2,1),A2:A372,\"\u003c\"&DATE(2022,3,1))。","结果为-5.357142857，选 D。用“下个月1日之前”可避免遗漏带时间的月末记录。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data02.xlsx","href":"../materials/p02/data02.xlsx"}]},{"number":145,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":5,"question":"文件“data02.xlsx”中的“Sheet1”中将A列Date按照“年-月”的方式，重新在F列中操作，列名为“年月”，使用函数TEXT将A列中的“年月日”转换为“年月”，数据格式为“yyyy-mm”。再按照分类字段“年月”，汇总方式“平均值”，选定汇总项“前天温度”，“ 2022-01”的“前天气温”平均值为（）。","answer":["B"],"dataset_description":"Excel表格文件“data02.xlsx”收集了北京的2022年的信息情况。工作表Sheet1包含5个特征数据：日期、白天天气、白天气温、昨天气温、前天气温。请根据该表格分析并解决以下问 let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
