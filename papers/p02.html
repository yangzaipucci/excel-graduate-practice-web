</style></head><body><div id="app"></div><dialog id="modal"></dialog><input type="file" id="import-file" accept="application/json,.json" hidden><script>const APP_DATA={"page":"paper","paperId":"p02","papers":[{"id":"p02","title":"Excel 模拟卷 02","originalTitle":"26模拟试卷(Excel) -02","source":"https://www.zlbbda.com.cn/studysome/exercise?testPapeId=168","questions":[{"number":1,"type":"判断题","book":"《大数据分析素养》","chapter":1,"question":"定量数据以数字形式表示，可以进行精确的测量和计算\n（  ）。","answer":["A"],"dataset_description":null,"id":"p02:1","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>定量数据以数字形式表示，可以进行精确的测量和计算\u003c/span>\u003c/p>\u003cp>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":2,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"营销成本可以拆解为广告费用和推广费用，不包括渠道费用（  ）。","answer":["B"],"dataset_description":null,"id":"p02:2","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>营销成本可以拆解为广告费用和推广费用，不包括渠道费用\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>。\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["营销成本不仅有广告和推广，还可能含分销佣金、渠道维护、平台服务等渠道费用，因此“不包括渠道费用”错误。","拆解成本时要覆盖获客、交易和渠道等必要环节，不能只算容易看到的广告费。"],"warning":""},"attachments":[]},{"number":3,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"如果某个细分市场中存在多个实力较强的竞争者，该市场就没有吸引力（  ）。","answer":["A"],"dataset_description":null,"id":"p02:3","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>如果某个细分市场中存在多个实力较强的竞争者，该市场就没有吸引力\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>。\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["多个强大对手可能使竞争激烈、价格和利润受压，所以教材把该市场视为缺乏吸引力，原站判对。","实际决策还应结合市场增长、客户需求、进入壁垒和企业自身优势，不能只凭对手数量就断定一定不值得进入。"],"warning":"强竞争通常降低吸引力，但不能无条件推出“完全没有吸引力”；题库用的是简化教材判断。"},"attachments":[]},{"number":4,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"新客户获取成本是公司级战略指标（  ）。","answer":["B"],"dataset_description":null,"id":"p02:4","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>新客户获取成本是公司级战略指标\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["新客户获取成本通常属于营销或运营的获客效率指标；本题分类中不直接归为公司级战略指标，因此判错。","例如 CAC=一定期间获客成本÷新增客户数。它可支持公司战略，但“支持战略”不等于分类上就是战略层指标。"],"warning":""},"attachments":[]},{"number":5,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"情景分析法的执行步骤包括对每种情景进行评估，分析其发生的可能性和影响（  ）。","answer":["A"],"dataset_description":null,"id":"p02:5","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>情景分析法的执行步骤包括对每种情景进行评估，分析其发生的可能性和影响（ &nbsp;）。\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["情景分析不仅列举可能未来，还要评估各情景的可能性及影响，再设计应对方案，题干正确。","例如需求上升、持平、下降三种情景分别测算收入与资金压力，以检验方案的稳健性。"],"warning":""},"attachments":[]},{"number":6,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"“本月交易金额”属于原子指标（  ）。","answer":["B"],"dataset_description":null,"id":"p02:6","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>“本月交易金额”属于原子指标\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>。\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["原子指标是基础度量及其统计逻辑，如交易金额求和。“本月交易金额”增加了“本月”这一时间限定，通常归为衍生指标，因此判错。","原子度量+时间或业务限定形成衍生指标；不能因为数字只有一个就称为原子指标。"],"warning":""},"attachments":[]},{"number":7,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"数据化的业务指标无法帮助企业找到业务发展方向（  ）。","answer":["B"],"dataset_description":null,"id":"p02:7","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>数据化的业务指标无法帮助企业找到业务发展方向\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>。\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["业务指标把增长、转化、效率等问题量化，能帮助识别瓶颈和发展方向，因此“无法帮助”错误。","例如访问多但成交少提示转化环节值得检查；指标提供线索，仍需结合业务证据分析原因。"],"warning":""},"attachments":[]},{"number":8,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"在数据清洗中，直接删除异常数据点是错误的（  ）。","answer":["B"],"dataset_description":null,"id":"p02:8","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在数据清洗中，直接删除异常数据点是错误的\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":9,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"通过训练模型来自动发现数据中的模式和规律，并进行预测和分类属于机器学习（  ）。","answer":["A"],"dataset_description":null,"id":"p02:9","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>通过训练模型来自动发现数据中的模式和规律，并进行预测和分类属于机器学习\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":10,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"空间属性通常用于表示数值的大小或重要性（  ）。","answer":["B"],"dataset_description":null,"id":"p02:10","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>空间属性通常用于表示数值的大小或重要性\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"空间属性的含义","paragraphs":["空间属性用于表示地理位置、空间范围、方向、距离或拓扑关系。数值大小通常通过长度、面积、颜色深浅等视觉编码表达。","题干把空间位置与数值大小的重要性混为一谈，因此判为错误。"],"warning":""},"attachments":[]},{"number":11,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"折线图可以迅速识别出数据中的最大值、最小值、中位数以及数据的整体分布情况（  ）。","answer":["B"],"dataset_description":null,"id":"p02:11","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>折线图\u003c/span>\u003cspan>可以迅速识别出数据中的最大值、最小值、中位数以及数据的整体分布情况\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":12,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"匿名化不属于数据清洗的方法（  ）。","answer":["A"],"dataset_description":null,"id":"p02:12","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>匿名化不属于数据清洗的方法\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":13,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"在数据图形中，分类属性通常用于确定图形的不同部分（  ）。","answer":["A"],"dataset_description":null,"id":"p02:13","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在数据图形中，分类属性通常用于确定图形的不同部分\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":14,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"计划完成程度指标是某一时期实际完成的指标数值与计划指标数量对比的结果。一般用百分数表示（  ）。","answer":["A"],"dataset_description":null,"id":"p02:14","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>计划完成程度指标是某一时期实际完成的指标数值与计划指标数量对比的结果。一般用百分数表示\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":15,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"定距数据之间的间隔大小是固定的（  ）。","answer":["A"],"dataset_description":null,"id":"p02:15","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>定距数据之间的间隔大小是固定的\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":16,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"相对指标都是用无名数表示的（  ）。","answer":["B"],"dataset_description":null,"id":"p02:16","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>相对指标都是用无名数表示的\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":17,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"定序尺度可以计算事物之间差距大小（  ）。","answer":["B"],"dataset_description":null,"id":"p02:17","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>定序尺度可以计算事物之间差距大小\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本容量越大，抽样平均误差越小（  ）。","answer":["A"],"dataset_description":null,"id":"p02:18","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>样本容量越大，抽样平均误差越小（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"标准误与标准差","paragraphs":["标准差描述一组观测值彼此有多分散；标准误描述一个统计量在重复抽样时有多波动，是统计量抽样分布的标准差。二者研究对象不同。","均值的标准误为 σ/√n，σ 未知时常以 s/√n 估计。其他条件相同，样本越大或总体越同质，标准误越小。样本量扩大到原来的4倍，标准误才缩小到一半。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"标准差看个体差异；标准误看估计稳定性。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"随机数表是将0至9的10个数字随机排列并生成表以备查用。","answer":["A"],"dataset_description":null,"id":"p02:19","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>随机数表是将0至9的10个数字随机排列并生成表以备查用。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"在实际工作中一般很少使用二阶段抽样（  ）。","answer":["B"],"dataset_description":null,"id":"p02:20","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在实际工作中一般很少使用二阶段抽样（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量的值是非唯一确定的（  ）。","answer":["A"],"dataset_description":null,"id":"p02:21","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>样本统计量的值是非唯一确定的\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"多阶段抽样的优点是易于组织实施，容易控制调查质量，省时，省力，省钱（  ）。","answer":["A"],"dataset_description":null,"id":"p02:22","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>多阶段抽样的优点是易于组织实施，容易控制调查质量，省时，省力，省钱（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"整群抽样的目的是缩小抽样误差（  ）。","answer":["B"],"dataset_description":null,"id":"p02:23","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>整群抽样的目的是缩小抽样误差（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本均值的抽样分布趋于正态分布，其分布的数学期望为总体均值，标准差为总体标准差的1/n（  ）。","answer":["B"],"dataset_description":null,"id":"p02:24","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>样本均值的抽样分布趋于正态分布，其分布的数学期望为总体均值，标准差为总体标准差的1/n\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"方差的假设检验可通过卡方统计量进行（ ）。","answer":["A"],"dataset_description":null,"id":"p02:25","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>方差的假设检验可通过卡方统计量进行（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"总体是4000万员工，所有员工的平均年龄为总体参数（  ）。","answer":["A"],"dataset_description":null,"id":"p02:26","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>总体是4000万员工，所有员工的平均年龄为总体参数（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"按总体单位标志的取值，可分为变量总体和属性总体（  ）。","answer":["A"],"dataset_description":null,"id":"p02:27","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>按总体\u003c/span>单位标志\u003cspan>的取值，可分为变量总体和属性总体（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"点估计原理复杂,在实际工作中不经常采用该方法（ ）。","answer":["B"],"dataset_description":null,"id":"p02:28","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>点估计原理复杂,在实际工作中不经常采用该方法\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"统计量的值依赖样本,根据统计量来推断总体参数一定具有确定性（ ）。","answer":["B"],"dataset_description":null,"id":"p02:29","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>统计量的值依赖样本,根据统计量来推断总体参数一定具有确定性（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"方差分析中的F检验总是单尾检验,而且是右尾检验（ ）。","answer":["A"],"dataset_description":null,"id":"p02:30","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>方差分析中的F检验总是单尾检验,而且是右尾检验（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"显著性检验用于检测备择假设是否成立（ ）。","answer":["B"],"dataset_description":null,"id":"p02:31","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>显著性检验用于检测备择假设是否成立（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"演绎推理是基于概率和经验规律（ ）。","answer":["B"],"dataset_description":null,"id":"p02:32","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>演绎推理是基于概率和经验规律\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"假设检验将问题转化为两个不重叠且对立的假设，通过样本数据判断哪个假设是真的（ ）。","answer":["B"],"dataset_description":null,"id":"p02:33","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>假设检验将问题转化为两个不重叠且对立的假设，通过样本数据判断哪个假设是真的（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据具有趋势和方向性的特征（ ）。","answer":["B"],"dataset_description":null,"id":"p02:34","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>大数据具有趋势和方向性的特征（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":35,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"云计算的通用性是指不针对特定的应用（ ）。","answer":["A"],"dataset_description":null,"id":"p02:35","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>云计算的通用性是指不针对特定的应用\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":36,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"Hadoop是大数据计算框架之一（ ）。","answer":["A"],"dataset_description":null,"id":"p02:36","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>Hadoop是大数据计算框架之一（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":37,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"方差分析的组内方差越小说明组间的差异越小（ ）。","answer":["B"],"dataset_description":null,"id":"p02:37","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>方差分析的组内方差越小说明\u003c/span>\u003cspan>组间\u003c/span>\u003cspan>的差异越小（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":38,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"决策树法是使用期望值准则进行决策（  ）。","answer":["A"],"dataset_description":null,"id":"p02:38","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>决策树法是使用期望值准则进行决策\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":39,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"决策树的根节点是第一个判断特征的节点（  ）。","answer":["A"],"dataset_description":null,"id":"p02:39","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>决策树的根节点是第一个判断特征的节点\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"梯度下降法是求解无约束非线性优化模型的方法（ ）。","answer":["A"],"dataset_description":null,"id":"p02:40","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>梯度下降法是求解无约束非线性优化模型的方法\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"饼状图是数据分析的一个重要方法，用来显示事物的总体或内部结构及变化,以下关于饼状图不正确的描述是(   )。","answer":["C"],"dataset_description":null,"id":"p02:41","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>饼状图是数据分析的一个重要方法，用来显示事物的总体或内部结构及变化,以下关于饼状图不正确的描述是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"饼状图中的百分数表示的是相对数。"},{"label":"B","html":"饼是指各部分在总体中所占比例。"},{"label":"C","html":"饼状图中的百分数表示的是绝对数。"},{"label":"D","html":"饼状图中的所有百分数相加等于100%。"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：饼状图中的百分数表示的是绝对数。”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":42,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"将实验数据按一定规律用表格方式记录是处理实验数据最常用的方法，下面关于表格设计的观点，不正确的是(   )","answer":["C"],"dataset_description":null,"id":"p02:42","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>将实验数据按一定规律用表格方式记录是处理实验数据最常用的方法，下面关于表格设计的观点，不正确的是( &nbsp; )\u003c/span>\u003c/p>","options":[{"label":"A","html":"要求对应关系清楚，简单明了。"},{"label":"B","html":"可以在标题栏中注明物理量名称和符号。"},{"label":"C","html":"无需写明表格名称。"},{"label":"D","html":"有利于发现相关量之间的物理关系。"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：无需写明表格名称。”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":43,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"数据分析的表格法被形象地形容为企业经营管理中的什么部分(   )。","answer":["B"],"dataset_description":null,"id":"p02:43","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>数据分析的表格法被形象地形容为企业经营管理中的什么部分( &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"骨架"},{"label":"B","html":"血液"},{"label":"C","html":"肌肉"},{"label":"D","html":"皮肤"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：血液”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":44,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"数据表中的每一列称为一个（   ）。","answer":["B"],"dataset_description":null,"id":"p02:44","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>数据表中的每一列称为一个（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"记录"},{"label":"B","html":"字段"},{"label":"C","html":"单元格"},{"label":"D","html":"数据"}],"explanation":{"topic":"表格中的字段和记录","paragraphs":["数据表的一列描述一种属性，称为字段，如姓名、日期、销售额，因此选 B。","一行是一个对象或一次事件的记录；行列交叉是单元格。“数据”是内容的统称，不能替代列的结构名称。"],"warning":""},"attachments":[]},{"number":45,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"在相同的产品类型中引进其他品牌,其品牌战略是（   ） 。","answer":["B"],"dataset_description":null,"id":"p02:45","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在相同的产品类型中引进其他品牌,其品牌战略是（ &nbsp; ） 。\u003c/span>\u003c/p>","options":[{"label":"A","html":"品牌延伸"},{"label":"B","html":"多品牌"},{"label":"C","html":"新品牌"},{"label":"D","html":"产品线扩展"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["同一产品类别使用不同品牌，是多品牌策略，选 B。","原品牌进入新的产品类别才是品牌延伸；新类别加新品牌通常是新品牌策略；同一品牌同一类别增加规格或口味是产品线扩展。"],"warning":""},"attachments":[]},{"number":46,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"以下关于竞争者分析诊断要素的描述,错误的是(   )。","answer":["C"],"dataset_description":null,"id":"p02:46","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下关于竞争者分析诊断要素的描述,错误的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>未来目标\u003c/p>"},{"label":"B","html":"\u003cp>现行战略\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>竞争对手对自己的假设\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>竞争对手的优势与劣势\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["竞争者诊断通常看未来目标、现行战略、假设和能力。C 只写“对自己的假设”，遗漏对行业及其他企业的假设，因此原站选 C。","A、B 是直接构成要素，D 优劣势用于判断能力。注意此题是在考“描述是否完整”，不是说自我假设与诊断完全无关。"],"warning":"C 描述不完整，但自我假设确实属于诊断内容。此题不是严格意义上完全错误的命题，做题按原站 C，理解保留完整四要素。"},"attachments":[]},{"number":47,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在数据清洗中，丢弃数据的方法较为常用，下面关于该方法适用性的说法中，正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p02:47","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在数据清洗中，丢弃数据的方法较为常用\u003c/span>\u003cspan>，下面关于该方法适用性的说法中，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"能够提高数据的准确性"},{"label":"B","html":"增加趋势数据对整体数据的影响"},{"label":"C","html":"适用于任何场景"},{"label":"D","html":"丢失数据不影响数据特征"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：丢失数据不影响数据特征”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在进行数据处理的过程中，往往需要对数据进行排序，所谓排序就是（   ）。","answer":["C"],"dataset_description":null,"id":"p02:48","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在进行数据处理的过程中，往往需要对数据进行排序，所谓排序就是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"把杂乱无章的数据变为从小到大排列的数据"},{"label":"B","html":"把杂乱无章的数据变为从大到小排列的数据"},{"label":"C","html":"把杂乱无章的数据变为有序的数据"},{"label":"D","html":"以上说法都错误"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：把杂乱无章的数据变为有序的数据”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在频率分布直方图中，每个小长方形的面积表示(     )。","answer":["B"],"dataset_description":null,"id":"p02:49","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>在频率分布直方图中，每个小长方形的面积表示( &nbsp; &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"落在相应各组的数据的频数"},{"label":"B","html":"相应各组的频率"},{"label":"C","html":"该样本所分成的组数"},{"label":"D","html":"数据的数据个数"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：相应各组的频率”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"定类尺度是指依据客观事物的品质进行分类，且各类是并列的平行关系，无法区分优劣或大小，根据上述定义，下列属于定类尺度的是（     ）。","answer":["A"],"dataset_description":null,"id":"p02:50","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>定类尺度是指依据客观事物的品质进行分类，且各类是并列的平行关系，无法区分优劣或大小，根据上述定义，下列属于定类尺度的是（ &nbsp; &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"动物可以分为哺乳动物和非哺乳动物"},{"label":"B","html":"满意程度可以分为非常满意、满意、不满意"},{"label":"C","html":"\u003cp>学校可以按办学层次分为小学、中学、大学\u003c/p>"},{"label":"D","html":"\u003cp>人按年龄可以分为幼年、少年、青年、中年、老年\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：动物可以分为哺乳动物和非哺乳动物”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"具有绝对零点的测量是（   ）。","answer":["D"],"dataset_description":null,"id":"p02:51","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>具有绝对零点的测量是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"定类测量"},{"label":"B","html":"定序测量"},{"label":"C","html":"定距测量"},{"label":"D","html":"定比测量"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：定比测量”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"全国粮食产量与全国人口比较,属于（   ）。","answer":["B"],"dataset_description":null,"id":"p02:52","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>全国粮食产量与全国人口比较,属于（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"平均指标"},{"label":"B","html":"强度相对指标"},{"label":"C","html":"计划完成相对指标"},{"label":"D","html":"比较相对指标"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：强度相对指标”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"按（     ）的不同,业务指标可以被分为实物指标和价值指标。","answer":["A"],"dataset_description":null,"id":"p02:53","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>按（ &nbsp; &nbsp; ）的不同,业务指标可以被分为实物指标和价值指标。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"计量单位"},{"label":"B","html":"总体"},{"label":"C","html":"内容"},{"label":"D","html":"性质"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：计量单位”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于抽样分布，下列说法错误的是（ ）","answer":["D"],"dataset_description":null,"id":"p02:54","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于抽样分布，下列说法错误的是（ ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>统计量的分布称为抽样分\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>每一个统计量都有一个抽样分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>不同的统计量可得不同的抽样分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样分布是\u003c/span>\u003cspan>经验分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：抽样分布是经验分布”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"统计总体的同质性是指（  ）。","answer":["D"],"dataset_description":null,"id":"p02:55","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>统计总体的同质性是指（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体全部单位的所有性质都相同\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体各单位的指标值相同\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体各单位的标志值相同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体全部单位至少有一个共同性质\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：总体全部单位至少有一个共同性质”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"类似于随机抽样法中的分层抽样的非随机抽样方法是（  ）。","answer":["A"],"dataset_description":null,"id":"p02:56","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>类似于随机抽样法中的分层抽样的非随机抽样方法是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>配额抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>滚雪球抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>方便抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>判断抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：配额抽样”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于有限统汁总体的是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:57","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下不属于有限统汁总体的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>人口总数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>企业数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>商店数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>连续大量生产产品的总产量\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：连续大量生产产品的总产量”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于正态分布，以下说法错误的是（   ）。","answer":["B"],"dataset_description":null,"id":"p02:58","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于正态分布，以下说法错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"正态分布距离均值越近的地方数值越集中"},{"label":"B","html":"正态分布距离均值越远的地方数值越集中"},{"label":"C","html":"正态分布出现极端值的概率很低"},{"label":"D","html":"图像越“瘦”，正态分布集中在均值附近的程度也越大"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：正态分布距离均值越远的地方数值越集中”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布的描述，正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p02:59","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于F分布的描述，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F分布曲线是关于y轴左右对称的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布可由两个相互独立的卡方随机变量构造而成\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F分布的倒数是卡方分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>T分布的倒数是F分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：F分布可由两个相互独立的卡方随机变量构造而成”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于F分布，下列说法不正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p02:60","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于F分布，下列说法不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F值通常会是正值\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布应该集中在1左右\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F分布是正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>F分布是偏态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：F分布是正态分布”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"统计量是样本的已知函数，关于其作用的说法，错误的是（  ）。","answer":["C"],"dataset_description":null,"id":"p02:61","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>统计量是\u003c/span>样本\u003cspan>的已知函数，关于其作用的说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>可以将样本中有关\u003c/span>总体\u003cspan>的信息汇集起来\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>统计量依赖且只依赖于样本\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>包含总体分布的参数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>从样本推断总体通常是通过统计量进行的\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：包含总体分布的参数”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"对于对称分布或近似对称分布的总体，其平均数参数为（ ）。","answer":["A"],"dataset_description":null,"id":"p02:62","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>对于对称分布或近似对称分布的总体，其平均数参数为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体算术均数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体几何均数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体中位数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体百分位数\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：总体算术均数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"当样本容量足够大时，样本比例的抽样分布近似服从哪种分布？","answer":["A"],"dataset_description":null,"id":"p02:63","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>当样本容量足够大时，样本比例的抽样分布近似服从哪种分布？\u003c/p>\u003cp>\u003cbr>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>均匀分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>二项分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：正态分布”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"一家互联网企业共有职工150名，其中高级学历45人，中级学历90人，初级学历15人。现采用分层抽样方法从中抽取容量为30的样本，则各学历人数分别为（   ）。","answer":["A"],"dataset_description":null,"id":"p02:64","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>一家互联网企业共有职工150名，其中高级学历45人，中级学历90人，初级学历15人。现采用分层抽样方法从中抽取容量为30的样本，则各学历人数分别为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"9，18，3"},{"label":"B","html":"10，15，5"},{"label":"C","html":"10，17，3"},{"label":"D","html":"9，16，5"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["按比例分层，抽样比30÷150=0.2。高级45×0.2=9，中级90×0.2=18，初级15×0.2=3，合计30，选 A。","应保持各学历组在样本中的比例，不是各组抽相同人数。"],"warning":""},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列属于无限总体的是 (   )。","answer":["A"],"dataset_description":null,"id":"p02:65","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列属于无限总体的是 ( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"宇宙中的行星"},{"label":"B","html":"全国总人口"},{"label":"C","html":"全国工业企业"},{"label":"D","html":"某企业职工工资水平"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：宇宙中的行星”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":66,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量的分布称为（ ）。","answer":["B"],"dataset_description":null,"id":"p02:66","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>样本统计量的分布称为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本频率分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本直方图\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：抽样分布”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":67,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"可靠度大于0.68时，抽样极限误差（  ）。","answer":["A"],"dataset_description":null,"id":"p02:67","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>可靠度大于0.68时，抽样极限误差（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>大于抽样平均误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>小于抽样平均误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>等于抽样平均误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>与抽样平均误差的大小关系依\u003c/span>\u003cspan>样本容量而定\u003c/span>\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["在常用正态近似双侧区间下，可靠度约68%对应临界倍数约1；更高可靠度需更大倍数。","极限误差Δ=z×标准误，故可靠度大于约0.68时，Δ大于标准误，选 A。该结论依赖这里的正态近似口径。"],"warning":""},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本比例的分布具有的特征是（ ）。","answer":["B"],"dataset_description":null,"id":"p02:68","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>样本比例的分布具有的特征是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本比例的均值等于总体均值，样本比例的标准差等于总体标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本比例的均值等于总体均值，样本比例的标准差等于总体标准差除以样本容量的平方根\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本比例的均值等于总体比例，样本比例的标准差等于总体比例的标准差除以样本容量的平方\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本比例的均值等于总体比例，样本比例的标准差等于总体比例的标准差除以样本容量\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：样本比例的均值等于总体均值，样本比例的标准差等于总体标准差除以样本容量的平方根”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于正态分布的说法不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p02:69","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下关于正态分布的说法不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布密度函数的显著特点是中间高两边低,是一条光滑的“钟形曲线&quot;\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>正态分布距离均值越近的地方数值密集\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>正态分布是最重要的一类连续型随机变量分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正态分布是最重要的一类离散型随机变量分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：正态分布是最重要的一类离散型随机变量分布”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于循环等距抽样的描述，错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p02:70","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于循环等距抽样的描述，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽满k个为止\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>当有限总体的N不能被样本n所整除，组数k不是一个整数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>将总体各单位按顺序排成首尾相接的循环圆形\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>用N/n确定抽样间隔k\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：抽满k个为止”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于卡方分布，以下说法不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p02:71","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于卡方分布，以下说法不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"卡方值大于等于零"},{"label":"B","html":"曲线形状受自由度的影响"},{"label":"C","html":"是连续型分布"},{"label":"D","html":"是对称分布"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：是对称分布”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":72,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"小样本情况下，当正态总体的方差未知时,估计总体均值使用的分布是（ ）。","answer":["C"],"dataset_description":null,"id":"p02:72","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>小样本情况下，当正态总体的方差未知时,估计总体均值使用的分布是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan> F分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan> T分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>卡方分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：T分布”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":73,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于系统随机抽样的说法，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:73","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下面关于系统随机抽样的说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本\u003c/span>\u003cspan>代表性强\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样分散较好\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样更为准确\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>可以消除\u003c/span>\u003cspan>总体的周期性误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：可以消除总体的周期性误差”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"采用整群抽样时，当各个群集包含的个体数目相差较大时，通常采用（   ）方法。","answer":["A"],"dataset_description":null,"id":"p02:74","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>采用整群抽样时，当各个群集包含的个体数目相差较大时，通常采用（ &nbsp; ）方法。\u003c/span>\u003c/p>","options":[{"label":"A","html":"不等概抽样"},{"label":"B","html":"等概系统抽样"},{"label":"C","html":"分层随机抽样"},{"label":"D","html":"简单随机抽样"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：不等概抽样”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计量不正确是（  ）。","answer":["B"],"dataset_description":null,"id":"p02:75","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于统计量不正确是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>对样本数据进行分析的变量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>描述单个总体单位\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>检验总体参数的变量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>具有统计平均的意义\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：描述单个总体单位”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于多阶段抽样说法正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p02:76","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下关于多阶段抽样说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>在样本量相同的情况下，比分层抽样的误差更小\u003c/p>"},{"label":"B","html":"\u003cp>多阶段抽样只能用于小规模调查\u003c/p>"},{"label":"C","html":"\u003cp> 多阶段抽样适用于调查范围特别狭窄的场景\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>适合大规模的调查\u003c/span>\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：适合大规模的调查”。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于卡方分布，以下不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p02:77","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于卡方分布，以下不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>由正态分布构造而成\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>当自由度很大时，分布近似为正态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分布在第一\u003c/span>象限\u003cspan>内，卡方值都是正值\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分布曲线呈左偏态\u003c/span>\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：分布曲线呈左偏态”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"代表性误差是（  ）。","answer":["A"],"dataset_description":null,"id":"p02:78","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>代表性误差是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>不能避免，但可以控制\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>既不可以避免，也不可以控制\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>既可以避免，也可以控制\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>可以避免，但不可以控制\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：不能避免，但可以控制”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于总体集中趋势的描述，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:79","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列关于总体集中趋势的描述，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>是总体的中心位置\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>代表总体的集中量数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>反映的个体向总体中心靠拢的倾向\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>在总体中心附近的个体数量较少\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：在总体中心附近的个体数量较少”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于正态分布函数，下列说法正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p02:80","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于正态分布函数，下列说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>标准差越大，分布越集中\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>标准差越小，分布越分散\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>标准差越大，分布越分散；标准差越小，分布越集中\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>均值不是正态分布的中心\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：标准差越大，分布越分散；标准差越小，分布越集中”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列影响因素中，不属于抽样误差来源的有（ ）。","answer":["D"],"dataset_description":null,"id":"p02:81","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>下列影响因素中，不属于抽样误差来源的有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体单位值之间的差异大小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本量的大小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样方式的选择\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样者的选择\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：抽样者的选择”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"t分布曲线是（ ）。","answer":["D"],"dataset_description":null,"id":"p02:82","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>t分布曲线是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>标准正态曲线\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>当自由度越大，t分布曲线的尾部越低\u003c/p>"},{"label":"C","html":"\u003cp>当自由度趋于无穷时，t分布曲线趋近于标准正态曲线\u003c/p>"},{"label":"D","html":"\u003cp> t分布是一簇曲线，随自由度的改变而不同\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：t分布是一簇曲线，随自由度的改变而不同”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"统计量可以用来描述数据,下列说法错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p02:83","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>统计量可以用来描述数据,下列说法错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>描述数据规律程度\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>描述数据位置度\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>描述数据离散程度\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>描述数据分布形态\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：描述数据规律程度”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量与相应的总体参数之间的差距是（ ）。","answer":["A"],"dataset_description":null,"id":"p02:84","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>样本统计量与相应的总体参数之间的差距是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>取样误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>估计误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>测量误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>随机误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：取样误差”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"t分布的均数是多少（ ）。","answer":["A"],"dataset_description":null,"id":"p02:85","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>t分布的均数是多少（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>0\u003c/p>"},{"label":"B","html":"\u003cp>1\u003c/p>"},{"label":"C","html":"\u003cp>2\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>不确定\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：0”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于简单随机抽样的描述，错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:86","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下关于简单随机抽样的描述，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>每个样本单位被抽中的概率相等\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本单位之间完全独\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本间无一定的关联性和排斥性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>被抽取的样本的总体个数是无限的\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：被抽取的样本的总体个数是无限的”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于抽样误差描述错误的是（ ）。","answer":["D"],"dataset_description":null,"id":"p02:87","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于抽样误差描述错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>是不可避免的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>是可控制的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样方法不同，产生的抽样误差也不同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>不属于抽样所特有的误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：不属于抽样所特有的误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"总体单位数为N,样本量为n，划分为k组，以下关于随机起点等距抽样的描述，不正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p02:88","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>总体单位数为N,样本量为n，划分为k组，\u003c/span>\u003cspan>以下关于\u003c/span>\u003cspan>随机起点等距抽样的描述，\u003c/span>\u003cspan>不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体单位具有相同的概率被抽到\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>避免周期性偏差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>可从第一组的1至k号总体单位中随机抽选一个样本单位\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>每隔k个单位抽取一个样本单位\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：避免周期性偏差”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本的说法正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p02:89","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于样本的说法正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>所有同质的观察单位形成的集合\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>是从总体中抽取的部分个体形成的集合\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>是研究结论所适用的个体形成的集合\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本量越大越好\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：是从总体中抽取的部分个体形成的集合”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":90,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"通过随机抽样方法从总体中随机抽取一定数量的样本进行调查,然后根据样本信息来推断总体特征的调查方法是（）。","answer":["C"],"dataset_description":null,"id":"p02:90","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>通过随机抽样方法从总体中随机抽取一定数量的样本进行调查,然后根据样本信息来推断总体特征的调查方法是（）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"普查"},{"label":"B","html":"典型调查"},{"label":"C","html":"抽样调查"},{"label":"D","html":"直接调查"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：抽样调查”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":91,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本或总体中各不同类别数值之间的比值称为（   ）。","answer":["D"],"dataset_description":null,"id":"p02:91","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>样本或总体中各不同类别数值之间的比值称为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"频数"},{"label":"B","html":"频率"},{"label":"C","html":"比例"},{"label":"D","html":"比率"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：比率”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"计算过程中产生的计算误差是（  ）。","answer":["D"],"dataset_description":null,"id":"p02:92","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>计算过程中产生的计算误差是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>不能避免，但可以控制\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>既不可以避免，也不可以控制\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>既可以避免，也可以控制\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>可以避免，但不可以控制\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：可以避免，但不可以控制”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"以下关于F检验法的说法错误的是（   ）。","answer":["A"],"dataset_description":null,"id":"p02:93","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>以下关于F检验法的说法错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>模型通过F检验,t检验一定也通过\u003c/p>"},{"label":"B","html":"\u003cp>F统计量值越大,模型越能通过检验\u003c/p>"},{"label":"C","html":"\u003cp>在一元回归模型中,无需进行F检验\u003c/p>"},{"label":"D","html":"\u003cp>对模型联合显著性检验的F检验,实际上也是对可决系数的显著性检验\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：模型通过F检验,t检验一定也通过”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于单侧检验和双侧检验，说法正确的是（   )。","answer":["C"],"dataset_description":null,"id":"p02:94","paperId":"p02","paperTitle":"Excel 模拟卷 02","question_html":"\u003cp>\u003cspan>关于单侧检验和双侧检验，说法正确的是（ &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"采用单侧检验更好"},{"label":"B","html":"采用双侧检验更好"},{"label":"C","html":"根据专业知识确定"},{"label":"D","html":"根据检验统计量的计算结果确定"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”
