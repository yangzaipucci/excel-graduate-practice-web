:"A","html":"决策树是一种监督式学习"},{"label":"B","html":"监督式学习不可以使用交叉验证进行训练"},{"label":"C","html":"监督式学习是一种基于规则的算法"},{"label":"D","html":"监督式学习不需要标签就可以训练"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：决策树是一种监督式学习”。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"数学模型是描述系统（   ）之间关系的数学表达式。","answer":["D"],"dataset_description":null,"id":"p08:110","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>数学模型是描述系统（ &nbsp; ）之间关系的数学表达式。\u003c/span>\u003c/p>","options":[{"label":"A","html":"输入变量"},{"label":"B","html":"输出变量"},{"label":"C","html":"扰动变量"},{"label":"D","html":"系统内部各个变量"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：系统内部各个变量”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":111,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"在求解非线性最优化问题中，拉格朗日乘子法和KKT条件法是两种最常用的方法。下面的观点正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p08:111","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>在求解非线性最优化问题中，拉格朗日乘子法和KKT条件法是两种最常用的方法。下面的观点正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"在有等式约束时使用拉格朗日乘子法"},{"label":"B","html":"在有等式约束时使用KKT条件法"},{"label":"C","html":"在有不等式约束时使用拉格朗日乘子法"},{"label":"D","html":"拉格朗日乘子法比KKT条件法效率高"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：在有等式约束时使用拉格朗日乘子法”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":112,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于线性规划问题，下列叙述正确的为（  ）。","answer":["D"],"dataset_description":null,"id":"p08:112","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于线性规划问题，下列叙述正确的为（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可行解一定存在"},{"label":"B","html":"最优解一定存在"},{"label":"C","html":"可行解必是最优解"},{"label":"D","html":"如果存在最优解，一定出现在可行解集合中"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：如果存在最优解，一定出现在可行解集合中”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下关于极大似然估计的观点，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p08:113","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下关于极大似然估计的观点，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"是根据概率最大的事件在一次实验中最可能出现的原理"},{"label":"B","html":"总体是离散型随机变量，则似然函数是由各样本取值的概率乘积得到的"},{"label":"C","html":"总体是连续型随机变量，则似然函数是由各样本密度函数取值的乘积得到的"},{"label":"D","html":"不属于点估计"}],"explanation":{"topic":"极大似然与贝叶斯估计","paragraphs":["极大似然估计把已观测样本固定，选择使似然 L(θ)=∏f(xᵢ;θ) 最大的参数。通常取对数把连乘变为连加，再求导、检查边界和极值。它并不等于“让参数本身的概率最大”。","贝叶斯估计为参数赋予先验分布，再用数据得到后验分布：后验∝似然×先验。频率学派常把参数视为固定未知量，贝叶斯方法则以概率分布表达对参数的不确定性。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：不属于点估计”。"],"tip":"极大似然：固定数据选参数；贝叶斯：先验+数据→后验。","source":""},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于朴素贝叶斯，下列说法错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p08:114","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于朴素贝叶斯，下列说法错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"它是一个分类算法"},{"label":"B","html":"朴素的意义在于它的一个天真的假设，所有特征之间是相互独立的"},{"label":"C","html":"\u003cp>它实际上是将多条件概率转换成了单一条件概率，简化了计算\u003c/p>"},{"label":"D","html":"朴素贝叶斯不需要使用联合概率"}],"explanation":{"topic":"朴素贝叶斯分类","paragraphs":["贝叶斯分类按后验概率 P(类别|特征) 选择类别。朴素贝叶斯的“朴素”是给定类别后，各特征条件独立的假设，并非无条件要求所有特征彼此独立。","后验与“类别先验×各特征条件概率的乘积”成比例；取对数可避免很小概率连乘下溢，平滑可处理零频次。它既可二分类，也可多分类。","训练不需要复杂的迭代求最优边界，但预测仍需参数估计；相关特征可能削弱独立假设，不能据此断言算法完全不能用。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：朴素贝叶斯不需要使用联合概率”。"],"tip":"给定类别后条件独立；先验×似然比后验。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于聚类的说法正确的是 （  ）。","answer":["D"],"dataset_description":null,"id":"p08:115","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于聚类的说法正确的是 （ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"其目的是根据过去的观测结果来预测新样本的标签为聚类"},{"label":"B","html":"聚类算法的更新步骤可解释性不强"},{"label":"C","html":"聚类算法对于孤立的野值不敏感"},{"label":"D","html":"聚类的算法训练样本往往都不含有标签"}],"explanation":{"topic":"聚类与 K 均值","paragraphs":["聚类是按相似性把对象分组的无监督学习，通常不依赖预先标好的类别。分类则学习已标注样本的类别规律，二者目标和训练信息不同。","K 均值先选 K 个中心，反复把样本分给最近中心，再以簇内均值更新中心，通常降低簇内平方距离和。需预先给 K，可能依赖初值、落入局部最优，对尺度和离群值敏感。","它偏好近似球状、尺度相近的数值簇，不能认为对任意形状、任意非数值数据都直接适用。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：聚类的算法训练样本往往都不含有标签”。"],"tip":"聚类无标签；K 均值：分配→更新，初值和尺度重要。","source":""},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于线性回归,下面说法不正确的是(  )。","answer":["B"],"dataset_description":null,"id":"p08:116","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于线性回归,下面说法不正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"常用最小二乘法"},{"label":"B","html":"剩余平方和反映了自变量化所引起的波动"},{"label":"C","html":"最小二乘解必存在"},{"label":"D","html":"回归平方和反映了自变量变化引起的波动"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：剩余平方和反映了自变量化所引起的波动”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"将线性规划的数学模型化为标准形的主要目的是（  ）。","answer":["B"],"dataset_description":null,"id":"p08:117","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>将线性规划的数学模型化为标准形的主要目的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"求解简单"},{"label":"B","html":"使用单纯形法求解"},{"label":"C","html":"表示简洁"},{"label":"D","html":"可以用矩阵表示"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：使用单纯形法求解”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"以下属于行政法规的是（   ）。","answer":["D"],"dataset_description":null,"id":"p08:118","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下属于行政法规的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"《贵州省大数据发展应用促进条例》"},{"label":"B","html":"《天津市促进大数据发展应用条例》"},{"label":"C","html":"《海南省大数据开发应用条例》"},{"label":"D","html":"《关键信息基础设施安全保护条例》"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：《关键信息基础设施安全保护条例》”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"法律以（   ）为机制调整人的行为和社会关系。","answer":["A"],"dataset_description":null,"id":"p08:119","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>法律以（ &nbsp; ）为机制调整人的行为和社会关系。\u003c/span>\u003c/p>","options":[{"label":"A","html":"权利和义务"},{"label":"B","html":"权利和责任"},{"label":"C","html":"义务和责任"},{"label":"D","html":"行为和责任"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：权利和义务”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"2021年11月16日，国家互联网信息办公室会同工业和信息化部、公安部、国家市场监督管理总局同意，联合制定了《互联网信息服务算法推荐管理规定》。该规定属于下列哪种位阶的法律规范(   )。","answer":["A"],"dataset_description":null,"id":"p08:120","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>2021年11月16日，国家互联网信息办公室会同工业和信息化部、公安部、国家市场监督管理总局同意，联合制定了《互联网信息服务算法推荐管理规定》。该规定属于下列哪种位阶的法律规范( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"规章"},{"label":"B","html":"行政法规"},{"label":"C","html":"法律"},{"label":"D","html":"规范性文件"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["题目所述规定由国务院有关部门联合制定，法律位阶属于部门规章，选 A。","行政法规由国务院制定，法律由全国人大及其常委会制定；不能仅凭标题中有“规定”就断定其位阶。"],"warning":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"企业数据孤岛产生的原因较为复杂，下列观点中，正确的有(   )。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p08:121","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>企业数据孤岛产生的原因较为复杂，下列观点中，正确的有( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"以功能为标准的部门划分导致数据孤岛。"},{"label":"B","html":"不同类型,不同版本的信息化管理系统导致数据孤岛。"},{"label":"C","html":"机构设置不合理。"},{"label":"D","html":"各个部门职责权利不清晰。"},{"label":"E","html":"缺少正态信息技术规划。"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：以功能为标准的部门划分导致数据孤岛。；B：不同类型,不同版本的信息化管理系统导致数据孤岛。；C：机构设置不合理。；D：各个部门职责权利不清晰。；E：缺少正态信息技术规划。”。多选题应检查所有选项，不能只选其中一项。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"作为一名数据分析师，应该根据具体业务选择合适的指标衡量业务。无论何种业务，我们都可以使用下述哪些数据来设计业务指标（   ）？","answer":["A","B","C"],"dataset_description":null,"id":"p08:122","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>作为一名数据分析师，应该根据具体业务选择合适的指标衡量业务。无论何种业务，我们都可以使用下述哪些数据来设计业务指标（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"用户数据"},{"label":"B","html":"行为数据"},{"label":"C","html":"产品数据"},{"label":"D","html":"行业销售数据"},{"label":"E","html":"财务数据"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["题库采用用户、行为、产品三维框架：用户回答谁，行为回答做什么，产品回答与什么对象互动，因此选 A、B、C。","D 行业销售与 E 财务数据在真实业务中也很重要，但不在本题规定的三维通用框架中；不要理解为它们不能用于指标设计。"],"warning":"“无论何种业务”表述过强；此处只说明题库采用的三维框架，不排斥财务和行业数据的重要性。"},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"企业内部资料的来源包括（   ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p08:123","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>企业内部资料的来源包括\u003c/span>\u003cspan>（\u003c/span> &nbsp; \u003cspan>）\u003c/span>\u003cspan>。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"业务资料"},{"label":"B","html":"业务统计资料"},{"label":"C","html":"财务资料"},{"label":"D","html":"其他资料"},{"label":"E","html":"人力资源资料"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：业务资料；B：业务统计资料；C：财务资料；D：其他资料；E：人力资源资料”。多选题应检查所有选项，不能只选其中一项。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"下列指标属于比较相对指标的有（   ）。","answer":["B","E"],"dataset_description":null,"id":"p08:124","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列指标属于比较相对指标的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"男生人数占全班学生总数的51%"},{"label":"B","html":"中国人口是美国人口的4.2倍"},{"label":"C","html":"某商场 9 月份费用额与销售额相比，费用额是销售的 8%"},{"label":"D","html":"某厂2010年产量是2005年产量的1.5倍"},{"label":"E","html":"2004年北京市生产总值4283.3 亿元，是上海市生产总值7450.27亿元的 57.49%"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、E。对应内容为“B：中国人口是美国人口的4.2倍；E：2004年北京市生产总值4283.3 亿元，是上海市生产总值7450.27亿元的 57.49%”。多选题应检查所有选项，不能只选其中一项。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于样本矩统计量的是（  ）。","answer":["A","B"],"dataset_description":null,"id":"p08:125","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下不属于样本矩统计量的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本变异系数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本偏度\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本峰度\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本均值\u003c/span>\u003c/p>"}],"explanation":{"topic":"矩估计与样本矩","paragraphs":["k 阶原点矩是 E(Xᵏ)，样本原点矩为 ΣXᵢᵏ/n；k 阶中心矩围绕均值计算，样本中心矩为 Σ(Xᵢ−X̄)ᵏ/n。第一阶原点矩就是样本均值，第一阶中心矩为0。","矩估计把总体矩中的未知参数与对应样本矩相等，解出参数估计。它属于点估计，不是根据“最可能产生数据”的原则选参数，后者属于极大似然估计。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B。对应内容为“A：样本标准差；B：样本变异系数”。多选题应检查所有选项，不能只选其中一项。"],"tip":"原点矩围绕0；中心矩围绕均值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列抽样方法不属于非概率抽样的是（  ）。","answer":["A","C"],"dataset_description":null,"id":"p08:126","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列抽样方法不属于非概率抽样的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>分层抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>判断抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>等距抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>滚雪球抽样\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>配额抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、C。对应内容为“A：分层抽样；C：等距抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于样本均值抽样分布的数学期望和方差的描述，正确的是（ ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p08:127","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于样本均值抽样分布的数学期望和方差的描述，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>与原总体的分布有关\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>与样本容量的大小有关\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>如果原总体是正态分布，无论样本容量的大小，样本均值的抽样分布都服从正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>如果有总体的分布是非正态分布，随着样本容量的增大，样本均值的抽样分布将趋于正态分布\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>如果原总体的分布是非正态分布，随着样本容量的增大，样本均值的抽样分布服从正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：与原总体的分布有关；B：与样本容量的大小有关；C：如果原总体是正态分布，无论样本容量的大小，样本均值的抽样分布都服从正态分布；D：如果有总体的分布是非正态分布，随着样本容量的增大，样本均值的抽样分布将趋于正态分布”。多选题应检查所有选项，不能只选其中一项。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于整群抽样的描述，错误的有（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p08:128","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于整群抽样的描述，错误的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"最基本的抽样方法"},{"label":"B","html":"将抽样对象按次序编号，先随机抽取第1个调查对象，然后再按一定间隔随机抽样"},{"label":"C","html":"先将总体按某种特征分成若干个&quot;层&quot;，再在每个层中用随机方式抽取调查对象，再将每个层所有抽取的对象合成一个样本"},{"label":"D","html":"从总体中随机抽取若干群作为调查对象，然后对每个群中所有对象进行检查"},{"label":"E","html":"在大规模调查中常把抽样过程分为几个阶段，每个阶段可单纯随机抽样"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、C、E。对应内容为“A：最基本的抽样方法；B：将抽样对象按次序编号，先随机抽取第1个调查对象，然后再按一定间隔随机抽样；C：先将总体按某种特征分成若干个\"层\"，再在每个层中用随机方式抽取调查对象，再将每个层所有抽取的对象合成一个样本；E：在大规模调查中常把抽样过程分为几个阶段，每个阶段可单纯随机抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下特殊人群可以用滚雪球抽样法的是（  ）。","answer":["B","C","D","E"],"dataset_description":null,"id":"p08:129","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下特殊人群可以用滚雪球抽样法的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>高中生\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>女性同性恋\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>无家可归者\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>流动劳工\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>非法移民\u003c/span>\u003c/p>"}],"explanation":{"topic":"滚雪球抽样","paragraphs":["先找到少量符合条件的对象，再请其推荐其他符合条件者，如此扩展样本。它通常用于难以建立抽样框、隐蔽或不易接触的人群。","优势是进入特殊群体较容易、能获得较深入的信息；局限是依赖关系网络，样本可能集中于某些圈子，入样概率通常未知，不能据此保证总体代表性或无偏。","“任何人群都适用、误差必然更小、可直接作严格概率推断”都超过了这种方法能保证的范围。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、D、E。对应内容为“B：女性同性恋；C：无家可归者；D：流动劳工；E：非法移民”。多选题应检查所有选项，不能只选其中一项。"],"tip":"滚雪球靠推荐，适合难接触群体；网络偏差要警惕。","source":""},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于t分布，下列说法正确的有（ ）。","answer":["A","B","C"],"dataset_description":null,"id":"p08:130","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于t分布，下列说法正确的有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>t分布\u003c/span>\u003cspan>的形状取决于其自由度\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布与标准正态分布在图形上有一些相似性\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>在相同的置信水平下，t分布的置信区间通常比标准正态分布的置信区间更宽\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>t分布与均匀分布图型相似\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>随着自由度逐渐增大，t分布逐渐接近标准差为2的正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：t分布的形状取决于其自由度；B：t分布与标准正态分布在图形上有一些相似性；C：在相同的置信水平下，t分布的置信区间通常比标准正态分布的置信区间更宽”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于F分布，下列说法正确的是（   ）","answer":["A","B","D"],"dataset_description":null,"id":"p08:131","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于F分布，下列说法正确的是（ &nbsp; ）\u003c/span>\u003c/p>","options":[{"label":"A","html":" F值通常会是正值"},{"label":"B","html":"F分布应该集中在1左右"},{"label":"C","html":"F分布是正态分布"},{"label":"D","html":"F分布是偏态分布"},{"label":"E","html":"F值有时会是负值"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：F值通常会是正值；B：F分布应该集中在1左右；D：F分布是偏态分布”。多选题应检查所有选项，不能只选其中一项。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于分层抽样的说法，正确的有（  ）。","answer":["A","B"],"dataset_description":null,"id":"p08:132","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于分层抽样的说法，正确的有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>分层抽样误差小，准确性高\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>分层抽样获得的样本代表性强\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分层抽样管理方便\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分层抽样是将所有产品统一编号后进行随机抽样\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>分层抽样费用少\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B。对应内容为“A：分层抽样误差小，准确性高；B：分层抽样获得的样本代表性强”。多选题应检查所有选项，不能只选其中一项。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计抽样的描述，正确的是（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p08:133","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于统计抽样的描述，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>能够\u003c/span>\u003cspan>精确地控制抽样风险\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>需要特殊的专业技能\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>能够\u003c/span>\u003cspan>高效地设计样本\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>能够\u003c/span>\u003cspan>定量评价样本的结果\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>需要增加额外费用\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：能够精确地控制抽样风险；B：需要特殊的专业技能；C：能够高效地设计样本；D：能够定量评价样本的结果；E：需要增加额外费用”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于判断抽样，下列说法正确的是（  ）。","answer":["B","C"],"dataset_description":null,"id":"p08:134","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于判断抽样，下列说法正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>研究者用判断抽样来选取总体中难以接近或识别的人群（如特殊群体）\u003c/p>"},{"label":"B","html":"\u003cp>判断抽样属于非概率抽样方法\u003c/p>"},{"label":"C","html":"\u003cp>判断抽样的效果在很大程度上取决于研究者个人的研究素质、经验和专业知识\u003c/p>"},{"label":"D","html":"\u003cp>研究者使用对自己最为便利的方法来选取样本\u003c/p>"},{"label":"E","html":"\u003cp>电视台记者的“街头拦人”调查属于判断抽样（若记者有意识地选择特定类型路人）或方便抽样（若随机拦截），但通常归类为方便抽样\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C。对应内容为“B：判断抽样属于非概率抽样方法；C：判断抽样的效果在很大程度上取决于研究者个人的研究素质、经验和专业知识”。多选题应检查所有选项，不能只选其中一项。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"关于检验统计量,下列说法中正确的是(   )。","answer":["A","B","D","E"],"dataset_description":null,"id":"p08:135","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于检验统计量,下列说法中正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"检验统计量是样本的函数"},{"label":"B","html":"检验统计量是随机变量"},{"label":"C","html":"检验统计量包含未知总体参数"},{"label":"D","html":"检验同一总体参数可以采用多个不同检验统计量"},{"label":"E","html":"原假设成立的前提下检验统计量的分布是明确可知的"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D、E。对应内容为“A：检验统计量是样本的函数；B：检验统计量是随机变量；D：检验同一总体参数可以采用多个不同检验统计量；E：原假设成立的前提下检验统计量的分布是明确可知的”。多选题应检查所有选项，不能只选其中一项。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下面对矩估计法中原点矩和中心矩表述，错误的是（   ）。","answer":["A","C","D"],"dataset_description":null,"id":"p08:136","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下面对矩估计法中原点矩和中心矩表述，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本的一阶原点矩就是样本的原数据值"},{"label":"B","html":"样本的一阶原点矩就是样本的均值"},{"label":"C","html":"样本的二阶原点矩就是样本的均值"},{"label":"D","html":"样本的二阶中心矩就是样本的标准差"},{"label":"E","html":"样本的二阶中心矩就是样本的方差"}],"explanation":{"topic":"矩估计与样本矩","paragraphs":["k 阶原点矩是 E(Xᵏ)，样本原点矩为 ΣXᵢᵏ/n；k 阶中心矩围绕均值计算，样本中心矩为 Σ(Xᵢ−X̄)ᵏ/n。第一阶原点矩就是样本均值，第一阶中心矩为0。","矩估计把总体矩中的未知参数与对应样本矩相等，解出参数估计。它属于点估计，不是根据“最可能产生数据”的原则选参数，后者属于极大似然估计。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、C、D。对应内容为“A：样本的一阶原点矩就是样本的原数据值；C：样本的二阶原点矩就是样本的均值；D：样本的二阶中心矩就是样本的标准差”。多选题应检查所有选项，不能只选其中一项。"],"tip":"原点矩围绕0；中心矩围绕均值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于大数据分析和传统数据分析的区别的说法正确的有(     )。","answer":["A","B","C","E"],"dataset_description":null,"id":"p08:137","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于大数据分析和传统数据分析的区别的说法正确的有( &nbsp; &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"传统的数据分析是“向后分析”,分析的是已经发生的情况"},{"label":"B","html":"大数据分析是“向前分析”,具有预测性"},{"label":"C","html":"传统的数据分析主要针对结构化数据"},{"label":"D","html":"大数据分析建立在海量原始数据基础上,不需要预先设定研究目的和方法"},{"label":"E","html":"要从大量数据中通过数据挖掘技术找到数据之间的关系并建立模型，寻找导致现实情况的根源因素"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：传统的数据分析是“向后分析”,分析的是已经发生的情况；B：大数据分析是“向前分析”,具有预测性；C：传统的数据分析主要针对结构化数据；E：要从大量数据中通过数据挖掘技术找到数据之间的关系并建立模型，寻找导致现实情况的根源因素”。多选题应检查所有选项，不能只选其中一项。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"在一元线性回归模型y=β0+β1x+ε中，下列说法正确的是（ ）。","answer":["A","B","C"],"dataset_description":null,"id":"p08:138","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>在一元线性回归模型y=β\u003c/span>\u003cspan>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>+β\u003c/span>\u003cspan>\u003csub>1\u003c/sub>\u003c/span>\u003cspan>x+ε中，下列说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"β\u003csub>0\u003c/sub>+β\u003csub>1\u003c/sub>x反映了由于x的变化而引起的y的线性变化"},{"label":"B","html":"ε反映了除x和y之间的线性关系之外的随机因素对y的影响"},{"label":"C","html":"在一元回归模型中把除x之外的影响y的因素都归人中"},{"label":"D","html":"ε可以由x和y之间的线性关系所解释的变异性"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：β0+β1x反映了由于x的变化而引起的y的线性变化；B：ε反映了除x和y之间的线性关系之外的随机因素对y的影响；C：在一元回归模型中把除x之外的影响y的因素都归人中”。多选题应检查所有选项，不能只选其中一项。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"以下有关宪法修改的表述，正确的有（    ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p08:139","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下有关宪法修改的表述，正确的有（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"宪法制定和修改程序比普通法律更为严格"},{"label":"B","html":"\u003cp>全国人民代表大会是唯一有权修改宪法的机关\u003c/p>"},{"label":"C","html":"\u003cp>全国人大常务委员会有权提出修正案\u003c/p>"},{"label":"D","html":"\u003cp>宪法修改可以由五分之一以上的全国人大代表提出\u003c/p>"},{"label":"E","html":"\u003cp>宪法修正案应由全国人大以全体代表的二分之一以上多数通过\u003c/p>"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：宪法制定和修改程序比普通法律更为严格；B：全国人民代表大会是唯一有权修改宪法的机关；C：全国人大常务委员会有权提出修正案；D：宪法修改可以由五分之一以上的全国人大代表提出”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"2018年9月17日，习近平主席致信祝贺2018世界人工智能大会在上海召开。在贺信中习近平主席指出，要处理好人工智能在（ ）等方面提出的新课题，需要各国深化合作、共同探讨。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p08:140","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>2018年9月17日，习近平主席致信祝贺2018世界人工智能大会在上海召开。在贺信中习近平主席指出，要处理好人工智能在（ ）等方面提出的新课题，需要各国深化合作、共同探讨。\u003c/span>\u003c/p>","options":[{"label":"A","html":"法律"},{"label":"B","html":"安全"},{"label":"C","html":"就业"},{"label":"D","html":"道德伦理"},{"label":"E","html":"政府治理"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：法律；B：安全；C：就业；D：道德伦理；E：政府治理”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“date08.xlsx”中在空白单元格，输入“=COLUMNS(1:1)”，得到的结果为（）。","answer":["B"],"dataset_description":"Excel表格文件“data08.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含6个特征数据：date、四支股票：openp、highp、lowp、closep、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p08:141","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>文件“date08.xlsx”中在空白单元格，输入“=COLUMNS(1:1)”，得到的结果为（）。\u003c/p>","options":[{"label":"A","html":"65536"},{"label":"B","html":"16384"},{"label":"C","html":"256"},{"label":"D","html":"1048576"}],"explanation":{"topic":"整行的列数","paragraphs":["COLUMNS(1:1) 计算第1整行包含多少列；.xlsx 工作表有16,384列，最后一列为 XFD，所以选 B。","1,048,576 是行数；256 是旧 .xls 格式的列数。"],"tip":"","warning":"题干 date08.xlsx 为文件名笔误，实际素材是 data08.xlsx。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data08.xlsx","href":"../materials/p08/data08.xlsx"}]},{"number":142,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":2,"question":"要实现文件\"data08.xlsx\"的工作表\"Sheet1\"中A列的日期数据手动输入，可以采用如下哪个方法来方便快捷地实现要求？","answer":["D"],"dataset_description":"Excel表格文件“data08.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含6个特征数据：date、四支股票：openp、highp、lowp、closep、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p08:142","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>要实现文件&quot;data08.xlsx&quot;的工作表&quot;Sheet1&quot;中A列的日期数据手动输入，可以采用如下哪个方法来方便快捷地实现要求？\u003c/p>","options":[{"label":"A","html":"逐个输入每个日期，手动调整日期格式"},{"label":"B","html":"在 Excel 中使用数据验证功能，逐个输入每个日期，然后自动转换为日期格式"},{"label":"C","html":"将日期数据逐个输入在文本文件中，并使用 Excel 的“导入数据”功能批量导入数据"},{"label":"D","html":"在 Excel 中使用自动填充功能来快速填充多行日期数据"}],"explanation":{"topic":"自动填充连续日期","paragraphs":["先输入起始日期，可再输入次日以确定步长，选中后拖动填充柄；也可在填充选项中选择“填充天数”。因此选使用自动填充的 D。","单纯复制同一个日期只会重复原值，需要确认生成的是按天变化的日期序列。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data08.xlsx","href":"../materials/p08/data08.xlsx"}]},{"number":143,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":3,"question":"文件“date08.xlsx”中的“Sheet1”中，选定原始数据中“A1:F362”区域，数据的缺失值个数为（  ）。","answer":["A"],"dataset_description":"Excel表格文件“data08.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含6个特征数据：date、四支股票：openp、highp、lowp、closep、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p08:143","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>文件“date08.xlsx”中的“Sheet1”中，选定原始数据中“A1:F362”区域，数据的缺失值个数为（ &nbsp;）。\u003c/p>","options":[{"label":"A","html":"0"},{"label":"B","html":"1"},{"label":"C","html":"10"},{"label":"D","html":"100"}],"explanation":{"topic":"指定区域检查缺失值","paragraphs":["本题只检查 A1:F362。可用 =COUNTBLANK(A1:F362) 或“定位条件→空值”，结果为0，选 A。","素材还有其他数据和格式行，但题目限定了区域；不要把整个工作表的空白算成缺失值。"],"tip":"","warning":"题干 date08.xlsx 为笔误，实际素材是 data08.xlsx。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data08.xlsx","href":"../materials/p08/data08.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"d let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
