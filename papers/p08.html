span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["比较同类企业的优势和劣势，可以识别与自己争夺客户、具有威胁或替代能力的对手，因此题干错误。","还要结合客户重合、份额和发展速度，不应只按企业名称或规模判断。"],"warning":""},"attachments":[]},{"number":4,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"市场调研不能发现那些尚未被满足的需求（  ）。","answer":["B"],"dataset_description":null,"id":"p08:4","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>市场调研不能发现那些尚未被满足的需求\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"市场调研与未满足需求","paragraphs":["市场调研可以通过访谈、观察、问卷、投诉和使用行为分析等方式发现客户痛点与尚未满足的需求。","调研结果并不保证完美，但题干说“不能发现”过于绝对，因此错误。"],"warning":""},"attachments":[]},{"number":5,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"关注竞争企业的市场份额变化趋势，评估其市场增长潜力可以识别出主要竞争对手（  ）。","answer":["A"],"dataset_description":null,"id":"p08:5","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关注竞争企业的市场份额变化趋势，评估其市场增长潜力可以识别出主要竞争对手\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["份额变化及增长潜力反映对手对市场的影响和未来威胁，可帮助识别主要竞争者，题干正确。","份额较小但增长很快的企业，也可能比份额稳定的企业更值得持续关注。"],"warning":""},"attachments":[]},{"number":6,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"通过深入剖析竞争对手的现状和未来动向，企业可以准确判断自身的市场地位和竞争优势，从而制定更加合理和有效的竞争策略（  ）。","answer":["A"],"dataset_description":null,"id":"p08:6","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>通过深入剖析竞争对手的现状和未来动向，企业可以准确判断自身的市场地位和竞争优势，从而制定更加合理和有效的竞争策略\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"expla l":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":15,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"强度相对数一般为有名数（  ）。","answer":["A"],"dataset_description":null,"id":"p08:15","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>强度相对数一般为有名数\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":16,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"计量尺度水平高级的类型可以用低级类型的分析方法（  ）。","answer":["A"],"dataset_description":null,"id":"p08:16","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>计量尺度水平\u003cspan>高级的类型可以用低级类型的分析方法\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":17,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"强度相对数也称强度相对指标（  ）。","answer":["A"],"dataset_description":null,"id":"p08:17","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>强度相对数也称强度相对指标\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"抽样的目的是从被抽取样品单位的分析、研究结果来估计和推断全部样品特性（  ）。","answer":["B"],"dataset_description":null,"id":"p08:18","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>抽样的目的是从被抽取样品单位的分析、研究结果来\u003c/span>估计\u003cspan>和\u003c/span>推断\u003cspan>全部样品\u003c/span>特性\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"抽样推断的对象","paragraphs":["抽样通常希望利用样本信息，估计和推断其所来自的总体特征，例如用样本均值估计总体均值。","若“全部样品”指已经抽出的样本，就混淆了样本与总体；推断目标应写成总体。"],"warning":"原站判错，但“全部样品特性”的表述有歧义。若作者本意是总体，题干描述的是抽样推断的通常目的，不能简单一概判错。"},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"有限总体的范围能够明确确定，且元素的数目是有限的（  ）。","answer":["A"],"dataset_description":null,"id":"p08:19","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>有限总体的范围能够明确确定，且元素的数目是有限的（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本容量越大，抽样平均误差越小（  ）。","answer":["A"],"dataset_description":null,"id":"p08:20","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>样本容量越大，抽样平均误差越小（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"标准误与标准差","paragraphs":["标准差描述一组观测值彼此有多分散；标准误描述一个统计量在重复抽样时有多波动，是统计量抽样分布的标准差。二者研究对象不同。","均值的标准误为 σ/√n，σ 未知时常以 s/√n 估计。其他条件相同，样本越大或总体越同质，标准误越小。样本量扩大到原来的4倍，标准误才缩小到一半。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"标准差看个体差异；标准误看估计稳定性。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"F分布是两个独立卡方分布的函数（ ）。","answer":["A"],"dataset_description":null,"id":"p08:21","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>F分布是两个独立卡方分布的函数（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"在实际调查研究中直接采用简单随机抽样的应用非常多。","answer":["B"],"dataset_description":null,"id":"p08:22","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>在实际调查研究中直接采用简单随机抽样的应用非常多\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"t分布曲线形状与自由度有关（ ）。","answer":["A"],"dataset_description":null,"id":"p08:23","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>t分布曲线形状与自由度有关（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"矩统计量不唯一（  ）。","answer":["A"],"dataset_description":null,"id":"p08:24","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>矩统计量不唯一（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"矩估计与样本矩","paragraphs":["k 阶原点矩是 E(Xᵏ)，样本原点矩为 ΣXᵢᵏ/n；k 阶中心矩围绕均值计算，样本中心矩为 Σ(Xᵢ−X̄)ᵏ/n。第一阶原点矩就是样本均值，第一阶中心矩为0。","矩估计把总体矩中的未知参数与对应样本矩相等，解出参数估计。它属于点估计，不是根据“最可能产生数据”的原则选参数，后者属于极大似然估计。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"原点矩围绕0；中心矩围绕均值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本均值的抽样分布是所有的样本均值形成的分布（  ）。","answer":["A"],"dataset_description":null,"id":"p08:25","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>样本均值的抽样分布是所有的样本均值形成的分布\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量的值不是唯一的（  ）。","answer":["A"],"dataset_description":null,"id":"p08:26","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>样本统计量的值不是唯一的\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"系统抽样需要给总体中的每一个元素按顺序编上号码。","answer":["A"],"dataset_description":null,"id":"p08:27","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>系统抽样需要给总体中的每一个元素按顺序编上号码\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"假设检验是先对总体的参数做出某种假设,为判断所作的假设是否正确,从总体中抽取样本判断假设是否成立的过程（ ）。","answer":["A"],"dataset_description":null,"id":"p08:28","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>假设检验是先对总体的参数做出某种假设,为判断所作的假设是否正确,从总体中抽取样本判断假设是否成立的过程（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"统计推理是一种枚举归纳推理（ ）。","answer":["B"],"dataset_description":null,"id":"p08:29","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>统计推理是一种枚举归纳推理\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"对于列联表为四行五列的卡方独立性检验,其自由度等于12（ ）。","answer":["A"],"dataset_description":null,"id":"p08:30","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>对于列联表为四行五列的卡方独立性检验,其自由度等于12\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"置信度是一个接近于0的概率值（ ）。","answer":["B"],"dataset_description":null,"id":"p08:31","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>置信度是一个接近于0的概率值（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"参数检验只能使用单样本数据","answer":["B"],"dataset_description":null,"id":"p08:32","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>参数检验只能使用单样本数据\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"参数检验并不限于单样本","paragraphs":["参数检验针对总体分布参数，在满足相应假设时，可处理单样本均值、双独立样本均值、配对均值及多组均值等问题。","例如两独立样本 t 检验就是参数检验的双样本情形，因此“只能使用单样本”错误。"],"warning":""},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"估计值与总体参数在一定允许的误差范围以内的概率称为置信度（ ）。","answer":["A"],"dataset_description":null,"id":"p08:33","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>估计值与总体参数在一定允许的误差范围以内的\u003c/span>概率\u003cspan>称为置信度（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据分析只能用于互联网领域（ ）。","answer":["B"],"dataset_description":null,"id":"p08:34","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>大数据分析只能用于互联网领域\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“ 不只记字母。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"叶子节也可能是中间节点（  ）。","answer":["B"],"dataset_description":null,"id":"p08:40","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>叶子节也可能是中间节点\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"可视化技术是探索性数据分析的主要方法之一，下列关于可视化技术的描述,说法错误的是（   ）","answer":["B"],"dataset_description":null,"id":"p08:41","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>可视化技术是探索性数据分析的主要方法之一，下列关于可视化技术的描述,说法错误的是（ &nbsp; ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"能够帮助数据分析人员快速吸收大量信息。"},{"label":"B","html":"可视化技术与具体的数据集毫不相关。"},{"label":"C","html":"能够帮助数据分析人员发现数据的模式。"},{"label":"D","html":"运用可视化技术具有专门性和特殊性。"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：可视化技术与具体的数据集毫不相关。”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":42,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下列关于指标对比分析法的表述中，不正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p08:42","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于指标对比分析法的表述中，不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可以用于不同的分析目的。"},{"label":"B","html":"既可以选用计划数，也可以选用实际数作为分析的基数。"},{"label":"C","html":"可以使用不同性质指标进行对比分析。"},{"label":"D","html":"用于分析对比的指标在经济内容上应当具有可比的共同基础。"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：可以使用不同性质指标进行对比分析。”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":43,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"数据分析师需要具备业务能力，下面关于业务能力的说法，不正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p08:43","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>数据分析师需要具备业务能力，下面关于业务能力的说法，不正确的是\u003c/span>\u003cspan>( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"行业背景知识"},{"label":"B","html":"企业业务流程"},{"label":"C","html":"数据图表"},{"label":"D","html":"自己独到的见解"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：数据图表”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":44,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"由宏观经济环境发生变化而导致企业发生风险，这种风险是(   )。","answer":["D"],"dataset_description":null,"id":"p08:44","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>由宏观经济环境发生变化而导致企业发生风险，这种风险是( &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"技术风险"},{"label":"B","html":"政治风险"},{"label":"C","html":"成功的可能性和潜在的吸引力"},{"label":"D","html":"市场风险"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["按本题分类，宏观经济变化引起需求、价格和市场条件波动，归为市场风险，选 D。","技术风险主要与技术适应或失败相关，政治风险侧重政治和政策变化；C 甚至不是风险类别。"],"warning":"宏观经济风险的具体归类可随风险体系而变，以上按题目给定分类说明。"},"attachments":[]},{"number":45,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"客户数据应当反映客户的基本情況，企业客户的数据中,姓名、性别、电子信箱等属于（   ）。","answer":["C"],"dataset_description":null,"id":"p08:45","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>客户数据应当反映客户的基本情況，企业客户的数据中,姓名、性别、电子信箱等属于（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"行为数据"},{"label":"B","html":"交易数据"},{"label":"C","html":"属性数据"},{"label":"D","html":"关系数据"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["姓名、性别、邮箱描述客户自身基本特征，属于属性数据，选 C。","行为数据是点击或访问，交易数据是购买和支付，关系数据刻画客户与他人的联系；应按记录内容而非来源分类。"],"warning":""},"attachments":[]},{"number":46,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"企业的战略指标一般可分为三个层级，以下不属于三层级之一的是（   ）。","answer":["B"],"dataset_description":null,"id":"p08:46","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>企业的战略指标一般可分为三个层级，以下不属于三层级之一的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"战略层指标"},{"label":"B","html":"计划层指标"},{"label":"C","html":"业务层指标"},{"label":"D","html":"执行层指标"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["题库使用战略层、业务层、执行层三个层级，“计划层”不是其中之一，选 B。","战略定方向，业务分解到产品或区域目标，执行跟踪具体行动；计划可以存在于各层，不能据此多造一个并列层。"],"warning":""},"attachments":[]},{"number":47,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在业务分析报告中，最不宜采用的表达形式是(   )。","answer":["D"],"dataset_description":null,"id":"p08:47","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>在业务分析报告中，最不宜采用的表达形式是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"图型"},{"label":"B","html":"文字"},{"label":"C","html":"表格"},{"label":"D","html":"表情符号"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：表情符号”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"从市场上收集第二手数据的调查方法是（    ）。","answer":["B"],"dataset_description":null,"id":"p08:48","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>从市场上\u003c/span>\u003cspan>收集第二手数据的调查方法是（ &nbsp; &nbsp;）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"观察调查法"},{"label":"B","html":"文案调查法"},{"label":"C","html":"实验调查法"},{"label":"D","html":"询问调查法"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：文案调查法”。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在对数据进行分组时,下列说法正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p08:49","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>在对数据进行分组时,下列说法正确的是（ &nbsp;）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"在分组时,我们应该先确定组距"},{"label":"B","html":"在分组时,组数越多越好"},{"label":"C","html":"在分组时,组数越少越好"},{"label":"D","html":"在对数据分组时，应先确定组数，再确定组距"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：在对数据分组时，应先确定组数，再确定组距”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"数量指标和质量指标的根本区别在于 (    )。","answer":["D"],"dataset_description":null,"id":"p08:50","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>数量指标和质量指标的根本区别在于 ( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"使用领域不同"},{"label":"B","html":"数量大小不同"},{"label":"C","html":"统计单位不同"},{"label":"D","html":"反映的总体数量特征的性质不同"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：反映的总体数量特征的性质不同”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"定距尺度与定比尺度的区别是（     ）。","answer":["D"],"dataset_description":null,"id":"p08:51","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>定距尺度与定比尺度的区别是（ &nbsp; &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>定比尺度是类似于定距尺度，但又高于定距尺度的一种计量方法\u003c/p>"},{"label":"B","html":"\u003cp>在定距尺度中不表示“没有”\u003c/p>"},{"label":"C","html":"\u003cp>定距尺度是类似于定比尺度，但又高于定比尺度的一种计量方法\u003c/p>"},{"label":"D","html":"\u003cp>在定比尺度中，“0”表示“没有”\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：在定比尺度中，“0”表示“没有””。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"恩格尔系数是指食品支出在家庭支出中的比重。随着我国经济的发展，恩格尔系数在下降，这说明（   ）。","answer":["B"],"dataset_description":null,"id":"p08:52","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>恩格尔系数是指食品支出在家庭支出中的比重。随着我国经济的发展，恩格尔系数在下降，这说明（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"我国家庭的消费意识滞后"},{"label":"B","html":"我国的家庭收入水平在提高"},{"label":"C","html":"我国家庭的消费意识增强"},{"label":"D","html":"我国家庭的收入水平在下降"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：我国的家庭收入水平在提高”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"具有绝对零点的测量是（   ）。","answer":["D"],"dataset_description":null,"id":"p08:53","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>具有绝对零点的测量是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"定类测量"},{"label":"B","html":"定序测量"},{"label":"C","html":"定距测量"},{"label":"D","html":"定比测量"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：定比测量”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"抽样调查中，无法消除的误差是（ ）。","answer":["A"],"dataset_description":null,"id":"p08:54","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>抽样调查中，无法消除的误差是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>责任心误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>登记误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>系统性误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：抽样误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布说法正确的是（ ）。","answer":["A"],"dataset_description":null,"id":"p08:55","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于F分布说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F分布是一分布族\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布的曲线关于y轴对称\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F分布有一个自由度\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>F分布的取值都大于零\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：F分布是一分布族”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"某市为了调查小学生视力情况，首先随机抽取该市几个学校，然后再从抽中学校各随机抽取部分学生作调查，这种抽样方式属于（  ）。","answer":["D"],"dataset_description":null,"id":"p08:56","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>某市为了调查小学生视力情况，首先随机抽取该市几个学校，然后再从抽中学校各随机抽取部分学生作调查，这种抽样方式属于（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 三阶段抽样\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>多级抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>前后抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>二阶段抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：二阶段抽样”。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"整群抽样中将总体各单位归并成若干个（   ）的集合，成为群，然后以群为单位抽取样本。","answer":["C"],"dataset_description":null,"id":"p08:57","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>整群抽样中将总体各单位归并成若干个（ &nbsp; ）的集合，成为群，然后以群为单位抽取样本。\u003c/span>\u003c/p>","options":[{"label":"A","html":"互不交叉，可以重复"},{"label":"B","html":"可以交叉，可以重复"},{"label":"C","html":"互不交叉，互不重复"},{"label":"D","html":"可以交叉，互不重复"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：互不交叉，互不重复”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"给定n=250，总体比例为0.1，那么样本比例的抽样标准差为（ ）。","answer":["A"],"dataset_description":null,"id":"p08:58","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>给定n=250，\u003c/span>\u003cspan>总体比例为\u003c/span>\u003cspan>0.1，那么样本比例的抽样标准差为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>0.019\u003c/p>"},{"label":"B","html":"\u003cp>0.016\u003c/p>"},{"label":"C","html":"\u003cp>0.012\u003c/p>"},{"label":"D","html":"\u003cp>0.12\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["样本比例标准误=√[p(1−p)/n]=√(0.1×0.9÷250)=√0.00036≈0.018974，约0.019，选 A。","这是比例估计的波动，不是0.1本身，也不是方差0.00036。"],"warning":""},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列叙述中，采用推断统计的方法是（   ）。","answer":["B"],"dataset_description":null,"id":"p08:59","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列叙述中，采用推断统计的方法是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"用饼图描述某企业职工的学历构成"},{"label":"B","html":"从某果园中采摘36个橘子，用这36个橘子的平均重量估计果园中橘子的平均重量"},{"label":"C","html":"一个城市在1月份的平均汽油价格"},{"label":"D","html":"反映大学生统计学成绩的条形图"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：从某果园中采摘36个橘子，用这36个橘子的平均重量估计果园中橘子的平均重量”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布的描述，正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p08:60","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于F分布的描述，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F分布曲线是关于y轴左右对称的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布可由两个相互独立的卡方随机变量构造而成\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F分布的倒数是卡方分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>T分布的倒数是F分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：F分布可由两个相互独立的卡方随机变量构造而成”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在统计学中把用于描述总体特征的概括性值称为（   ）。","answer":["C"],"dataset_description":null,"id":"p08:61","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>在统计学中把用于描述总体特征的概括性值称为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"总体"},{"label":"B","html":"样本"},{"label":"C","html":"参数"},{"label":"D","html":"统计量"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：参数”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"与简单随机抽样相比，以下关于整群抽样的描述，错误的是（  ）。","answer":["B"],"dataset_description":null,"id":"p08:62","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>与简单随机抽样相比，\u003c/span>\u003cspan>以下关于整群抽样的描述，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>简化了抽样编制的工作量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>调查的地点相对分散\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>节省调查费用\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>方便了调查的实施\u003c/span>\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：调查的地点相对分散”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"系统抽样是将总体的全部单元按照一定顺序排列,先随机抽取第一个样本,再以此样本为起点,按照某种确定的规则顺序抽取其余的样本单元的抽样方法。根据上述定义,下列抽样中属于系统抽样的是（   ）。","answer":["A"],"dataset_description":null,"id":"p08:63","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>系统抽样是将总体的全部单元按照一定顺序排列,先随机抽取第一个样本,再以此样本为起点,按照某种确定的规则顺序抽取其余的样本单元的抽样方法。根据上述定义,下列抽样中属于系统抽样的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>研究人员为了从标有1—15号的15个球中选3个作样本，先随机选取2号球，再抽取7号、12号入样\u003c/p>"},{"label":"B","html":"\u003cp>工厂生产的产品，用传送带将产品送入包装车间，检验人员从传送带上每隔五分钟抽一件产品进行检验\u003c/p>"},{"label":"C","html":"\u003cp>研究人员为了进行某项市场调查，在商场门口随机选择消费者进行询问，直到询问人数满足事先规定为止\u003c/p>"},{"label":"D","html":"\u003cp>电影院为了解观众对某部电影的观感，邀请每排座位号为14的观众填写调查问卷\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：研究人员为了从标有1—15号的15个球中选3个作样本，先随机选取2号球，再抽取7号、12号入样”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"如果标准差为4，方差等于（   ）。","answer":["B"],"dataset_description":null,"id":"p08:64","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>如果标准差为4，方差等于\u003c/span>\u003cspan>（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>2\u003c/p>"},{"label":"B","html":"\u003cp>16\u003c/p>"},{"label":"C","html":"\u003cp>4\u003c/p>"},{"label":"D","html":"\u003cp>12\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：16”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于描述总体集中趋势的参数，下列错误的说法是（  ）。","answer":["C"],"dataset_description":null,"id":"p08:65","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于描述总体集中趋势的参数，下列错误的说法是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>算术平均不适用于描述偏态分布总体的集中趋势\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>算术平均适用于对称分布的总体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>中位数只适用于描述偏态分布总体的集中趋势\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>中位数是指总体中按大小排列后位于中间位置的数\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：中位数只适用于描述偏态分布总体的集中趋势”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":66,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于非概率的配额抽样与概率方法的分层抽样之间的区别的说法，错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p08:66","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下关于非概率的配额抽样与概率方法的分层抽样之间的区别的说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>配额抽样一般适用于总体比较小的研究，分层抽样适用于总体较大的研究\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>配额抽样建立在研究者对总体非常熟悉的基础上，而分层抽样不需要对总体的单位或元素非常熟悉\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>配额抽样只能获得一个与总体比较相似的样本，分层抽样可以再现总体的结构\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>配额抽样和分层抽样的样本都能够推论总体\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：配额抽样和分层抽样的样本都能够推论总体”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":67,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于系统抽样要素的是（  ）。","answer":["B"],"dataset_description":null,"id":"p08:67","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下不属于系统抽样要素的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>所选样本的数量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体单位分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本总容量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>取样间隔\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：总体单位分布”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于多阶段抽样说法正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p08:68","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下关于多阶段抽样说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>在样本量相同的情况下，比分层抽样的误差更小\u003c/p>"},{"label":"B","html":"\u003cp>多阶段抽样只能用于小规模调查\u003c/p>"},{"label":"C","html":"\u003cp> 多阶段抽样适用于调查范围特别狭窄的场景\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>适合大规模的调查\u003c/span>\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：适合大规模的调查”。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面有关抽样分布的说法, 错误的是（ ）。","answer":["D"],"dataset_description":null,"id":"p08:69","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下面有关抽样分布的说法, 错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>随着样本容量的增加，抽样分布趋于正态\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随着样本容量的增加，抽样分布的方差趋小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样分布的方差与总体方差的大小有关\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正态总体抽样所有统计量服从正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：正态总体抽样所有统计量服从正态分布”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"用于总体均值推断的检验统计量服从自由度为多少的什么分布？","answer":["A"],"dataset_description":null,"id":"p08:70","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>用于总体均值推断的检验统计量服从自由度为多少的什么分布？\u003c/p>","options":[{"label":"A","html":"n-1的t分布"},{"label":"B","html":"n-1的z分布"},{"label":"C","html":"n的t分布"},{"label":"D","html":"n的z分布"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：n-1的t分布”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面有关抽样分布的说法,不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p08:71","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下面有关抽样分布的说法,不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>在独立同分布且方差存在的条件下，随着样本容量的增加，样本均值的抽样分布趋于正态分布\u003c/p>"},{"label":"B","html":"\u003cp>随着样本容量的增加，样本均值抽样分布的方差趋小\u003c/p>"},{"label":"C","html":"\u003cp>样本均值抽样分布的方差与原总体方差的大小有关\u003c/p>"},{"label":"D","html":"\u003cp>正态总体下，由样本构造的所有统计量都服从正态分布\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：正态总体下，由样本构造的所有统计量都服从正态分布”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":72,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"调查中所产生的系统性误差是（  ）。","answer":["C"],"dataset_description":null,"id":"p08:72","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>调查中所产生的系统性误差是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>系统性误差不能避免，但可以控制\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>系统性误差既不可以避免，也不可以控制\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>系统性误差可以避免\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>系统性误差可以避免，但不可以控制\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：系统性误差可以避免”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":73,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于描述总体平均数的指标是（  ）。","answer":["C"],"dataset_description":null,"id":"p08:73","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下不属于描述总体平均数的指标是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体算术平均数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体几何平均数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体众数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体加权平均数\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：总体众数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于样本统计量分布规律描述正确的是（ ）。","answer":["A"],"dataset_description":null,"id":"p08:74","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下面关于样本统计量分布规律描述正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>样本均值的抽样分布，在大样本条件下近似服从正态分布\u003c/p>"},{"label":"B","html":"\u003cp> 所有样本统计量的抽样分布都精确服从正态分布\u003c/p>"},{"label":"C","html":"\u003cp>样本均值的抽样分布，在小样本条件下一定服从正态分布\u003c/p>"},{"label":"D","html":"\u003cp>样本中位数的抽样分布，在大样本条件下近似服从正态分布\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：样本均值的抽样分布，在大样本条件下近似服从正态分布”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量是（  ）。","answer":["C"],"dataset_description":null,"id":"p08:75","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>样本统计量是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>未知但确定的量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>一个已知的量\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随机变量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>唯一的量\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：随机变量”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在离散程度的测度中,最容易受极端值影响的是（   ）","answer":["A"],"dataset_description":null,"id":"p08:76","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>在离散程度的测度中,最容易受极端值影响的是（ &nbsp; ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"极差"},{"label":"B","html":"四分位数"},{"label":"C","html":"标准差"},{"label":"D","html":"方差"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：极差”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于分层抽样的说法，正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p08:77","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于分层抽样的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>层内具有异质性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>分层变量越多，层数越多\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分层抽样是一种非随机抽样方法\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分层原则是层间具有同质性\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：分层变量越多，层数越多”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列对抽样误差的描述正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p08:78","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列对抽样误差的描述正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>由抽样所引起的误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本分布可近似看作正偏分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>提高观测精度可减小抽样误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>减少样本容量可减少抽样误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：由抽样所引起的误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布的描述,错误的是（ ）。","answer":["A"],"dataset_description":null,"id":"p08:79","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于F分布的描述,错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F分布是一个负偏态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F值总为正值\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随着分子和分母的自由度的变化而变化的一簇曲线\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分子和分母的自由度越大,F分布越接近正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：F分布是一个负偏态分布”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于系统误差的描述,不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p08:80","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于系统误差的描述,不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>系统误差具有重复性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>系统误差具有单向性\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>系统误差具有可测性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>系统误差服从正态分布规律\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：系统误差服从正态分布规律”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"自由度为n的卡方分布的数学期望为（ ）。","answer":["C"],"dataset_description":null,"id":"p08:81","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>自由度为n的卡方分布的数学期望为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>3n\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>2n\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>n\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>6n\u003c/span>\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：n”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"已知某正态总体的标准差为16,现从中随机抽取一个n=100的样本，样本标准差为16，则样本平均数分布的标准误为（ ）。","answer":["B"],"dataset_description":null,"id":"p08:82","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>已知某正态总体的标准差为16,现从中随机抽取一个n=100的样本，样本标准差为16，则样本平均数分布的标准误为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>0.16\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>1.6\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>4\u003c/p>"},{"label":"D","html":"\u003cp>25\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["总体标准差σ=16，n=100，均值标准误σ/√n=16÷10=1.6，选 B。","题干给出的样本标准差也为16，但此题已知总体标准差，可直接使用总体口径。"],"warning":""},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"常用的抽样方法中，整群抽样的优点是（   ）。","answer":["B"],"dataset_description":null,"id":"p08:83","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>常用的抽样方法中，整群抽样的优点是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>样本代表性好\u003c/p>"},{"label":"B","html":"便于组织，节省经费"},{"label":"C","html":"\u003cp>误差小于单纯随机抽样\u003cspan>\u003cbr>\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>均数，比率及相应的标准误计算简单\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：便于组织，节省经费”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"调查中所产生的登记性误差是（  ）。","answer":["C"],"dataset_description":null,"id":"p08:84","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>调查中所产生的登记性误差是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>不能避免，但可以控制\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>既不可以避免，也不可以控制\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>既可以避免，也可以控制\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>可以避免，但不可以控制\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：既可以避免，也可以控制”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"如果数据为正态分布,我们将选择（   ）为集中趋势指标。","answer":["B"],"dataset_description":null,"id":"p08:85","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>如果数据为正态分布,我们将选择（ &nbsp; ）为集中趋势指标。\u003c/span>\u003c/p>","options":[{"label":"A","html":"中位数"},{"label":"B","html":"均值"},{"label":"C","html":"众数"},{"label":"D","html":"几何平均数"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：均值”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于分层抽样的说法，不正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p08:86","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于分层抽样的说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>分层抽样适用于总体各层之间差异较大的情形\u003c/p>"},{"label":"B","html":"\u003cp> 分层抽样的目的是使层内个体更具同质性\u003c/p>"},{"label":"C","html":"\u003cp>分层抽样中每个个体被抽中的概率一定相同\u003c/p>"},{"label":"D","html":"\u003cp>分层抽样常按各层数量比例来分配样本量\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：分层抽样中每个个体被抽中的概率一定相同”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本均值抽样分布的特点有（ ）。","answer":["D"],"dataset_description":null,"id":"p08:87","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>样本均值抽样分布的特点有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本均值会随着样本容量的增大而变小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本均值会随着样本容量的增大而变大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本均值抽样分布的标准差会随着样本容量的增大而变大\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本均值抽样分布的标准差会随着样本容量的增大而变小\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：样本均值抽样分布的标准差会随着样本容量的增大而变小”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列指标中，用于描述数据集中趋势，并且易受极端值影响的是（   ）。","answer":["A"],"dataset_description":null,"id":"p08:88","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列指标中，用于描述数据集中趋势，并且易受极端值影响的是（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"算术平均数"},{"label":"B","html":"中位数"},{"label":"C","html":"众数"},{"label":"D","html":"极差"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：算术平均数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计量与估计量的说法不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p08:89","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于统计量与估计量的说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>估计量计算利用参数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>估计量是样本点确定的量\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>统计量表达式中不包含任何未知参数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>统计量是样本的函数形式\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：估计量计算利用参数”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":90,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"将总体按某些重要的标志分成互不交叉重叠的层，然后在各层中采用随机抽样或其他方式抽取若干样本单位组成一个样本的抽样方法是（    ）。","answer":["B"],"dataset_description":null,"id":"p08:90","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>将总体按某些重要的标志分成互不交叉重叠的层，然后在各层中采用随机抽样或其他方式抽取若干样本单位组成一个样本的抽样方法是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"简单随机抽样"},{"label":"B","html":"分层随机抽样"},{"label":"C","html":"整群随机抽样"},{"label":"D","html":"系统随机抽样"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：分层随机抽样”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":91,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下述关于样本指标的说法，不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p08:91","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下述关于\u003c/span>\u003cspan>样本指标\u003c/span>\u003cspan>的说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本\u003c/span>\u003cspan>指标\u003c/span>\u003cspan>的\u003c/span>\u003cspan>值是确定的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本指标是根据抽样计算的指标\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本指标的计算随着样本的不同而不同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本\u003c/span>\u003cspan>指标\u003c/span>\u003cspan>的\u003c/span>\u003cspan>值是不确定的\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：样本指标的值是确定的”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例的抽样分布,说法错误的是（ ）","answer":["A"],"dataset_description":null,"id":"p08:92","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于样本比例的抽样分布,说法错误的是（ ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本比例的均值等于样本比例的标准差"},{"label":"B","html":"样本比例的均值等于总体比例的均值"},{"label":"C","html":"如果总体比例为0.5，则样本比例的抽样分布图形是对称的"},{"label":"D","html":"如果总体比例偏离0.5，只要样本量足够大，则样本比例的抽样分布仍可近似正态分布"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：样本比例的均值等于样本比例的标准差”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"以下关于参数估计的说法中，正确的是( )。","answer":["B"],"dataset_description":null,"id":"p08:93","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下关于参数估计的说法中，正确的是( )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>区间估计优于点估计\u003c/p>"},{"label":"B","html":"\u003cp>样本容量越大,估计越精确\u003c/p>"},{"label":"C","html":"\u003cp>样本含量越大,估计越不精确\u003c/p>"},{"label":"D","html":"\u003cp>一个参数只能有一个估计\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：样本容量越大,估计越精确”。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"以下有关假设检验的观点，错误的是(  )。","answer":["A"],"dataset_description":null,"id":"p08:94","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下有关假设检验的观点，错误的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 原假设H0，通常是希望出现的结果\u003c/p>"},{"label":"B","html":"\u003cp>小概率事件的界值，可以是0.01，也可以是0.05，甚至是0.1\u003c/p>"},{"label":"C","html":"\u003cp>样本的获取，一定要保证简单随机抽样\u003c/p>"},{"label":"D","html":"\u003cp>选择检验的方法，可以是多种统计模型\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：原假设H0，通常是希望出现的结果”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":95,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于统计推断的工作过程的描述，不属于其基本工作环节的是（ ）。","answer":["C"],"dataset_description":null,"id":"p08:95","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下面关于统计推断的工作过程的描述，\u003c/span>不属于其基本工作环节的是（ ）。\u003c/p>","options":[{"label":"A","html":"数据检测,数据整理形成样本"},{"label":"B","html":"设计抽样方法"},{"label":"C","html":"分析和评价样本的质量"},{"label":"D","html":"确定合适的统计量进行推断"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：分析和评价样本的质量”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":96,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"推论统计的主要内容不包括（   )。","answer":["C"],"dataset_description":null,"id":"p08:96","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>推论统计的主要内容不包括（ &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"点估计"},{"label":"B","html":"区间估计"},{"label":"C","html":"交互分类"},{"label":"D","html":"假设检验"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：交互分类”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":97,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于单侧检验和双侧检验，说法正确的是（   )。","answer":["C"],"dataset_description":null,"id":"p08:97","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于单侧检验和双侧检验，说法正确的是（ &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"采用单侧检验更好"},{"label":"B","html":"采用双侧检验更好"},{"label":"C","html":"根据专业知识确定"},{"label":"D","html":"根据检验统计量的计算结果确定"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：根据专业知识确定”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":98,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在总体参数的区间估计中，能够说明估计可靠程度的是(    )。","answer":["A"],"dataset_description":null,"id":"p08:98","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>在总体参数的区间估计中，能够说明估计可靠程度的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"置信水平"},{"label":"B","html":"置信区间"},{"label":"C","html":"判定系数"},{"label":"D","html":"估计标准误差"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：置信水平”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":99,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"以下关于F检验法的说法错误的是（   ）。","answer":["A"],"dataset_description":null,"id":"p08:99","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下关于F检验法的说法错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>模型通过F检验,t检验一定也通过\u003c/p>"},{"label":"B","html":"\u003cp>F统计量值越大,模型越能通过检验\u003c/p>"},{"label":"C","html":"\u003cp>在一元回归模型中,无需进行F检验\u003c/p>"},{"label":"D","html":"\u003cp>对模型联合显著性检验的F检验,实际上也是对可决系数的显著性检验\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：模型通过F检验,t检验一定也通过”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于假设检验的拒绝域，下列说法不正确的有(   )。","answer":["C"],"dataset_description":null,"id":"p08:100","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于假设检验的拒绝域，下列说法不正确的有( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>拒绝域与接受域一定互斥，且一定互补\u003c/p>"},{"label":"B","html":"缩小拒绝域, 可以减少犯第一类错误的概率"},{"label":"C","html":"缩小拒绝域, 可以减少犯第二类错误的概率"},{"label":"D","html":"若样本落入拒绝域, 则检验的结论为拒绝原假设"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：缩小拒绝域, 可以减少犯第二类错误的概率”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":101,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列有关置信度和置信区间的表述中正确的是(    )。","answer":["B"],"dataset_description":null,"id":"p08:101","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列有关置信度和置信区间的表述中正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>置信度越高，测定的可信度越低\u003c/p>"},{"label":"B","html":"\u003cp>置信区间的大小和测定次数有关\u003c/p>"},{"label":"C","html":"\u003cp>置信度越高，置信区间越窄\u003c/p>"},{"label":"D","html":"\u003cp>置信区间的中心位置取决于测量次数\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：置信区间的大小和测定次数有关”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":102,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于区间估计,下列说法正确的是(   )。","answer":["D"],"dataset_description":null,"id":"p08:102","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于区间估计,下列说法正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"总体体正态,方差未知时只能用t分布对总体均值进行估计"},{"label":"B","html":"总体正态,方差已知时不能用正态分布对总体均值进行估计"},{"label":"C","html":"对于非正态总体,不能用正态分布对总体均值进行估计"},{"label":"D","html":"无论总体分布如何,样本容量比较大时均可以用正态分布对总体均值进行估计"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：无论总体分布如何,样本容量比较大时均可以用正态分布对总体均值进行估计”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下面关于数据存储单位的叙述，正确的是（    ）。","answer":["D"],"dataset_description":null,"id":"p08:103","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下面关于数据存储单位的叙述，正确的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"1GB = 1024KB"},{"label":"B","html":"1MB = 1024B"},{"label":"C","html":"1GB = 1024B"},{"label":"D","html":"1GB = 1024MB"}],"explanation":{"topic":"数据容量单位","paragraphs":["bit 是二进制位，byte 是字节，1 byte=8 bit。常见单位从小到大为 B、KB、MB、GB、TB、PB、EB、ZB、YB，不要把位与字节混为一谈。","严格的十进制前缀每级1000，二进制前缀 KiB、MiB、GiB 每级1024。教材和操作系统有时用 KB/MB 表示1024倍关系，做题时需结合选项约定，而不能认为两种口径永远相同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：1GB = 1024MB”。"],"tip":"B 与 b 不同；K→M→G→T→P→E。","source":""},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于大数据的特征,说法正确的是(   )。","answer":["D"],"dataset_description":null,"id":"p08:104","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下列关于大数据的特征,说法正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据价值密度高"},{"label":"B","html":"数据类型少"},{"label":"C","html":"数据基本无变化"},{"label":"D","html":"数据体量巨大"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：数据体量巨大”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"为了让数据变得可用，需要对数据进行三个步骤的处理，以下描述错误的是（    ）。","answer":["A"],"dataset_description":null,"id":"p08:105","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>为了让数据变得可用，需要对数据进行三个步骤的处理，以下描述错误的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据抽样"},{"label":"B","html":"数据分析"},{"label":"C","html":"数据清洗"},{"label":"D","html":"数据管理"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：数据抽样”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"关于大数据的说法，以下正确的是（   )。","answer":["C"],"dataset_description":null,"id":"p08:106","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>关于大数据的说法，以下正确的是（ &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据只要足够大就行"},{"label":"B","html":"\u003cp>大数据可以自行进行智能分析，无需人工干预\u003c/p>"},{"label":"C","html":"\u003cp>大数据通常具有数据量大、数据类型多样、产生速度快、价值密度低等特征\u003c/p>"},{"label":"D","html":"大数据要大"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：大数据通常具有数据量大、数据类型多样、产生速度快、价值密度低等特征”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下哪个不属于大数据的特性（   ）。","answer":["C"],"dataset_description":null,"id":"p08:107","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下哪个不属于大数据的特性（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据类型繁多"},{"label":"B","html":"数据量大"},{"label":"C","html":"价值密度高"},{"label":"D","html":"处理速度快"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：价值密度高”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下面关于大数据特征描述，不正确的是(   )。","answer":["B"],"dataset_description":null,"id":"p08:108","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>下面关于大数据特征描述，不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据量大"},{"label":"B","html":"数据价值密度高"},{"label":"C","html":"数据类型多样"},{"label":"D","html":"数据产生处理速度快"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：数据价值密度高”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下哪个关于监督式学习的说法，正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p08:109","paperId":"p08","paperTitle":"Excel 模拟卷 08","question_html":"\u003cp>\u003cspan>以下哪个关于监督式学习的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label"
