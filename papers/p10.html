NoSQL 常包括键值、文档、列族和图等模型，不是只能存文本或只能用表格。关系数据库以表和关系为主要模型，数据模型与物理存储方式不能混为一谈。","存储需兼顾容量扩展、检索效率、备份恢复、权限和安全；加密主要保护保密性，不能单靠更严格加密来解决容量增长。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：数据库二维逻辑表”。"],"tip":"来源和结构分开看；NoSQL 不只键值一种。","source":""},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"在下列关于机云计算的表述中，不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:107","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在下列关于机云计算的表述中，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>云计算是一种基于网络的超级计算模式\u003c/p>"},{"label":"B","html":"\u003cp> 云计算在IT市场上的雏形已经形成，它为供应商提供了全新的机遇并催生了传统IT产品的转变\u003c/p>"},{"label":"C","html":"\u003cp>1999年Salesforce公司首次通过网站向企业提供企业级应用（CRM），这被认为是云计算发展的重要里程碑之一\u003c/p>"},{"label":"D","html":"\u003cp>云计算具有超大规模、虚拟化、高可靠性、通用性、高可扩展性、按需服务等显著特点\u003c/p>"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：云计算具有超大规模、虚拟化、高可靠性、通用性、高可扩展性、按需服务等显著特点”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于大数据叙述，不正确的一项是(    )。","answer":["D"],"dataset_description":null,"id":"p10:108","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下关于大数据叙述，不正确的一项是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>大数据通常指无法在可承受时间范围内用常规工具进行抓取、管理和处理的数据集合\u003c/p>"},{"label":"B","html":"\u003cp>大数据不仅包含海量数据，还包含多种复杂类型的数据\u003c/p>"},{"label":"C","html":"\u003cp>大数据的核心价值之一在于对海量数据进行及时有效的分析\u003c/p>"},{"label":"D","html":"\u003cp>大数据仅指数据量大，不涉及数据类型和速度等其他特征\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：大数据仅指数据量大，不涉及数据类型和速度等其他特征”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于纯整数规划的最优解,下列说法正确的是(  )。","answer":["A"],"dataset_description":null,"id":"p10:109","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于纯整数规划的最优解,下列说法正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>纯整数规划可能存在无穷多最优解\u003c/p>"},{"label":"B","html":"\u003cp> 纯整数规划的最优解一定唯一\u003c/p>"},{"label":"C","html":"\u003cp>纯整数规划一定有最优解\u003c/p>"},{"label":"D","html":"\u003cp>纯整数规划一定有可行解\u003c/p>"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：纯整数规划可能存在无穷多最优解”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下对K均值聚类算法解释正确的是(   )。","answer":["A"],"dataset_description":null,"id":"p10:110","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下对K均值聚类算法解释正确的是( &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"不能自动识别类的个数,随机挑选初始点为中心点计算"},{"label":"B","html":"能自动识别类的个数,随机挑选初始点为中心点计算"},{"label":"C","html":"能自动识别类的个数，不是随机挑选初始点为中心点计算"},{"label":"D","html":"不能自动识别类的个数，不是随机挑选初始点为中心点计算"}],"explanation":{"topic":"聚类与 K 均值","paragraphs":["聚类是按相似性把对象分组的无监督学习，通常不依赖预先标好的类别。分类则学习已标注样本的类别规律，二者目标和训练信息不同。","K 均值先选 K 个中心，反复把样本分给最近中心，再以簇内均值更新中心，通常降低簇内平方距离和。需预先给 K，可能依赖初值、落入局部最优，对尺度和离群值敏感。","它偏好近似球状、尺度相近的数值簇，不能认为对任意形状、任意非数值数据都直接适用。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：不能自动识别类的个数,随机挑选初始点为中心点计算”。"],"tip":"聚类无标签；K 均值：分配→更新，初值和尺度重要。","source":""},"attachments":[]},{"number":111,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于有监督学习和无监督学习的叙述，不正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p10:111","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于有监督学习和无监督学习的叙述，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"回归和分类算法均属于有监督学习"},{"label":"B","html":"有监督学习是从标签化训练数据集中推断出模型的机器学习任务"},{"label":"C","html":"主成分，聚类，决策树是无监督学习"},{"label":"D","html":"\u003cp>无监督\u003cspan>学习不\u003c/span>\u003cspan>要求\u003c/span>类别已知\u003c/p>"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：主成分，聚类，决策树是无监督学习”。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":112,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下关于单峰区间[a,b]上的一维搜索方法的表述，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p10:112","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下关于单峰区间[a,b]上的一维搜索方法的表述，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"黄金分割法是最常用的一维搜索试探方法"},{"label":"B","html":"斐波那契法和黄金分割法只需计算目标函数在各点处的函数值，无需求导"},{"label":"C","html":"斐波那契法和黄金分割法均采用区间分割技术，而利用区间分割技术缩减区间的方式一般是舍弃劣点的外侧"},{"label":"D","html":"一维搜索方法只有斐波那契法和0.618法"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：一维搜索方法只有斐波那契法和0.618法”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列有关梯度下降法的说法不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p10:113","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列有关梯度下降法的说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"梯度是标量仅有大小，没有方向"},{"label":"B","html":"梯度是一个向量"},{"label":"C","html":"一维搜索确定步长"},{"label":"D","html":"梯度下降法沿着负梯度方向进行下一步探索"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：梯度是标量仅有大小，没有方向”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于线性规划问题，下列叙述正确的为（  ）。","answer":["D"],"dataset_description":null,"id":"p10:114","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于线性规划问题，下列叙述正确的为（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可行解一定存在"},{"label":"B","html":"最优解一定存在"},{"label":"C","html":"可行解必是最优解"},{"label":"D","html":"如果存在最优解，一定出现在可行解集合中"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：如果存在最优解，一定出现在可行解集合中”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"对一个求目标函数最大的混合整数规划问题，以下观点不正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p10:115","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>对一个求目标函数最大的混合整数规划问题，以下观点不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"其线性规划松弛问题的最优解可能是该整数规划问题的最优解"},{"label":"B","html":"该问题可行解的个数是有限的"},{"label":"C","html":"任一可行解的目标函数值不可能大于其线性规划松弛问题的目标函数值"},{"label":"D","html":"该问题可行解中可能存在不取整数值的变量"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：该问题可行解的个数是有限的”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"图解法的求解过程不包括（  ）。","answer":["D"],"dataset_description":null,"id":"p10:116","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>图解法的求解过程不包括（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"绘制目标函数等值线"},{"label":"B","html":"移动目标函数等值线求最优解"},{"label":"C","html":"画出可行解集合"},{"label":"D","html":"计算目标函数在各可行点处的值"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：计算目标函数在各可行点处的值”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于线性回归,下面说法不正确的是(  )。","answer":["B"],"dataset_description":null,"id":"p10:117","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于线性回归,下面说法不正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"常用最小二乘法"},{"label":"B","html":"剩余平方和反映了自变量化所引起的波动"},{"label":"C","html":"最小二乘解必存在"},{"label":"D","html":"回归平方和反映了自变量变化引起的波动"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：剩余平方和反映了自变量化所引起的波动”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"在我国法律体系中，法律效力最高的是（   ）。","answer":["C"],"dataset_description":null,"id":"p10:118","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在我国法律体系中，法律效力最高的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"基本法律"},{"label":"B","html":"行政法规"},{"label":"C","html":"宪法"},{"label":"D","html":"全国人大通过的决定"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：宪法”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"以下属于行政法规的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:119","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下属于行政法规的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"《贵州省大数据发展应用促进条例》"},{"label":"B","html":"《天津市促进大数据发展应用条例》"},{"label":"C","html":"《海南省大数据开发应用条例》"},{"label":"D","html":"《关键信息基础设施安全保护条例》"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：《关键信息基础设施安全保护条例》”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"算法之所以难以解释，是因为“（  ）”现象的存在。","answer":["C"],"dataset_description":null,"id":"p10:120","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>算法之所以难以解释，是因为“（ &nbsp;）”现象的存在。\u003c/span>\u003c/p>","options":[{"label":"A","html":"混乱"},{"label":"B","html":"不可控"},{"label":"C","html":"黑箱"},{"label":"D","html":"黑洞"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：黑箱”。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"漏斗分析法是使用漏斗图展示数据分析过程和结果的数据分析方法，以下适合采用漏斗分析法的场景有(   )。","answer":["A","B","D"],"dataset_description":null,"id":"p10:121","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>漏斗分析法是使用漏斗图展示数据分析过程和结果的数据分析方法，以下适合采用漏斗分析法的场景有\u003c/span>\u003cspan>( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 电商平台从“浏览商品”到“支付成功”各环节的转化率监控\u003c/p>"},{"label":"B","html":"\u003cp>企业招聘过程中“简历投递→笔试→面试→录用”各阶段人数变化\u003c/p>"},{"label":"C","html":"\u003cp>某地区第一、二、三产业产值占GDP的比重\u003c/p>"},{"label":"D","html":"\u003cp>银行信用卡营销中“客户触达→申请→审批→激活”的流失节点排查\u003c/p>"},{"label":"E","html":"\u003cp>企业本年度各类成本费用占总成本的百分比\u003c/p>"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：电商平台从“浏览商品”到“支付成功”各环节的转化率监控；B：企业招聘过程中“简历投递→笔试→面试→录用”各阶段人数变化；D：银行信用卡营销中“客户触达→申请→审批→激活”的流失节点排查”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"用户行为数据用于用户行为分析场景，下列各项中属于行为的属性包括（   ）？","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p10:122","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>用户行为数据用于用户行为分析场景，下列各项中属于行为的属性包括（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"时间"},{"label":"B","html":"地点"},{"label":"C","html":"人物"},{"label":"D","html":"交互"},{"label":"E","html":"交互内容"}],"explanation":{"topic":"本题解析","paragraphs":["一个行为事件应回答何时、何地、谁、做了什么以及作用于什么内容，所以五项全选。"],"warning":"","optionAnalysis":[{"label":"A","selected":true,"reason":"时间说明行为何时发生。"},{"label":"B","selected":true,"reason":"地点或场景说明行为在哪里发生。"},{"label":"C","selected":true,"reason":"人物说明行为由哪个用户发生。"},{"label":"D","selected":true,"reason":"交互说明发生了点击、浏览、购买等什么动作。"},{"label":"E","selected":true,"reason":"交互内容说明动作作用于哪个商品、页面或对象。"}]},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"下列关于市场调查中，观察法的特点的描述，正确的包括（   ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p10:123","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于市场调查中，观察法的特点的描述，正确的包括（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"能够反映客观事实的发生过程"},{"label":"B","html":"具有直观性和可靠性"},{"label":"C","html":"简便易行灵活性强"},{"label":"D","html":"有利于对无法无需或难以进行语言交流的市场现象进行调查"},{"label":"E","html":"可排除语言交流或人际交往中可能发生的误会和干扰"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：能够反映客观事实的发生过程；B：具有直观性和可靠性；C：简便易行灵活性强；D：有利于对无法无需或难以进行语言交流的市场现象进行调查；E：可排除语言交流或人际交往中可能发生的误会和干扰”。多选题应检查所有选项，不能只选其中一项。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"总量指标的计量单位有多种，下列关于计量单位的描述，正确的有（   ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p10:124","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>总量指标的计量单位有多种，下列关于计量单位的描述，正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"货币单位"},{"label":"B","html":"劳动量单位"},{"label":"C","html":"自然单位"},{"label":"D","html":"度量衡单位"},{"label":"E","html":"标准实物单位"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：货币单位；B：劳动量单位；C：自然单位；D：度量衡单位；E：标准实物单位”。多选题应检查所有选项，不能只选其中一项。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列说法中正确的有（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p10:125","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列说法中正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本均值是总体均值的无偏估计量"},{"label":"B","html":"样本比例是总体比例的无偏估计量"},{"label":"C","html":"样本均值是总体均值的一致估计量"},{"label":"D","html":"样本标准差是总体标准差的无偏估计量"},{"label":"E","html":"样本方差是总体方差的无偏估计量"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：样本均值是总体均值的无偏估计量；B：样本比例是总体比例的无偏估计量；C：样本均值是总体均值的一致估计量；E：样本方差是总体方差的无偏估计量”。多选题应检查所有选项，不能只选其中一项。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于描述总体集中趋势的参数，下列错误的是（  ）。","answer":["A","C","E"],"dataset_description":null,"id":"p10:126","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于描述总体集中趋势的参数，下列错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>平均值适用于所有类型的总体\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>平均值适用于对称分布的总体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>几何平均适用于对称分布的总体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>中位数适用于描述偏态分布的总体\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>中位数是指总体中数值最大的数\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、C、E。对应内容为“A：平均值适用于所有类型的总体；C：几何平均适用于对称分布的总体；E：中位数是指总体中数值最大的数”。多选题应检查所有选项，不能只选其中一项。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列属于概率抽样的是（  ）。","answer":["A","B","D"],"dataset_description":null,"id":"p10:127","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列属于\u003c/span>\u003cspan>概率抽样\u003c/span>\u003cspan>的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体中的每个个体都有相等的被选中的机会\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样能较好代表总体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>个体\u003c/span>\u003cspan>被选中的机会都不相等\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样误差小于非\u003c/span>\u003cspan>概率抽样\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>不能获得估计值的精度\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：总体中的每个个体都有相等的被选中的机会；B：抽样能较好代表总体；D：抽样误差小于非概率抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下统计量，能够用于描述数据分布形状的是（  ）。","answer":["B","E"],"dataset_description":null,"id":"p10:128","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下统计量，能够用于描述数据分布形状的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>四分位间距\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>偏度\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>极差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>方差\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>峰度\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、E。对应内容为“B：偏度；E：峰度”。多选题应检查所有选项，不能只选其中一项。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列对F分布的描述中，正确的是（ ）。","answer":["C","D","E"],"dataset_description":null,"id":"p10:129","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列对F分布的描述中，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>F分布是对称分布\u003c/p>"},{"label":"B","html":"\u003cp> F值的取值范围是 −∞ 到 +∞\u003c/p>"},{"label":"C","html":"\u003cp>F分布的平均数大于中位数\u003c/p>"},{"label":"D","html":"\u003cp>F分布的形态随分子分母自由度不同而不同\u003c/p>"},{"label":"E","html":"\u003cp>分母和分子的自由度越大，F分布越接近正态分布\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C、D、E。对应内容为“C：F分布的平均数大于中位数；D：F分布的形态随分子分母自由度不同而不同；E：分母和分子的自由度越大，F分布越接近正态分布”。多选题应检查所有选项，不能只选其中一项。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于正态分布的说法正确的是（ ）。","answer":["A","C","E"],"dataset_description":null,"id":"p10:130","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下关于正态分布的说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布密度函数的显著特点是中间高两边低，由中间向两边递减，并且分布左右对称\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>正态分布距离均值越近的地方数值越分散,而在离均值较远的地方数值则很密集\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>正态分布是最重要的一类连续型随机变量分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正态分布是最重要的一类离散型随机变量分布\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>如果频率直方图呈现出钟形特征，可认为该变量大致服从正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、E。对应内容为“A：正态分布密度函数的显著特点是中间高两边低，由中间向两边递减，并且分布左右对称；C：正态分布是最重要的一类连续型随机变量分布；E：如果频率直方图呈现出钟形特征，可认为该变量大致服从正态分布”。多选题应检查所有选项，不能只选其中一项。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于t分布的表述，正确的是（ ）。","answer":["B","C","D"],"dataset_description":null,"id":"p10:131","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于t分布的表述，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>以均值1中心左右对称分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随着自由度的大小而变化的一簇曲线\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>自由度大于30时，接近正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>变量取值在-∞到+∞之间\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>变量取值在-1到+1之间\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、D。对应内容为“B：随着自由度的大小而变化的一簇曲线；C：自由度大于30时，接近正态分布；D：变量取值在-∞到+∞之间”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"在一般情况下，以下关于调查研究中抽样误差大小的排序，错误的是（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p10:132","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在一般情况下，以下关于调查研究中抽样误差大小的排序，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"整群抽样≥系统抽样≥单纯随机抽样≥分层抽样"},{"label":"B","html":"系统抽样≥单纯随机抽样≥整群抽样≥分层抽样"},{"label":"C","html":"分层抽样≥系统抽样≥单纯随机抽样≥整群抽样"},{"label":"D","html":"整群抽样≥单纯随机抽样≥系统抽样≥分层抽样"},{"label":"E","html":"单纯随机抽样≥整群抽样≥分层抽样≥系统抽样"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、C、E。对应内容为“A：整群抽样≥系统抽样≥单纯随机抽样≥分层抽样；B：系统抽样≥单纯随机抽样≥整群抽样≥分层抽样；C：分层抽样≥系统抽样≥单纯随机抽样≥整群抽样；E：单纯随机抽样≥整群抽样≥分层抽样≥系统抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于非参数统计叙述正确的是（  ）。","answer":["B","C","E"],"dataset_description":null,"id":"p10:133","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于非参数统计叙述正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>非参数统计推断的准确度较低\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>非参数统计方法无需假定总体分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>非参数统计适用面更广\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>非参数统计不对总体参数进行推断\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>非参数统计通过样本信息来推断总体分布位置\u003c/span>\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、E。对应内容为“B：非参数统计方法无需假定总体分布；C：非参数统计适用面更广；E：非参数统计通过样本信息来推断总体分布位置”。多选题应检查所有选项，不能只选其中一项。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于参数的是（ ）。","answer":["A","B","C"],"dataset_description":null,"id":"p10:134","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下属于参数的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体平均数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体方差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体比例\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本均值\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本方差\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：总体平均数；B：总体方差；C：总体比例”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于95%与99%的置信区间相比较的观点描述，错误的是(   )。","answer":["A","D","E"],"dataset_description":null,"id":"p10:135","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于95%与99%的置信区间相比较的观点描述，错误的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>前者的置信度大于后者\u003c/p>"},{"label":"B","html":"\u003cp>前者的置信度小于后者\u003c/p>"},{"label":"C","html":"\u003cp>前者的置信区间小于后者\u003c/p>"},{"label":"D","html":"\u003cp>二者的估计精度相同\u003c/p>"},{"label":"E","html":"\u003cp>前者的置信区间大于后者\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、D、E。对应内容为“A：前者的置信度大于后者；D：二者的估计精度相同；E：前者的置信区间大于后者”。多选题应检查所有选项，不能只选其中一项。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下列有关t检验统计量的叙述中，不正确的观点有（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p10:136","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列有关t检验统计量的叙述中，不正确的观点有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"t越大，说明总体参数差别越大"},{"label":"B","html":"t越大，说明总体参数差别越小"},{"label":"C","html":"t越大，说明样本统计量差别越大"},{"label":"D","html":"t越大，说明样本统计量差别越小"},{"label":"E","html":"\u003cp>t统计量的绝对值越大，越有理由认为两个总体参数不相等\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、C、D。对应内容为“A：t越大，说明总体参数差别越大；B：t越大，说明总体参数差别越小；C：t越大，说明样本统计量差别越大；D：t越大，说明样本统计量差别越小”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"下面关于大数据价值的说法，错误的是（    ）。","answer":["B","E"],"dataset_description":null,"id":"p10:137","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下面关于大数据价值的说法，错误的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据的根本价值在于可以为人们找出答案"},{"label":"B","html":"数据的价值会因为不断使用而削减"},{"label":"C","html":"数据的价值会因为不断重组而产生更大的价值"},{"label":"D","html":"目前阶段，数据的产生不以人的意志为转移"},{"label":"E","html":"数据的作用仅仅是用来预测未来"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B、E。对应内容为“B：数据的价值会因为不断使用而削减；E：数据的作用仅仅是用来预测未来”。多选题应检查所有选项，不能只选其中一项。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"关于决策树的描述，正确的是（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p10:138","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于决策树的描述，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"每个节点表示一个属性的测试"},{"label":"B","html":"每个分支代表测试的结果"},{"label":"C","html":"每个叶子节点代表一个分类标签"},{"label":"D","html":"从根到叶子的路径代表分类规则"},{"label":"E","html":"决策树本质上是一个循环结构"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：每个节点表示一个属性的测试；B：每个分支代表测试的结果；C：每个叶子节点代表一个分类标签；D：从根到叶子的路径代表分类规则”。多选题应检查所有选项，不能只选其中一项。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"民事责任承担方式有（    ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p10:139","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>民事责任承担方式有（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"停止侵害"},{"label":"B","html":"返还财产"},{"label":"C","html":"恢复原状"},{"label":"D","html":"刑事责任"},{"label":"E","html":"支付违约金"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：停止侵害；B：返还财产；C：恢复原状；E：支付违约金”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"2018年9月17日，习近平主席致信祝贺2018世界人工智能大会在上海召开。在贺信中习近平主席指出，要处理好人工智能在（ ）等方面提出的新课题，需要各国深化合作、共同探讨。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p10:140","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>2018年9月17日，习近平主席致信祝贺2018世界人工智能大会在上海召开。在贺信中习近平主席指出，要处理好人工智能在（ ）等方面提出的新课题，需要各国深化合作、共同探讨。\u003c/span>\u003c/p>","options":[{"label":"A","html":"法律"},{"label":"B","html":"安全"},{"label":"C","html":"就业"},{"label":"D","html":"道德伦理"},{"label":"E","html":"政府治理"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：法律；B：安全；C：就业；D：道德伦理；E：政府治理”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“data10.xlsx”中表格“Sheet1”第4列的编号为（）。","answer":["A"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p10:141","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>文件“data10.xlsx”中表格“Sheet1”第4列的编号为（）。\u003c/p>","options":[{"label":"A","html":"D"},{"label":"B","html":"4"},{"label":"C","html":"四"},{"label":"D","html":"IV"}],"explanation":{"topic":"A1 引用中的列编号","paragraphs":["Excel 默认用字母编号列：第1列 A、第2列 B、第3列 C、第4列 D。因此第4列的编号是 D，选 A。","数字4是列的序号，不是 A1 样式显示的列名；IV 是旧版 Excel 的最后一列，不是第4列。"],"tip":"列用字母，行用数字。","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p10/data10.xlsx"}]},{"number":142,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":2,"question":"将文件\"data10.xlsx\"存储为CSV文件类型，应选择以下哪个选项？","answer":["A"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p10:142","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>将文件&quot;data10.xlsx&quot;存储为CSV文件类型，应选择以下哪个选项？\u003c/p>","options":[{"label":"A","html":"另存为"},{"label":"B","html":"打印"},{"label":"C","html":"查找和替换"},{"label":"D","html":"剪切和粘贴"}],"explanation":{"topic":"另存为 CSV","paragraphs":["通过“文件→另存为”选择 CSV 类型，选 A。","打印不会生成 CSV；查找替换和剪切粘贴也不负责改变文件格式。CSV 只保存平面数据，不能完整保留格式和多个工作表。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p10/data10.xlsx"}]},{"number":143,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":3,"question":"文件“data10.xlsx”中的“Sheet1”中“AMZN.O”的具体数据分布情况为（）","answer":["A"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p10:143","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>文件“data10.xlsx”中的“Sheet1”中“AMZN.O”的具体数据分布情况为（）\u003c/p>","options":[{"label":"A","html":"\u003cp>平均值167.86，计数500，求和83927.92\u003c/p>"},{"label":"B","html":"平均值：177.86，计数：501，求和：83927.92"},{"label":"C","html":"平均值：187.96，计数：501，求和：83927.92"},{"label":"D","html":"平均值：200.88，计数：501，求和：83927.92"}],"explanation":{"topic":"AMZN.O 的均值与求和","paragraphs":["AMZN.O 在 B 列，B2:B501 有500个数值，求和83927.9178，均值167.8558356。保留两位分别83927.92、167.86，选 A。","这里的计数是 COUNT(B2:B501)=500，不包含文本表头。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p10/data10.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"data10.xlsx\"的工作表\"Sheet1\"中，请使用COUNTA函数计算C列中所有非空单元格的数量，所使用公式和结果正确的是？","answer":["A"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p10:144","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>在文件&quot;data10.xlsx&quot;的工作表&quot;Sheet1&quot;中，请使用COUNTA函数计算C列中所有非空单元格的数量，所使用公式和结果正确的是？\u003c/p>","options":[{"label":"A","html":"=COUNTA(C:C)；501"},{"label":"B","html":"=COUNTA(C)；501"},{"label":"C","html":"=COUNTA(C1:C)；500"},{"label":"D","html":"=COUNTA(C:C1)；510"}],"explanation":{"topic":"COUNTA 统计非空单元格","paragraphs":["使用 =COUNTA(C:C)，C:C 表示整列 C。素材中包含 500 个非空数据单元格和1个非空表头，因此结果是 501，选 A。","COUNTA 统计文本和数字等非空内容，COUNT 只统计数字；C 或 C1:C 都不是本题正确的完整列引用。看似空白但含公式空字符串的单元格，也可能被 COUNTA 计入。"],"tip":"COUNTA 含表头文本；COUNT 只数数字。","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p10/data10.xlsx"}]},{"number":145,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":5,"question":"文件“data10.xlsx”中的“Sheet1”中将A列Date按照“年-月”的方式，重新在F列中操作，列名为“年月”，使用函数TEXT将A列中的“年月日”转换为“年月”，数据格式为“yyyy-mm”。在新的工作表中创建数据透视图，轴(类别)选择“年月”，值（平均值项）选择“AMZN.O”，值（平均值项）选择“GS.N”，值（平均值项）选择“SPY”，” AMZN.O”最高的一月的“GS.N”和“SPY”分别为（）。","answer":["B"],"dataset_description":"Excel表格文件“data10.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：AMZN.O、GS.N、SPY、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，工作表在本试题中默认排序为A1升序，在每次解答问题前请清除筛选并恢复工作表至默认排序再进行答题，请勿随意更改工作表原始数据。只保留小数点后两位，采取四舍五入。","id":"p10:145","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>文件“data10.xlsx”中的“Sheet1”中将A列Date按照“年-月”的方式，重新在F列中操作，列名为“年月”，使用函数TEXT将A列中的“年月日”转换为“年月”，数据格式为“yyyy-mm”。在新的工作表中创建数据透视图，轴(类别)选择“年月”，值（平均值项）选择“AMZN.O”，值（平均值项）选择“GS.N”，值（平均值项）选择“SPY”，” AMZN.O”最高的一月的“GS.N”和“SPY”分别为（）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"GS.N：200.47，SPY：120.82"},{"label":"B","html":"GS.N：100.47，SPY：120.82"},{"label":"C","html":"GS.N：120.47，SPY：120.82"},{"label":"D","html":"GS.N：140.47，SPY：120.82"}],"explanation":{"topic":"日期分组与数据透视分析","paragraphs":["用 TEXT 生成年月，以年月为行，对 AMZN.O、GS.N、SPY 同时求平均；按 AMZN.O 的月均值降序。","取 AMZN.O 月均值最高的那一月，在同一行读取 GS.N≈100.47、SPY≈120.82，选 B。这里不是三种资产各自最高月份的拼接。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data10.xlsx","href":"../materials/p10/data10.xlsx"}]},{"number":146,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":6,"question":"假设在文件\"data10.xlsx\"的工作表\"Sheet2\"中A1单元格的值为2022/2/22，B1单元格的值为10，C1到C3单元格的值分别为2022/2/22, 2022/2/23, 2022/2/24，D1单元格的公式为=WORKDAY(A1,B1,C1:C3)，则D1单元格的值将显示为什么？（请在Excel文件中使用WORKDAY函数来获取结果）","answer":["C"],"dataset_description":"Excel表格文件“data10.   const PREFIX='excel-practice:v1:';
  function same(a,b){return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&[...a].sort().join('|')===[...b].sort().join('|');}
  function grade(questions,answers){
    const details=questions.map(q=>{const selected=Array.isArray(answers[q.id])?answers[q.id]:[];return {id:q.id,selected,correct:same(selected,q.answer),blank:selected.length===0};});
    const correct=details.filter(x=>x.correct).length,blank=details.filter(x=>x.blank).length;
    return {total:details.length,correct,blank,incorrect:details.length-correct-blank,score:details.length?Math.round(correct/details.length*10000)/100:0,details,wrongIds:details.filter(x=>!x.correct).map(x=>x.id)};
  }
  function updateWrongs(existing,questions,answers,now){
    const result=JSON.parse(JSON.stringify(existing||{}));
    for(const d of grade(questions,answers).details){
      const old=result[d.id];
      if(d.correct){if(old)result[d.id]={...old,masteredAt:now,lastReviewed:now,reviews:(old.reviews||0)+1};}
      else result[d.id]={id:d.id,wrongCount:(old?.wrongCount||0)+1,firstWrong:old?.firstWrong||now,lastWrong:now,lastReviewed:now,reviews:(old?.reviews||0)+1,masteredAt:null,lastSelection:d.selected};
    }
    return result;
  }
  function validAnswers(questions,answers){const out={};for(const q of questions){const allowed=new Set(q.options.map(o=>o.label));let selected=Array.isArray(answers?.[q.id])?[...new Set(answers[q.id])].filter(x=>allowed.has(x)):[];if(q.type!=='多选题')selected=selected.slice(0,1);if(selected.length)out[q.id]=selected;}return out;}
  return {PREFIX,same,grade,updateWrongs,validAnswers};
});

function exportProgress(){const backup={format:'excel-practice-backup',version:1,createdAt:Date.now(),entries:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(P))backup.entries[k.slice(P.length)]=JSON.parse(localStorage.getItem(k));}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Excel刷题进度与错题备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出，可保存到手机文件');}
async function importProgress(file){try{if(!file||file.size>10000000)throw Error('备份文件过大或未选择');const b=JSON.parse(await file.text());if(b.format!=='excel-practice-backup'||b.version!==1||!b.entries||typeof b.entries!=='object')throw Error('这不是本程序的备份文件');const checked={};for(const [k,v] of Object.entries(b.entries)){if(k==='wrongs'){if(!v||Array.isArray(v)||typeof v!=='object')throw Error('错题数据格式不正确');checked[k]={};for(const [id,w] of Object.entries(v)){if(!all[id]||w?.id!==id||!Number.isFinite(w.wrongCount)||w.wrongCount<1)throw Error('备份包含未知题目');checked[k][id]={id,wrongCount:w.wrongCount,firstWrong:Number(w.firstWrong)||Date.now(),lastWrong:Number(w.lastWrong)||Date.now(),lastReviewed:Number(w.lastReviewed)||Date.now(),reviews:Number(w.reviews)||0,masteredAt:w.masteredAt?Number(w.masteredAt):null,lastSelection:Array.isArray(w.lastSelection)?w.lastSelection.filter(x=>all[id].options.some(o=>o.label===x)):[]};}}else if(k.startsWith('study:')&&(papers.some(p=>k==='study:'+p.id)||k==='study:all-wrongs')){if(!v||!all[v.id])throw Error('背题进度格式不正确');checked[k]={id:v.id,at:Number(v.at)||Date.now()};}else if(k.startsWith('session:')&&(papers.some(p=>k==='session:'+p.id)||k==='session:all-wrongs')){if(v===null)continue;const s=safeState(v);if(!s)throw Error('作答进度格式不正确');checked[k]=s;}else if(k.startsWith('history:')&&(papers.some(p=>k==='history:'+p.id)||k==='history:all-wrongs')){if(!Array.isArray(v)||v.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100||!Number.isFinite(x.total)))throw Error('成绩记录格式不正确');checked[k]=v.slice(0,20);}}
pendingImport=checked;showDialog('导入备份',`<p>将导入 ${Object.keys(checked.wrongs||{}).length} 道错题历史，并恢复备份中的作答进度。</p><p class="muted">备份中的同名记录会覆盖当前记录。建议先导出当前备份。</p>`,'<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-import">确认导入</button>');}catch(e){toast('无法导入：'+e.message);}}
let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
