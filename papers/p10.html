:"判断题","book":"《大数据分析素养》","chapter":3,"question":"在数据清洗中，直接删除异常数据点是错误的（  ）。","answer":["B"],"dataset_description":null,"id":"p10:10","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在数据清洗中，直接删除异常数据点是错误的\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":11,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"‌政府法规属于企业外部数据源（  ）。","answer":["A"],"dataset_description":null,"id":"p10:11","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>‌政府法规属于企业外部数据源\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":12,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"数据处理和数据清洗是数据处理流程中紧密相连且相互依存的（  ）。","answer":["A"],"dataset_description":null,"id":"p10:12","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>数据处理和数据清洗是数据处理流程中紧密相连且相互依存的\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处 id":"p10:15","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>标志总量是总体单位标志值的总和,它是标志值（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":16,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"动态相对数是将总体不同时期的同类指标对比而计算的比值（  ）。","answer":["A"],"dataset_description":null,"id":"p10:16","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>动态相对数是将总体不同时期的同类指标对比而计算的比值\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":17,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"定序尺度可以描述降水量的变化（  ）。","answer":["B"],"dataset_description":null,"id":"p10:17","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>定序尺度可以描述降水量的变化\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"随着样本容量的增加,样本平均数分布的方差趋小（  ）。","answer":["A"],"dataset_description":null,"id":"p10:18","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>随着样本容量的增加,样本平均数分布的方差趋小\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"一个总体只可以抽取一个样本（  ）。","answer":["B"],"dataset_description":null,"id":"p10:19","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>一个总体只可以抽取一个样本（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"一个样本方差与给定总体方差的比较一般用卡方分布（ ）。","answer":["A"],"dataset_description":null,"id":"p10:20","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>一个样本方差与给定总体方差的比较一般用卡方分布（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"总体的特征是唯一确定的，是已知的（  ）。","answer":["B"],"dataset_description":null,"id":"p10:21","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>总体的特征是唯一确定的，是已知的（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"适当的样本单位数目是保证样本指标具有充分代表性的基本前提（  ）。","answer":["A"],"dataset_description":null,"id":"p10:22","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>适当的样本单位数目是保证样本指标具有充分代表性的基本前提\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"变异性使得随便抽取一个单位加以观察即可知道整个总体的状况（  ）。","answer":["B"],"dataset_description":null,"id":"p10:23","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>变异性使得随便抽取一个单位加以观察即可知道整个总体的状况（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"在实际调查研究中直接采用简单随机抽样的应用非常多。","answer":["B"],"dataset_description":null,"id":"p10:24","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在实际调查研究中直接采用简单随机抽样的应用非常多\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"系统误差是指一种非随机性误差（  ）。","answer":["A"],"dataset_description":null,"id":"p10:25","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>系统误差是指一种非随机性误差（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"总体相关系数绝对值越大,总体内个体相关程度越弱（  ）。","answer":["B"],"dataset_description":null,"id":"p10:26","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>总体相关系数绝对值越大,总体内个体相关程度越弱\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"协方差与相关系数","paragraphs":["协方差 Cov(X,Y)=E[(X−EX)(Y−EY)] 表示共同变化方向，但大小受单位影响。相关系数 r=Cov(X,Y)/(σXσY) 消除量纲，范围在−1到1之间，绝对值越大表示线性相关越强。","r>0 为同向，r\u003c0 为反向，r≈0 只表示线性关系弱，并不排除非线性关系，更不能推出独立；相关也不等于因果。","协方差矩阵对称，对角线是各变量方差，非对角线是成对协方差；方差非负，协方差可以为负。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"r 看符号和绝对值；相关≠因果，零相关≠没关系。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"群通常是由那些地理位置邻近的或隶属于同一系统的单位所构成（  ）。","answer":["A"],"dataset_description":null,"id":"p10:27","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>群通常是由那些地理位置邻近的或隶属于同一系统的单位所构成\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整群抽样中的群","paragraphs":["整群抽样先把总体划分为若干群，再抽取部分群，对被抽中群内的单位调查。群可以按地域邻近、学校班级或组织系统等自然边界形成。","所以题干对群的常见构成方式描述正确。需注意整群与分层不同：抽群通常希望群内有异质性、群间有一定相似性。"],"warning":""},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"F分布的临界值根据显著性水平，分子自由度，和分母自由度共同确定（ ）。","answer":["A"],"dataset_description":null,"id":"p10:28","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>F分布的临界值根据显著性水平，分子自由度，和分母自由度共同确定\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"卡方检验不能够用于定量数据（ ）。","answer":["B"],"dataset_description":null,"id":"p10:29","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>卡方检验不能够用于定量数据（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"区间估计不仅给出了未知参数的估计范围，而且还可以给出该范围包含参数真值的可信程度（ ）。","answer":["A"],"dataset_description":null,"id":"p10:30","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>区间估计不仅给出了未知参数的估计范围，而且还可以给出该范围包含参数真值的可信程度（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"假设检验的理论基础是小概率事件（ ）。","answer":["A"],"dataset_description":null,"id":"p10:31","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>假设检验的理论基础是小概率事件（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"区间估计是指根据样本统计量,抽样误差,以及概率保证程度去推断总体参数的可能范围（ ）。","answer":["A"],"dataset_description":null,"id":"p10:32","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>区间估计是指根据样本统计量,抽样误差,以及概率保证程度去推断总体参数的可能范围\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"某个参数恰好在一个区间内的概率不低于5%，称这个区间是置信水平为95%的置信区间（ ）。","answer":["B"],"dataset_description":null,"id":"p10:33","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>某个参数恰好在一个区间内的概率不低于5%，称这个区间是置信水平为95%的置信区间\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据又称巨量资料（ ）。","answer":["A"],"dataset_description":null,"id":"p10:34","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>大数据又称巨量资料（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":35,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据是指数据量非常大的数据集合（ p>"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":38,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"优化模型的变量有两类,分别为决策变量和状态变量（ ）。","answer":["A"],"dataset_description":null,"id":"p10:38","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>优化模型的变量有两类,分别为决策变量和状态变量\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":39,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"多元回归中的系数可以是正的，也可以是负的（  ）。","answer":["A"],"dataset_description":null,"id":"p10:39","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>多元回归中的系数可以是正的，也可以是负的（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"朴素贝叶斯分类器适用于多分类任务（  ）。","answer":["A"],"dataset_description":null,"id":"p10:40","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>朴素贝叶斯分类器适用于多分类任务\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"朴素贝叶斯分类","paragraphs":["贝叶斯分类按后验概率 P(类别|特征) 选择类别。朴素贝叶斯的“朴素”是给定类别后，各特征条件独立的假设，并非无条件要求所有特征彼此独立。","后验与“类别先验×各特征条件概率的乘积”成比例；取对数可避免很小概率连乘下溢，平滑可处理零频次。它既可二分类，也可多分类。","训练不需要复杂的迭代求最优边界，但预测仍需参数估计；相关特征可能削弱独立假设，不能据此断言算法完全不能用。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"给定类别后条件独立；先验×似然比后验。","source":""},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下列关于综合评价法的说法中，正确的是( )。","answer":["D"],"dataset_description":null,"id":"p10:41","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于综合评价法的说法中，正确的是( )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 综合评价法的第一步是确定各指标的权重\u003c/p>"},{"label":"B","html":"\u003cp>综合评价法只能分为主观评价法和客观评价法两类\u003c/p>"},{"label":"C","html":"\u003cp>各指标权重只能采用定量分析法得出\u003c/p>"},{"label":"D","html":"\u003cp>综合评价的评价指标应具有可测性\u003c/p>"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：综合评价的评价指标应具有可测性”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":42,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"通过数据分析，企业管理者可以达到管理目标，下面关于数据分析目标的说法，不正确的是（   ）？","answer":["D"],"dataset_description":null,"id":"p10:42","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>通过数据分析，企业管理者可以达到管理目标，下面关于数据分析目标的说法，不正确的是（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"企业现状分析。"},{"label":"B","html":"运营过程中的原因分析。"},{"label":"C","html":"利用数据分析预测未来。"},{"label":"D","html":"以上三个都不正确。"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：以上三个都不正确。”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":43,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下列对数据价值的叙述，不正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p10:43","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列对数据价值的叙述，不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据的价值与数据的利用有关"},{"label":"B","html":"从海量低价值密度数据中常可以挖掘出有价值的信息"},{"label":"C","html":"数据的价值与数据量成正比"},{"label":"D","html":"大量低价值数据应保存在低成本环境中"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：数据的价值与数据量成正比”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":44,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"品牌承载的更多是一部分消费者对某个产品或服务的认可，下面对于品牌最基本的含义的说法，正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:44","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>品牌承载的更多是一部分消费者对某个产品或服务的认可，下面对于品牌最基本的含义的说法，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"消费者类型"},{"label":"B","html":"消费者文化"},{"label":"C","html":"消费者利益"},{"label":"D","html":"商品属性"}],"explanation":{"topic":"本题解析","paragraphs":["品牌的基本层次是让消费者联想到产品属性，如耐用、性能或品质，所以本题选 D。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"消费者类型是用户形象层面的联想，不是品牌最基本的属性层。"},{"label":"B","selected":false,"reason":"文化属于品牌更深层的含义，不是最基本层次。"},{"label":"C","selected":false,"reason":"利益是产品属性给客户带来的好处，位于属性之上的解释层。"},{"label":"D","selected":true,"reason":"品牌首先使人联想到商品的具体属性，如性能或品质，对应题目“最基本”。"}]},"attachments":[]},{"number":45,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"下面关于市场细分依据的观点，正确的是(    )。","answer":["A"],"dataset_description":null,"id":"p10:45","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下面关于市场细分依据的观点，正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>市场细分的根本依据是消费需求的差异性\u003c/p>"},{"label":"B","html":"\u003cp>市场细分的依据是企业规模的大小差异\u003c/p>"},{"label":"C","html":"\u003cp>市场细分的依据是产品价格的高低差异\u003c/p>"},{"label":"D","html":"\u003cp>市场细分的依据是销售渠道的长短差异\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["市场细分的根本依据是消费者需求的差异性，选 A。"],"warning":"","optionAnalysis":[{"label":"A","selected":true,"reason":"不同消费者需求不同，才有划分市场并分别服务的必要。"},{"label":"B","selected":false,"reason":"企业规模不是消费者需求差异这个根本依据。"},{"label":"C","selected":false,"reason":"价格可用于定位或分组，但不能代替需求差异这一根本依据。"},{"label":"D","selected":false,"reason":"渠道长短是经营安排，不是市场细分的根本出发点。"}]},"attachments":[]},{"number":46,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"战略方案是根据企业目前所处的营销环境来确定，下面关于战略管理在企业中的地位，正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p10:46","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>战略方案是根据企业目前所处的营销环境来确定，下面关于\u003c/span>\u003cspan>战略管理在企业中的地位，正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"经营管理"},{"label":"B","html":"职能管理"},{"label":"C","html":"最高层次"},{"label":"D","html":"市场营销"}],"explanation":{"topic":"本题解析","paragraphs":["战略管理关乎企业长期方向、总体目标和资源配置，在管理体系中居于最高层次，选 C。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"经营管理是活动范围的称呼，没有表达战略管理的最高层次地位。"},{"label":"B","selected":false,"reason":"职能管理属于局部管理，不能代表企业整体长期方向的管理层次。"},{"label":"C","selected":true,"reason":"战略管理决定整体长期方向和资源配置，位于最高层次。"},{"label":"D","selected":false,"reason":"市场营销是一项职能，不能概括全部战略管理。"}]},"attachments":[]},{"number":47,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在运用观察法收集业务数据时，我们需要特别注意（        ）。","answer":["B"],"dataset_description":null,"id":"p10:47","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在运用\u003c/span>\u003cspan>观察法收集业务数据时，我们需要特别注意（ &nbsp; &nbsp; &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"客观性问题"},{"label":"B","html":"全方位问题"},{"label":"C","html":"法律和道德伦理问题"},{"label":"D","html":"求真务实"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：全方位问题”。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"用来描述双变量的统计图形是（   ）。","answer":["A"],"dataset_description":null,"id":"p10:48","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>用来描述双变量的统计图形是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"散点图"},{"label":"B","html":"条形图"},{"label":"C","html":"直方图"},{"label":"D","html":"折线图"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：散点图”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"下面关于数据清洗的方法描述,不正确的是(   )。","answer":["D"],"dataset_description":null,"id":"p10:49","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下面关于数据清洗的方法描述,不正确的是( &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"缺失值填充"},{"label":"B","html":"重复值去除"},{"label":"C","html":"寻找离群点"},{"label":"D","html":"集成不同的数据库"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：集成不同的数据库”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"一个完整的统计指标的构成包括多种要素，下列关于统计指标构成要素的描述，错误的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:50","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>一个完整的统计指标的构成包括多种要素，下列关于统计指标构成要素的描述，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"指标名称和指标数值"},{"label":"B","html":"时间限制，空间限制和计量单位"},{"label":"C","html":"指标名称，计算方法"},{"label":"D","html":"指标名称，指标价值"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：指标名称，指标价值”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"将服务人员的满意程度分成非常满意，满意，不满意三类，所采用的计量尺度是（   ）。","answer":["C"],"dataset_description":null,"id":"p10:51","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>将服务人员的满意程度分成非常满意，满意，不满意三类，所采用的计量尺度是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"定比尺度"},{"label":"B","html":"定类尺度"},{"label":"C","html":"定序尺度"},{"label":"D","html":"定距尺度"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：定序尺度”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"如果按照从低层到高层的排列顺序将测量尺度进行排列，在下述选项中，正确的是(    )。","answer":["B"],"dataset_description":null,"id":"p10:52","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>如果按照从低层到高层的排列顺序将测量尺度进行排列，在下述选项中，正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"定序尺度，定距尺度，定比尺度，定类尺度"},{"label":"B","html":"定类尺度，定序尺度，定距尺度，定比尺度"},{"label":"C","html":"定序尺度，定比尺度，定距尺度，定类尺度"},{"label":"D","html":"定类尺度，定距尺度，定序尺度，定比尺度"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：定类尺度，定序尺度，定距尺度，定比尺度”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"在计算计划完成相对数指标时，分子和分母的数值是（     ）。","answer":["D"],"dataset_description":null,"id":"p10:53","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在计算计划完成相对数指标时，分子和分母的数值是（ &nbsp; &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"只能是绝对数"},{"label":"B","html":"只能是相对数"},{"label":"C","html":"只能是平均数"},{"label":"D","html":"既可以是绝对数，也可以是相对数或平均数"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：既可以是绝对数，也可以是相对数或平均数”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本均值的抽样分布近似服从正态分布所需的样本容量至少为（ ）。","answer":["C"],"dataset_description":null,"id":"p10:54","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>样本均值的抽样分布近似服从正态分布所需的样本容量至少为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>5\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>10\u003c/p>"},{"label":"C","html":"\u003cp>30\u003c/p>"},{"label":"D","html":"\u003cp>100\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：30”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"正态分布曲线由参数μ和σ决定，当μ值相同吋，σ取（ ）时正态曲线展开程度最大，曲线最宽矮。","answer":["D"],"dataset_description":null,"id":"p10:55","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>正态分布曲线由参数μ和σ决定，当μ值相同吋，σ取（ ）时正态曲线展开程度最大，曲线最宽矮。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>0.5\u003c/p>"},{"label":"B","html":"\u003cp>1\u003c/p>"},{"label":"C","html":"\u003cp>2\u003c/p>"},{"label":"D","html":"\u003cp>3\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：3”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例p正确的说法是（ ）。","answer":["A"],"dataset_description":null,"id":"p10:56","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于样本比例p正确的说法是（ ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"随着样本容量的增大，p 的方差愈来愈小"},{"label":"B","html":"随着样本容量的增大，p 的方差愈来愈大"},{"label":"C","html":"随着样本容量的增大，p 的方差不会发生改变"},{"label":"D","html":"随着样本容量的增大，p 的方差在某些区间会变大，在某些区间会变小"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：随着样本容量的增大，p 的方差愈来愈小”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下抽取样本的原则,不正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p10:57","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下抽取样本的原则,不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体限定明确\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本要具有代表性\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本容量越小,越具有代表性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本容量要适当\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：样本容量越小,越具有代表性”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列不属于抽样设计原则的是（  ）。","answer":["B"],"dataset_description":null,"id":"p10:58","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列不属于抽样设计原则的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>目的性原则\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>不可测原则\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>可行性原则\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>经济性原则\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：不可测原则”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于样本均值抽样分布的描述,正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p10:59","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下关于样本均值抽样分布的描述,正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan> \u003c/span>样本均值的抽样分布的均值等于总体均值\u003c/p>"},{"label":"B","html":"\u003cp> 样本均值的抽样分布的标准差等于总体标准差\u003c/p>"},{"label":"C","html":"\u003cp>样本均值的抽样分布的标准差等于总体标准差除以样本量的平方根\u003c/p>"},{"label":"D","html":"\u003cp>样本均值在任何情况下都服从正态分布\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：样本均值的抽样分布的标准差等于总体标准差除以样本量的平方根”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布的F值的说法中，正确的是（   ）。","answer":["A"],"dataset_description":null,"id":"p10:60","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于F分布的F值的说法中，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"F值总为正值"},{"label":"B","html":"F值可以为负值"},{"label":"C","html":"F值可以是0"},{"label":"D","html":"F分布是正态分布"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：F值总为正值”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"标准正态分布的平均数与标准差分别为（ ）。","answer":["A"],"dataset_description":null,"id":"p10:61","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>标准正态分布的平均数与标准差分别为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>0与1\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>1与0\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>0与±1\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>1与1\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：0与1”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本容量越大,说明（ ）","answer":["D"],"dataset_description":null,"id":"p10:62","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>样本容量越大,说明（ ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本方差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本方差越大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本的平均值越大\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本方差越接近总体方差\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：样本方差越接近总体方差”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于抽样误差描述错误的是（ ）。","answer":["B"],"dataset_description":null,"id":"p10:63","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于抽样误差描述错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>是可控制的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>不是抽样所特有的误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>是不可避免的\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>与调查误差不同\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：不是抽样所特有的误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面有关抽样分布的说法,不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p10:64","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下面有关抽样分布的说法,不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>在独立同分布且方差存在的条件下，随着样本容量的增加，样本均值的抽样分布趋于正态分布\u003c/p>"},{"label":"B","html":"\u003cp>随着样本容量的增加，样本均值抽样分布的方差趋小\u003c/p>"},{"label":"C","html":"\u003cp>样本均值抽样分布的方差与原总体方差的大小有关\u003c/p>"},{"label":"D","html":"\u003cp>正态总体下，由样本构造的所有统计量都服从正态分布\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：正态总体下，由样本构造的所有统计量都服从正态分布”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于标准误,正确的说法是（ ）。","answer":["C"],"dataset_description":null,"id":"p10:65","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于标准误,正确的说法是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>标准误越大,表示原始数据的变异度越大\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>标准误越大,表示变量值分布较分散\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>标准误越大,表示样本均数之间的离散程度越大\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>标准误是总体均数的标准差\u003c/span>\u003c/p>"}],"explanation":{"topic":"标准误与标准差","paragraphs":["标准差描述一组观测值彼此有多分散；标准误描述一个统计量在重复抽样时有多波动，是统计量抽样分布的标准差。二者研究对象不同。","均值的标准误为 σ/√n，σ 未知时常以 s/√n 估计。其他条件相同，样本越大或总体越同质，标准误越小。样本量扩大到原来的4倍，标准误才缩小到一半。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：标准误越大,表示样本均数之间的离散程度越大”。"],"tip":"标准差看个体差异；标准误看估计稳定性。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":66,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本量变大，下面的表述，不正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p10:66","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>样本量变大，下面的表述，不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>样本均值的标准误变小\u003c/p>"},{"label":"B","html":"\u003cp>样本均值的标准差变小\u003c/p>"},{"label":"C","html":"\u003cp>样本均值的方差变小\u003c/p>"},{"label":"D","html":"\u003cp>样本方差会越来越接近总体方差\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：样本均值的标准差变小”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":67,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于“统计量”的描述中,不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:67","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于“统计量”的描述中,不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"统计量为随机变量"},{"label":"B","html":"统计量是样本的函数"},{"label":"C","html":"统计量表达式中不含有参数"},{"label":"D","html":"估计量不是统计量"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：估计量不是统计量”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于分层抽样的说法，正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p10:68","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于分层抽样的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>层内具有异质性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>分层变量越多，层数越多\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分层抽样是一种非随机抽样方法\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分层原则是层间具有同质性\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：分层变量越多，层数越多”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下抽样方法中，抽取的每个单元都有相同的入样概率的是（  ）。","answer":["D"],"dataset_description":null,"id":"p10:69","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下抽样方法中，抽取的每个单元都有相同的入样概率的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>随意抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>整群抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>多阶段抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>简单随机抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：简单随机抽样”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"某校共有1000名学生，利用系统随机抽样从中抽取100名学生，下列不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p10:70","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>某校共有1000名学生，利用系统随机抽样从中抽取100名学生，下列不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>将女生排前面，男生排后面\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样间隔为10\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>每隔10人抽取一名学生\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>将1000名学生进行编号\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：将女生排前面，男生排后面”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"假设总体比例为0.2,从此总体中抽取容量为100的样本,则样本比例的标准差为（ ）。","answer":["C"],"dataset_description":null,"id":"p10:71","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>假设总体比例为0.2,从此总体中抽取容量为100的样本,则样本比例的标准差为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>0.2\u003c/p>"},{"label":"B","html":"\u003cp>0.04\u003c/p>"},{"label":"C","html":"\u003cp>0.02\u003c/p>"},{"label":"D","html":"\u003cp>0.16\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["比例标准差=√[0.2×(1−0.2)/100]=√0.0016=0.04。","按公式应选 B，但原站给 C（0.02）。不要为了匹配原答案把开方或分母算错。"],"warning":"原站答案 C 与标准公式计算不符，评分保留 C，同时标注理论应选 B（0.04）。"},"attachments":[]},{"number":72,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"抽样推断中，抽取样本需要遵循的基本原则是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:72","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>抽样推断中，抽取样本需要遵循的基本原则是（ &nbsp; ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"全面原则"},{"label":"B","html":"系统原则"},{"label":"C","html":"及时原则"},{"label":"D","html":"随机原则"}],"explanation":{"topic":"抽样推断的随机原则","paragraphs":["概率抽样通过随机机制选取单位，并要求纳入概率已知且为正，才能评估抽样误差并对总体进行统计推断。因此基本原则选 D：随机原则。","“全面”对应普查，不是抽样；及时性有助于调查质量，但不能替代随机选样。"],"warning":""},"attachments":[]},{"number":73,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"t分布曲线是（ ）。","answer":["D"],"dataset_description":null,"id":"p10:73","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>t分布曲线是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>标准正态曲线\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>当自由度越大，t分布曲线的尾部越低\u003c/p>"},{"label":"C","html":"\u003cp>当自由度趋于无穷时，t分布曲线趋近于标准正态曲线\u003c/p>"},{"label":"D","html":"\u003cp> t分布是一簇曲线，随自由度的改变而不同\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：t分布是一簇曲线，随自由度的改变而不同”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于统计量的说法，错误的是（   ）。","answer":["C"],"dataset_description":null,"id":"p10:74","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下面关于统计量的说法，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"统计量是样本的函数"},{"label":"B","html":"只依赖于样本"},{"label":"C","html":"包含至少一个未知参数"},{"label":"D","html":"不包含任何未知参数"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：包含至少一个未知参数”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于简单随机抽样的观点，不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p10:75","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下关于简单随机抽样的观点，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 从总体中逐个进行抽取\u003c/p>"},{"label":"B","html":"\u003cp>每个个体被抽中的概率相等\u003c/p>"},{"label":"C","html":"\u003cp>抽样前不能确定哪些个体被抽中\u003c/p>"},{"label":"D","html":"\u003cp>总体中的个体数必须是有限的\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：从总体中逐个进行抽取”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"抽样误差最常用的指标是（ ）。","answer":["A"],"dataset_description":null,"id":"p10:76","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>抽样误差最常用的指标是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>抽样标准误\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样方差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>变异系数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>置信区间\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：抽样标准误”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"（   ）是指所选样本不能完全代表总体而导致的误差。","answer":["B"],"dataset_description":null,"id":"p10:77","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>（ &nbsp; ）是指所选样本不能完全代表总体而导致的误差。\u003c/span>\u003c/p>","options":[{"label":"A","html":"调查误差"},{"label":"B","html":"抽样误差"},{"label":"C","html":"非抽样误差"},{"label":"D","html":"系统误差"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：抽样误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在抽样调查方法中，抽样误差最大的是（   ）。","answer":["B"],"dataset_description":null,"id":"p10:78","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在抽样调查方法中，抽样误差最大的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"单纯随机抽样"},{"label":"B","html":"整群抽样"},{"label":"C","html":"系统抽样"},{"label":"D","html":"分层抽样"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：整群抽样”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于概率抽样方法的误差大小，下列排列正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p10:79","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于概率抽样方法的误差大小，下列排列正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>单纯随机抽样分层抽样系统抽样整群抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>单纯随机抽样系统抽样分层抽样整群抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分层抽样系统抽样单纯随机抽样整群抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分层抽样单纯随机抽样系统抽样整群抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：分层抽样系统抽样单纯随机抽样整群抽样”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"对变量X与变量Y之间的卡方值,下列说法正确的是（   ）。","answer":["A"],"dataset_description":null,"id":"p10:80","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>对变量X与变量Y之间的卡方值,下列说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 卡方值越大，“X与Y有关系”的可信程度越大\u003c/p>"},{"label":"B","html":"\u003cp> 卡方值越大，“X与Y有关系”的可信程度越小\u003c/p>"},{"label":"C","html":"\u003cp>卡方值越接近0，“X与Y无关”的可信程度越小\u003c/p>"},{"label":"D","html":"\u003cp>卡方值越大，“X与Y无关”的可信程度越小\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：卡方值越大，“X与Y有关系”的可信程度越大”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于离散度量的指标,最容易受极端值影响的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:81","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下面关于离散度量的指标,最容易受极端值影响的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"标准差"},{"label":"B","html":"异众比率"},{"label":"C","html":"四分位差"},{"label":"D","html":"极差"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：极差”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于正态分布的说法，正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p10:82","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于正态分布的说法，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布密度函数的显著特点是中间低两边高\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>正态分布密度函数由中间向两边递增\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>正态分布密度函数是一条光滑的“钟形曲线”\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正态分布密度函数的分布上下对称\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：正态分布密度函数是一条光滑的“钟形曲线””。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布的描述,错误的是（ ）。","answer":["A"],"dataset_description":null,"id":"p10:83","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于F分布的描述,错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F分布是一个负偏态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F值总为正值\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随着分子和分母的自由度的变化而变化的一簇曲线\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分子和分母的自由度越大,F分布越接近正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：F分布是一个负偏态分布”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"统计中所说的样本是指（  ）。","answer":["C"],"dataset_description":null,"id":"p10:84","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>统计中所说的样本是指（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>从总体中随意抽取一部分\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>有意识地选择总体中的典型部分\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>从总体中随机抽取有代表性的一部分\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>以上都不是\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：从总体中随机抽取有代表性的一部分”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于样本均值分布的均值和总体均值的观点，正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p10:85","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于样本均值分布的均值和总体均值的观点，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>分布的均值不等于总体均值\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>只有在非重复抽样的条件下，样本均值的期望值才等于总体均值\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>只有在重复抽样的条件下，样本均值的期望值才等于总体均值\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分布的均值总是等于总体均值\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：分布的均值总是等于总体均值”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下哪个分布不是右偏分布（ ）。","answer":["A"],"dataset_description":null,"id":"p10:86","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下哪个分布不是右偏分布（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>均匀分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>卡方分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>对数正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：均匀分布”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"为了了解使用有机农业技术的农民所占的比例，以下的抽样方式，正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p10:87","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>为了了解使用有机农业技术的农民所占的比例，以下的抽样方式，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>在全国范围内随机抽取若干个县，再对这些县内的全部农民进行调查\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan> \u003c/span>在全国范围内按农民姓名拼音排序后，等间隔抽取调查对象\u003c/p>"},{"label":"C","html":"\u003cp>在全国范围内随机抽取少量农民作为调查对象\u003c/p>"},{"label":"D","html":"\u003cp>只选择某一个农业大县的农民进行调查\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：在全国范围内随机抽取若干个县，再对这些县内的全部农民进行调查”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于t分布，下列说法正确的有（ ）。","answer":["C"],"dataset_description":null,"id":"p10:88","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于t分布，下列说法正确的有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>t分布有两个拐点\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布与标准正态分布的图型特征相同\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>当自由度趋于无穷大时，t分布趋近于标准正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>t分布与均匀分布图形相似\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：当自由度趋于无穷大时，t分布趋近于标准正态分布”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于抽样误差的观点，正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p10:89","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下面关于抽样误差的观点，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"调查中所产生的登记性误差"},{"label":"B","html":"调查中所产生的系统性误差"},{"label":"C","html":"随机的代表性误差"},{"label":"D","html":"计算过程中产生的误差"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：随机的代表性误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":90,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下对于整群抽样的说法，错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p10:90","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下对于\u003c/span>\u003cspan>整群抽样\u003c/span>\u003cspan>的说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>先将总体分成若干个可以重叠的群\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>先将总体分为若干个不可以重叠的多个群，然后从这些群中随机抽取若干个群\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>对这些群内所有个体进行调查\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>据样本量，确定应该抽取的群数\u003c/span>\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：先将总体分成若干个可以重叠的群”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":91,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"随机抽取1000个消费者进行电话采访来了解某商品的品牌忠诚度。按照抽样调查理论，这1000个受访者的品牌忠诚度的平均值是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:91","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>随机抽取1000个消费者进行电话采访来了解某商品的品牌忠诚度。按照抽样调查理论，这1000个受访者的品牌忠诚度的平均值是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"总体"},{"label":"B","html":"样本"},{"label":"C","html":"总体参数"},{"label":"D","html":"样本统计量"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["这1000人是样本，用他们的回答算出的品牌忠诚度平均值是样本统计量，所以选 D。","若对所有目标消费者的真实平均忠诚度作概括，才是总体参数；“样本”是人群集合，不是计算出来的均值。"],"warning":""},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在某市随机抽取9个家庭，调查得到每个家庭的人均月收入的样本如下（单位：元）:\n1080 750 1080 850 1080 960 2000 1250 1680\n这个样本的众数为：","answer":["B"],"dataset_description":null,"id":"p10:92","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在某市随机抽取9个家庭，调查得到每个家庭的人均月收入的样本如下（单位：元）:\u003c/span>\u003c/p>\u003cp>\u003cspan>1080 750 1080 850 1080 960 2000 1250 1680\u003c/span>\u003c/p>\u003cp>\u003cspan>这个样本的众数为：\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>1680\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>1080\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>960\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>2000\u003c/span>\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["众数是出现次数最多的数。1080出现3次，其他收入各出现1次，所以众数1080，选 B。","众数与均值、中位数不同，不要求把各值相加。"],"warning":""},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列有关置信度和置信区间的表述中正确的是(    )。","answer":["B"],"dataset_description":null,"id":"p10:93","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列有关置信度和置信区间的表述中正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>置信度越高，测定的可信度越低\u003c/p>"},{"label":"B","html":"\u003cp>置信区间的大小和测定次数有关\u003c/p>"},{"label":"C","html":"\u003cp>置信度越高，置信区间越窄\u003c/p>"},{"label":"D","html":"\u003cp>置信区间的中心位置取决于测量次数\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：置信区间的大小和测定次数有关”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于原假设的建立，下列叙述中正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:94","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于原假设的建立，下列叙述中正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"若不希望否定某一命题，就将此命题作为原假设"},{"label":"B","html":"尽量使后果严重的错误成为第二类错误"},{"label":"C","html":"如果原假设未被拒绝,就可以证明原假设是正确的"},{"label":"D","html":"若想利用样本作为对某一命题强有力的支持，应将此命题的对立命题作为原假设"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：若想利用样本作为对某一命题强有力的支持，应将此命题的对立命题作为原假设”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":95,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"以下有关假设检验的观点，错误的是(  )。","answer":["A"],"dataset_description":null,"id":"p10:95","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下有关假设检验的观点，错误的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 原假设H0，通常是希望出现的结果\u003c/p>"},{"label":"B","html":"\u003cp>小概率事件的界值，可以是0.01，也可以是0.05，甚至是0.1\u003c/p>"},{"label":"C","html":"\u003cp>样本的获取，一定要保证简单随机抽样\u003c/p>"},{"label":"D","html":"\u003cp>选择检验的方法，可以是多种统计模型\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：原假设H0，通常是希望出现的结果”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":96,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于假设检验的说法中,下面正确的是(    )。","answer":["C"],"dataset_description":null,"id":"p10:96","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于假设检验的说法中,下面正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"做显著性检验的目的就是为了接受原假设"},{"label":"B","html":"一旦检验法选择正确,计算没有错误,就不会作出错误判断"},{"label":"C","html":"一旦样本容量一定,犯第一类错误和第二类错误的概率不可能同时减小"},{"label":"D","html":"显著性水平就是原假设为真时,接受原假设的概率"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：一旦样本容量一定,犯第一类错误和第二类错误的概率不可能同时减小”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":97,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于归纳，以下说法不正确的是（   ）。","answer":["B"],"dataset_description":null,"id":"p10:97","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于归纳，以下说法不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"归纳是一种从许多个别事物中概括出一般原理的推理方法"},{"label":"B","html":"简单枚举法是一种完全归纳法"},{"label":"C","html":"贝叶斯推理是一种基于统计学的归纳推理"},{"label":"D","html":"“穆勒五法”是古典归纳逻辑的最高成就之一"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：简单枚举法是一种完全归纳法”。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":98,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在假设检验中，给定原假设为H0 ，备选假设为H1的情况下，下面那个选项属于第二类错误（    ）。","answer":["C"],"dataset_description":null,"id":"p10:98","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在假设检验中，给定原假设为H\u003c/span>\u003cspan>\u003csub>0 \u003c/sub>\u003c/span>\u003cspan>，备选假设为H\u003c/span>\u003cspan>\u003csub>1\u003c/sub>\u003c/span>\u003cspan>的情况下，下面那个选项属于第二类错误（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"H\u003csub>0\u003c/sub>为真，不拒绝H\u003csub>1\u003c/sub>"},{"label":"B","html":"H\u003csub>0\u003c/sub>为真，拒绝H\u003csub>1\u003c/sub>"},{"label":"C","html":"H\u003csub>0\u003c/sub>不真，不拒绝H\u003csub>0\u003c/sub>"},{"label":"D","html":"H\u003csub>0\u003c/sub>不真，拒绝H\u003csub>0\u003c/sub>"}],"explanation":{"topic":"假设检验的两类错误","paragraphs":["第一类错误是原假设 H₀ 为真却拒绝它，也叫弃真，其概率通常用 α 表示。第二类错误是 H₀ 为假却未拒绝它，也叫取伪，其概率用 β 表示，检验功效为 1−β。","在样本量、效应大小和检验方案等条件固定时，降低 α 常会增加 β。增加有效样本量可以改善检验功效，不能说两类错误在任何情况下都固定互补或相加等于1。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：H0不真，不拒绝H0”。"],"tip":"弃真 α；取伪 β；功效 1−β。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":99,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于“拒绝域”的评述中,不正确的是(    )。","answer":["D"],"dataset_description":null,"id":"p10:99","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于“拒绝域”的评述中,不正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"拒绝域是样本空间的子集"},{"label":"B","html":"拒绝域的结构形式是先定的，与具体抽样结果无关"},{"label":"C","html":"拒绝域往往是通过某检验统计量诱导出来的"},{"label":"D","html":"拒绝域中涉及的临界值要通过抽样来确定"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：拒绝域中涉及的临界值要通过抽样来确定”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在总体参数的区间估计中，能够说明估计可靠程度的是(    )。","answer":["A"],"dataset_description":null,"id":"p10:100","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>在总体参数的区间估计中，能够说明估计可靠程度的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"置信水平"},{"label":"B","html":"置信区间"},{"label":"C","html":"判定系数"},{"label":"D","html":"估计标准误差"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：置信水平”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":101,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于双侧检验的描述，不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:101","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下列关于双侧检验的描述，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>在抽样分布的两尾各有一个临界值，且关于原点对称\u003c/p>"},{"label":"B","html":"\u003cp>显著性水平值平均分布在抽样分布的两尾\u003c/p>"},{"label":"C","html":"\u003cp>在抽样分布的两尾各有一块拒绝域\u003c/p>"},{"label":"D","html":"\u003cp>检验目的是为了判断某个总体参数是否大于某个定值\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：检验目的是为了判断某个总体参数是否大于某个定值”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":102,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"假设检验中的显著性水平一般用α来表示，下述关于α的观点正确的选项是（ ）。","answer":["A"],"dataset_description":null,"id":"p10:102","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>假设检验中的显著性水平一般用α来表示，下述关于α的观点正确的选项是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"犯第一类错误的概率不超过α"},{"label":"B","html":"犯第二类错误的概率不超过α"},{"label":"C","html":"犯两类错误的概率之和不超过α"},{"label":"D","html":"犯第一类错误的概率不超过1-α"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：犯第一类错误的概率不超过α”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于云计算的描述不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p10:103","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下关于云计算的描述不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"私有云是将云基础设施与软硬件资源创建在防火墙内，以供机构或企业内各部门共享数据中心内的资源"},{"label":"B","html":"云计算模式中用户通过高速互联网就可以透明地使用各种资源"},{"label":"C","html":"云计算由一系列可以动态升级和被虚拟化的资源组成"},{"label":"D","html":"云计算包括的几个层次的服务中，IaaS在应用软件层实现，PaaS在基础设施层实现"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：云计算包括的几个层次的服务中，IaaS在应用软件层实现，PaaS在基础设施层实现”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"关于大数据的质量信息，描述不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p10:104","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>关于大数据的质量信息，描述不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"来源多样"},{"label":"B","html":"数据量大"},{"label":"C","html":"数据产生、变化速度快"},{"label":"D","html":"数据信息难利用"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：数据信息难利用”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于降维的说法不正确的是（  ）？","answer":["B"],"dataset_description":null,"id":"p10:105","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>以下关于降维的说法不正确的是（ &nbsp;）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"降维是将训练样本从高维空间转换到低维空间"},{"label":"B","html":"降维不会对数据产生损伤"},{"label":"C","html":"通过降维可以更有效地发掘有意义的数据结构"},{"label":"D","html":"降维将有助于实现数据可视化"}],"explanation":{"topic":"降维与特征表示","paragraphs":["降维将高维特征映射或筛选为较少维度，在尽量保留重要结构和信息的同时降低冗余、噪声与计算成本。通常是高维到低维，而不是反过来扩维。","特征选择保留原特征的子集；特征提取构造新特征，如主成分分析以方差方向构造线性组合。降维一般存在信息取舍，不能保证毫无信息损失或必然提高所有模型准确率。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：降维不会对数据产生损伤”。"],"tip":"降维减少特征维度；选择保留原列，提取产生新列。","source":""},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下面不属于非结构化数据的是（  ）。","answer":["D"],"dataset_description":null,"id":"p10:106","paperId":"p10","paperTitle":"Excel 模拟卷 10","question_html":"\u003cp>\u003cspan>下面不属于非结构化数据的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>办公文档\u003c/p>"},{"label":"B","html":"\u003cp>图片\u003c/p>"},{"label":"C","html":"\u003cp>视频信息\u003c/p>"},{"label":"D","html":"\u003cp>数据库二维逻辑表\u003c/p>"}],"explanation":{"topic":"数据结构、数据库与存储","paragraphs":["结构化数据具有明确模式，如关系表的行列；半结构化数据有标签或键等组织方式，如 JSON、XML；非结构化数据如图片、音视频和自由文本。来源内部或外部与结构类型是两个不同维度。","
