关于大数据特征描述，不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据量大"},{"label":"B","html":"数据价值密度高"},{"label":"C","html":"数据类型多样"},{"label":"D","html":"数据产生处理速度快"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：数据价值密度高”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"关于非结构化数据的存储，下列说法正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p06:105","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于非结构化数据的存储，下列说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"当非结构化数据较小时.可以使用关系型数据库将其直接储存在数据库表的多值字段和变长字段中"},{"label":"B","html":"若数据较大.则存放于文件系统中，数据库则用于存放相关文件的索引信息"},{"label":"C","html":"两者均正确"},{"label":"D","html":"两者均不正确"}],"explanation":{"topic":"数据结构、数据库与存储","paragraphs":["结构化数据具有明确模式，如关系表的行列；半结构化数据有标签或键等组织方式，如 JSON、XML；非结构化数据如图片、音视频和自由文本。来源内部或外部与结构类型是两个不同维度。","NoSQL 常包括键值、文档、列族和图等模型，不是只能存文本或只能用表格。关系数据库以表和关系为主要模型，数据模型与物理存储方式不能混为一谈。","存储需兼顾容量扩展、检索效率、备份恢复、权限和安全；加密主要保护保密性，不能单靠更严格加密来解决容量增长。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：两者均正确”。"],"tip":"来源和结构分开看；NoSQL 不只键值一种。","source":""},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于大数据可视化的说法，不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p06:106","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下关于大数据可视化的说法，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据可视化利用计算机图形学和图像处理技术，将数据转换为图形或图像在屏幕上显示出来，并进行各种交互处理的理论，方法和技术"},{"label":"B","html":"能够把抽象，枯燥或难以理解的内容，包括看似毫无意义的数据，信息，知识等等以一种容易理解的视觉方式展示出来"},{"label":"C","html":"涉及到计算机图形学，图像处理，计算机视觉，计算机辅助设计等多个领域，成为研究数据表示，数据处理，决策分析等一系列问题的综合技术"},{"label":"D","html":"对多维数据进行切片，切块，旋转等动作剖析数据，从而多角度多侧面观察数据"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：对多维数据进行切片，切块，旋转等动作剖析数据，从而多角度多侧面观察数据”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列有关大数据的说法，不正确的是（    ） 。","answer":["B"],"dataset_description":null,"id":"p06:107","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列有关大数据的说法，不正确的是（ &nbsp; &nbsp;） 。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据决策成为一种新的决策方式"},{"label":"B","html":"数据量达到1GB就是大数据"},{"label":"C","html":"大数据技术是以数据为本质的新一代革命性的信息技术"},{"label":"D","html":"大数据对科学研究、思维方式和社会发展都具有重要而深远的影响"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：数据量达到1GB就是大数据”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于数据价值的叙述中,不正确的是(    )。","answer":["C"],"dataset_description":null,"id":"p06:108","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下关于数据价值的叙述中,不正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据的价值与数据的利用有关"},{"label":"B","html":"从海量低价值密度数据中常可以挖掘出有价值的信息"},{"label":"C","html":"数据的价值与数据量成正比"},{"label":"D","html":"大量低价值数据应保存在低成本环境中"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：数据的价值与数据量成正比”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"对一个求目标函数最大的混合整数规划问题，以下中不正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p06:109","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>对一个求目标函数最大的混合整数规划问题，以下中不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"其线性规划松弛问题的最优解可能是该整数规划问题的最优解"},{"label":"B","html":"该问题可行解的个数是有限的"},{"label":"C","html":"任一可行解的目标函数值不可能大于其线性规划松弛问题的目标函数值"},{"label":"D","html":"该问题可行解中可能存在不取整数值的变量"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：该问题可行解的个数是有限的”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"将线性规划的数学模型化为标准形的主要目的是（  ）。","answer":["B"],"dataset_description":null,"id":"p06:110","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>将线性规划的数学模型化为标准形的主要目的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"求解简单"},{"label":"B","html":"使用单纯形法求解"},{"label":"C","html":"表示简洁"},{"label":"D","html":"可以用矩阵表示"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：使用单纯形法求解”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":111,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于共轭梯度法, 下面说法正确的是(  )。","answer":["D"],"dataset_description":null,"id":"p06:111","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于共轭梯度法, 下面说法正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"相邻两步的搜索方向正交"},{"label":"B","html":"相邻两步的残量正交"},{"label":"C","html":"搜索方向满足共轭条件"},{"label":"D","html":"B和C都对"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：B和C都对”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":112,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下关于极大似然估计的观点，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p06:112","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下关于极大似然估计的观点，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"是根据概率最大的事件在一次实验中最可能出现的原理"},{"label":"B","html":"总体是离散型随机变量，则似然函数是由各样本取值的概率乘积得到的"},{"label":"C","html":"总体是连续型随机变量，则似然函数是由各样本密度函数取值的乘积得到的"},{"label":"D","html":"不属于点估计"}],"explanation":{"topic":"极大似然与贝叶斯估计","paragraphs":["极大似然估计把已观测样本固定，选择使似然 L(θ)=∏f(xᵢ;θ) 最大的参数。通常取对数把连乘变为连加，再求导、检查边界和极值。它并不等于“让参数本身的概率最大”。","贝叶斯估计为参数赋予先验分布，再用数据得到后验分布：后验∝似然×先验。频率学派常把参数视为固定未知量，贝叶斯方法则以概率分布表达对参数的不确定性。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：不属于点估计”。"],"tip":"极大似然：固定数据选参数；贝叶斯：先验+数据→后验。","source":""},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下面关于方差分析内容的描述，正确的是(  )。","answer":["B"],"dataset_description":null,"id":"p06:113","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下面关于方差分析内容的描述，正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"F值可能是负数"},{"label":"B","html":"F值不可能是负数"},{"label":"C","html":"组间离均差不会等于组内离均差"},{"label":"D","html":"组间离均差不会小于组内离均差"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：F值不可能是负数”。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于系统优化的叙述中,不正确的是 ( )。","answer":["C"],"dataset_description":null,"id":"p06:114","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于系统优化的叙述中,不正确的是 ( )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可以运用数学模型对问题进行优化"},{"label":"B","html":"系统优化时需要对结果进行完善和验证"},{"label":"C","html":"通过优化的目标与决策变量可以计算出满意解"},{"label":"D","html":"有时通过估算也可以实现系统优化"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：通过优化的目标与决策变量可以计算出满意解”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于纯整数规划的最优解,下列说法正确的是(  )。","answer":["A"],"dataset_description":null,"id":"p06:115","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于纯整数规划的最优解,下列说法正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>纯整数规划可能存在无穷多最优解\u003c/p>"},{"label":"B","html":"\u003cp> 纯整数规划的最优解一定唯一\u003c/p>"},{"label":"C","html":"\u003cp>纯整数规划一定有最优解\u003c/p>"},{"label":"D","html":"\u003cp>纯整数规划一定有可行解\u003c/p>"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：纯整数规划可能存在无穷多最优解”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列有关线性回归方程的说法,错误的是(  )。","answer":["C"],"dataset_description":null,"id":"p06:116","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列有关线性回归方程的说法,错误的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"其建立依赖最小二乘法"},{"label":"B","html":"\u003cp>能够确定两个或多个变量间相互依赖的定量关系\u003c/p>"},{"label":"C","html":"\u003cp>只能确定两个变量相互依赖的定量关系\u003c/p>"},{"label":"D","html":"\u003cp>只有在散点图大致呈线性时,求出的回归直线方程才有实际意义\u003c/p>"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：只能确定两个变量相互依赖的定量关系”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下对于朴素贝叶斯算法说法，错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p06:117","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下对于朴素贝叶斯算法说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"适合多分类任务"},{"label":"B","html":"对大数据集的训练速度快"},{"label":"C","html":"属于生成模型"},{"label":"D","html":"特征有缺失值无法计算"}],"explanation":{"topic":"朴素贝叶斯分类","paragraphs":["贝叶斯分类按后验概率 P(类别|特征) 选择类别。朴素贝叶斯的“朴素”是给定类别后，各特征条件独立的假设，并非无条件要求所有特征彼此独立。","后验与“类别先验×各特征条件概率的乘积”成比例；取对数可避免很小概率连乘下溢，平滑可处理零频次。它既可二分类，也可多分类。","训练不需要复杂的迭代求最优边界，但预测仍需参数估计；相关特征可能削弱独立假设，不能据此断言算法完全不能用。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：特征有缺失值无法计算”。"],"tip":"给定类别后条件独立；先验×似然比后验。","source":""},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"《数据安全法》的通过时间为（   ）。","answer":["B"],"dataset_description":null,"id":"p06:118","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>《数据安全法》的通过时间为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"2022"},{"label":"B","html":"2021"},{"label":"C","html":"2020"},{"label":"D","html":"2018"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：2021”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"根据法律规范层级，下列何种规范的法律效力最高（  ）。","answer":["A"],"dataset_description":null,"id":"p06:119","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>根据法律规范层级，下列何种规范的法律效力最高（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"《个人信息保护法》"},{"label":"B","html":"《上海市数据条例》"},{"label":"C","html":"《征信业管理条例》"},{"label":"D","html":"《网络安全审查办法》"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：《个人信息保护法》”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"与一般社会道德相比较，以下哪项不属于职业道德伦理（  ）。","answer":["D"],"dataset_description":null,"id":"p06:120","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>与一般社会道德相比较，以下哪项不属于职业道德伦理（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"职业道德伦理是在历史上形成的、特定的职业环境中产生和发展起来的，它常常形成世代相袭的职业传统和比较稳定的职业心理和习惯，因此具有较强的稳定性和连续性"},{"label":"B","html":"职业道德伦理反映着特定的职业关系，具有特定职业的业务特征，只对从事特定职业的人们具有约束力"},{"label":"C","html":"职业道德伦理通常以规章制度、工作守则、服务公约、劳动规程、行为须知等形式表现出来"},{"label":"D","html":"职业道德伦理依靠国家强制力保证实施"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：职业道德伦理依靠国家强制力保证实施”。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"关于随机抽样,下列哪一项说法是正确的（  ）。","answer":["A","B","D"],"dataset_description":null,"id":"p06:121","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于随机抽样,下列哪一项说法是正确的（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样时应使得总体中每一个个体都有同等的机会被抽取\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样者在抽样时应使样本更能代表总体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随机抽样即随意抽取个体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>为确保样本具有更好的代表性,样本量应足够大\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>选择符合研究者意愿的样本单位\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：抽样时应使得总体中每一个个体都有同等的机会被抽取；B：抽样者在抽样时应使样本更能代表总体；D：为确保样本具有更好的代表性,样本量应足够大”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"作为一名数据分析师，应该根据具体业务选择合适的指标衡量业务。无论何种业务，我们都可以使用下述哪些数据来设计业务指标（   ）？","answer":["A","B","C"],"dataset_description":null,"id":"p06:122","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>作为一名数据分析师，应该根据具体业务选择合适的指标衡量业务。无论何种业务，我们都可以使用下述哪些数据来设计业务指标（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"用户数据"},{"label":"B","html":"行为数据"},{"label":"C","html":"产品数据"},{"label":"D","html":"行业销售数据"},{"label":"E","html":"财务数据"}],"explanation":{"topic":"本题解析","paragraphs":["题库采用用户、行为、产品三维框架：用户回答谁，行为回答做什么，产品回答与什么对象互动，因此选 A、B、C。"],"warning":"“无论何种业务”表述过强；此处只说明题库采用的三维框架，不排斥财务和行业数据的重要性。","optionAnalysis":[{"label":"A","selected":true,"reason":"用户维度说明业务涉及谁，是题库三维框架之一。"},{"label":"B","selected":true,"reason":"行为维度说明用户做了什么，是题库三维框架之一。"},{"label":"C","selected":true,"reason":"产品维度说明行为作用的业务对象，是题库三维框架之一。"},{"label":"D","selected":false,"reason":"行业销售可用于分析，但不属于本题指定的用户、行为、产品三维。"},{"label":"E","selected":false,"reason":"财务数据有实际用途，但不属于本题指定的三维框架；不选不代表不能用于指标。"}]},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"频数分布表有多重用途，下列关于频数分布表的用途的观点中，正确的有（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p06:123","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>频数分布表有多重用途，下列关于频数分布表的用途的观点中，正确的有\u003c/span>\u003cspan>（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"揭示资料的分布类型。"},{"label":"B","html":"观察数的集中趋势"},{"label":"C","html":"观察数的离散趋势。"},{"label":"D","html":"可以显示数据中规则的情况"},{"label":"E","html":"便于发现数据中特大或特小的离群值。"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：揭示资料的分布类型。；B：观察数的集中趋势；C：观察数的离散趋势。；E：便于发现数据中特大或特小的离群值。”。多选题应检查所有选项，不能只选其中一项。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"融资风险预警指标体系应该包括下述哪些选项（   ）？","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p06:124","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>融资风险预警指标体系应该包括下述哪些选项（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"盈利能力"},{"label":"B","html":"资产运营能力"},{"label":"C","html":"融资结构"},{"label":"D","html":"偿债能力"},{"label":"E","html":"发展能力"}],"explanation":{"topic":"业务指标与指标体系","paragraphs":["指标必须有业务含义、统计对象、计算方法和口径，体系应从战略目标逐级分解到部门和执行活动。常见层次为公司、业务或部门、具体运营层，并非任何运营指标都直接等于公司战略指标。","原子指标强调不可再拆的基础度量和聚合逻辑；加上时间、地区等限定可形成衍生指标，完成值、同比、环比等不能不加区分地都叫原子指标。","点击率=点击次数/曝光次数，留存率考察一批用户后续仍活跃的比例，客单价需明确“客户数还是订单数”的口径。指标可分规模、转化、效率、质量等，不能凭一个数就下结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：盈利能力；B：资产运营能力；C：融资结构；D：偿债能力；E：发展能力”。多选题应检查所有选项，不能只选其中一项。"],"tip":"指标先定对象、时间和口径；比率必须说清分母。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列对F分布的描述中，正确的是（ ）。","answer":["C","D","E"],"dataset_description":null,"id":"p06:125","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列对F分布的描述中，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>F分布是对称分布\u003c/p>"},{"label":"B","html":"\u003cp> F值的取值范围是 −∞ 到 +∞\u003c/p>"},{"label":"C","html":"\u003cp>F分布的平均数大于中位数\u003c/p>"},{"label":"D","html":"\u003cp>F分布的形态随分子分母自由度不同而不同\u003c/p>"},{"label":"E","html":"\u003cp>分母和分子的自由度越大，F分布越接近正态分布\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C、D、E。对应内容为“C：F分布的平均数大于中位数；D：F分布的形态随分子分母自由度不同而不同；E：分母和分子的自由度越大，F分布越接近正态分布”。多选题应检查所有选项，不能只选其中一项。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于卡方分布的特点描述，正确的是（ ）。","answer":["B","E"],"dataset_description":null,"id":"p06:126","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于卡方分布的特点描述，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>卡方取值都是正值\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>卡方分布是正偏态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>卡方分布为非连续性函\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>卡方分布不可加\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>卡方分布是一分布族\u003c/span>\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、E。对应内容为“B：卡方分布是正偏态分布；E：卡方分布是一分布族”。多选题应检查所有选项，不能只选其中一项。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于t分布，以下说法正确的是（ ）。","answer":["A","B","D"],"dataset_description":null,"id":"p06:127","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于t分布，以下说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>t分布曲线是连续的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>以0为中心的对称分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan> t分布就标准正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>自由度越小，t分布两侧尾部的面积较标准正态分布的大\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>t分布的曲线形状固定\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：t分布曲线是连续的；B：以0为中心的对称分布；D：自由度越小，t分布两侧尾部的面积较标准正态分布的大”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于不放回简单随机抽样的抽样误差的说法，正确的有（ ）。","answer":["A","B","E"],"dataset_description":null,"id":"p06:128","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于不放回简单随机抽样的抽样误差的说法，正确的有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样误差无法避免但可计算\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本量越大抽样误差越小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体方差越大抽样误差越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>统计量的选择对抽样误差没有影响\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>比放回简单随机抽样的误差小\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、E。对应内容为“A：抽样误差无法避免但可计算；B：样本量越大抽样误差越小；E：比放回简单随机抽样的误差小”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于样本次序统计量的是（  ）。","answer":["B","C","E"],"dataset_description":null,"id":"p06:129","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下属于样本次序统计量的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本均值\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本中位数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本分位数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本众数\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本四分位数\u003c/span>\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、E。对应内容为“B：样本中位数；C：样本分位数；E：样本四分位数”。多选题应检查所有选项，不能只选其中一项。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于偏倚类型的是哪些？","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p06:130","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>以下属于偏倚类型的是哪些？\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>选择性偏倚\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>无应答偏倚\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>测量偏倚\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>回忆偏倚\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>检查者偏倚\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：选择性偏倚；B：无应答偏倚；C：测量偏倚；D：回忆偏倚；E：检查者偏倚”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"某省10万户企业中的所有员工为5000万，构成已总体，抽取200户企业的所有员工构成样本，以下属于参数的是（  ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p06:131","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>某省\u003c/span>\u003cspan>10万户企业中的所有员工为5000万，构成已总体，抽取200户企业的所有员工构成样本，以下属于参数的是\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>研究生学历员工的比例\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>员工的平均年龄\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>员工的平均年工资\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>男女员工的比例\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>通过样本计算的平均年工资\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：研究生学历员工的比例；B：员工的平均年龄；C：员工的平均年工资；D：男女员工的比例”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列有关偶然误差的论述中正确的是（ ）。","answer":["A","B","D","E"],"dataset_description":null,"id":"p06:132","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列有关偶然误差的论述中正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>偶然误差具有随机性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>偶然误差的数值大小、正负出现的机会均等\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>偶然误差具有单向性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>偶然误差在分析中是无法避免\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>偶然误差是由一些不确定的偶然因素造成\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D、E。对应内容为“A：偶然误差具有随机性；B：偶然误差的数值大小、正负出现的机会均等；D：偶然误差在分析中是无法避免；E：偶然误差是由一些不确定的偶然因素造成”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列选项中，不属于统计抽样的是（  ）。","answer":["B","D","E"],"dataset_description":null,"id":"p06:133","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列选项中，不属于统计抽样的是（ &nbsp;）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>属性抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>任意抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>变量抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>随意抽样\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>判断抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B、D、E。对应内容为“B：任意抽样；D：随意抽样；E：判断抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于标准误的解释，不正确的是（ ）。","answer":["C","D"],"dataset_description":null,"id":"p06:134","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于标准误的解释，不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本均值的标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本率的标准差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>标准差的平均数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>标准差的标准差\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>统计量的标准差\u003c/span>\u003c/p>"}],"explanation":{"topic":"标准误与标准差","paragraphs":["标准差描述一组观测值彼此有多分散；标准误描述一个统计量在重复抽样时有多波动，是统计量抽样分布的标准差。二者研究对象不同。","均值的标准误为 σ/√n，σ 未知时常以 s/√n 估计。其他条件相同，样本越大或总体越同质，标准误越小。样本量扩大到原来的4倍，标准误才缩小到一半。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C、D。对应内容为“C：标准差的平均数；D：标准差的标准差”。多选题应检查所有选项，不能只选其中一项。"],"tip":"标准差看个体差异；标准误看估计稳定性。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下列有关建立假设的论述，错误的是（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p06:135","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列有关建立假设的论述，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"两样本均数比较的假设检验时，H\u003csub>1\u003c/sub>的表达式是：μ\u003csub>1\u003c/sub>=μ\u003csub>2\u003c/sub>"},{"label":"B","html":"两样本均数比较的假设检验时，H\u003csub>0\u003c/sub>的表达式是：μ\u003csub>1\u003c/sub>≠μ\u003csub>2\u003c/sub>"},{"label":"C","html":"检验假设用H\u003csub>1\u003c/sub>表示"},{"label":"D","html":"备择假设用H\u003csub>0\u003c/sub>表示"},{"label":"E","html":"假设可分成两种，分别用符号H\u003csub>0\u003c/sub>和H\u003csub>1\u003c/sub>表示"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、C、D。对应内容为“A：两样本均数比较的假设检验时，H1的表达式是：μ1=μ2；B：两样本均数比较的假设检验时，H0的表达式是：μ1≠μ2；C：检验假设用H1表示；D：备择假设用H0表示”。多选题应检查所有选项，不能只选其中一项。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于假设检验的观点，错误的选项包括（  ）。","answer":["B","D"],"dataset_description":null,"id":"p06:136","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>下面关于假设检验的观点，错误的选项包括（ &nbsp;）。\u003c/p>","options":[{"label":"A","html":"\u003cp>假设检验是对原假设进行检验\u003c/p>"},{"label":"B","html":"\u003cp>假设检验是对备择假设进行检验\u003c/p>"},{"label":"C","html":"当拒绝原假设时,可能犯了弃真错误"},{"label":"D","html":"\u003cp>备选假设是设计者想要否定的假设\u003c/p>"},{"label":"E","html":"\u003cp>原假设是设计者想要否定的假设\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B、D。对应内容为“B：假设检验是对备择假设进行检验；D：备选假设是设计者想要否定的假设”。多选题应检查所有选项，不能只选其中一项。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"关于大数据可视化，下面哪些说法是正确的（   ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p06:137","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于大数据可视化，下面哪些说法是正确的（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据可视化可用于模型构建环节，用于进行可视化分析"},{"label":"B","html":"大数据可视化可用于方案实施环节中，用于将分析结果发布出去"},{"label":"C","html":"大数据可视化可用于模型评估中，可直观地看出模型是否符合预期"},{"label":"D","html":"大数据可视化不属于哪一个具体环节，在大数据分析各环节都可使用"},{"label":"E","html":"大数据方面的应用，将数据信息转化为视觉形式的过程"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：大数据可视化可用于模型构建环节，用于进行可视化分析；B：大数据可视化可用于方案实施环节中，用于将分析结果发布出去；C：大数据可视化可用于模型评估中，可直观地看出模型是否符合预期；D：大数据可视化不属于哪一个具体环节，在大数据分析各环节都可使用；E：大数据方面的应用，将数据信息转化为视觉形式的过程”。多选题应检查所有选项，不能只选其中一项。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"方差分析包括(  )。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p06:138","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>方差分析包括( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"单因素方差分析"},{"label":"B","html":"多因素方差分析"},{"label":"C","html":"协方差分析"},{"label":"D","html":"一元方差分析和多元方差分析"},{"label":"E","html":"非参数方差分析"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：单因素方差分析；B：多因素方差分析；C：协方差分析；D：一元方差分析和多元方差分析；E：非参数方差分析”。多选题应检查所有选项，不能只选其中一项。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"法的规范作用包括（   ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p06:139","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>法的规范作用包括（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"指引"},{"label":"B","html":"评价"},{"label":"C","html":"教育"},{"label":"D","html":"预测"},{"label":"E","html":"强制"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：指引；B：评价；C：教育；D：预测；E：强制”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"算法可解释性的目的包括（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p06:140","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>算法可解释性的目的包括（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"维护算法消费者的知情权利益"},{"label":"B","html":"避免和解决算法决策的错误性和歧视性"},{"label":"C","html":"明晰算法决策的主体性、因果性或相关性"},{"label":"D","html":"解决算法可问责性问题"},{"label":"E","html":"加强公众监督"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：维护算法消费者的知情权利益；B：避免和解决算法决策的错误性和歧视性；C：明晰算法决策的主体性、因果性或相关性；D：解决算法可问责性问题；E：加强公众监督”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“data06.xlsx”中的工作簿文件扩展名为（）","answer":["A"],"dataset_description":"Excel表格文件“data06.xlsx”收集了一只股票的相关信息情况。工作表Sheet1包含8个特征数据：日期、收盘、开盘、高、低、交易量、涨跌量、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p06:141","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>文件“data06.xlsx”中的工作簿文件扩展名为（） &nbsp; \u003c/p>","options":[{"label":"A","html":".xlsx"},{"label":"B","html":".xlsm"},{"label":"C","html":".xls"},{"label":"D","html":".docx"}],"explanation":{"topic":"工作簿文件扩展名","paragraphs":["题目给出的素材文件名以 .xlsx 结尾，因此扩展名是 .xlsx，选 A。",".xlsm 是启用宏的工作簿，.xls 是旧版工作簿，.docx 是 Word 文档；不能把它们与当前素材的实际扩展名混同。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data06.xlsx","href":"../materials/p06/data06.xlsx"}]},{"number":142,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":2,"question":"假如文件\"data06.xlsx\"的工作表\"Sheet1\"中A列的日期数据为按天递增的，要实现手动输入，可以采用如下哪个方法来方便快捷地实现要求？","answer":["D"],"dataset_description":"Excel表格文件“data06.xlsx”收集了一只股票的相关信息情况。工作表Sheet1包含8个特征数据：日期、收盘、开盘、高、低、交易量、涨跌量、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p06:142","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>假如文件&quot;data06.xlsx&quot;的工作表&quot;Sheet1&quot;中A列的日期数据为按天递增的，要实现手动输入，可以采用如下哪个方法来方便快捷地实现要求？\u003c/p>","options":[{"label":"A","html":"逐个输入每个日期，手动调整日期格式"},{"label":"B","html":"在 Excel 中使用数据验证功能，逐个输入每个日期，然后自动转换为日期格式"},{"label":"C","html":"将日期数据逐个输入在文本文件中，并使用 Excel 的“导入数据”功能批量导入数据"},{"label":"D","html":"在 Excel 中使用自动填充功能来快速填充多行日期数据"}],"explanation":{"topic":"自动填充连续日期","paragraphs":["先输入起始日期，可再输入次日以确定步长，选中后拖动填充柄；也可在填充选项中选择“填充天数”。因此选使用自动填充的 D。","单纯复制同一个日期只会重复原值，需要确认生成的是按天变化的日期序列。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data06.xlsx","href":"../materials/p06/data06.xlsx"}]},{"number":143,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":3,"question":"文件“data06.xlsx”中的“Sheet1”中“收盘”的标准差、最值为（）。","answer":["C"],"dataset_description":"Excel表格文件“data06.xlsx”收集了一只股票的相关信息情况。工作表Sheet1包含8个特征数据：日期、收盘、开盘、高、低、交易量、涨跌量、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p06:143","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>文件“data06.xlsx”中的“Sheet1”中“收盘”的标准差、最值为（）。\u003c/p>","options":[{"label":"A","html":"标准差：37.13，最值为：166.37，9.99"},{"label":"B","html":"标准差：38.18，最值为：156.37，10.01"},{"label":"C","html":"标准差：37.13，最值为：156.37，9.99"},{"label":"D","html":"标准差：38.18，最值为：166.37，10.01"}],"explanation":{"topic":"收盘价的样本标准差与最值","paragraphs":["收盘价位于 B 列，数据区域 B2:B868。用 =STDEV.S(B2:B868)、=MAX(B2:B868)、=MIN(B2:B868)，分别约37.13、156.37、9.99，选 C。","样本标准差用 n−1 作方差分母，STDEV.P 使用 n；两者口径不能直接混用。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data06.xlsx","href":"../materials/p06/data06.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"data06.xlsx\"的工作表\"Sheet1\"中，请使用COUNTA函数计算C列中所有非空单元格的数量，所使用公式和结果正确的是？","answer":["A"],"dataset_description":"Excel表格文件“data06.xlsx”收集了一只股票的相关信息情况。工作表Sheet1包含8个特征数据：日期、收盘、开盘、高、低、交易量、涨跌量、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p06:144","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>在文件&quot;data06.xlsx&quot;的工作表&quot;Sheet1&quot;中，请使用COUNTA函数计算C列中所有非空单元格的数量，所使用公式和结果正确的是？\u003c/p>","options":[{"label":"A","html":"=COUNTA(C:C)；868"},{"label":"B","html":"=COUNTA(C)；860"},{"label":"C","html":"=COUNTA(C1:C)；868"},{"label":"D","html":"=COUNTA(C:C1)；860"}],"explanation":{"topic":"COUNTA 统计非空单元格","paragraphs":["使用 =COUNTA(C:C)，C:C 表示整列 C。素材中包含 867 个非空数据单元格和1个非空表头，因此结果是 868，选 A。","COUNTA 统计文本和数字等非空内容，COUNT 只统计数字；C 或 C1:C 都不是本题正确的完整列引用。看似空白但含公式空字符串的单元格，也可能被 COUNTA 计入。"],"tip":"COUNTA 含表头文本；COUNT 只数数字。","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data06.xlsx","href":"../materials/p06/data06.xlsx"}]},{"number":145,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":5,"question":"文件“data06.xlsx”中的“Sheet1”中将A列Date按照“年-月”的方式，重新在I列中操作，列名为“年月”，使用函数TEXT将A列中的“年月日”转换为“年月”，数据格式为“yyyy-mm”。在新的工作表中创建数据透视图，轴(类别)选择“年月”，值（平均值项）选择“开盘”，分布图为（）。","answer":["D"],"dataset_description":"Excel表格文件“data06.xlsx”收集了一只股票的相关信息情况。工作表Sheet1包含8个特征数据：日期、收盘、开盘、高、低、交易量、涨跌量、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p06:145","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>文件“data06.xlsx”中的“Sheet1”中将A列Date按照“年-月”的方式，重新在I列中操作，列名为“年月”，使用函数TEXT将A列中的“年月日”转换为“年月”，数据格式为“yyyy-mm”。在新的工作表中创建数据透视图，轴(类别)选择“年月”，值（平均值项）选择“开盘”，分布图为（）。\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYMAAADtCAIAAADSj47bAAAAAXNSR0IArs4c6QAAIABJREFUeAHtvedb28q+sL3/uOz18Zz9PNd13vOsRUJWGhCKAdM7mI7pvfcSeu8lQEzHpvfeQigGg23cpfdKhjVbGctjSLzKXvn5QzL6aWYk3RrdGkkj8Q8WfkAACACBP5vAP/7sFYDlAwEgAARYMBE0AiAABP58AmCiP38fwBoAASAAJoI2AASAwJ9P4CsTMQzz8ePHra0ttVqNVk0ulx98+V1cXPz5KwtrAASAwN+UwFcmGhgYcHZ2FgqF9vb2SqWSZdnY2FiPL7/S0tK/KQHYLCAABP58Al+ZSKvVGgwGvV7v5OS0vr7OsqxYLP7z1xHWAAgAgb87ga9MhDZWrVa/ePHi/PycZdm4uDixWJyRkbGzs0NBoVarP8IPCAABIEAlQHEIaSKdTpeQkNDS0oLKnJ+fHx4eDgwMuLq6Go1GSxVpNJpz+AEBIAAEqAQsCYRlvx5PZDAYKioqkpKSTCYTt4zJZHJxccG3sbmzIA0EgAAQ+H4CX/WJmpqanJycGr/8tra2bm5ugoODx8fHo6OjExISvn9hUAMQAAJAgJfAVya6uLjY+u13fX3NMMz+/v7k5OTW1pZWq+UtD0EgAASAwPcT+MpE318d1AAEgAAQ+AYCYKJvgAZFgAAQsDEBMJGNgUJ1QAAIfAMBMNE3QIMiQAAI2JgAmMjGQKE6IAAEvoEAmOgboEERIAAEbEwATGRjoFAdEAAC30AATPQN0KAIEAACNiYAJrIxUKgOCACBbyAAJvoGaFAECAABGxP4+5hoeP6iY+K0Y+L04YRQ/guF7uFFfsycCNT4svzH3Pz/iK1G   const PREFIX='excel-practice:v1:';
  function same(a,b){return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&[...a].sort().join('|')===[...b].sort().join('|');}
  function grade(questions,answers){
    const details=questions.map(q=>{const selected=Array.isArray(answers[q.id])?answers[q.id]:[];return {id:q.id,selected,correct:same(selected,q.answer),blank:selected.length===0};});
    const correct=details.filter(x=>x.correct).length,blank=details.filter(x=>x.blank).length;
    return {total:details.length,correct,blank,incorrect:details.length-correct-blank,score:details.length?Math.round(correct/details.length*10000)/100:0,details,wrongIds:details.filter(x=>!x.correct).map(x=>x.id)};
  }
  function updateWrongs(existing,questions,answers,now){
    const result=JSON.parse(JSON.stringify(existing||{}));
    for(const d of grade(questions,answers).details){
      const old=result[d.id];
      if(d.correct){if(old)result[d.id]={...old,masteredAt:now,lastReviewed:now,reviews:(old.reviews||0)+1};}
      else result[d.id]={id:d.id,wrongCount:(old?.wrongCount||0)+1,firstWrong:old?.firstWrong||now,lastWrong:now,lastReviewed:now,reviews:(old?.reviews||0)+1,masteredAt:null,lastSelection:d.selected};
    }
    return result;
  }
  function validAnswers(questions,answers){const out={};for(const q of questions){const allowed=new Set(q.options.map(o=>o.label));let selected=Array.isArray(answers?.[q.id])?[...new Set(answers[q.id])].filter(x=>allowed.has(x)):[];if(q.type!=='多选题')selected=selected.slice(0,1);if(selected.length)out[q.id]=selected;}return out;}
  return {PREFIX,same,grade,updateWrongs,validAnswers};
});

function startStudy(ids){if(!ids.length){toast('暂无可背的题目');return;}studying=true;studyIds=ids;const saved=read('study:'+scope,null);studyIndex=saved&&ids.includes(saved.id)?ids.indexOf(saved.id):0;studyReveal=true;renderStudy();window.scrollTo(0,0);}
function studyMove(n){studyIndex=Math.max(0,Math.min(studyIds.length-1,n));write('study:'+scope,{id:studyIds[studyIndex],at:Date.now()});renderStudy();window.scrollTo(0,0);}
function renderStudy(){const q=all[studyIds[studyIndex]];write('study:'+scope,{id:q.id,at:Date.now()});root.innerHTML=`<div class="shell"><header class="quiz-head"><div class="quiz-head-row"><div><div class="quiz-title">${esc(q.paperTitle)} · 背题模式</div><div class="quiz-meta">第 ${studyIndex+1} / ${studyIds.length} 题 · 背题不计分，不改变考试进度或错题状态</div></div><button class="btn small" data-action="intro">退出背题</button></div><div class="progress-track"><span style="width:${(studyIndex+1)/studyIds.length*100}%"></span></div></header><main class="question-wrap">${notice()}<div class="q-label"><span class="number">${q.number}</span><span class="pill">${esc(q.type)}</span></div><div class="q-source">${esc(q.book)} 第 ${q.chapter} 章</div>${q.dataset_description?`<details class="dataset"><summary>操作题说明与 Excel 素材</summary><p>${esc(q.dataset_description)}</p>${q.attachments.map(a=>`<a download href="${esc(a.href)}">下载 ${esc(a.name)} ↗</a>`).join('')}</details>`:''}<section class="question-text">${q.question_html}</section><div class="options">${q.options.map(o=>`<div class="option ${studyReveal&&q.answer.includes(o.label)?'is-correct':''}"><span class="option-letter">${esc(o.label)}</span><div class="option-content">${o.html}</div>${studyReveal&&q.answer.includes(o.label)?'<span class="option-tag">正确选项</span>':''}</div>`).join('')}</div><button class="btn" data-action="study-reveal">${studyReveal?'隐藏答案和解析 · 自测':'显示答案和解析'}</button>${studyReveal?`<div class="review-note"><b>${q.explanation?.warning?'原站答案（请看核对提示）':'正确答案'}：${q.answer.join('、')}</b></div>${explanation(q)}`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="study-prev" ${studyIndex===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="study-grid">背题目录</button><button class="btn primary" data-action="study-next" ${studyIndex===studyIds.length-1?'disabled':''}>下一题</button></nav>`;}

function exportProgress(){const backup={format:'excel-practice-backup',version:1,createdAt:Date.now(),entries:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(P))backup.entries[k.slice(P.length)]=JSON.parse(localStorage.getItem(k));}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Excel刷题进度与错题备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出，可保存到手机文件');}
async function importProgress(file){try{if(!file||file.size>10000000)throw Error('备份文件过大或未选择');const b=JSON.parse(await file.text());if(b.format!=='excel-practice-backup'||b.version!==1||!b.entries||typeof b.entries!=='object')throw Error('这不是本程序的备份文件');const checked={};for(const [k,v] of Object.entries(b.entries)){if(k==='wrongs'){if(!v||Array.isArray(v)||typeof v!=='object')throw Error('错题数据格式不正确');checked[k]={};for(const [id,w] of Object.entries(v)){if(!all[id]||w?.id!==id||!Number.isFinite(w.wrongCount)||w.wrongCount<1)throw Error('备份包含未知题目');checked[k][id]={id,wrongCount:w.wrongCount,firstWrong:Number(w.firstWrong)||Date.now(),lastWrong:Number(w.lastWrong)||Date.now(),lastReviewed:Number(w.lastReviewed)||Date.now(),reviews:Number(w.reviews)||0,masteredAt:w.masteredAt?Number(w.masteredAt):null,lastSelection:Array.isArray(w.lastSelection)?w.lastSelection.filter(x=>all[id].options.some(o=>o.label===x)):[]};}}else if(k.startsWith('study:')&&(papers.some(p=>k==='study:'+p.id)||k==='study:all-wrongs')){if(!v||!all[v.id])throw Error('背题进度格式不正确');checked[k]={id:v.id,at:Number(v.at)||Date.now()};}else if(k.startsWith('session:')&&(papers.some(p=>k==='session:'+p.id)||k==='session:all-wrongs')){if(v===null)continue;const s=safeState(v);if(!s)throw Error('作答进度格式不正确');checked[k]=s;}else if(k.startsWith('history:')&&(papers.some(p=>k==='history:'+p.id)||k==='history:all-wrongs')){if(!Array.isArray(v)||v.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100||!Number.isFinite(x.total)))throw Error('成绩记录格式不正确');checked[k]=v.slice(0,20);}}
pendingImport=checked;showDialog('导入备份',`<p>将导入 ${Object.keys(checked.wrongs||{}).length} 道错题历史，并恢复备份中的作答进度。</p><p class="muted">备份中的同名记录会覆盖当前记录。建议先导出当前备份。</p>`,'<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-import">确认导入</button>');}catch(e){toast('无法导入：'+e.message);}}
let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
