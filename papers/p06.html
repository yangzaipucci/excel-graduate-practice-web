\u003cp>\u003cspan>数据图形数据属性只有数值属性和分类属性\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":11,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"在数据分析阶段，多次调整分析模型、参数或方法，以找到最适合当前数据集的分析方案（  ）。","answer":["A"],"dataset_description":null,"id":"p06:11","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>在数据分析阶段，多次调整分析模型、参数或方法，以找到最适合当前数据集的分析方案\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"模型迭代与验证","paragraphs":["分析往往要根据诊断结果调整模型、参数、特征或方法，反复比较，以寻找适合问题和数据的方案。题干描述了这种迭代过程，所以判对。","但不能只追求当前训练集拟合最好：还应使用独立验证集或交叉验证，避免反复调参造成过拟合。"],"warning":""},"attachments":[]},{"number":12,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"物流运输、仓储、配送数据有助于企业掌握物流动态，优化物流流程，降低物流成本，属于企业外部数据（  ）。","answer":["B"],"dataset_description":null,"id":"p06:12","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>物流运输、仓储、配送数据有助于企业掌握物流动态，优化物流流程，降低物流成本，属于企业外部数据\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":13,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"居民消费价格指数不属于宏观经济数据（  ）。","answer":["B"],"dataset_description":null,"id":"p06:13","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>居民消费价格指数不属于宏观经济数据\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"居民消费价格指数","paragraphs":["CPI 衡量居民消费品和服务价格水平的变动，常用于分析通货膨胀和居民购买力，是典型宏观经济指标。","题干说它“不属于宏观经济数据”，否定了其实际用途，因此错误。"],"warning":""},"attachments":[]},{"number":14,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"相对指标和平均指标必须通过总量指标计算（  ）。","answer":["B"],"dataset_description":null,"id":"p06:14","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>相对指标和平均指标必须通过总量指标计算\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":15,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"定比尺度是测量层次中最高的一种且没有绝对的零点（  ）。","answer":["B"],"dataset_description":null,"id":"p06:15","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>定比尺度是测量层次中最高的一种且没有绝对的零点\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":16,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"定类变量的各类别间是不平等的,有高低、大小、优劣之分（  ）。","answer":["B"],"dataset_description":null,"id":"p06:16","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>定类变量的各类别间是不平等的,有高低、大小、优劣之分\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":17,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"公司产品价格是绝对指标（  ）。","answer":["B"],"dataset_description":null,"id":"p06:17","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>公司\u003c/span>\u003cspan>产品价格\u003c/span>\u003cspan>是绝对指标\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"非参数统计依赖总体分布（  ）。","answer":["B"],"dataset_description":null,"id":"p06:18","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>非参数统计依赖总体分布\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"多段抽样是先将调查总体各单位按一定标志分成若干组，作为抽样的第一级单位。然后将第一级组又分成若干小的组，作为抽样的第二级单位。依此类推，还可分为第三级、第四级单位（  ）。","answer":["A"],"dataset_description":null,"id":"p06:19","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>多段抽样是先将调查总体各单位按一定标志分成若干组，作为抽样的第一级单位。然后将第一级组又分成若干小的组，作为抽样的第二级单位。依此类推，还可分为第三级、第四级单位（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"判断抽样的优点是抽样误差小（  ）。","answer":["B"],"dataset_description":null,"id":"p06:20","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>判断抽样的\u003c/span>\u003cspan>优点是抽样误差小\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"反映总体内部集中程度的统计量是变异系数（  ）。","answer":["B"],"dataset_description":null,"id":"p06:21","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>反映\u003cspan>总体\u003c/span>内部\u003cspan>集中\u003c/span>程度的统计量\u003cspan>是\u003c/span>变异系数\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"非参数统计方法无需假定总体分布（  ）。","answer":["A"],"dataset_description":null,"id":"p06:22","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>非参数统计方法无需假定总体分布\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"研究人口的收入状况时,按身份证号码的排列顺序与所研究的内容有关。","answer":["B"],"dataset_description":null,"id":"p06:23","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>研究人口的收入状况时,按身份证号码的排列顺序与所研究的内容有关\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"卡方分布曲线形状与自由度无关（ ）。","answer":["B"],"dataset_description":null,"id":"p06:24","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>卡方分布曲线形状与自由度无关\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"变异性是指构成总体的单位在同质性之外的其他方面要有差异（  ）。","answer":["A"],"dataset_description":null,"id":"p06:25","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>变异性是指构成总体的单位在同质性之外的其他方面要有差异（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本均值分布的数学期望恰好等于总体方差（  ）。","answer":["B"],"dataset_description":null,"id":"p06:26","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>样本均值分布的数学期望恰好等于总体方差（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"来自于同一个总体的样本，抽取的样本不同，统计量就不同（  ）。","answer":["A"],"dataset_description":null,"id":"p06:27","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>来自于\u003c/span>同一个总体\u003cspan>的样本\u003c/span>，抽取的样本不同，统计量就不同\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"卡方检验不依赖样本数量（ ）。","answer":["B"],"dataset_description":null,"id":"p06:28","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>卡方检验不依赖样本数量\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"正确的归纳要求从总体中选出的样本必须足够大而且具有代表性（ ）。","answer":["A"],"dataset_description":null,"id":"p06:29","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>正确的归纳要求从总体中选出的样本必须足够大而且具有代表性（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"不拒绝备选假设是因为难以获得所有样本（ ）。","answer":["B"],"dataset_description":null,"id":"p06:30","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>不拒绝备选假设是因为难以获得所有样本（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"区间估计的可靠程度越大估计的精确程度越低（ ）。","answer":["A"],"dataset_description":null,"id":"p06:31","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>区间估计的可靠程度越大估计的精确程度越低（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"无论F检验的原假设是小于等于还是大于等于，拒绝域都在左侧（ ）。","answer":["B"],"dataset_description":null,"id":"p06:32","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>无论F检验的原假设是小于等于还是大于等于，拒绝域都在左侧（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"参数估计属于统计推断（ ）。f","answer":["A"],"dataset_description":null,"id":"p06:33","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>参数估计属于统计推断（ ）\u003c/span>\u003cspan>。f\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"云计算具有高可靠性,不存在系统危险性（ ）。","answer":["B"],"dataset_description":null,"id":"p06:34","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>云计算具有高可靠性,不存在系统危险性\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":35,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据难以处理是因为其复杂性和多样性（ ）。","answer":["A"],"dataset_description":null,"id":"p06:35","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>大数据难以处理是因为其复杂性和多样性\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":36,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据精准营销需要依赖专业的平台提供数据支撑（ ）。","answer":["A"],"dataset_description":null,"id":"p06:36","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>大数据精准营销需要依赖专业的平台提供数据支撑\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":37,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"降维是将训练样本从低维空间转换到高维空间（  ）。","answer":["B"],"dataset_description":null,"id":"p06:37","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>降维是将训练样本从低维空间转换到高维空间\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"降维与特征表示","paragraphs":["降维将高维特征映射或筛选为较少维度，在尽量保留重要结构和信息的同时降低冗余、噪声与计算成本。通常是高维到低维，而不是反过来扩维。","特征选择保留原特征的子集；特征提取构造新特征，如主成分分析以方差方向构造线性组合。降维一般存在信息取舍，不能保证毫无信息损失或必然提高所有模型准确率。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"降维减少特征维度；选择保留原列，提取产生新列。","source":""},"attachments":[]},{"number":38,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"整数线性规划的最优解一定在顶点上达到（ ）。","answer":["B"],"dataset_description":null,"id":"p06:38","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>整数线性规划的最优解一定在顶点上达到（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":39,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"CART决策树用信息熵来划分属性（  ）。","answer":["B"],"dataset_description":null,"id":"p06:39","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>CART决策树用信息熵来划分属性\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"回归方程的决定系数取值在［-1,1］之间（ ）。","answer":["B"],"dataset_description":null,"id":"p06:40","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>回归方程的\u003c/span>\u003cspan>决定系数取值在［-1,1］之间\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"电子表格（excel）具有非常强大的功能，最突出的功能是（   ）。","answer":["D"],"dataset_description":null,"id":"p06:41","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>电子表格（excel）具有非常强大的功能，最突出的功能是（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"处理文档。"},{"label":"B","html":"制作表格。"},{"label":"C","html":"数据库管理。"},{"label":"D","html":"处理表格数据。"}],"explanation":{"topic":"Excel 单元格、文件与基本操作","paragraphs":["Excel 的 A1 引用方式以字母表示列、数字表示行，例如 D4 表示第4列第4行，连续区域用冒号连接。现代 .xlsx 工作表共有1,048,576行、16,384列。","日期通常以序列数保存，显示格式只改变外观；时间是一天的小数部分，显示文本与真实日期值需区分。自动填充可快速生成日期序列。",".xlsx 是常见无宏工作簿格式，.xlsm 可保存宏，.xls 为旧格式。CSV/TXT 适合平面文本数据，通常不能完整保留多工作表、图表和格式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：处理表格数据。”。"],"tip":"列字母、行数字；显示格式和单元格实际值分开看。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[]},{"number":42,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"曲线图是利用曲线的升降起伏来反映事物的变化,以下关于曲线图正确的描述是(   )。","answer":["B"],"dataset_description":null,"id":"p06:42","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>曲线图是利用曲线的升降起伏来反映事物的变化,以下关于曲线图正确的描述是( &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"非常间接反映事物的趋势变化。"},{"label":"B","html":"能够描述不同时期的发展水平及发展规律。"},{"label":"C","html":"通常需要较多的文字描述。"},{"label":"D","html":"仅能容纳较少历史信息。"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：能够描述不同时期的发展水平及发展规律。”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":43,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下面关于数据分析的基本步骤的描述，正确的是（  ）","answer":["D"],"dataset_description":null,"id":"p06:43","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下面关于数据分析的基本步骤的描述，正确的是（ &nbsp;）\u003c/span>\u003c/p>","options":[{"label":"A","html":"收集数据、处理数据、制作数据图表。"},{"label":"B","html":"确定问题、收集数据、处理数据、制作数据图表。"},{"label":"C","html":"确定问题、处理数据、制作数据图表，依据数据图表分析得出结论。"},{"label":"D","html":"确定问题、收集数据、处理数据，制作数据图表，依据数据图表分析得出结。"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：确定问题、收集数据、处理数据，制作数据图表，依据数据图表分析得出结。”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":44,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"业务指标可以根据维度进行类别划分，下面关于业务指标数据维度的描述,不正确的是(   )。","answer":["B"],"dataset_description":null,"id":"p06:44","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>业务指标可以根据维度进行类别划分，下面关于业务指标数据维度的描述,不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"行为数据"},{"label":"B","html":"利润数据"},{"label":"C","html":"产品数据"},{"label":"D","html":"用户数据"}],"explanation":{"topic":"本题解析","paragraphs":["本题采用用户、行为、产品三个业务数据维度，利润是经营结果或财务指标，不是这一框架的并列维度，所以选 B。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"行为是本题采用的业务数据维度。"},{"label":"B","selected":true,"reason":"利润属于经营结果或财务指标，不是本题三维框架中的并列维度。"},{"label":"C","selected":false,"reason":"产品是本题采用的业务数据维度。"},{"label":"D","selected":false,"reason":"用户是本题采用的业务数据维度。"}]} uestion_html":"\u003cp>\u003cspan>一些企业可以从报纸，杂志，互联网等媒体上收集行业数据,下述哪类企业可能无法通过这种方式收集数据。（ &nbsp; &nbsp;）\u003c/span>\u003c/p>","options":[{"label":"A","html":"旅游企业"},{"label":"B","html":"电影院"},{"label":"C","html":"餐饮企业"},{"label":"D","html":"安保企业"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：安保企业”。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"用图表对数据进行图形化展示时,如果数据具有明显变化趋势特点，需要选择（   ）。","answer":["B"],"dataset_description":null,"id":"p06:48","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>用图表对数据进行图形化展示时,如果数据具有明显变化趋势特点，需要选择（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"柱状图"},{"label":"B","html":"折线图"},{"label":"C","html":"饼图"},{"label":"D","html":"雷达图"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：折线图”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"企业从其行业协会收集的资料，称为（    ）资料。","answer":["C"],"dataset_description":null,"id":"p06:49","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>企业从其行业协会收集的资料，称为（ &nbsp; &nbsp;）资料。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>直接\u003c/p>"},{"label":"B","html":"\u003cp>一手\u003c/p>"},{"label":"C","html":"\u003cp>二手\u003c/p>"},{"label":"D","html":"\u003cp>公共\u003c/p>"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：二手”。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"指标按其所表明的业务性质不同，可分为（   ）。","answer":["B"],"dataset_description":null,"id":"p06:50","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>指标按其所表明的业务性质不同，可分为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"单个指标和总指标"},{"label":"B","html":"数量指标和质量指标"},{"label":"C","html":"定基指标和环比指标"},{"label":"D","html":"平均指标和总指标"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：数量指标和质量指标”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"下列变量中,属于定性变量的是（   ）。","answer":["A"],"dataset_description":null,"id":"p06:51","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列变量中,属于定性变量的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"人口性别"},{"label":"B","html":"年末总人口"},{"label":"C","html":"进出口量"},{"label":"D","html":"财政收入"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：人口性别”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"以下属于位置平均数的是（   ）。","answer":["A"],"dataset_description":null,"id":"p06:52","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下属于位置平均数的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"众数"},{"label":"B","html":"极差"},{"label":"C","html":"几何平均数"},{"label":"D","html":"算术平均数"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：众数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"数量指标和质量指标的根本区别在于 (    )。","answer":["D"],"dataset_description":null,"id":"p06:53","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>数量指标和质量指标的根本区别在于 ( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"使用领域不同"},{"label":"B","html":"数量大小不同"},{"label":"C","html":"统计单位不同"},{"label":"D","html":"反映的总体数量特征的性质不同"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：反映的总体数量特征的性质不同”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"分层抽样是将抽样单位按某种特征划分为不同的组，以下不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p06:54","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>分层抽样是将抽样单位按某种特征划分为不同的组，以下不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>从不同的组中独立抽取样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>将不同的组抽出的样本组成一个总的抽样样本\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>从不同的组中随机地抽取样本\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>随机抽取几个组群组成一个总的抽样样本\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：随机抽取几个组群组成一个总的抽样样本”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于t分布下列说法错误的是（ ）。","answer":["D"],"dataset_description":null,"id":"p06:55","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于t分布下列说法错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>当自由度n趋向无穷大，t分布趋向标准标准正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布是一簇曲线\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>自由度相同时，t的绝对值越大，概率P越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan> t分布是以1为中心、左右对称的单峰曲线\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：t分布是以1为中心、左右对称的单峰曲线”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"统计包括三个含义，以下不属于统计领域的是（  ）。","answer":["D"],"dataset_description":null,"id":"p06:56","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>统计包括三个含义，以下不属于统计领域的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>统计科学\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>统计资料\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>统计工作\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>统计方法\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计的三个含义","paragraphs":["教材通常将统计概括为统计工作、统计资料和统计科学三个相互联系的含义。工作产生资料，科学研究统计理论与方法。","统计方法属于统计科学的内容，不是这三个并列含义之一，所以此题选 D；不是说方法不属于广义统计领域。"],"warning":""},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本容量与抽样误差的关系是（   ）。","answer":["C"],"dataset_description":null,"id":"p06:57","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>样本容量与抽样误差的关系是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"正比"},{"label":"B","html":"反比"},{"label":"C","html":"反向"},{"label":"D","html":"相等"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：反向”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于抽样误差的论述错误的是（ ）。","answer":["B"],"dataset_description":null,"id":"p06:58","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于抽样误差的论述错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样不可避免会出现抽样误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>从同一总体抽取不同样本，样本平均值之间的差别是抽样误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样误差产生的根源在于个体变异\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样误差可以控制\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：从同一总体抽取不同样本，样本平均值之间的差别是抽样误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"组成总体的每个元素称为（   ）。","answer":["B"],"dataset_description":null,"id":"p06:59","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>组成总体的每个元素称为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"总体"},{"label":"B","html":"个体"},{"label":"C","html":"变量"},{"label":"D","html":"样本"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：个体”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于抽样人员确定样本量大小说法不正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p06:60","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于抽样人员确定样本量大小说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体的量越大，需要样本量越大\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>可用资金越少，样本量越大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>可容忍误差增大，样本量减少\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>可靠程度越高，样本量越大\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：可用资金越少，样本量越大”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"标准正态分布的平均数与标准差分别为（ ）。","answer":["A"],"dataset_description":null,"id":"p06:61","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>标准正态分布的平均数与标准差分别为（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>0与1\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>1与0\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>0与±1\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>1与1\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：0与1”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"正态总体样本均值的抽样分布是（ ）。","answer":["C"],"dataset_description":null,"id":"p06:62","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>正态总体样本均值的抽样分布是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>N (μ,σ 2 )\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>N (0,0)\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>N (μ,1/n σ 2 )\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>N (0,1)\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：N (μ,1/n σ 2 )”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于于整群抽样方法是（  ）。","answer":["C"],"dataset_description":null,"id":"p06:63","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下不属于于\u003c/span>\u003cspan>整群抽样\u003c/span>\u003cspan>方法是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>随机抽若干盒食品(每盒装有若干食品)\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>进行\u003c/span>产品检验\u003cspan>,每隔8小时抽取上一个小时生产的全部产品\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>调查高中生数学成绩，随机抽取10人\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>调查中学生患近视眼的情况，抽某一个班做统计\u003c/span>\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：调查高中生数学成绩，随机抽取10人”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于整群抽样的说法，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p06:64","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下关于\u003c/span>\u003cspan>整群抽样\u003c/span>\u003cspan>的说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>整组抽选样本单位\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>将\u003c/span>\u003cspan>总体划分为单位数目相等的若干个组\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>用不重复抽样方法抽进行组抽取\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>用重复抽样方法抽进行组抽取\u003c/span>\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：用重复抽样方法抽进行组抽取”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"“标准误”的正确解释是（ ）。","answer":["A"],"dataset_description":null,"id":"p06:65","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>“标准误”的正确解释是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>统计量的标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本率的标准差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>标准差的标准差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本均值的标准差\u003c/span>\u003c/p>"}],"explanation":{"topic":"标准误与标准差","paragraphs":["标准差描述一组观测值彼此有多分散；标准误描述一个统计量在重复抽样时有多波动，是统计量抽样分布的标准差。二者研究对象不同。","均值的标准误为 σ/√n，σ 未知时常以 s/√n 估计。其他条件相同，样本越大或总体越同质，标准误越小。样本量扩大到原来的4倍，标准误才缩小到一半。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：统计量的标准差”。"],"tip":"标准差看个体差异；标准误看估计稳定性。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":66,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布特性的描述中，不正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p06:66","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于F分布特性的描述中，不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F是一个正偏态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F是一个负偏态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F值总是大于0\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分母和分子的自由度越大，F分布越接近正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：F是一个负偏态分布”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":67,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列属于无限总体的是 (   )。","answer":["A"],"dataset_description":null,"id":"p06:67","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列属于无限总体的是 ( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"宇宙中的行星"},{"label":"B","html":"全国总人口"},{"label":"C","html":"全国工业企业"},{"label":"D","html":"某企业职工工资水平"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：宇宙中的行星”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于样本统计量的无偏性的说法，哪一个选项是正确的（    ）。","answer":["B"],"dataset_description":null,"id":"p06:68","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下面关于样本统计量的无偏性的说法，哪一个选项是正确的（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本统计量等于总体参数"},{"label":"B","html":"样本统计量均值等于总体参数均值"},{"label":"C","html":"样本统计量比例等于总体比例"},{"label":"D","html":"样本统计量均值的均值等于总体均值"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：样本统计量均值等于总体参数均值”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"偏度描述数据分布的对称性，下列说法不正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p06:69","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>偏度描述数据分布的对称性，下列说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>当偏度值 &lt; 0时，分布负偏\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>当偏度值 = 0时，分布对称\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>当偏度值 &lt; 0时，分布重心左偏\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>当偏度值 &gt; 0时，分布正偏\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：当偏度值 \u003c 0时，分布重心左偏”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"配额抽样和分层随机抽样既有相似之处，也有很大区别。以下不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p06:70","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cstrong> \u003c/strong>\u003cspan>配额抽样和\u003c/span>分层随机抽样\u003cspan>既有相似之处，也有很大区别。\u003c/span>\u003cspan>以下不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>分层抽样可由调查人员在\u003c/span>配额\u003cspan>内主观判断选定样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>按各个特征分配样本数额\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>可根据\u003c/span>\u003cspan>预先确定的属性\u003c/span>\u003cspan>分层\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>配额抽样可由调查人员在\u003c/span>配额\u003cspan>内主观判断选定样本\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：分层抽样可由调查人员在配额内主观判断选定样本”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在设计抽样方案时，要以调查的总体方案和研究目标为依据，体现了设计抽样方案原则中的（  ）。","answer":["A"],"dataset_description":null,"id":"p06:71","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>在设计抽样方案时，要以调查的总体方案和研究目标为依据，体现了设计抽样方案原则中的（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>目的性原则\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>可测性原则\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>可行性原则\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>经济型原则\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：目的性原则”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":72,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"多阶段抽样最大的缺点是(   )。","answer":["B"],"dataset_description":null,"id":"p06:72","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>多阶段抽样最大的缺点是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本分布不均匀\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样误差大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽取样本太多\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽取样本太少\u003c/span>\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：抽样误差大”。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":73,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"一所大学从全校学生中随机抽取300人作为样本进行调查，其中80%的人回答他们的月生活费支出在800元以上。这里的300人指的是（   ）概念。","answer":["B"],"dataset_description":null,"id":"p06:73","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>一所大学从全校学生中随机抽取300人作为样本进行调查，其中80%的人回答他们的月生活费支出在800元以上。这里的300人指的是（ &nbsp; ）概念。\u003c/span>\u003c/p>","options":[{"label":"A","html":"总体"},{"label":"B","html":"样本"},{"label":"C","html":"变量"},{"label":"D","html":"统计量"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：样本”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在其他条件相同的条件下,重复抽样所需的样本单位数比不重复抽样","answer":["A"],"dataset_description":null,"id":"p06:74","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>在其他条件相同的条件下,重复抽样所需的样本单位数比不重复抽样\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>多\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>少\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>相等\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>难以判\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：多”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"构成统计总体的各个单位称为（   ）。","answer":["D"],"dataset_description":null,"id":"p06:75","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>构成统计总体的各个单位称为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"调查单位"},{"label":"B","html":"特征值"},{"label":"C","html":"品质标志"},{"label":"D","html":"总体单位"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：总体单位”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于配额抽样方法应用的领域的是（  ）。","answer":["A"],"dataset_description":null,"id":"p06:76","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下不属于配额抽样方法应用的领域的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>研究大学生的高等数学成绩\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>研究年轻人及老年人的消费\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>研究团体的的领袖和普通成员\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>研究组织中的激进派和较温派成员\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：研究大学生的高等数学成绩”。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量是（  ）。","answer":["C"],"dataset_description":null,"id":"p06:77","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>样本统计量是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>确定的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>唯一的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随机变量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>确定二态变量\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：随机变量”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"抽样平均误差和抽样极限误差相比,其差值（   ）。","answer":["D"],"dataset_description":null,"id":"p06:78","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>抽样平均误差和抽样极限误差相比,其差值（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大"},{"label":"B","html":"小"},{"label":"C","html":"相等"},{"label":"D","html":"不确定"}],"explanation":{"topic":"抽样极限误差与概率度","paragraphs":["常见教材记号为 Δ=z×SE：Δ 是给定置信水平下的抽样误差界限，SE 是抽样标准误，z 是相应的概率度或临界值。三者不是互相独立的量。","固定标准误时，要求更高置信水平需要更大的 z 和更宽的误差界限；固定误差界限而提高置信水平，则要降低标准误，通常需要增大样本量。","这里的“最大误差”是对应概率保证程度的界限，并非随机抽样所有可能结果都绝对不会越界。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：不确定”。"],"tip":"误差界限=临界值×标准误。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列指标中，用于描述数据集中趋势，并且易受极端值影响的是（   ）。","answer":["A"],"dataset_description":null,"id":"p06:79","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列指标中，用于描述数据集中趋势，并且易受极端值影响的是（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"算术平均数"},{"label":"B","html":"中位数"},{"label":"C","html":"众数"},{"label":"D","html":"极差"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：算术平均数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"描述偏态分布数据集中趋势的常用统计参数是（   ）。","answer":["C"],"dataset_description":null,"id":"p06:80","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>描述偏态分布数据集中趋势的常用统计参数是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"算术平均数"},{"label":"B","html":"标准差"},{"label":"C","html":"中位数"},{"label":"D","html":"四分位数"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：中位数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"抽样误差的大小（  ）。","answer":["B"],"dataset_description":null,"id":"p06:81","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>抽样误差的大小（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>既可以避免,也可以控制\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>无法避免,但可以控制\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>无法避免,也无法控制\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>可以避免,但无法控制\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：无法避免,但可以控制”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计误差说法，正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p06:82","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于统计误差说法，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>系统误差影响稳定性,不影响准确性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>系统误差影响准确性,也影响准确性\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随机误差影响稳定性,不影响准确性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>随机误差影响稳定性,也影响准确性\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：随机误差影响稳定性,不影响准确性”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本均值抽样分布的特点有（ ）。","answer":["D"],"dataset_description":null,"id":"p06:83","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>样本均值抽样分布的特点有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本均值会随着样本容量的增大而变小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本均值会随着样本容量的增大而变大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本均值抽样分布的标准差会随着样本容量的增大而变大\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本均值抽样分布的标准差会随着样本容量的增大而变小\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：样本均值抽样分布的标准差会随着样本容量的增大而变小”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布的F值的说法中，正确的是（   ）。","answer":["A"],"dataset_description":null,"id":"p06:84","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于F分布的F值的说法中，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"F值总为正值"},{"label":"B","html":"F值可以为负值"},{"label":"C","html":"F值可以是0"},{"label":"D","html":"F分布是正态分布"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：F值总为正值”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于抽样设计方法的描述,错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p06:85","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于抽样设计方法的描述,错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>调查者可在总体中随意抽取总体中任意部分,作为样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>实行抽样时,要使总体中每个个体都有同等机会被抽\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽取的样本对总体要有代表性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>严格控制抽样有助减少误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：调查者可在总体中随意抽取总体中任意部分,作为样本”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本比例的分布具有的特征是（ ）。","answer":["B"],"dataset_description":null,"id":"p06:86","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>样本比例的分布具有的特征是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本比例的均值等于总体均值，样本比例的标准差等于总体标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本比例的均值等于总体均值，样本比例的标准差等于总体标准差除以样本容量的平方根\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本比例的均值等于总体比例，样本比例的标准差等于总体比例的标准差除以样本容量的平方\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本比例的均值等于总体比例，样本比例的标准差等于总体比例的标准差除以样本容量\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：样本比例的均值等于总体均值，样本比例的标准差等于总体标准差除以样本容量的平方根”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"从某个总体中抽取一个样本容量为10的样本，样本均值的抽样标准误为3，总体的方差等于（ ）。","answer":["A"],"dataset_description":null,"id":"p06:87","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>从某个总体中抽取一个样本容量为10的样本，样本均值的抽样标准误为3，总体的方差等于（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>90\u003c/p>"},{"label":"B","html":"\u003cp>60\u003c/p>"},{"label":"C","html":"\u003cp>80\u003c/p>"},{"label":"D","html":"\u003cp>75\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["均值标准误 SE=σ/√n。已知 SE=3、n=10，所以总体方差σ²=SE²×n=9×10=90，选 A。","注意所求是方差，不是标准差；标准差为√90。"],"warning":""},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例的分布具有的特征，以下正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p06:88","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于样本比例的分布具有的特征，以下正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本比例的均值等于总体均值,样本比例的标准差等于总体标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本比例的均值等于总体均值,样本标准差等于总体标准差除以样本容量的平方\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>所有可能的样本的比例的平均值等于总体比例\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>比例抽样分布的标准误差不可以计算\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：所有可能的样本的比例的平均值等于总体比例”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于无限总体的是（  ）。","answer":["B"],"dataset_description":null,"id":"p06:89","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>以下不属于无限总体的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>连续生产\u003cspan>的某种\u003c/span>产品\u003cspan>的生产数量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>人口数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>时间序列总体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>大海里的鱼资源数\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：人口数”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":90,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在抽样平均误差一定时，概率度值越大（ ）。","answer":["D"],"dataset_description":null,"id":"p06:90","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>在抽样平均误差一定时，概率度值越大（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样极限误差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>推断的准确性越高\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体参数越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样\u003c/span>\u003cspan>极限误差\u003c/span>\u003cspan>越大\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样极限误差与概率度","paragraphs":["常见教材记号为 Δ=z×SE：Δ 是给定置信水平下的抽样误差界限，SE 是抽样标准误，z 是相应的概率度或临界值。三者不是互相独立的量。","固定标准误时，要求更高置信水平需要更大的 z 和更宽的误差界限；固定误差界限而提高置信水平，则要降低标准误，通常需要增大样本量。","这里的“最大误差”是对应概率保证程度的界限，并非随机抽样所有可能结果都绝对不会越界。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：抽样极限误差越大”。"],"tip":"误差界限=临界值×标准误。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":91,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"某省有工业企业50万户，构成一个总体，类型为国企，私企，合营，以下属于参数的是（  ）。","answer":["A"],"dataset_description":null,"id":"p06:91","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>某省有工业企业50万户，构成一个总体，类型为国企，私企，合营，以下属于参数的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体中国企所占比例\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体容量为50万户企业\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本容量为100户企业\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>在100户企业中，国企所占比例\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：总体中国企所占比例”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下述关于协方差的描述，错误的是（   ）。","answer":["B"],"dataset_description":null,"id":"p06:92","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下述关于协方差的描述，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>协方差为正表示两个变量同向变化\u003c/p>"},{"label":"B","html":"\u003cp>协方差为零说明两个变量相互独立\u003c/p>"},{"label":"C","html":"\u003cp>协方差为负表示两个变量反向变化\u003c/p>"},{"label":"D","html":"\u003cp> 协方差的数值大小受变量量纲影响\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：协方差为零说明两个变量相互独立”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"统计归纳容易出现下列哪种错误（   ）。","answer":["D"],"dataset_description":null,"id":"p06:93","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>统计归纳容易出现下列哪种错误（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"违背事实"},{"label":"B","html":"前后矛盾"},{"label":"C","html":"因果倒置"},{"label":"D","html":"以偏概全"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：以偏概全”。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在卡方检验中,下面关于原假设的说法，正确的是(   )。","answer":["B"],"dataset_description":null,"id":"p06:94","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>在卡方检验中,下面关于原假设的说法，正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据总体是正态的"},{"label":"B","html":"数据X与Y间是独立的"},{"label":"C","html":"组与组的总体均值相等"},{"label":"D","html":"数据X与Y之间无线性相关"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：数据X与Y间是独立的”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":95,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于显著性水平，以下表述错误的是（   ）。","answer":["D"],"dataset_description":null,"id":"p06:95","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于显著性水平，以下表述错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"假设检验事先规定的小概率标准"},{"label":"B","html":"取值愈大，则冒无显著性差异而被错判为显著性差异的风险也愈大"},{"label":"C","html":"实际上是犯第一类错误的概率"},{"label":"D","html":"就是临界值——检验接受域和拒绝域的分界点"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：就是临界值——检验接受域和拒绝域的分界点”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":96,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于Z检验和T检验的概念区别，错误的是（    ）。","answer":["B"],"dataset_description":null,"id":"p06:96","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下列关于Z检验和T检验的概念区别，错误的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":" T检验主要用于样本含量较小(例如n&lt;30)，总体标准差σ未知的正态分布总体"},{"label":"B","html":"Z检验是均值差异检验方法，T检验不是"},{"label":"C","html":"T分布是Z分布的小样本分布，当样本量增大时，样本分布逐渐向Z分布趋近"},{"label":"D","html":"Z检验是一般用于大样本(即样本容量大于30)下，比较两个均值的差异是否显著"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：Z检验是均值差异检验方法，T检验不是”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":97,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"如果样本个数为n，以下关于卡方检验的自由度（df）的说法,正确的是(    )。","answer":["D"],"dataset_description":null,"id":"p06:97","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>如果样本个数为n，以下关于卡方检验的自由度（df）的说法,正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"做适合度检验时，df = n-1"},{"label":"B","html":"对一个3×4列联表进行检验时，df = 11"},{"label":"C","html":"对2×2列联表进行检验时，df = 4"},{"label":"D","html":"对2×2列联表检验时，df=1"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：对2×2列联表检验时，df=1”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":98,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于显著性水平,以下表述错误的是（   ）。","answer":["D"],"dataset_description":null,"id":"p06:98","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>关于显著性水平,以下表述错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"假设检验事先规定的小概率标准"},{"label":"B","html":"取值愈大,则冒无显著性差异而被错判为显蓍性差异的风险也怠大"},{"label":"C","html":"实际上是犯第—类错误的概率"},{"label":"D","html":"就是临界值—检验接受域和拒绝域的分界点"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：就是临界值—检验接受域和拒绝域的分界点”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":99,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"通过样本信息来推断总体特征就叫统计推断,下述哪个选项是统计推断的两个重要方面（   ）。","answer":["C"],"dataset_description":null,"id":"p06:99","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>通过样本信息来推断总体特征就叫统计推断,下述哪个选项是统计推断的两个重要方面（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"点值估计和假设检验"},{"label":"B","html":"参数估计和点值估计"},{"label":"C","html":"参数估计和假设检验"},{"label":"D","html":"点值估计和区间估计"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：参数估计和假设检验”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下述对矩估计法的表述，错误的选项是（   ）。","answer":["B"],"dataset_description":null,"id":"p06:100","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下述对矩估计法的表述，错误的选项是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"矩估计法直观，简便，不需要知道总体的分布"},{"label":"B","html":"矩估计法不需要总体原点矩的存在"},{"label":"C","html":"如果原点矩不存在，则无法使用矩估计法"},{"label":"D","html":"矩估计法可以实现对总体数学期望和方差进行估计"}],"explanation":{"topic":"矩估计与样本矩","paragraphs":["k 阶原点矩是 E(Xᵏ)，样本原点矩为 ΣXᵢᵏ/n；k 阶中心矩围绕均值计算，样本中心矩为 Σ(Xᵢ−X̄)ᵏ/n。第一阶原点矩就是样本均值，第一阶中心矩为0。","矩估计把总体矩中的未知参数与对应样本矩相等，解出参数估计。它属于点估计，不是根据“最可能产生数据”的原则选参数，后者属于极大似然估计。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：矩估计法不需要总体原点矩的存在”。"],"tip":"原点矩围绕0；中心矩围绕均值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":101,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在一个不是正态分布的总体中，如果抽取样本容量为2的样本，以下关于样本均值的说法，正确的是（  )。","answer":["A"],"dataset_description":null,"id":"p06:101","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>在一个不是正态分布的总体中，如果抽取样本容量为2的样本，\u003c/span>\u003cspan>以下关于\u003c/span>\u003cspan>样本均值\u003c/span>\u003cspan>的说法，正确的是\u003c/span>\u003cspan>（ &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>不会呈现正态分布的特征\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>一定服从\u003c/span>\u003cspan>F分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>自动服从\u003c/span>\u003cspan>正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"不能确定"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["总体非正态且 n=2 很小，不能直接依中心极限定理认定样本均值近似正态。原站选 A。","严格地说，题目条件不足以排除所有“近似正态”的可能；应记住的是“不保证正态”，不是“必定呈现某种固定非正态形状”。"],"warning":"原站 A 应按“不保证正态”的教学意图理解，A 的绝对措辞不够严谨。"},"attachments":[]},{"number":102,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于假设检验的陈述中，正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p06:102","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下面关于假设检验的陈述中，正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"假设检验中如果结果拒绝了原假设,就说明备择假设一定是对的"},{"label":"B","html":"假设检验中如果接受了原假设,则原假设就一定是对的"},{"label":"C","html":"当拒绝原假设时,只能认为接受它的根据尚不充分,而不能认为它绝对错误"},{"label":"D","html":"假设检验中如果接受了原假设,则备择假设一定错误"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：当拒绝原假设时,只能认为接受它的根据尚不充分,而不能认为它绝对错误”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"云计算包括3种类型。面向所有用户提供服务，只要是注册付费的用户都可以使用，这种云计算属于（    ）。","answer":["C"],"dataset_description":null,"id":"p06:103","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>云计算包括3种类型。面向所有用户提供服务，只要是注册付费的用户都可以使用，这种云计算属于（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"独立云"},{"label":"B","html":"私有云"},{"label":"C","html":"公有云"},{"label":"D","html":"混合云"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：公有云”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下面关于大数据特征描述，不正确的是(   )。","answer":["B"],"dataset_description":null,"id":"p06:104","paperId":"p06","paperTitle":"Excel 模拟卷 06","question_html":"\u003cp>\u003cspan>下面
