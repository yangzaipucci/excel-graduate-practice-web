实物指标（  ）。","answer":["B"],"dataset_description":null,"id":"p01:17","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>工业总产值9000亿元属于实物指标\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"统计量的方差较小,即对总体参数的估计较为精确。","answer":["A"],"dataset_description":null,"id":"p01:18","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>统计量的方差较小,即对总体参数的估计较为精确\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"利用随机数表进行抽样，不能够保证随机原则的实现。","answer":["B"],"dataset_description":null,"id":"p01:19","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>利用随机数表进行抽样，不能够\u003c/span>\u003cspan>保证\u003c/span>随机原则\u003cspan>的实现\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"总体的参数是已知的常数（  ）。","answer":["B"],"dataset_description":null,"id":"p01:20","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>总体的参数是已知的常数\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"滚雪球抽样适用于人口稀少,难以获取或不愿意配合调查的人群（  ）。","answer":["A"],"dataset_description":null,"id":"p01:21","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>滚雪球抽样\u003c/span>\u003cspan>适用于人口稀少,难以获取或不愿意配合调查的人群（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"滚雪球抽样","paragraphs":["先找到少量符合条件的对象，再请其推荐其他符合条件者，如此扩展样本。它通常用于难以建立抽样框、隐蔽或不易接触的人群。","优势是进入特殊群体较容易、能获得较深入的信息；局限是依赖关系网络，样本可能集中于某些圈子，入样概率通常未知，不能据此保证总体代表性或无偏。","“任何人群都适用、误差必然更小、可直接作严格概率推断”都超过了这种方法能保证的范围。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"滚雪球靠推荐，适合难接触群体；网络偏差要警惕。","source":""},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本距离可通过总体单位数除以样本单位数来确定。","answer":["A"],"dataset_description":null,"id":"p01:22","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>样本距离可通过总体单位数除以样本单位数来确定。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"滚雪球抽样可以获得更深入，更详细的信息（  ）。","answer":["A"],"dataset_description":null,"id":"p01:23","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>滚雪球抽样\u003c/span>\u003cspan>可以获得更深入，更详细的信息（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"滚雪球抽样","paragraphs":["先找到少量符合条件的对象，再请其推荐其他符合条件者，如此扩展样本。它通常用于难以建立抽样框、隐蔽或不易接触的人群。","优势是进入特殊群体较容易、能获得较深入的信息；局限是依赖关系网络，样本可能集中于某些圈子，入样概率通常未知，不能据此保证总体代表性或无偏。","“任何人群都适用、误差必然更小、可直接作严格概率推断”都超过了这种方法能保证的范围。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"滚雪球靠推荐，适合难接触群体；网络偏差要警惕。","source":""},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"随着样本容量的增加,样本均数的标准误越来越小（  ）。","answer":["A"],"dataset_description":null,"id":"p01:24","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>随着样本容量的增加,样本均数的标准误越来越小（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"进行抽样设计应遵循四条原则,即:目的性原则;可行性原则;经济性原则;可测性原则（  ）。","answer":["A"],"dataset_description":null,"id":"p01:25","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>进行抽样设计应遵循四条原则,即:目的性原则;可行性原则;经济性原则;可测性原则\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"多段抽样是先将调查总体各单位按一定标志分成若干组，作为抽样的第一级单位。然后将第一级组又分成若干小的组，作为抽样的第二级单位。依此类推，还可分为第三级、第四级单位（  ）。","answer":["A"],"dataset_description":null,"id":"p01:26","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>多段抽样是先将调查总体各单位按一定标志分成若干组，作为抽样的第一级单位。然后将第一级组又分成若干小的组，作为抽样的第二级单位。依此类推，还可分为第三级、第四级单位（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"抽样估计的实际误差通常都可以计算出来（  ）。","answer":["B"],"dataset_description":null,"id":"p01:27","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>抽样估计的实际误差通常都可以计算出来（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"检验统计量的值与显著性水平直接进行比较,得出是否接受原假设的结论（ ）。","answer":["B"],"dataset_description":null,"id":"p01:28","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>检验统计量的值与显著性水平直接进行比较,得出是否接受原假设的结论（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"统计归纳就是根据样本的规律推出总体的一些性质（ ）。","answer":["A"],"dataset_description":null,"id":"p01:29","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>统计归纳就是根据样本的规律推出总体的一些性质（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"F统计量的计算公式中分子自由度和分母自由度的顺序是不固定的（ ）。","answer":["B"],"dataset_description":null,"id":"p01:30","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>F统计量的计算公式中分子自由度和分母自由度的顺序是不固定的\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"非参数检验不需要假定总体的分布形态，直接利用样本数据对总体分布形态进行推断，对总体的分布进行检验（ ）。","answer":["A"],"dataset_description":null,"id":"p01:31","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>非参数检验不需要假定总体的分布形态，直接利用样本数据对总体分布形态进行推断，对总体的分布进行检验\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"矩估计是一种用样本矩估计总体矩的点估计方法（ ）。","answer":["A"],"dataset_description":null,"id":"p01:32","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>矩估计是一种用样本矩估计总体矩的点估计方法（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"贝叶斯估计是把待估计的参数看成是确定性的量（ ）。","answer":["B"],"dataset_description":null,"id":"p01:33","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>贝叶斯估计是把待估计的参数看成是确定性的量（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"极大似然与贝叶斯估计","paragraphs":["极大似然估计把已观测样本固定，选择使似然 L(θ)=∏f(xᵢ;θ) 最大的参数。通常取对数把连乘变为连加，再求导、检查边界和极值。它并不等于“让参数本身的概率最大”。","贝叶斯估计为参数赋予先验分布，再用数据得到后验分布：后验∝似然×先验。频率学派常把参数视为固定未知量，贝叶斯方法则以概率分布表达对参数的不确定性。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"极大似然：固定数据选参数；贝叶斯：先验+数据→后验。","source":""},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据中的数据都是结构化的数据（ ）。","answer":["B"],"dataset_description":null,"id":"p01:34","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>大数据中的数据都是结构化的数据\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":35,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"云计算的“SaaS“模型属于软件即服务层次（ ）。","answer":["A"],"dataset_description":null,"id":"p01:35","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>云计算的“SaaS“模型属于软件即服务层次\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":36,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"虚拟化的内容要比云计算大得多（ ）。","answer":["B"],"dataset_description":null,"id":"p01:36","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>虚拟化的内容要比云计算大得多（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":37,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"相关系数可以反映正相关和负相关（  ）。","answer":["A"],"dataset_description":null,"id":"p01:37","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>相关系数可以反映正相关和负相关（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"协方差与相关系数","paragraphs":["协方差 Cov(X,Y)=E[(X−EX)(Y−EY)] 表示共同变化方向，但大小受单位影响。相关系数 r=Cov(X,Y)/(σXσY) 消除量纲，范围在−1到1之间，绝对值越大表示线性相关越强。","r>0 为同向，r\u003c0 为反向，r≈0 只表示线性关系弱，并不排除非线性关系，更不能推出独立；相关也不等于因果。","协方差矩阵对称，对角线是各变量方差，非对角线是成对协方差；方差非负，协方差可以为负。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"r 看符号和绝对值；相关≠因果，零相关≠没关系。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":38,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"决策树的父节点的熵大于子节点的熵（  ）。","answer":["B"],"dataset_description":null,"id":"p01:38","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>决策树的父节点的熵大于子节点的熵\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":39,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"聚类算法通常用于在不知道类别的情况下,把样本按照样本之间的相似性等分成不同的类别（  ）。","answer":["A"],"dataset_description":null,"id":"p01:39","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>聚类算法通常用于在不知道类别的情况下,把样本按照样本之间的相似性等分成不同的类别\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"聚类算法要求数据有标签,属于有监督学习（  ）。","answer":["B"],"dataset_description":null,"id":"p01:40","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>聚类算法要求数据有标签,属于有监督学习\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"聚类与 K 均值","paragraphs":["聚类是按相似性把对象分组的无监督学习，通常不依赖预先标好的类别。分类则学习已标注样本的类别规律，二者目标和训练信息不同。","K 均值先选 K 个中心，反复把样本分给最近中心，再以簇内均值更新中心，通常降低簇内平方距离和。需预先给 K，可能依赖初值、落入局部最优，对尺度和离群值敏感。","它偏好近似球状、尺度相近的数值簇，不能认为对任意形状、任意非数值数据都直接适用。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"聚类无标签；K 均值：分配→更新，初值和尺度重要。","source":""},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"要成为一名优秀的数据分析师, 需要具备一定的核心竞争力。下列说法不正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p01:41","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>要成为一名优秀的数据分析师, 需要具备一定的核心竞争力。下列说法不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"解决问题的能力"},{"label":"B","html":"数据敏感能力"},{"label":"C","html":"哲学思维能力"},{"label":"D","html":"沟通能力"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：哲学思维能力”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"numbe u003cp>\u003cspan>战略分析包括企业外部环境分析，和\u003c/span>\u003cspan>( &nbsp; )两部分。\u003c/span>\u003c/p>","options":[{"label":"A","html":"企业经营状况分析"},{"label":"B","html":"企业内部环境分析"},{"label":"C","html":"企业管理效率分析"},{"label":"D","html":"企业人力资源分析"}],"explanation":{"topic":"本题解析","paragraphs":["战略分析的两大部分是外部环境分析和内部环境分析，所以选 B。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"经营状况只是内部分析的一部分，不能代表完整的另一大部分。"},{"label":"B","selected":true,"reason":"战略分析由外部环境和内部环境两部分组成，与题干构成完整对应。"},{"label":"C","selected":false,"reason":"管理效率是内部分析的一个方面，范围过窄。"},{"label":"D","selected":false,"reason":"人力资源属于内部条件之一，不能代替全部内部环境。"}]},"attachments":[]},{"number":45,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"数据表中的每一列称为一个（   ）。","answer":["B"],"dataset_description":null,"id":"p01:45","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>数据表中的每一列称为一个（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"记录"},{"label":"B","html":"字段"},{"label":"C","html":"单元格"},{"label":"D","html":"数据"}],"explanation":{"topic":"本题解析","paragraphs":["数据表的一列描述一种属性，称为字段，如姓名、日期、销售额，因此选 B。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"记录对应一行，而题目问一列。"},{"label":"B","selected":true,"reason":"字段对应一列，表示一种属性，如姓名或日期。"},{"label":"C","selected":false,"reason":"单元格是行列交叉处，既不是整行也不是整列。"},{"label":"D","selected":false,"reason":"数据是内容的统称，不是“列”的结构名称。"}]},"attachments":[]},{"number":46,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"下列关于市场营销的核心观点,正确的是(   )。","answer":["A"],"dataset_description":null,"id":"p01:46","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于市场营销的核心观点,正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"交换活动"},{"label":"B","html":"生产活动"},{"label":"C","html":"促销活动"},{"label":"D","html":"销售活动"}],"explanation":{"topic":"本题解析","paragraphs":["营销的核心是价值交换：一方提供有价值的产品或服务，另一方提供金钱等回报，因此选 A。"],"warning":"","optionAnalysis":[{"label":"A","selected":true,"reason":"营销围绕价值交换展开，交换是其核心。"},{"label":"B","selected":false,"reason":"生产负责创造供给，不等于营销全部过程。"},{"label":"C","selected":false,"reason":"促销只是传播和推动交换的手段。"},{"label":"D","selected":false,"reason":"销售只是实现交易的环节，不能概括需求识别、价值创造等营销活动。"}]},"attachments":[]},{"number":47,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在Excel 中,下列对于日期型数据的叙述错误的是（   ）。","answer":["C"],"dataset_description":null,"id":"p01:47","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在Excel 中,下列对于日期型数据的叙述错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>日期型字符串大于或等于8个字符\u003c/p>"},{"label":"B","html":"能够将日期转换成日期型字符串"},{"label":"C","html":"日期字符串必须加引号"},{"label":"D","html":"日期字符串可以不加引号"}],"explanation":{"topic":"Excel 单元格、文件与基本操作","paragraphs":["Excel 的 A1 引用方式以字母表示列、数字表示行，例如 D4 表示第4列第4行，连续区域用冒号连接。现代 .xlsx 工作表共有1,048,576行、16,384列。","日期通常以序列数保存，显示格式只改变外观；时间是一天的小数部分，显示文本与真实日期值需区分。自动填充可快速生成日期序列。",".xlsx 是常见无宏工作簿格式，.xlsm 可保存宏，.xls 为旧格式。CSV/TXT 适合平面文本数据，通常不能完整保留多工作表、图表和格式。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：日期字符串必须加引号”。"],"tip":"列字母、行数字；显示格式和单元格实际值分开看。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在频率分布直方图中，每个小长方形的面积表示(     )。","answer":["B"],"dataset_description":null,"id":"p01:48","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在频率分布直方图中，每个小长方形的面积表示( &nbsp; &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"落在相应各组的数据的频数"},{"label":"B","html":"相应各组的频率"},{"label":"C","html":"该样本所分成的组数"},{"label":"D","html":"数据的数据个数"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：相应各组的频率”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"数据加工离不开数据变量类型，以下不是属于文本数据类型的是（  ）。","answer":["B"],"dataset_description":null,"id":"p01:49","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>数据加工离不开数据变量类型，\u003c/span>\u003cspan>以下不是属于文本数据类型的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"朋友圈的信息"},{"label":"B","html":"十字路口车流量"},{"label":"C","html":"新冠检测问题的微博讨论"},{"label":"D","html":"期末考试卷"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：十字路口车流量”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"全国粮食产量与全国人口比较,属于（   ）。","answer":["B"],"dataset_description":null,"id":"p01:50","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>全国粮食产量与全国人口比较,属于（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"平均指标"},{"label":"B","html":"强度相对指标"},{"label":"C","html":"计划完成相对指标"},{"label":"D","html":"比较相对指标"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：强度相对指标”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"下列变量中，属于定量变量的是（   ）。","answer":["B"],"dataset_description":null,"id":"p01:51","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列变量中，属于定量变量的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"性别"},{"label":"B","html":"年龄"},{"label":"C","html":"产品等级"},{"label":"D","html":"汽车品牌"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：年龄”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"指出下面的变量哪一个属于顺序变量（    ）。","answer":["B"],"dataset_description":null,"id":"p01:52","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>指出下面的变量哪一个属于顺序变量（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"每月的生活费支出"},{"label":"B","html":"产品质量的等级"},{"label":"C","html":"企业所属的行业"},{"label":"D","html":"产品的销售收入"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：产品质量的等级”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"在下列指标中，属于比较相对数指标的是（   ）。","answer":["C"],"dataset_description":null,"id":"p01:53","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在\u003c/span>\u003cspan>下列指标中，属于比较相对数指标的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"银行不良资产比率"},{"label":"B","html":"新生婴儿性别比"},{"label":"C","html":"中印两国GDP比"},{"label":"D","html":"国民经济三大产业比例"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：中印两国GDP比”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"抽签法先将总体中的个体进行编号，然后采用随机的方法任意抽取号码，所以抽签法适用于（   ）。","answer":["A"],"dataset_description":null,"id":"p01:54","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>抽签法先将总体中的个体进行编号，然后采用随机的方法任意抽取号码，所以抽签法适用于（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"简单抽样"},{"label":"B","html":"分层抽样"},{"label":"C","html":"等距抽样"},{"label":"D","html":"批量过大的抽样"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：简单抽样”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于样本均值抽样分布的描述，哪一个选项是错误的（    ）？","answer":["D"],"dataset_description":null,"id":"p01:55","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面关于样本均值抽样分布的描述，哪一个选项是错误的（ &nbsp; &nbsp;）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"抽样分布由不断抽取容量为n的样本并计算样本均值后构成"},{"label":"B","html":"均值抽样分布的均值为总体均值"},{"label":"C","html":"当样本容量充分大时，抽样分布服从近似正态分布"},{"label":"D","html":"均值抽样分布的标准差为总体标准差"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：均值抽样分布的标准差为总体标准差”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于统计总体大量性的说法，正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p01:56","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面关于统计总体大量性的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>少数单位组成\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>许多单位组成\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>个别事物也能构成总体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>要求具有绝对单位数量\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：许多单位组成”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于抽样设计方法的描述,错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p01:57","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于抽样设计方法的描述,错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>调查者可在总体中随意抽取总体中任意部分,作为样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>实行抽样时,要使总体中每个个体都有同等机会被抽\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽取的样本对总体要有代表性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>严格控制抽样有助减少误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：调查者可在总体中随意抽取总体中任意部分,作为样本”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在样本来自同一总体且计算无误的情况下，总体均数与样本均数的数值不同，可能的原因有哪些（ ）。","answer":["B"],"dataset_description":null,"id":"p01:58","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在样本来自同一总体且计算无误的情况下，\u003c/span>\u003cspan>总体均数与样本均数的数值不同，可能的原因有哪些（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本所在的总体与已知的总体不是同一个\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本所在的总体与已知的总体是同一个\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>计算错误\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：抽样误差”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"分别采用重复随机抽样和不重复随机抽样,两者样本均值的期望值（ ）。","answer":["A"],"dataset_description":null,"id":"p01:59","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>分别采用重复随机抽样和不重复随机抽样,两者样本均值的期望值（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>相等\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>有时相等,有时不等\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>前者小于后者\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>后者小于前者\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：相等”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于小样本的说法，正确的是（   ）。","answer":["B"],"dataset_description":null,"id":"p01:60","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于小样本的说法，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本容量大于30的样本"},{"label":"B","html":"样本容量小于30的样本"},{"label":"C","html":"样本容量等于30的样本"},{"label":"D","html":"样本容量小于等于30的样本"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：样本容量小于30的样本”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于多阶段抽样的是（  ）。","answer":["C"],"dataset_description":null,"id":"p01:61","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下属于多阶段抽样的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>先将总体按某种特征分成若干个“层”，再在每个层中用随机方式抽取调查对象，再将每个层所有抽取的对象合成一个样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>将抽样对象按次序编号，先随机抽取第一个调查对象，然后再按一定间隔随机抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>在大规模调查中常把抽样过程分为几个阶段，每个阶段可以使用简单随机抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>从总体中随机抽取若干群作为调查对象，然后对每个群中所有对象进行检查\u003c/span>\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：在大规模调查中常把抽样过程分为几个阶段，每个阶段可以使用简单随机抽样”。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在抽样平均误差一定时，概率度值越大（ ）。","answer":["D"],"dataset_description":null,"id":"p01:62","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在抽样平均误差一定时，概率度值越大（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样极限误差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>推断的准确性越高\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体参数越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样\u003c/span>\u003cspan>极限误差\u003c/span>\u003cspan>越大\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样极限误差与概率度","paragraphs":["常见教材记号为 Δ=z×SE：Δ 是给定置信水平下的抽样误差界限，SE 是抽样标准误，z 是相应的概率度或临界值。三者不是互相独立的量。","固定标准误时，要求更高置信水平需要更大的 z 和更宽的误差界限；固定误差界限而提高置信水平，则要降低标准误，通常需要增大样本量。","这里的“最大误差”是对应概率保证程度的界限，并非随机抽样所有可能结果都绝对不会越界。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：抽样极限误差越大”。"],"tip":"误差界限=临界值×标准误。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于协方差矩阵的说法，不正确的是（   ）。","answer":["A"],"dataset_description":null,"id":"p01:63","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于\u003c/span>\u003cspan>协方差矩阵\u003c/span>\u003cspan>的说法，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>协方差矩阵只能用于描述两个数据变量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>在矩阵的对角元素上为方差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>在矩阵的对角元素外的位置为协方差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>由方差和协方差共同组成的矩阵\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：协方差矩阵只能用于描述两个数据变量”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本均值检验统计量分布的说法，不正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p01:64","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于样本\u003c/span>\u003cspan>均值检验统计量分布\u003c/span>\u003cspan>的说法，不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体分布为正态，方差已知，无论样本容量的大小，样本均值的分布为正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体分布为正态，方差未知，样本容量大于30, 样本均值的分布为近似正态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体分布为正态，方差未知，样本容量小于30,则样本均值的分布为正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体分布为非正态或未知，样本容量大于30,则样本均值的分布为近似正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：总体分布为正态，方差未知，样本容量小于30,则样本均值的分布为正态分布”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于抽样极限误差、抽样平均误差及概率度之间关系陈述正确的有（ ）。","answer":["B"],"dataset_description":null,"id":"p01:65","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于抽样极限误差、抽样平均误差及概率度之间关系陈述正确的有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>概率度一定时,抽样平均误差越大,则极限误差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>概率度一定时,抽样平均误差越大,则极限误差越大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>极限误差一定时,抽样平均误差越大,则概率度越大\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样平均误差一定时,概率度越大,则极限误差越小\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样极限误差与概率度","paragraphs":["常见教材记号为 Δ=z×SE：Δ 是给定置信水平下的抽样误差界限，SE 是抽样标准误，z 是相应的概率度或临界值。三者不是互相独立的量。","固定标准误时，要求更高置信水平需要更大的 z 和更宽的误差界限；固定误差界限而提高置信水平，则要降低标准误，通常需要增大样本量。","这里的“最大误差”是对应概率保证程度的界限，并非随机抽样所有可能结果都绝对不会越界。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：概率度一定时,抽样平均误差越大,则极限误差越大”。"],"tip":"误差界限=临界值×标准误。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":66,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于正态分布的说法不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p01:66","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下关于正态分布的说法不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布密度函数的显著特点是中间高两边低,是一条光滑的“钟形曲线&quot;\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>正态分布距离均值越近的地方数值密集\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>正态分布是最重要的一类连续型随机变量分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正态分布是最重要的一类离散型随机变量分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：正态分布是最重要的一类离散型随机变量分布”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":67,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"构成总体的每个个体的特征是（ ）。","answer":["D"],"dataset_description":null,"id":"p01:67","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>构成\u003c/span>总体\u003cspan>的每个\u003c/span>个体\u003cspan>的\u003c/span>特征\u003cspan>是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>必须\u003c/span>完全相同\u003c/p>"},{"label":"B","html":"\u003cp>既可\u003cspan>以相同，\u003c/span>也可\u003cspan>以不同\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>完全不相同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>不\u003c/span>完全相同\u003cspan>但至少\u003c/span>有一个\u003cspan>方面相同\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：不完全相同但至少有一个方面相同”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本容量越大,说明（ ）","answer":["D"],"dataset_description":null,"id":"p01:68","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>样本容量越大,说明（ ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本方差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本方差越大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本的平均值越大\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本方差越接近总体方差\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：样本方差越接近总体方差”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"（ ）连同t分布和卡方分布被称为三大统计学分布。","answer":["A"],"dataset_description":null,"id":"p01:69","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>（ ）连同t分布和卡方分布被称为三大统计学分布。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>正态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>几何分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>指数分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：F分布”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"某单位有科研人员168人,其中具有高级以上职称的24人,中级职称48人，其余96人均为初级以下职称的人，现要采用比例分层抽样的抽取方法，从不同职称中抽取一个容量为35的样本，三个层级的抽取比例应该是（  ）。","answer":["A"],"dataset_description":null,"id":"p01:70","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>某单位有科研人员168人,其中具有高级以上职称的24人,中级职称48人，其余96人均为初级以下职称的人，现要采用比例分层抽样的抽取方法，从不同职称中抽取一个容量为35的样本，三个层级的抽取比例应该是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>1:2:4\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>1:3:4\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>1:2:5\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>2:1:4\u003c/span>\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["比例分层抽样中，各层抽取人数与层内人数成比例。高级24、中级48、初级96，约分24:48:96=1:2:4，选 A。","总样本35时，每份35÷7=5，因此三层分别抽5、10、20人。"],"warning":""},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于统计量的说法，不正确的是（   ）。","answer":["A"],"dataset_description":null,"id":"p01:71","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面关于统计量的说法，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"统计量与总体同分布"},{"label":"B","html":"统计量是随机变量"},{"label":"C","html":"统计量是样本的函数"},{"label":"D","html":"统计量不含未知参数"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：统计量与总体同分布”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":72,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"如果在纸箱中随机抓取乒乓球，需要对每个球进行（  ）。","answer":["C"],"dataset_description":null,"id":"p01:72","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>如果在纸箱中随机抓取乒乓球，需要对每个球进行（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>涂上不同颜色\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>标上厂商名字\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>写上\u003c/span>\u003cspan>不同的编码\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>标注新旧程度\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：写上不同的编码”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":73,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"影响整群抽样误差大小的主要是（   ）。","answer":["D"],"dataset_description":null,"id":"p01:73","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>影响整群抽样误差大小的主要是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"组间误差"},{"label":"B","html":"组内误差"},{"label":"C","html":"总体方差"},{"label":"D","html":"群间方差"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：群间方差”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例的抽样分布,说法错误的是（ ）。","answer":["A"],"dataset_description":null,"id":"p01:74","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于样本比例的抽样分布,说法错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本比例的平均值等于样本比例的标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本比例的平均值等于总体比例\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>如果总体比例为0.5，则样本比例的抽样分布图形是对称的\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>如果总体比例偏离0.5，只要样本量足够大，则样本比例的抽样分布仍可近似正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：样本比例的平均值等于样本比例的标准差”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"能由样本统计量对事物的总体特征作出统计推论和估计的是（   ）。","answer":["A"],"dataset_description":null,"id":"p01:75","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>能由样本统计量对事物的总体特征作出统计推论和估计的是（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"参数估计"},{"label":"B","html":"集中量数"},{"label":"C","html":"地位量数"},{"label":"D","html":"相关系数"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：参数估计”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"偏态系数测度了数据分布的非对称性程度。如果一组数据的分布是对称的,则偏态系数（   ）。","answer":["B"],"dataset_description":null,"id":"p01:76","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>偏态系数测度了数据分布的非对称性程度。如果一组数据的分布是对称的,则偏态系数（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"等于1"},{"label":"B","html":"等于0"},{"label":"C","html":"大于0"},{"label":"D","html":"大于1"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：等于0”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于简单随机抽样的说法，不正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p01:77","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下关于简单随机抽样的说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>事先要对样本编号，比较费时费力\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体分布越分散时，抽样分析越精确\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>当样本容量较小时，影响样本的代表性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样方法具有一定的局限性\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：总体分布越分散时，抽样分析越精确”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列不属于抽样设计原则的是（  ）。","answer":["B"],"dataset_description":null,"id":"p01:78","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列不属于抽样设计原则的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>目的性原则\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>不可测原则\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>可行性原则\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>经济性原则\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：不可测原则”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"有关抽样误差说法正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p01:79","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>有关抽样误差说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体异质性程度相同，样本容量越大，抽样误差越大\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>参数值与统计值之间的差异就是抽样误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本规模相同，总体异质性程度越高，抽样误差越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样中因违反抽样规则产生误差属于抽样误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：参数值与统计值之间的差异就是抽样误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"对于下述样本量,不属于大样本的是（  ）。","answer":["A"],"dataset_description":null,"id":"p01:80","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>对于下述样本量,不属于大样本的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>20个\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>30个\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>40个\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>50个\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：20个”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例p正确的说法是（ ）。","answer":["A"],"dataset_description":null,"id":"p01:81","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于样本比例p正确的说法是（ ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"随着样本容量的增大，p 的方差愈来愈小"},{"label":"B","html":"随着样本容量的增大，p 的方差愈来愈大"},{"label":"C","html":"随着样本容量的增大，p 的方差不会发生改变"},{"label":"D","html":"随着样本容量的增大，p 的方差在某些区间会变大，在某些区间会变小"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：随着样本容量的增大，p 的方差愈来愈小”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于统计量，以下错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p01:82","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于统计量，以下错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>无偏性有时并不一定存在\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>参数的无偏估计往往不唯一\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>无偏估计不一定是好估计\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>有偏估计不可以修正为无偏估计\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：有偏估计不可以修正为无偏估计”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于系统随机抽样的说法，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p01:83","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面关于系统随机抽样的说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本\u003c/span>\u003cspan>代表性强\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样分散较好\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样更为准确\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>可以消除\u003c/span>\u003cspan>总体的周期性误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：可以消除总体的周期性误差”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于总体集中趋势的描述，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p01:84","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于总体集中趋势的描述，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>是总体的中心位置\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>代表总体的集中量数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>反映的个体向总体中心靠拢的倾向\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>在总体中心附近的个体数量较少\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：在总体中心附近的个体数量较少”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例的分布具有的特征，以下正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p01:85","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于样本比例的分布具有的特征，以下正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本比例的均值等于总体均值,样本比例的标准差等于总体标准差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本比例的均值等于总体均值,样本标准差等于总体标准差除以样本容量的平方\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>所有可能的样本的比例的平均值等于总体比例\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>比例抽样分布的标准误差不可以计算\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：所有可能的样本的比例的平均值等于总体比例”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于任意抽样方法的是（  ）。","answer":["A"],"dataset_description":null,"id":"p01:86","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下不属于任意抽样方法的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>排列后随机抽取\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>街头随访\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>邮寄式调查\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>拦截式访问\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：排列后随机抽取”。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于卡方分布的特点描述，错误的是（ ）。","answer":["C"],"dataset_description":null,"id":"p01:87","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于卡方分布的特点描述，错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>卡方取值均为正值\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>卡方分布是正偏态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>卡方分布为非连续性分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>卡方分布具有可加性\u003c/span>\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：卡方分布为非连续性分布”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布说法正确的是（ ）。","answer":["A"],"dataset_description":null,"id":"p01:88","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于F分布说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>F分布是一分布族\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布的曲线关于y轴对称\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>F分布有一个自由度\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>F分布的取值都大于零\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：F分布是一分布族”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本均值的标准差（ ）。","answer":["A"],"dataset_description":null,"id":"p01:89","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>样本均值的标准差（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>随着样本量的增大而变小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随着样本量的增大而变大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>与样本量的大小无关\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>大于总体标准差\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：随着样本量的增大而变小”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":90,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以不下属于位置平均数的是（ ）。","answer":["B"],"dataset_description":null,"id":"p01:90","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以不下属于\u003c/span>\u003cspan>位置平均数\u003c/span>\u003cspan>的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>中位数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>算术平均\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分位数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>众数\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：算术平均”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":91,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于正态分布的说法中,不正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p01:91","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于正态分布的说法中,不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布是最重要的一类连续型随机变量分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>正态分布距离均值越近的地方数值越稀疏,而在离均值较远的地方数值则很密集\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>正态分布密度函数的显著特点是中间高两边低,由中间向两边递减,并且分布左右对称,是一条光滑的“钟形曲线”\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>如果频率直方图呈现出钟形特征,可认为该变量大致服从正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：正态分布距离均值越近的地方数值越稀疏,而在离均值较远的地方数值则很密集”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"对于一组样本10，25，37，39，53，68，中位数统计量为（  ）。","answer":["B"],"dataset_description":null,"id":"p01:92","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>对于一组样本10，25，37，39，53，68，中位数统计量为（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>37\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>38\u003c/p>"},{"label":"C","html":"\u003cp>39\u003c/p>"},{"label":"D","html":"\u003cp>37.5\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["数据已经升序排列，共6个数。中位数取第3、4个的平均：(37+39)÷2=38，因此选 B。","均值需把所有数相加后除以6，不是这道题所问的中位数。"],"warning":""},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于弃真错误和取伪错误的说法中，正确的是(   )。","answer":["B"],"dataset_description":null,"id":"p01:93","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于弃真错误和取伪错误的说法中，正确的是( &nbsp; )。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"α+β=1"},{"label":"B","html":"要使犯两类错误的概率都减小，只能增加样本容量"},{"label":"C","html":"一般认为取伪错误的严重性高于弃真错误的严重性"},{"label":"D","html":"α变大，β也会变大"}],"explanation":{"topic":"假设检验的两类错误","paragraphs":["第一类错误是原假设 H₀ 为真却拒绝它，也叫弃真，其概率通常用 α 表示。第二类错误是 H₀ 为假却未拒绝它，也叫取伪，其概率用 β 表示，检验功效为 1−β。","在样本量、效应大小和检验方案等条件固定时，降低 α 常会增加 β。增加有效样本量可以改善检验功效，不能说两类错误在任何情况下都固定互补或相加等于1。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：要使犯两类错误的概率都减小，只能增加样本容量”。"],"tip":"弃真 α；取伪 β；功效 1−β。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于总体均值的估计量，说法不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p01:94","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于总体均值的估计量，说法不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"当总体标准差已知时，用正态分布近似法"},{"label":"B","html":"\u003cp>当总体标准差未知但样本容量足够大时，用正态分布近似法\u003c/p>"},{"label":"C","html":"\u003cp>当总体标准差未知时且样本容量不够大时，可采用 t分布法\u003c/p>"},{"label":"D","html":"总体均值的估计有区间估计法和查表法"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：总体均值的估计有区间估计法和查表法”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":95,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"F分布通常被用来检验正态总体的(   )。","answer":["D"],"dataset_description":null,"id":"p01:95","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>F分布通常被用来检验正态总体的( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"均值"},{"label":"B","html":"分布"},{"label":"C","html":"对称性"},{"label":"D","html":"方差"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：方差”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":96,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在两均值t检验中，下列原假设正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p01:96","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在两均值t检验中，下列原假设正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"两个总体均值不同"},{"label":"B","html":"两个样本均值不同"},{"label":"C","html":"两个总体均值相同"},{"label":"D","html":"两个样本均值相同"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：两个总体均值相同”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":97,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"如果总体呈正态分布,当总体方差未知时,这时的均值检验需要使用(    )。","answer":["C"],"dataset_description":null,"id":"p01:97","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>如果总体呈正态分布,当总体方差未知时,这时的均值检验需要使用( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"Z检验"},{"label":"B","html":"F检验"},{"label":"C","html":"t检验"},{"label":"D","html":"近似Z检验"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：t检验”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":98,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下面哪个不是置信区间长度的影响因素(   )。","answer":["C"],"dataset_description":null,"id":"p01:98","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面哪个不是置信区间长度的影响因素( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"自由度"},{"label":"B","html":"总体标准差"},{"label":"C","html":"总体平均数"},{"label":"D","html":"样本容量"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：总体平均数”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":99,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在假设检验问题中，原假设为H0，给定显著水平为α，下面正确的选项是（  ）。","answer":["C"],"dataset_description":null,"id":"p01:99","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在假设检验问题中，原假设为H\u003c/span>\u003cspan>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>，给定显著水平为α，下面正确的选项是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"P(接受H\u003csub>0\u003c/sub>| H\u003csub>0\u003c/sub>不正确)＝1-α"},{"label":"B","html":"P(拒绝H\u003csub>0\u003c/sub> |H\u003csub>0\u003c/sub>不正确)＝1-α"},{"label":"C","html":"P(拒绝H\u003csub>0\u003c/sub>| H\u003csub>0\u003c/sub>正确)＝α"},{"label":"D","html":"P(接受H\u003csub>0\u003c/sub>| H\u003csub>0\u003c/sub>正确)＝α"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：P(拒绝H0| H0正确)＝α”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"对于一个总体，其方差为已知，当样本容量n保持不变时，如果置信度1-α变小，则有（  ）。","answer":["B"],"dataset_description":null,"id":"p01:100","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>对于一个总体，其方差为已知，当样本容量n保持不变时，如果置信度1-α变小，则有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"置信区间宽度变大"},{"label":"B","html":"置信区间宽度变小"},{"label":"C","html":"置信区间长度不变"},{"label":"D","html":"长度不一定变小"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：置信区间宽度变小”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":101,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列说法正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p01:101","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列说法正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"如果备择假设是正确的,但做出的决策是拒绝备择假设,则犯了弃真错误"},{"label":"B","html":"如果备择假设是错误的,但做出的决策是接收备择假设,则犯了采伪错误"},{"label":"C","html":"如果零假设是正确的,但做出的决策是接受备择假设,则犯了弃真错误"},{"label":"D","html":"如果零假设是错误的,但做出的决策是接收备择假设,则犯了采伪错误"}],"explanation":{"topic":"假设检验的两类错误","paragraphs":["第一类错误是原假设 H₀ 为真却拒绝它，也叫弃真，其概率通常用 α 表示。第二类错误是 H₀ 为假却未拒绝它，也叫取伪，其概率用 β 表示，检验功效为 1−β。","在样本量、效应大小和检验方案等条件固定时，降低 α 常会增加 β。增加有效样本量可以改善检验功效，不能说两类错误在任何情况下都固定互补或相加等于1。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：如果零假设是正确的,但做出的决策是接受备择假设,则犯了弃真错误”。"],"tip":"弃真 α；取伪 β；功效 1−β。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":102,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在假设检验中，给定原假设为H0 ，备选假设为H1的情况下，下面那个选项属于第二类错误（    ）。","answer":["C"],"dataset_description":null,"id":"p01:102","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在假设检验中，给定原假设为H\u003c/span>\u003cspan>\u003csub>0 \u003c/sub>\u003c/span>\u003cspan>，备选假设为H\u003c/span>\u003cspan>\u003csub>1\u003c/sub>\u003c/span>\u003cspan>的情况下，下面那个选项属于第二类错误（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"H\u003csub>0\u003c/sub>为真，不拒绝H\u003csub>1\u003c/sub>"},{"label":"B","html":"H\u003csub>0\u003c/sub>为真，拒绝H\u003csub>1\u003c/sub>"},{"label":"C","html":"H\u003csub>0\u003c/sub>不真，不拒绝H\u003csub>0\u003c/sub>"},{"label":"D","html":"H\u003csub>0\u003c/sub>不真，拒绝H\u003csub>0\u003c/sub>"}],"explanation":{"topic":"假设检验的两类错误","paragraphs":["第一类错误是原假设 H₀ 为真却拒绝它，也叫弃真，其概率通常用 α 表示。第二类错误是 H₀ 为假却未拒绝它，也叫取伪，其概率用 β 表示，检验功效为 1−β。","在样本量、效应大小和检验方案等条件固定时，降低 α 常会增加 β。增加有效样本量可以改善检验功效，不能说两类错误在任何情况下都固定互补或相加等于1。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：H0不真，不拒绝H0”。"],"tip":"弃真 α；取伪 β；功效 1−β。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"计算是基于（ ）的相关服务的增加，使用和交付模式，通常涉及通过互联网来提供动态易扩展且经常是虚拟化的资源。","answer":["B"],"dataset_description":null,"id":"p01:103","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>计算是基于（ ）的相关服务的增加，使用和交付模式，通常涉及通过互联网来提供动态易扩展且经常是虚拟化的资源。 &nbsp; &nbsp;\u003c/span>\u003c/p>","options":[{"label":"A","html":"计算机"},{"label":"B","html":"互联网"},{"label":"C","html":"智能手机"},{"label":"D","html":"通讯产品"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：互联网”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于数据挖掘描述不正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p01:104","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于数据挖掘描述不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据挖掘从大量数据库中发现并提取隐藏在内的合理的、有效的信息"},{"label":"B","html":"数据挖掘可以帮助企业管理人员寻找规律，发现被忽略的要素，预测趋势，进行决策"},{"label":"C","html":"数据挖掘就是从少量的数据中挖掘出可能有潜在价值的信息技术"},{"label":"D","html":"数据挖掘是一种决策支持过程"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：数据挖掘就是从少量的数据中挖掘出可能有潜在价值的信息技术”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于大数据叙述，不正确的一项是(    )。","answer":["D"],"dataset_description":null,"id":"p01:105","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下关于大数据叙述，不正确的一项是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>大数据通常指无法在可承受时间范围内用常规工具进行抓取、管理和处理的数据集合\u003c/p>"},{"label":"B","html":"\u003cp>大数据不仅包含海量数据，还包含多种复杂类型的数据\u003c/p>"},{"label":"C","html":"\u003cp>大数据的核心价值之一在于对海量数据进行及时有效的分析\u003c/p>"},{"label":"D","html":"\u003cp>大数据仅指数据量大，不涉及数据类型和速度等其他特征\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：大数据仅指数据量大，不涉及数据类型和速度等其他特征”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于大数据中计算机存储容量单位的说法中,错误的是（    )。","answer":["B"],"dataset_description":null,"id":"p01:106","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于大数据中计算机存储容量单位的说法中,错误的是（ &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"一个汉字需要16个比特的存储空间"},{"label":"B","html":"容纳一个英文字符需要2个字节"},{"label":"C","html":"基本单位是字节"},{"label":"D","html":"1KB＜1MB＜1TB"}],"explanation":{"topic":"数据容量单位","paragraphs":["bit 是二进制位，byte 是字节，1 byte=8 bit。常见单位从小到大为 B、KB、MB、GB、TB、PB、EB、ZB、YB，不要把位与字节混为一谈。","严格的十进制前缀每级1000，二进制前缀 KiB、MiB、GiB 每级1024。教材和操作系统有时用 KB/MB 表示1024倍关系，做题时需结合选项约定，而不能认为两种口径永远相同。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：容纳一个英文字符需要2个字节”。"],"tip":"B 与 b 不同；K→M→G→T→P→E。","source":""},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于大数据的特点,叙述错误的是（   )。","answer":["A"],"dataset_description":null,"id":"p01:107","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下关于大数据的特点,叙述错误的是（ &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"速度慢"},{"label":"B","html":"多元、异构"},{"label":"C","html":"数据规模大"},{"label":"D","html":"基于高度分析的新价值"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：速度慢”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"对于大数据特征的描述,不正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p01:108","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>对于大数据特征的描述,不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"海量的数据规模(巨量性)"},{"label":"B","html":"快速的数据流转(迅变性)"},{"label":"C","html":"单一数据类型(单一性)"},{"label":"D","html":"高质量的数据要求(真实性)"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：单一数据类型(单一性)”。"],"tip":"
