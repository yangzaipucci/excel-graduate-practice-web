体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于一维搜索的牛顿法,下列叙述错误的是( )。","answer":["B"],"dataset_description":null,"id":"p01:109","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于一维搜索的牛顿法,下列叙述错误的是( )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"牛顿法属于一维搜索的插值方法"},{"label":"B","html":"牛顿法的特点是收敛速度很慢"},{"label":"C","html":"牛顿法中需要计算每一点的函数二阶导数"},{"label":"D","html":"牛顿法要求初始点离极小点不太远,否则有可能使极小化序列发散"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：牛顿法的特点是收敛速度很慢”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于方差分析的表述中，错误的是(  )。","answer":["C"],"dataset_description":null,"id":"p01:110","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于方差分析的表述中，错误的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"检验若干总体的均值是否相等的一种统计方法"},{"label":"B","html":"\u003cp>\u003cspan>用于分析不同组别数据之间的均值差异是否具有统计显著性的一种方法\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>只要有两个样本均值不相等，就拒绝原假设\u003c/p>"},{"label":"D","html":"F检验值等于平均组间方差除以平均组内方差"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：只要有两个样本均值不相等，就拒绝原假设”。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":111,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于朴素贝叶斯分类算法,描述不正确的是(   )。","answer":["A"],"dataset_description":null,"id":"p01:111","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于朴素贝叶斯分类算法,描述不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"它假设属性之间可以相互不独立"},{"label":"B","html":"根据先验概率计算后验概率"},{"label":"C","html":"基本思想是对于给定的待分类项，求解在此项出现的条件下，统计计算各个类别出现的概率，取出现最大概率的作为此待分类项类别"},{"label":"D","html":"有最小错误率判断规则和最小风险判断规则"}],"explanation":{"topic":"朴素贝叶斯分类","paragraphs":["贝叶斯分类按后验概率 P(类别|特征) 选择类别。朴素贝叶斯的“朴素”是给定类别后，各特征条件独立的假设，并非无条件要求所有特征彼此独立。","后验与“类别先验×各特征条件概率的乘积”成比例；取对数可避免很小概率连乘下溢，平滑可处理零频次。它既可二分类，也可多分类。","训练不需要复杂的迭代求最优边界，但预测仍需参数估计；相关特征可能削弱独立假设，不能据此断言算法完全不能用。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：它假设属性之间可以相互不独立”。"],"tip":"给定类别后条件独立；先验×似然比后验。","source":""},"attachments":[]},{"number":112,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"分支定界法中(   )。","answer":["A"],"dataset_description":null,"id":"p01:112","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>分支定界法中( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"最大值问题的目标是各分支的上界"},{"label":"B","html":"最大值问题的目标是各分支的下界"},{"label":"C","html":"最小值问题的目标是各分支的上界"},{"label":"D","html":"以上都不对"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：最大值问题的目标是各分支的上界”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下面哪个不是分类模型（  ）。","answer":["A"],"dataset_description":null,"id":"p01:113","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面哪个不是分类模型（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":" k-均值模型"},{"label":"B","html":"决策树模型"},{"label":"C","html":"贝叶斯模型"},{"label":"D","html":"各项表述均不正确"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：k-均值模型”。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于线性规划模型，下列说法不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p01:114","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于线性规划模型，下列说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"变量必须是非负的"},{"label":"B","html":"目标函数可以极大也可以是极小"},{"label":"C","html":"目标函数应是线性的"},{"label":"D","html":"约束条件必须是线性的"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：变量必须是非负的”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下关于整数规划的命题中不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p01:115","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下关于整数规划的命题中不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"用分支定界法求解整数规划问题首先要求解放松整数要求的线性规划问题"},{"label":"B","html":"整数规划解的数目比线性规划少的多，但整数规划问题也可能有无数多个可行解"},{"label":"C","html":"求解整数规划问题要比求解线性规划问题难得多"},{"label":"D","html":"分支定界方法不能求解有连续变量的混合整数规划问题"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：分支定界方法不能求解有连续变量的混合整数规划问题”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下面对回归和分类的描述不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p01:116","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面对回归和分类的描述不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"在分类模型中，学习得到一个函数将输入变量映射到离散输出空间"},{"label":"B","html":"两者均是学习输入变量和输出变量之间潜在关系模型在"},{"label":"C","html":"回归分析中，学习得到一个函数将输入变量映射到连续输出空间"},{"label":"D","html":"回归是一种无监督学习、分类学习是有监督学习"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：回归是一种无监督学习、分类学习是有监督学习”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下面对梯度下降方法的描述，不正确的是（  )。","answer":["A"],"dataset_description":null,"id":"p01:117","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面对梯度下降方法的描述，不正确的是（ &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"梯度方向是函数值下降最快方向"},{"label":"B","html":"梯度下降算法是一种使得目标函数最小化的方法"},{"label":"C","html":"梯度下降算法用来优化非线性模型"},{"label":"D","html":"梯度反方向是函数值下降最快方向"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：梯度方向是函数值下降最快方向”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"在我国，有权修改宪法的主体是（   ）。","answer":["A"],"dataset_description":null,"id":"p01:118","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>在我国，有权修改宪法的主体是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"全国人大"},{"label":"B","html":"全国人大常委会"},{"label":"C","html":"国务院"},{"label":"D","html":"党中央"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：全国人大”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"（   ）是最严厉的责任形式。","answer":["A"],"dataset_description":null,"id":"p01:119","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>（ &nbsp; ）是最严厉的责任形式。\u003c/span>\u003c/p>","options":[{"label":"A","html":"刑事法律责任"},{"label":"B","html":"民事法律责任"},{"label":"C","html":"行政法律责任"},{"label":"D","html":"政治责任"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：刑事法律责任”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"针对算法漏洞带来的安全风险，可以采取的措施是（  ）。","answer":["A"],"dataset_description":null,"id":"p01:120","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>针对算法漏洞带来的安全风险，可以采取的措施是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"加强算法保密性，通过加密等安全防护措施确保算法不被轻易泄露"},{"label":"B","html":"通过传统的安全防护措施防范算法参数被非法修改的可能性"},{"label":"C","html":"保证系统在异常输入时仍然保持其可用性"},{"label":"D","html":"在攸关人身安全的领域明确风险提示要求"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：加强算法保密性，通过加密等安全防护措施确保算法不被轻易泄露”。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"关于数据资源长远价值的说法，以下说法正确的包括（    ）。","answer":["A","C"],"dataset_description":null,"id":"p01:121","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于数据资源长远价值的说法，以下说法正确的包括（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"具有不稳定性。"},{"label":"B","html":"所有数据都有保留价值。"},{"label":"C","html":"仅仅未来真正用得上的数据。"},{"label":"D","html":"从垃圾数据中发现价值。"},{"label":"E","html":"上述说法都不对。"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C。对应内容为“A：具有不稳定性。；C：仅仅未来真正用得上的数据。”。多选题应检查所有选项，不能只选其中一项。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"下列关于风险保留的说法，正确的有(   )。","answer":["B","D","E"],"dataset_description":null,"id":"p01:122","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于风险保留的说法，正确的有( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>风险保留是无计划的选择\u003c/p>"},{"label":"B","html":"\u003cp>风险保留是指企业理性主动承担风险\u003c/p>"},{"label":"C","html":"\u003cp>风险保留是指企业非理性主动承担风险\u003c/p>"},{"label":"D","html":"\u003cp>风险保留是一种利用内部资源补偿损失\u003c/p>"},{"label":"E","html":"\u003cp>风险保留是通过自有资金来弥补所遭遇的损失\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["风险保留是企业决定自行承担损失，常用内部资源或自有资金补偿，所以选 B、D、E。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"本题考主动风险保留，是事先评估后的选择，不能说无计划。"},{"label":"B","selected":true,"reason":"主动接受自己有能力承担的风险，符合本题的理性风险保留。"},{"label":"C","selected":false,"reason":"主动保留应有评估和安排，“非理性”不符合本题定义。"},{"label":"D","selected":true,"reason":"内部资源补偿损失，说明损失由企业自身承担。"},{"label":"E","selected":true,"reason":"自有资金弥补损失，是风险保留的具体做法。"}]},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"以下关于系统抽样法的描述，正确的是（  ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p01:123","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下关于系统抽样法的描述，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>依据一定的抽样距离，从总体中抽取样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>采用简单随机抽样的方法在最前面的K个元素中抽取一个元素\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>从容量为N的总体中抽取容量为n的样本，需将总体分成均衡的K组\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>从每一部分抽取一个个体，得到所需要的样本\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>给总体中的每一个元素随机编上号码\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：依据一定的抽样距离，从总体中抽取样本；B：采用简单随机抽样的方法在最前面的K个元素中抽取一个元素；C：从容量为N的总体中抽取容量为n的样本，需将总体分成均衡的K组；D：从每一部分抽取一个个体，得到所需要的样本”。多选题应检查所有选项，不能只选其中一项。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"下述关于统计指数作用的观点，正确的有(    )。","answer":["A","B","E"],"dataset_description":null,"id":"p01:124","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下述关于统计指数作用的观点，正确的有( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"综合的反映复杂现象在数量上变动的方向和程度"},{"label":"B","html":"分析复杂现象总体变动中各个因素的变动"},{"label":"C","html":"反映现象总体各单位变量分布的集中趋势"},{"label":"D","html":"反映现象总体的规模水平"},{"label":"E","html":"因素变动对总体变动的影响程度"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、E。对应内容为“A：综合的反映复杂现象在数量上变动的方向和程度；B：分析复杂现象总体变动中各个因素的变动；E：因素变动对总体变动的影响程度”。多选题应检查所有选项，不能只选其中一项。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于系统抽样要素的是（  ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p01:125","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下属于系统抽样要素的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>所选样本的数量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>取样间隔\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本总容量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体单位分布\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>选取样本占样本总容量的比例\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：所选样本的数量；B：取样间隔；C：样本总容量；E：选取样本占样本总容量的比例”。多选题应检查所有选项，不能只选其中一项。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于统计总体的特征描述，正确的是（  ）。","answer":["C","D","E"],"dataset_description":null,"id":"p01:126","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下关于统计总体的特征描述，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体单位是可数的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>少数单位也能形成总体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体的所有单位都必须具有某一共同性质\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>由许多个单位组成的\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>在其他多个方面存在差异\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C、D、E。对应内容为“C：总体的所有单位都必须具有某一共同性质；D：由许多个单位组成的；E：在其他多个方面存在差异”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于抽样误差的表述中，正确的有（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p01:127","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于抽样误差的表述中，正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"抽样误差无法避免，但可计算"},{"label":"B","html":"抽样误差与总体分布有关，总体方差越大，抽样误差越大"},{"label":"C","html":"其他条件相同，样本量越大，抽样误差越小"},{"label":"D","html":"抽样误差与抽样方式和估计量的选择也有关"},{"label":"E","html":"分层抽样的估计量方差一般大于简单随机抽样"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：抽样误差无法避免，但可计算；B：抽样误差与总体分布有关，总体方差越大，抽样误差越大；C：其他条件相同，样本量越大，抽样误差越小；D：抽样误差与抽样方式和估计量的选择也有关”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于整群抽样和分层抽样的异同，以下说法正确的是（  ）。","answer":["B","C","D","E"],"dataset_description":null,"id":"p01:128","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于整群抽样和分层抽样的异同，以下说法正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>整群抽样要求同一群体内部的单位具有相同性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>分层随机抽样要求各层之间有明显差异\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分层抽样的划分标志与调查标志有密切关系\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>都是首先根据某种标准把调查总体分为若干部分群或层\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>整群抽样的划分标志可以与调查标志无关\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层抽样与整群抽样的区别","paragraphs":["分层抽样先把总体分成互不重叠的层，再在每一层抽若干单位，目的是保证各层代表性并降低误差；有效分层通常层内相似、层间差异较大。","整群抽样把总体分为互不重叠的群，抽取一部分群，对抽中群内的单位全部调查。它通常便于组织、节省成本，但群内相关性高时误差可能增大。","“每组都抽一些”是分层；“只抽部分组，组内全查”是整群；“抽组后组内再抽一部分”则是多阶段。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、D、E。对应内容为“B：分层随机抽样要求各层之间有明显差异；C：分层抽样的划分标志与调查标志有密切关系；D：都是首先根据某种标准把调查总体分为若干部分群或层；E：整群抽样的划分标志可以与调查标志无关”。多选题应检查所有选项，不能只选其中一项。"],"tip":"分层每层抽，整群抽群全查，多阶段群内再抽。","source":""},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于t分布，下列描述正确的是（ ）。","answer":["A","B","D","E"],"dataset_description":null,"id":"p01:129","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于t分布，下列描述正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>t分布是关于0对称的曲线\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>当自由度趋近于无穷大时，t分布为标准正态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>与标准正态分布类似，t分布是唯一确定的一条曲线\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>t分布曲线下面积95%的界值不是一个常量\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>t分布是对称分布，但不是正态分布曲线\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D、E。对应内容为“A：t分布是关于0对称的曲线；B：当自由度趋近于无穷大时，t分布为标准正态分布；D：t分布曲线下面积95%的界值不是一个常量；E：t分布是对称分布，但不是正态分布曲线”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于样本平均数和总体平均数的描述，正确的有（ ）。","answer":["A","C"],"dataset_description":null,"id":"p01:130","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于样本平均数和总体平均数的描述，正确的有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>前者是随机变量，后者是一个确定值\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>两者都是确定值\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本平均数是用于总体平均数的抽样推断\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>前者是一个确定值，后者是随机变量\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>两者都是随机变量\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C。对应内容为“A：前者是随机变量，后者是一个确定值；C：样本平均数是用于总体平均数的抽样推断”。多选题应检查所有选项，不能只选其中一项。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下描述总体单位集中趋势的观点，正确的论述是（  ）。","answer":["A","B","D","E"],"dataset_description":null,"id":"p01:131","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下描述总体单位集中趋势的观点，正确的论述是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体平均数适宜于对称分布单位\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体中位数适宜于正偏态分布单位\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>同一正偏态分布单位，总体平均数小于总体中位数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>对称分布总体的平均数等于中位数\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>几何均数特别适宜于对数对称分布总体\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D、E。对应内容为“A：总体平均数适宜于对称分布单位；B：总体中位数适宜于正偏态分布单位；D：对称分布总体的平均数等于中位数；E：几何均数特别适宜于对数对称分布总体”。多选题应检查所有选项，不能只选其中一项。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于偶然误差的说法,以下正确的是（ ）。","answer":["A","C","D"],"dataset_description":null,"id":"p01:132","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>关于偶然误差的说法,以下正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>有偶然原因引起的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>正负是固定的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>大小不固定\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正负概率出现的机率大致相同\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>绝对值大的出现的概率大\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、D。对应内容为“A：有偶然原因引起的；C：大小不固定；D：正负概率出现的机率大致相同”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列说法中正确的有（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p01:133","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列说法中正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本均值是总体均值的无偏估计量"},{"label":"B","html":"样本比例是总体比例的无偏估计量"},{"label":"C","html":"样本均值是总体均值的一致估计量"},{"label":"D","html":"样本标准差是总体标准差的无偏估计量"},{"label":"E","html":"样本方差是总体方差的无偏估计量"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：样本均值是总体均值的无偏估计量；B：样本比例是总体比例的无偏估计量；C：样本均值是总体均值的一致估计量；E：样本方差是总体方差的无偏估计量”。多选题应检查所有选项，不能只选其中一项。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于t分布，论述正确的是（ ）。","answer":["A","B","D"],"dataset_description":null,"id":"p01:134","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于t分布，论述正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>当样本数量趋向于无穷大时，t分布曲线与标准正态分布曲线发生重合\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布是对称于零的单峰分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>t分布与标准正态分布图特征相同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>t分布的形状由自由度决定\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>相同的t值所对应的\u003c/span>\u003cspan>t分布曲线下的面积相同\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：当样本数量趋向于无穷大时，t分布曲线与标准正态分布曲线发生重合；B：t分布是对称于零的单峰分布；D：t分布的形状由自由度决定”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于归纳法与演绎法的说法中，错误的是（   ）。","answer":["A","B","E"],"dataset_description":null,"id":"p01:135","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于归纳法与演绎法的说法中，错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"演绎法从观察开始"},{"label":"B","html":"归纳法先推论后观察"},{"label":"C","html":"演绎法是从一般性出发以达到个别"},{"label":"D","html":"归纳法是从个别出发以达到一般性"},{"label":"E","html":"归纳法与演绎法的推理顺序相同"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、E。对应内容为“A：演绎法从观察开始；B：归纳法先推论后观察；E：归纳法与演绎法的推理顺序相同”。多选题应检查所有选项，不能只选其中一项。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于区间估计的说法中,不正确的有(   )。","answer":["C","D"],"dataset_description":null,"id":"p01:136","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下列关于区间估计的说法中,不正确的有( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"区间估计中的可靠性是用某个区间去估计总体参数时,成功的可能性有多大"},{"label":"B","html":"对同一总体来说,区间越大,把握性越大"},{"label":"C","html":"从精确性出发,要求区间越大越好"},{"label":"D","html":"从把握性出发,要求区间越小越好"},{"label":"E","html":"置信区间表明区间估计的可靠性"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C、D。对应内容为“C：从精确性出发,要求区间越大越好；D：从把握性出发,要求区间越小越好”。多选题应检查所有选项，不能只选其中一项。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"大数据的应用领域包括（    ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p01:137","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>大数据的应用领域包括（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"制造业"},{"label":"B","html":"金融行业"},{"label":"C","html":"汽车行业"},{"label":"D","html":"互联网行业"},{"label":"E","html":"航空行业"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：制造业；B：金融行业；C：汽车行业；D：互联网行业；E：航空行业”。多选题应检查所有选项，不能只选其中一项。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"下面关于K均值聚类算法的特点的描述，正确的是（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p01:138","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>下面关于K均值聚类算法的特点的描述，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据集中包含符号属性时,直接应用K均值聚类算法是有问题的"},{"label":"B","html":"用户事先需要制定K的个数"},{"label":"C","html":"对噪声和孤立点数据比较敏感"},{"label":"D","html":"少量的敏感数据能够对聚类均值起到很大的影响"},{"label":"E","html":"聚类的相似性用距离表示"}],"explanation":{"topic":"聚类与 K 均值","paragraphs":["聚类是按相似性把对象分组的无监督学习，通常不依赖预先标好的类别。分类则学习已标注样本的类别规律，二者目标和训练信息不同。","K 均值先选 K 个中心，反复把样本分给最近中心，再以簇内均值更新中心，通常降低簇内平方距离和。需预先给 K，可能依赖初值、落入局部最优，对尺度和离群值敏感。","它偏好近似球状、尺度相近的数值簇，不能认为对任意形状、任意非数值数据都直接适用。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：数据集中包含符号属性时,直接应用K均值聚类算法是有问题的；B：用户事先需要制定K的个数；C：对噪声和孤立点数据比较敏感；D：少量的敏感数据能够对聚类均值起到很大的影响；E：聚类的相似性用距离表示”。多选题应检查所有选项，不能只选其中一项。"],"tip":"聚类无标签；K 均值：分配→更新，初值和尺度重要。","source":""},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"以下有关宪法修改的表述，正确的有（    ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p01:139","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>以下有关宪法修改的表述，正确的有（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"宪法制定和修改程序比普通法律更为严格"},{"label":"B","html":"\u003cp>全国人民代表大会是唯一有权修改宪法的机关\u003c/p>"},{"label":"C","html":"\u003cp>全国人大常务委员会有权提出修正案\u003c/p>"},{"label":"D","html":"\u003cp>宪法修改可以由五分之一以上的全国人大代表提出\u003c/p>"},{"label":"E","html":"\u003cp>宪法修正案应由全国人大以全体代表的二分之一以上多数通过\u003c/p>"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：宪法制定和修改程序比普通法律更为严格；B：全国人民代表大会是唯一有权修改宪法的机关；C：全国人大常务委员会有权提出修正案；D：宪法修改可以由五分之一以上的全国人大代表提出”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"职业伦理道德规范的对象有（  ）。","answer":["A","B"],"dataset_description":null,"id":"p01:140","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>职业伦理道德规范的对象有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"从业人员内部关系"},{"label":"B","html":"从业人员与服务对象关系"},{"label":"C","html":"国家与公民关系"},{"label":"D","html":"公民与行业关系"},{"label":"E","html":"国家与行业关系"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B。对应内容为“A：从业人员内部关系；B：从业人员与服务对象关系”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“data01.xlsx”中的表格“Sheet1”第4列的编号为（）。","answer":["A"],"dataset_description":"主题干：Excel表格文件“data01.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：SPX、EUR、VIX、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p01:141","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>文件“data01.xlsx”中的表格“Sheet1”第4列的编号为（）。\u003c/p>","options":[{"label":"A","html":"D"},{"label":"B","html":"4"},{"label":"C","html":"四"},{"label":"D","html":"IV"}],"explanation":{"topic":"A1 引用中的列编号","paragraphs":["Excel 默认用字母编号列：第1列 A、第2列 B、第3列 C、第4列 D。因此第4列的编号是 D，选 A。","数字4是列的序号，不是 A1 样式显示的列名；IV 是旧版 Excel 的最后一列，不是第4列。"],"tip":"列用字母，行用数字。","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data01.xlsx","href":"../materials/p01/data01.xlsx"}]},{"number":142,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":2,"question":"将网页数据爬取到文件\"data01.xlsx\"的工作表\"Sheet1\"中，若使用Excel来进行操作，那么所支持的类型为？","answer":["B"],"dataset_description":"主题干：Excel表格文件“data01.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：SPX、EUR、VIX、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p01:142","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>将网页数据爬取到文件&quot;data01.xlsx&quot;的工作表&quot;Sheet1&quot;中，若使用Excel来进行操作，那么所支持的类型为？\u003c/p>","options":[{"label":"A","html":"\u003cp>HTML格式\u003c/p>"},{"label":"B","html":"表格数据"},{"label":"C","html":"\u003cp>视频类数据\u003c/p>"},{"label":"D","html":"图片类数据"}],"explanation":{"topic":"从网页获取表格数据","paragraphs":["在 Excel 中可从“数据→获取数据→从其他源→从 Web”导入网页中的可识别表格，题目考查的类型是表格数据，选 B。","这里的导入功能提取结构化行列数据，不等于把所有视频、音频或任意网页布局完整转换成工作表。动态网页、登录页面可能需要额外处理。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data01.xlsx","href":"../materials/p01/data01.xlsx"}]},{"number":143,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":3,"question":"文件“data01.xlsx”中的“Sheet1”中通过“定位条件”选取所有的缺失值单元格，选择用下一个单元格的值进行填充（例如：A1用A2的值填充，如没有缺失值则不用填充）。“SPX”的具体数据分布情况为（）","answer":["D"],"dataset_description":"主题干：Excel表格文件“data01.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：SPX、EUR、VIX、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p01:143","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>\u003cspan>文件“data01.xlsx”中的“Sheet1”中通过“定位条件”选取所有的缺失值单元格，选择用下一个单元格的值进行填充（例如：A1用A2的值填充，\u003c/span>\u003cspan>如没有缺失值则不用填充\u003c/span>\u003cspan>）。“SPX”的具体数据分布情况为（）\u003c/span>\u003c/p>","options":[{"label":"A","html":"平均值：2203.36，计数：501，求和：601680.61"},{"label":"B","html":"平均值：1103.36，计数：501，求和：601680.61"},{"label":"C","html":"平均值：1000.36，计数：501，求和：601680.61"},{"label":"D","html":"平均值：1203.36，计数：501，求和：601680.61"}],"explanation":{"topic":"缺失值检查与描述统计","paragraphs":["先对原始数据区定位空值，按题意用下一单元格填补；素材有效 SPX 数据无须填补。B2:B501 有500个数值，求和601680.61，均值601680.61÷500=1203.36122，约1203.36，选 D。","复现公式：=SUM(B2:B501)、=AVERAGE(B2:B501)。"],"tip":"均值分母是数值个数。","warning":"原选项“计数501”包含1个文本表头；SPX 实际数值个数 COUNT 为500。不要拿601680.61除以501求均值。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data01.xlsx","href":"../materials/p01/data01.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"data01.xlsx\"的工作表\"Sheet1\"中，请使用COUNTA函数计算C列中所有非空单元格的数量，所使用公式和结果正确的是？","answer":["A"],"dataset_description":"主题干：Excel表格文件“data01.xlsx”收集了几只股票的相关信息情况。工作表Sheet1包含5个特征数据：date、三支股票：SPX、EUR、VIX、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p01:144","paperId":"p01","paperTitle":"Excel 模拟卷 01","question_html":"\u003cp>在文件&quot;data01.xlsx&quot;的工作表&quot;Sheet1&quot;中，请使用COUNTA函数计算C列中所有非空单元格的数量，所使用公式和结果正确的是？\u003c/p>","options":[{"label":"A","html":"=COUNTA(C:C)；501"},{"label":"B","html":"=COUNTA(C)；501"},{"label":"C","html":"=COUNTA(C1:C)；500"},{"label":"D","html":"=COUNTA(C:C1)；500"}],"explanation":{"topic":"COUNTA 统计非空单元格","paragraphs":["使用 =COUNTA(C:C)，C:C 表示整列 C。素材中包含 500 个非空数据单元格和1个非空表头，因此结果是 501，选 A。","COUNTA 统计文本和数字等非空内容，COUNT 只统计数字；C 或 C1:C 都不是本题正确的完整列引用。看似空白但含公式空字符串的单元格，也可能被 COUNTA 计入。"],"tip":"C   function grade(questions,answers){

  }

  }

});

stash();studying=false;state=null;current=[];
const p=paper(),isWrong=D.page==='wrongs',active=activeWrongs(isWrong?null:p.id),mastered=masteredWrongs(isWrong?null:p.id),draft=safeState(read('session:'+scope,null));
root.innerHTML=`<div class="shell">${topbar()}<main class="intro"><div class="eyebrow">${isWrong?'专项复习':'独立试卷'}</div><h1>${isWrong?'我的错题本':esc(p.title)}</h1><p class="muted">${isWrong?'把做错的题，再认真做对一次。答对会标为已掌握，历史不丢失。':'背题模式直接学习答案和解析；考试模式隐藏答案，交卷后统一评分。两种模式分别保存进度。'}</p>${notice()}${isWrong?`<div class="wrong-stats"><span class="pill">待复习 ${active.length} 题</span><span class="pill">已掌握 ${mastered.length} 题</span></div>${draft&&!draft.submitted?`<div class="panel"><h2>上次的错题练习还没完成</h2><p class="muted">已答 ${Object.keys(draft.answers).length} / ${draft.ids.length} 题</p><button class="btn primary" data-action="resume">继续重刷</button></div>`:''}<div class="actions">${active.length?'<button class="btn primary" data-action="begin-wrongs">重刷全部待复习错题</button><button class="btn" data-action="study-wrongs">背错题 · 看解析</button>':''}</div>${!active.length?`<div class="empty">${mastered.length?'当前错题都已掌握。可以在下面把想复习的题重新加入。':'还没有错题。先去做一套试卷，交卷后会自动收录。'}</div>`:''}<div class="actions"><button class="btn danger" data-action="clear-wrongs">清空全部错题</button></div><div class="history-list"><h2>待复习题目</h2>${active.length?wrongHistory(active):'<p class="muted">暂无待复习题目</p>'}</div>${mastered.length?`<details class="panel"><summary>已掌握历史 · ${mastered.length} 题</summary>${wrongHistory(mastered)}</details>`:''}`:`${draft?`<div class="panel"><h2>${draft.submitted?'上次练习已交卷':'继续上次练习'}</h2><p class="muted">已答 ${Object.keys(draft.answers).length} / ${draft.ids.length} 题 · 用时 ${time(draft.elapsedMs)}</p><button class="btn primary" data-action="resume">${draft.submitted?'查看上次成绩':'继续作答'}</button></div>`:''}<div class="panel"><h2>开始一次新练习</h2><label class="choice"><input type="radio" name="range" value="all" checked>整套试卷 <small>148 题</small></label><label class="choice"><input type="radio" name="range" value="operations">只刷操作题 <small>第 141—148 题，共 8 题</small></label><div class="actions"><button class="btn primary" data-action="begin-study">背题模式 · 答案与解析</button><button class="btn" data-action="begin-paper">考试模式 · 开始作答</button>${active.length?`<button class="btn" data-action="begin-wrongs">本卷错题 · ${active.length}</button>`:''}</div></div>`}<div class="panel"><h2>本次计分规则</h2><p class="muted">每题等权，答对题数 ÷ 本次题数 × 100。多选题全部选对才得分，未答计 0 分。成绩为练习分，不采用原网站未核实的考试题型权重。</p></div><a href="${isWrong?'index.html':'../index.html'}">← 返回全部试卷</a></main></div>`;
}
function begin(ids,kind,confirmed=false){
studying=false;
if(!ids.length){toast('当前没有待复习错题');return;}
const old=safeState(read('session:'+scope,null));
if(old&&!old.submitted&&!confirmed){showDialog('开始新的练习？','<p>这会替换当前未交卷的作答进度。已保存的错题与历史成绩会继续保留。</p>','<button class="btn" data-action="close-dialog">保留当前进度</button><button class="btn primary" data-action="confirm-new">开始新练习</button>');pending={ids,kind};return;}
closeDialog();state={version:1,attempt:Date.now()+'-'+Math.random().toString(36).slice(2),ids,kind,answers:{},index:0,elapsedMs:0,startedAt:Date.now(),submitted:false};current=ids.map(id=>all[id]);review=false;reviewIds=null;tick=Date.now();save();renderQuestion();window.scrollTo(0,0);
}
let pending=null;
function resume(){studying=false;state=safeState(read('session:'+scope,null));if(!state)return intro();current=state.ids.map(id=>all[id]);review=false;reviewIds=null;tick=Date.now();if(state.submitted)result();else renderQuestion();}
function navList(){return reviewIds||state.ids;}
function answeredCount(){return Object.values(state.answers).filter(a=>a.length).length;}
function renderQuestion(){
const ids=navList(),q=all[ids[state.index]],selected=state.answers[q.id]||[],show=review;
root.innerHTML=`<div class="shell"><header class="quiz-head"><div class="quiz-head-row"><div><div class="quiz-title">${D.page==='wrongs'?'错题重刷':esc(paper().title)}${show?' · 答案回顾':''}</div><div class="quiz-meta">${show?`第 ${state.index+1} / ${ids.length} 题`:`已答 ${answeredCount()} / ${state.ids.length} 题`} · <span id="timer">${time(state.elapsedMs)}</span></div></div><button class="btn small" data-action="${show?'result':'submit-dialog'}">${show?'返回成绩':'交卷'}</button></div><div class="progress-track"><span style="width:${show?(state.index+1)/ids.length*100:answeredCount()/state.ids.length*100}%"></span></div></header><main class="question-wrap">${notice()}<div class="q-label"><span class="number">${state.index+1}<small> / ${ids.length}</small></span><span class="pill">${esc(q.type)}</span>${q.type==='多选题'?'<small>可选择多项</small>':''}</div><div class="q-source">${esc(q.paperTitle)} · 原第 ${q.number} 题 · ${esc(q.book)} 第 ${q.chapter} 章</div>${q.dataset_description?`<details class="dataset"><summary>操作题说明与 Excel 素材</summary><p>${esc(q.dataset_description)}</p>${q.attachments.map(a=>`<a download href="${esc(a.href)}">下载 ${esc(a.name)} ↗</a>`).join('')}</details>`:''}<section class="question-text" id="question" aria-live="polite">${q.question_html}</section><div class="options" role="group" aria-labelledby="question">${q.options.map(o=>`<label class="option ${selected.includes(o.label)?'selected':''} ${show&&q.answer.includes(o.label)?'is-correct':''} ${show&&selected.includes(o.label)&&!q.answer.includes(o.label)?'is-wrong':''}"><input type="${q.type==='多选题'?'checkbox':'radio'}" name="answer" value="${esc(o.label)}" ${selected.includes(o.label)?'checked':''} ${show?'disabled':''}><span class="option-letter">${esc(o.label)}</span><div class="option-content">${o.html}</div>${show&&q.answer.includes(o.label)?'<span class="option-tag">正确选项</span>':''}</label>`).join('')}</div>${show?`<div class="review-note ${C.same(selected,q.answer)?'':'wrong'}"><p><b>${C.same(selected,q.answer)?'回答正确':selected.length?'回答错误':'未作答'}</b></p><p>你的答案：${selected.length?selected.join('、'):'未答'}<br>${q.explanation?.warning?'原站答案（请看核对提示）':'正确答案'}：${q.answer.join('、')}</p><small>答案来源：网站官方答案标记</small></div>${explanation(q)}`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="previous" ${state.index===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="grid">答题卡</button><button class="btn primary" data-action="next" ${show&&state.index===ids.length-1?'disabled':''}>${!show&&state.index===ids.length-1?'检查交卷':'下一题'}</button></nav>`;
}
function navigate(index){stash();state.index=index;save();renderQuestion();window.scrollTo(0,0);}
function grid(){const ids=navList();showDialog('答题卡',`<div class="answer-grid">${ids.map((id,i)=>{const a=state.answers[id]||[];return `<button class="grid-q ${a.length?'done':''} ${review&&!C.same(a,all[id].answer)?'bad':''} ${state.index===i?'current':''}" data-action="jump" data-index="${i}" aria-label="第${i+1}题，${a.length?'已答':'未答'}">${i+1}</button>`}).join('')}</div><p class="legend">绿色：已答${review?' · 红色：错误或未答':''} · 白色：未答</p>`,'<button class="btn" data-action="close-dialog">返回题目</button>');}
function submitDialog(){stash();const n=state.ids.length-answeredCount();showDialog('确认交卷',`<p>本次共 <b>${state.ids.length}</b> 题，已答 <b>${answeredCount()}</b> 题${n?`，还有 <b>${n}</b> 题未答`:''}。</p><p class="muted">交卷后统一计分，错题和未答题会自动收录到错题本。</p>`,`<button class="btn" data-action="close-dialog">继续作答</button><button class="btn primary" data-action="submit">确认交卷并计分</button>`);}
function submit(){if(!state||state.submitted)return;stash();const now=Date.now();state.submitted=true;state.submittedAt=now;write('wrongs',C.updateWrongs(wrongs(),current,state.answers,now));const g=C.grade(current,state.answers),h=read('history:'+scope,[]);write('history:'+scope,[{attempt:state.attempt,score:g.score,total:g.total,correct:g.correct,at:now,kind:state.kind},...h.filter(x=>x.attempt!==state.attempt)].slice(0,20));save();closeDialog();review=false;reviewIds=null;result();window.scrollTo(0,0);}
function result(){const g=C.grade(current,state.answers);root.innerHTML=`<div class="shell">${topbar()}<main class="result"><div class="eyebrow">本次练习已完成</div><h1>${D.page==='wrongs'?'错题重刷成绩':esc(paper().title)}</h1><div class="score">${g.score}<small> 分</small></div><div class="result-rule">练习百分制 · 答对 ${g.correct} / ${g.total} 题 · 用时 ${time(state.elapsedMs)}</div>${notice()}<div class="stats"><div><strong>${g.correct}</strong><span>答对</span></div><div><strong>${g.incorrect}</strong><span>答错</span></div><div><strong>${g.blank}</strong><span>未答</span></div></div><div class="actions"><button class="btn primary" data-action="review-all">查看答案与解析</button>${g.wrongIds.length?'<button class="btn" data-action="review-wrong">查看本次错题</button><button class="btn" data-action="retry">重刷本次错题</button>':''}<button class="btn" data-action="intro">${D.page==='wrongs'?'返回错题本':'返回试卷入口'}</button></div><div class="saved-note">${g.wrongIds.length?`本次 ${g.wrongIds.length} 道错题／未答题已保存至错题本。`:'本次全部答对。之前收录的题已标为“已掌握”，历史仍保留。'}${storageFailed?' 当前浏览器不允许储存，请先解决上方提示。':' 下次打开同一浏览器即可继续复习。'}</div><p class="result-rule" style="margin-top:20px">计分规则：答对题数 ÷ 本次题数 × 100；多选题全部选对才得分。此分数为练习成绩，不是原网站正式考试评分。</p></main></div>`;}

function explanation(q){const x=q.explanation;if(!x)return '<section class="explanation"><h3>本题解析</h3><p>本题说明待核对。</p></section>';const direct=x.optionAnalysis,paras=x.paragraphs||[];return `<section class="explanation"><h3>本题解析</h3>${direct?`<div class="option-analysis">${direct.map(o=>`<p><b>${esc(o.label)} · ${o.selected?'本题应选':'本题不选'}：</b>${esc(o.reason)}</p>`).join('')}</div>`:paras.map(t=>`<p>${esc(t)}</p>`).join('')}${x.warning?`<p class="explanation-warning"><b>原题核对：</b>${esc(x.warning)}</p>`:''}<small>独立整理；有疑义时保留原站评分答案并注明。</small></section>`;}

function startStudy(ids){if(!ids.length){toast('暂无可背的题目');return;}studying=true;studyIds=ids;const saved=read('study:'+scope,null);studyIndex=saved&&ids.includes(saved.id)?ids.indexOf(saved.id):0;studyReveal=true;renderStudy();window.scrollTo(0,0);}
function studyMove(n){studyIndex=Math.max(0,Math.min(studyIds.length-1,n));write('study:'+scope,{id:studyIds[studyIndex],at:Date.now()});renderStudy();window.scrollTo(0,0);}
function renderStudy(){const q=all[studyIds[studyIndex]];write('study:'+scope,{id:q.id,at:Date.now()});root.innerHTML=`<div class="shell"><header class="quiz-head"><div class="quiz-head-row"><div><div class="quiz-title">${esc(q.paperTitle)} · 背题模式</div><div class="quiz-meta">第 ${studyIndex+1} / ${studyIds.length} 题 · 背题不计分，不改变考试进度或错题状态</div></div><button class="btn small" data-action="intro">退出背题</button></div><div class="progress-track"><span style="width:${(studyIndex+1)/studyIds.length*100}%"></span></div></header><main class="question-wrap">${notice()}<div class="q-label"><span class="number">${q.number}</span><span class="pill">${esc(q.type)}</span></div><div class="q-source">${esc(q.book)} 第 ${q.chapter} 章</div>${q.dataset_description?`<details class="dataset"><summary>操作题说明与 Excel 素材</summary><p>${esc(q.dataset_description)}</p>${q.attachments.map(a=>`<a download href="${esc(a.href)}">下载 ${esc(a.name)} ↗</a>`).join('')}</details>`:''}<section class="question-text">${q.question_html}</section><div class="options">${q.options.map(o=>`<div class="option ${studyReveal&&q.answer.includes(o.label)?'is-correct':''}"><span class="option-letter">${esc(o.label)}</span><div class="option-content">${o.html}</div>${studyReveal&&q.answer.includes(o.label)?'<span class="option-tag">正确选项</span>':''}</div>`).join('')}</div><button class="btn" data-action="study-reveal">${studyReveal?'隐藏答案和解析 · 自测':'显示答案和解析'}</button>${studyReveal?`<div class="review-note"><b>${q.explanation?.warning?'原站答案（请看核对提示）':'正确答案'}：${q.answer.join('、')}</b></div>${explanation(q)}`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="study-prev" ${studyIndex===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="study-grid">背题目录</button><button class="btn primary" data-action="study-next" ${studyIndex===studyIds.length-1?'disabled':''}>下一题</button></nav>`;}

function exportProgress(){const backup={format:'excel-practice-backup',version:1,createdAt:Date.now(),entries:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(P))backup.entries[k.slice(P.length)]=JSON.parse(localStorage.getItem(k));}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Excel刷题进度与错题备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出，可保存到手机文件');}
async function importProgress(file){try{if(!file||file.size>10000000)throw Error('备份文件过大或未选择');const b=JSON.parse(await file.text());if(b.format!=='excel-practice-backup'||b.version!==1||!b.entries||typeof b.entries!=='object')throw Error('这不是本程序的备份文件');const checked={};for(const [k,v] of Object.entries(b.entries)){if(k==='wrongs'){if(!v||Array.isArray(v)||typeof v!=='object')throw Error('错题数据格式不正确');checked[k]={};for(const [id,w] of Object.entries(v)){if(!all[id]||w?.id!==id||!Number.isFinite(w.wrongCount)||w.wrongCount<1)throw Error('备份包含未知题目');checked[k][id]={id,wrongCount:w.wrongCount,firstWrong:Number(w.firstWrong)||Date.now(),lastWrong:Number(w.lastWrong)||Date.now(),lastReviewed:Number(w.lastReviewed)||Date.now(),reviews:Number(w.reviews)||0,masteredAt:w.masteredAt?Number(w.masteredAt):null,lastSelection:Array.isArray(w.lastSelection)?w.lastSelection.filter(x=>all[id].options.some(o=>o.label===x)):[]};}}else if(k.startsWith('study:')&&(papers.some(p=>k==='study:'+p.id)||k==='study:all-wrongs')){if(!v||!all[v.id])throw Error('背题进度格式不正确');checked[k]={id:v.id,at:Number(v.at)||Date.now()};}else if(k.startsWith('session:')&&(papers.some(p=>k==='session:'+p.id)||k==='session:all-wrongs')){if(v===null)continue;const s=safeState(v);if(!s)throw Error('作答进度格式不正确');checked[k]=s;}else if(k.startsWith('history:')&&(papers.some(p=>k==='history:'+p.id)||k==='history:all-wrongs')){if(!Array.isArray(v)||v.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100||!Number.isFinite(x.total)))throw Error('成绩记录格式不正确');checked[k]=v.slice(0,20);}}
pendingImport=checked;showDialog('导入备份',`<p>将导入 ${Object.keys(checked.wrongs||{}).length} 道错题历史，并恢复备份中的作答进度。</p><p class="muted">备份中的同名记录会覆盖当前记录。建议先导出当前备份。</p>`,'<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-import">确认导入</button>');}catch(e){toast('无法导入：'+e.message);}}
let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
