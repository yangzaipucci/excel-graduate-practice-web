root.innerHTML=`<div id="home" class="shell">${topbar()}<main><section class="hero"><div><div class="eyebrow">研究生 · EXCEL 专项练习</div><h1>把每一次练习，<br>变成下一次进步。</h1><p>11 套原卷独立作答，交卷即出分。错题自动收录，随时回来再练一次。</p></div><div class="hero-count">1,628<span>道题 · 含 88 道操作题</span></div></section>${notice()}<div class="stats"><div><strong>${completed}<small> / 11</small></strong><span>已交卷的试卷</span></div><div><strong>${answered}</strong><span>当前进度已答</span></div><div><strong>${active.length}</strong><span>待复习错题</span></div></div><section class="wrong-banner"><div><h2>我的错题本</h2><p>${active.length?`${active.length} 道待复习 · ${mastered.length} 道已掌握`:'错题和未答题会在交卷后自动收录'}</p></div><a href="wrongs.html">${active.length?'去重刷错题':'查看错题本'} →</a></section><div class="section-head"><h2>选择一套，开始练习</h2><span class="pill">进度自动保存</span></div><section class="paper-list">${papers.map((p,i)=>{const s=safeState(read('session:'+p.id,null)),h=read('history:'+p.id,[]),n=s?Object.values(s.answers).filter(a=>a.length).length:0;return `<article class="paper-row"><div class="paper-no">${i===10?'冲刺':String(i+1).padStart(2,'0')}</div><div><h3>${esc(p.title)}</h3><p>148 题 · 8 道操作题${h.length?` · 上次 ${h[0].score} 分`:''}</p>${s?`<div class="mini-progress"><span style="width:${n/s.ids.length*100}%"></span></div><p>${s.submitted?'已交卷':`已答 ${n} / ${s.ids.length} 题`}</p>`:''}</div><a href="papers/${p.id}.html">${s?(s.submitted?'查看成绩':'继续作答'):'开始做题'} →</a></article>`}).join('')}</section><section class="backup"><button class="btn small" data-action="export">备份进度与错题</button><button class="btn small" data-action="import">导入备份</button><small>记录保存在当前设备、当前浏览器。更换手机前请先备份；清除浏览器数据会清除记录。</small></section><details class="panel"><summary>手机使用与计分说明</summary><ul class="rules"><li>用手机浏览器打开此链接。可通过浏览器菜单“添加到主屏幕”，以后像小程序一样进入。</li><li>练习分数＝答对题数 ÷ 本次题数 × 100。多选题必须全部选对；少选、多选、选错或未答均计 0 分。这是练习百分制，不代表网站正式考试的题型权重。</li><li>操作题可下载原始 Excel 素材，在 Excel 中操作后再选答案。每道题请从原始数据独立操作。</li><li>答错、未答题都会进入错题本。重刷答对后标为“已掌握”，历史记录仍保留。</li><li>首次完整打开后支持离线访问；手机文件预览器若不能运行网页，请使用已发 function paper(){return papers.find(p=>p.id===D.paperId);}

function intro(){
const p=paper(),isWrong=D.page==='wrongs',active=activeWrongs(isWrong?null:p.id),mastered=masteredWrongs(isWrong?null:p.id),draft=safeState(read('session:'+scope,null));
root.innerHTML=`<div class="shell">${topbar()}<main class="intro"><div class="eyebrow">${isWrong?'专项复习':'独立试卷'}</div><h1>${isWrong?'我的错题本':esc(p.title)}</h1><p class="muted">${isWrong?'把做错的题，再认真做对一次。答对会标为已掌握，历史不丢失。':'作答时隐藏答案，交卷后统一评分。离开页面也会保留进度。'}</p>${notice()}${isWrong?`<div class="wrong-stats"><span class="pill">待复习 ${active.length} 题</span><span class="pill">已掌握 ${mastered.length} 题</span></div>${draft&&!draft.submitted?`<div class="panel"><h2>上次的错题练习还没完成</h2><p class="muted">已答 ${Object.keys(draft.answers).length} / ${draft.ids.length} 题</p><button class="btn primary" data-action="resume">继续重刷</button></div>`:''}<div class="actions">${active.length?'<button class="btn primary" data-action="begin-wrongs">重刷全部待复习错题</button>':''}</div>${!active.length?`<div class="empty">${mastered.length?'当前错题都已掌握。可以在下面把想复习的题重新加入。':'还没有错题。先去做一套试卷，交卷后会自动收录。'}</div>`:''}<div class="history-list"><h2>待复习题目</h2>${active.length?wrongHistory(active):'<p class="muted">暂无待复习题目</p>'}</div>${mastered.length?`<details class="panel"><summary>已掌握历史 · ${mastered.length} 题</summary>${wrongHistory(mastered)}</details>`:''}`:`${draft?`<div class="panel"><h2>${draft.submitted?'上次练习已交卷':'继续上次练习'}</h2><p class="muted">已答 ${Object.keys(draft.answers).length} / ${draft.ids.length} 题 · 用时 ${time(draft.elapsedMs)}</p><button class="btn primary" data-action="resume">${draft.submitted?'查看上次成绩':'继续作答'}</button></div>`:''}<div class="panel"><h2>开始一次新练习</h2><label class="choice"><input type="radio" name="range" value="all" checked>整套试卷 <small>148 题</small></label><label class="choice"><input type="radio" name="range" value="operations">只刷操作题 <small>第 141—148 题，共 8 题</small></label><div class="actions"><button class="btn primary" data-action="begin-paper">开始新练习</button>${active.length?`<button class="btn" data-action="begin-wrongs">本卷错题 · ${active.length}</button>`:''}</div></div>`}<div class="panel"><h2>本次计分规则</h2><p class="muted">每题等权，答对题数 ÷ 本次题数 × 100。多选题全部选对才得分，未答计 0 分。成绩为练习分，不采用原网站未核实的考试题型权重。</p></div><a function begin(ids,kind,confirmed=false){
if(!ids.length){toast('当前没有待复习错题');return;}
const old=safeState(read('session:'+scope,null));
if(old&&!old.submitted&&!confirmed){showDialog('开始新的练习？','<p>这会替换当前未交卷的作答进度。已保存的错题与历史成绩会继续保留。</p>','<button class="btn" data-action="close-dialog">保留当前进度</button><button class="btn primary" data-action="confirm-new">开始新练习</button>');pending={ids,kind};return;}
closeDialog();state={version:1,attempt:Date.now()+'-'+Math.random().toString(36).slice(2),ids,kind,answers:{},index:0,elapsedMs:0,startedAt:Date.now(),submitted:false};current=ids.map(id=>all[id]);review=false;reviewIds=null;tick=Date.now();save();renderQuestion();window.scrollTo(0,0);
}
let pending=null;
function resume(){state=safeState(read('session:'+scope,null));if(!state)return intro();current=state.ids.map(id=>all[id]);review=false;reviewIds=null;tick=Date.now();if(state.submitted)result();else renderQuestion();}
function navList(){return reviewIds||state.ids;}

function renderQuestion(){
const ids=navList(),q=all[ids[state.index]],selected=state.answers[q.id]||[],show=review;
root.innerHTML=`<div class="shell"><header class="quiz-head"><div class="quiz-head-row"><div><div class="quiz-title">${D.page==='wrongs'?'错题重刷':esc(paper().title)}${show?' · 答案回顾':''}</div><div class="quiz-meta">${show?`第 ${state.index+1} / ${ids.length} 题`:`已答 ${answeredCount()} / ${state.ids.length} 题`} · <span id="timer">${time(state.elapsedMs)}</span></div></div><button class="btn small" data-action="${show?'result':'submit-dialog'}">${show?'返回成绩':'交卷'}</button></div><div class="progress-track"><span style="width:${show?(state.index+1)/ids.length*100:answeredCount()/state.ids.length*100}%"></span></div></header><main class="question-wrap">${notice()}<div class="q-label"><span class="number">${state.index+1}<small> / ${ids.length}</small></span><span class="pill">${esc(q.type)}</span>${q.type==='多选题'?'<small>可选择多项</small>':''}</div><div class="q-source">${esc(q.paperTitle)} · 原第 ${q.number} 题 · ${esc(q.book)} 第 ${q.chapter} 章</div>${q.dataset_description?`<details class="dataset"><summary>操作题说明与 Excel 素材</summary><p>${esc(q.dataset_description)}</p>${q.attachments.map(a=>`<a download href="${esc(a.href)}">下载 ${esc(a.name)} ↗</a>`).join('')}</details>`:''}<section class="question-text" id="question" aria-live="polite">${q.question_html}</section><div class="options" role="group" aria-labelledby="question">${q.options.map(o=>`<label class="option ${selected.includes(o.label)?'selected':''} ${show&&q.answer.includes(o.label)?'is-correct':''} ${show&&selected.includes(o.label)&&!q.answer.includes(o.label)?'is-wrong':''}"><input type="${q.type==='多选题'?'checkbox':'radio'}" name="answer" value="${esc(o.label)}" ${selected.includes(o.label)?'checked':''} ${show?'disabled':''}><span class="option-letter">${esc(o.label)}</span><div class="option-content">${o.html}</div>${show&&q.answer.includes(o.label)?'<span class="option-tag">正确选项</span>':''}</label>`).join('')}</div>${show?`<div class="review-note ${C.same(selected,q.answer)?'':'wrong'}"><p><b>${C.same(selected,q.answer)?'回答正确':selected.length?'回答错误':'未作答'}</b></p><p>你的答案：${selected.length?selected.join('、'):'未答'}<br>正确答案：${q.answer.join('、')}</p><small>来源：网站官方答案标记</small></div>`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="previous" ${state.index===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="grid">答题卡</button><button class="btn primary" data-action="next" ${show&&state.index===ids.length-1?'disabled':''}>${!show&&state.index===ids.length-1?'检查交卷':'下一题'}</button></nav>`;
}
function navigate(index){stash();state.index=index;save();renderQuestion();window.scrollTo(0,0);}
function grid(){const ids=navList();showDialog('答题卡',`<div class="answer-grid">${ids.map((id,i)=>{const a=state.answers[id]||[];return `<button class="grid-q ${a.length?'done':''} ${review&&!C.same(a,all[id].answer)?'bad':''} ${state.index===i?'current':''}" data-action="jump" data-index="${i}" aria-label="第${i+1}题，${a.length?'已答':'未答'}">${i+1}</button>`}).join('')}</div><p class="legend">绿色：已答${review?' · 红色：错误或未答':''} · 白色：未答</p>`,'<button class="btn" data-action="close-dialog">返回题目</button>');}
function submitDialog(){stash();const n=state.ids.length-answeredCount();showDialog('确认交卷',`<p>本次共 <b>${state.ids.length}</b> 题，已答 <b>${answeredCount()}</b> 题${n?`，还有 <b>${n}</b> 题未答`:''}。</p><p class="muted">交卷后统一计分，错题和未答题会自动收录到错题本。</p>`,`<button class="btn" data-action="close-dialog">继续作答</button><button class="btn primary" data-action="submit">确认交卷并计分</button>`);}
function submit(){if(!state||state.submitted)return;stash();const now=Date.now();state.submitted=true;state.submittedAt=now;write('wrongs',C.updateWrongs(wrongs(),current,state.answers,now));const g=C.grade(current,state.answers),h=read('history:'+scope,[]);write('history:'+scope,[{attempt:state.attempt,score:g.score,total:g.total,correct:g.correct,at:now,kind:state.kind},...h.filter(x=>x.attempt!==state.attempt)].slice(0,20));save();closeDialog();review=false;reviewIds=null;result();window.scrollTo(0,0);}
function result(){const g=C.grade(current,state.answers);root.innerHTML=`<div class="shell">${topbar()}<main class="result"><div class="eyebrow">本次练习已完成</div><h1>${D.page==='wrongs'?'错题重刷成绩':esc(paper().title)}</h1><div class="score">${g.score}<small> 分</small></div><div class="result-rule">练习百分制 · 答对 ${g.correct} / ${g.total} 题 · 用时 ${time(state.elapsedMs)}</div>${notice()}<div class="stats"><div><strong>${g.correct}</strong><span>答对</span></div><div><strong>${g.incorrect}</strong><span>答错</span></div><div><strong>${g.blank}</strong><span>未答</span></div></div><div class="actions"><button class="btn primary" data-action="review-all">查看全部答案</button>${g.wrongIds.length?'<button class="btn" data-action="review-wrong">查看本次错题</button><button class="btn" data-action="retry">重刷本次错题</button>':''}<button class="btn" data-action="intro">${D.page==='wrongs'?'返回错题本':'返回试卷入口'}</button></div><div class="saved-note">${g.wrongIds.length?`本次 ${g.wrongIds.length} 道错题／未答题已保存至错题本。`:'本次全部答对。之前收录的题已标为“已掌握”，历史仍保留。'}${storageFailed?' 当前浏览器不允许储存，请先解决上方提示。':' 下次打开同一浏览器即可继续复习。'}</div><p class="result-rule" style="margin-top:20px">计分规则：答对题数 ÷ 本次题数 × 100；多选题全部选对才得分。此分数为练习成绩，不是原网站正式考试评分。</p></main></div>`;}
function exportProgress(){const backup={format:'excel-practice-backup',version:1,createdAt:Date.now(),entries:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(P))backup.entries[k.slice(P.length)]=JSON.parse(localStorage.getItem(k));}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Excel刷题进度与错题备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出，可保存到手机文件');}
async function importProgress(file){try{if(!file||file.size>10000000)throw Error('备份文件过大或未选择');const b=JSON.parse(await file.text());if(b.format!=='excel-practice-backup'||b.version!==1||!b.entries||typeof b.entries!=='object')throw Error('这不是本程序的备份文件');const checked={};for(const [k,v] of Object.entries(b.entries)){if(k==='wrongs'){if(!v||Array.isArray(v)||typeof v!=='object')throw Error('错题数据格式不正确');checked[k]={};for(const [id,w] of Object.entries(v)){if(!all[id]||w?.id!==id||!Number.isFinite(w.wrongCount)||w.wrongCount<1)throw Error('备份包含未知题目');checked[k][id]={id,wrongCount:w.wrongCount,firstWrong:Number(w.firstWrong)||Date.now(),lastWrong:Number(w.lastWrong)||Date.now(),lastReviewed:Number(w.lastReviewed)||Date.now(),reviews:Number(w.reviews)||0,masteredAt:w.masteredAt?Number(w.masteredAt):null,lastSelection:Array.isArray(w.lastSelection)?w.lastSelection.filter(x=>all[id].options.some(o=>o.label===x)):[]};}}else if(k.startsWith('session:')&&(papers.some(p=>k==='session:'+p.id)||k==='session:all-wrongs')){const s=safeState(v);if(!s)throw Error('作答进度格式不正确');checked[k]=s;}else if(k.startsWith('history:')&&(papers.some(p=>k==='history:'+p.id)||k==='history:all-wrongs')){if(!Array.isArray(v)||v.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100||!Number.isFinite(x.total)))throw Error('成绩记录格式不正确');checked[k]=v.slice(0,20);}}
pendingImport=checked;showDialog('导入备份',`<p>将导入 ${Object.keys(checked.wrongs||{}).length} 道错题历史，并恢复备份中的作答进度。</p><p class="muted">备份中的同名记录会覆盖当前记录。建议先导出当前备份。</p>`,'<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-import">确认导入</button>');}catch(e){toast('无法导入：'+e.message);}}
let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
