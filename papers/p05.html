</style></head><body><div id="app"></div><dialog id="modal"></dialog><input type="file" id="import-file" accept="application/json,.json" hidden><script>const APP_DATA={"page":"paper","paperId":"p05","papers":[{"id":"p05","title":"Excel 模拟卷 05","originalTitle":"26模拟试卷(Excel) -05","source":"https://www.zlbbda.com.cn/studysome/exercise?testPapeId=171","questions":[{"number":1,"type":"判断题","book":"《大数据分析素养》","chapter":1,"question":"探索性数据分析需要明确的假设（  ）。","answer":["B"],"dataset_description":null,"id":"p05:1","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>探索性数据分析需要明确的假设\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":2,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"为了确保营销策略的有效性和市场竞争力，企业无需定期对目标市场进行评估和调整（  ）。","answer":["B"],"dataset_description":null,"id":"p05:2","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>为了确保营销策略的有效性和市场竞争力，企业无需定期对目标市场进行评估和调整\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["需求、竞争和自身能力会变化，目标市场应持续评估，必要时调整，因此“无需定期评估和调整”错误。"],"warning":""},"attachments":[]},{"number":3,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"确定竞争对手需要查看行业内各企业的市场份额和排名，了解企业在行业中的地位和影响力（  ）。","answer":["A"],"dataset_description":null,"id":"p05:3","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan> ":2,"question":"深入了解目标消费者的需求、偏好、购买行为，以便开发符合市场需求的产品或服务属于市场机会分析（  ）。","answer":["A"],"dataset_description":null,"id":"p05:7","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>深入了解目标消费者的需求、偏好、购买行为，以便开发符合市场需求的产品或服务属于市场机会分析\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["了解需求、偏好和购买行为可以发现未满足需求，进而判断新产品或服务机会，因此属于市场机会分析，判对。"],"warning":""},"attachments":[]},{"number":8,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"分词、主题模型、情感分析不属于文本分析（  ）。","answer":["B"],"dataset_description":null,"id":"p05:8","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>分词、主题模型、情感分析不属于文本分析\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":9,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"饼图可以判断增加广告投放是否能有效提升销售额（  ）。","answer":["B"],"dataset_description":null,"id":"p05:9","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>饼图可以判断增加广告投放是否能有效提升销售额\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":10,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"数据存储是简单地保存数据（  ）。","answer":["B"],"dataset_description":null,"id":"p05:10","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>数据存储是简单地保存数据\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据结构、数据库与存储","paragraphs":["结构化数据具有明确模式，如关系表的行列；半结构化数据有标签或键等组织方式，如 JSON、XML；非结构化数据如图片、音视频和自由文本。来源内部或外部与结构类型是两个不同维度。","NoSQL 常包括键值、文档、列族和图等模型，不是只能存文本或只能用表格。关系数据库以表和关系为主要模型，数据模型与物理存储方式不能混为一谈。","存储需兼顾容量扩展、检索效率、备份恢复、权限和安全；加密主要保护保密性，不能单靠更严格加密来解决容量增长。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"来源和结构分开看；NoSQL 不只键值一种。","source":""},"attachments":[]},{"number":11,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"居民消费价格指数不属于宏观经济数据（  ）。","answer":["B"],"dataset_description":null,"id":"p05:11","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>居民消费价格指数不属于宏观经济数据\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"居民消费价格指数","paragraphs":["CPI 衡量居民消费品和服务价格水平的变动，常用于分析通货膨胀和居民购买力，是典型宏观经济指标。","题干说它“不属于宏观经济数据”，否定了其实际用途，因此错误。"],"warning":""},"attachments":[]},{"number":12,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"企业内部数据是企业运营和决策的重要基础资源（  ）。","answer":["A"],"dataset_description":null,"id":"p05:12","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>企业内部数据是企业运营和决策的重要基础资源\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":13,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"数据集成不属于数据处理流程（  ）。","answer":["B"],"dataset_description":null,"id":"p05:13","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>数据集成不属于数据处理流程\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":14,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"公司产品价格是绝对指标（  ）。","answer":["B"],"dataset_description":null,"id":"p05:14","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>公司\u003c/span>\u003cspan>产品价格\u003c/span>\u003cspan>是绝对指标\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":15,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"总量指标是没有计量单位的统计绝对数（  ）。","answer":["B"],"dataset_description":null,"id":"p05:15","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>总量指标是没有计量单位的统计绝对数\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":16,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"强度相对数也称强度相对指标（  ）。","answer":["A"],"dataset_description":null,"id":"p05:16","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>强度相对数也称强度相对指标\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":17,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"有名数可以根据不同的情况分别采用倍数、成数、系数、百分数、千分数来表示（  ）。","answer":["B"],"dataset_description":null,"id":"p05:17","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>有名数可以根据不同的情况分别采用倍数、成数、系数、百分数、千分数来表示\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"有名数与无名数","paragraphs":["有名数带有具体计量单位，如10人、5吨、200元；无名数通常是不带具体实物单位的比值，如倍数、百分数和系数。","题干将无名数常用的表达方式套在有名数上，因此判错。百分数的分子与分母必须具有可比口径。"],"warning":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"偶然误差又称随机误差（  ）。","answer":["A"],"dataset_description":null,"id":"p05:18","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>偶然误差又称随机误差（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本容量主要由精确度、同质性、财力、抽样类型、分析类别等因素决定（  ）。","answer":["A"],"dataset_description":null,"id":"p05:19","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>样本容量主要由精确度、同质性、财力、抽样类型、分析类别等因素决定（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"抽签法规定总体中的所有个体编号必须从1到N。","answer":["B"],"dataset_description":null,"id":"p05:20","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>抽签法规定总体中的所有个体编号必须从1到N。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"总体平均有算术平均，几何平均，平方平均，调和平均，和加权平均（  ）。","answer":["A"],"dataset_description":null,"id":"p05:21","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>总体平均有算术平均，几何平均，平方平均，调和平均，和加权平均（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"根据总体单位排列方法，等距抽样的单位排列可分为按有关标志排队，按无关标志排队，以及介于按有关标志排队和按无关标志排队之间的按自然状态排列。","answer":["A"],"dataset_description":null,"id":"p05:22","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>根据总体单位排列方法，等距抽样的单位排列可分为按有关标志排队，按无关标志排队，以及介于按有关标志排队和按无关标志排队之间的按自然状态排列\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"群通常是由那些地理位置邻近的或隶属于同一系统的单位所构成（  ）。","answer":["A"],"dataset_description":null,"id":"p05:23","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>群通常是由那些地理位置邻近的或隶属于同一系统的单位所构成\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整群抽样中的群","paragraphs":["整群抽样先把总体划分为若干群，再抽取部分群，对被抽中群内的单位调查。群可以按地域邻近、学校班级或组织系统等自然边界形成。","所以题干对群的常见构成方式描述正确。需注意整群与分层不同：抽群通常希望群内有异质性、群间有一定相似性。"],"warning":""},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本比例的抽样分布就是所有样本比例的可能取值形成的概率分布（  ）。","answer":["A"],"dataset_description":null,"id":"p05:24","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>样本比例的抽样分布就是所有样本比例的可能取值形成的概率分布（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"滚雪球抽样是一种适用范围广，成本低廉，可以获得深入信息的非概率性抽样方法（  ）。","answer":["B"],"dataset_description":null,"id":"p05:25","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>滚雪球抽样是一种适用范围广，成本低廉，可以获得深入信息的非概率性抽样方法（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"滚雪球抽样","paragraphs":["先找到少量符合条件的对象，再请其推荐其他符合条件者，如此扩展样本。它通常用于难以建立抽样框、隐蔽或不易接触的人群。","优势是进入特殊群体较容易、能获得较深入的信息；局限是依赖关系网络，样本可能集中于某些圈子，入样概率通常未知，不能据此保证总体代表性或无偏。","“任何人群都适用、误差必然更小、可直接作严格概率推断”都超过了这种方法能保证的范围。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"滚雪球靠推荐，适合难接触群体；网络偏差要警惕。","source":""},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"抽样极限误差保证样本指标与总体指标之间的抽样误差不超过某一给定的最大可能范围（  ）。","answer":["A"],"dataset_description":null,"id":"p05:26","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>抽样极限误差保证样本指标与总体指标之间的抽样误差不超过某一给定的最大可能范围（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"抽样极限误差与概率度","paragraphs":["常见教材记号为 Δ=z×SE：Δ 是给定置信水平下的抽样误差界限，SE 是抽样标准误，z 是相应的概率度或临界值。三者不是互相独立的量。","固定标准误时，要求更高置信水平需要更大的 z 和更宽的误差界限；固定误差界限而提高置信水平，则要降低标准误，通常需要增大样本量。","这里的“最大误差”是对应概率保证程度的界限，并非随机抽样所有可能结果都绝对不会越界。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"误差界限=临界值×标准误。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"统计总体具有大量性,同质性,和差异性三个特征（  ）。","answer":["A"],"dataset_description":null,"id":"p05:27","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>统计总体具有大量性,同质性,和差异性三个特征（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"置信水平和显著性水平之间不存在任何关系（ ）。","answer":["B"],"dataset_description":null,"id":"p05:28","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>置信水平和显著性水平之间不存在任何关系\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"归纳推理是基于逻辑必然性的（ ）。","answer":["B"],"dataset_description":null,"id":"p05:29","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>归纳推理是基于逻辑必然性的\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"假设检验是一种统计推断方法（ ）。","answer":["A"],"dataset_description":null,"id":"p05:30","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>假设检验\u003cspan>是一种统计推断方法\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"样本数据推断总体特征的方法称为推断统计（ ）。","answer":["A"],"dataset_description":null,"id":"p05:31","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>样本数据推断总体特征的方法称为推断统计\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"显著性水平不变,可能出现单侧检验拒绝原假设,而双侧检验不拒绝原假设（ ）。","answer":["A"],"dataset_description":null,"id":"p05:32","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>显著性水平不变,可能出现单侧检验拒绝原假设,而双侧检验不拒绝原假设\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"假设检验将问题转化为两个不重叠且对立的假设，通过样本数据判断哪个假设是真的（ ）。","answer":["B"],"dataset_description":null,"id":"p05:33","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>假设检验将问题转化为两个不重叠且对立的假设，通过样本数据判断哪个假设是真的（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据有多样的数据类型（ ）。","answer":["A"],"dataset_description":null,"id":"p05:34","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>大数据有多样的数据类型（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":35,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"真实性是大数据价值的基础（ ）。","answer":["A"],"dataset_description":null,"id":"p05:35","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>真实性是大数据价值的基础（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":36,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"社交网络和微博产生的日志数据属于大数据的一种（ ）。","answer":["A"],"dataset_description":null,"id":"p05:36","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>社交网络和微博产生的日志数据属于大数据的一种\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":37,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"方差分析的因子总是一元的（ ）。","answer":["B"],"dataset_description":null,"id":"p05:37","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>方差分析的因子总是\u003c/span>\u003cspan>一元的（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":38,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"单纯形法所求线性规划的最优解不一定是唯一的（ ）。","answer":["A"],"dataset_description":null,"id":"p05:38","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>单纯形法所求线性规划的最优解不一定是唯一的\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":39,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"降维技术是指在保证数据所具有的代表性特性情况下,将高维数据转化为低维数据的过程（  ）。","answer":["A"],"dataset_description":null,"id":"p05:39","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>降维技术是指在保证数据所具有的代表性特性情况下,将高维数据转化为低维数据的过程（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"降维与特征表示","paragraphs":["降维将高维特征映射或筛选为较少维度，在尽量保留重要结构和信息的同时降低冗余、噪声与计算成本。通常是高维到低维，而不是反过来扩维。","特征选择保留原特征的子集；特征提取构造新特征，如主成分分析以方差方向构造线性组合。降维一般存在信息取舍，不能保证毫无信息损失或必然提高所有模型准确率。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"降维减少特征维度；选择保留原列，提取产生新列。","source":""},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"根据信息增益构造的决策树是递归决策树（  ）。","answer":["B"],"dataset_description":null,"id":"p05:40","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>根据信息增益构造的决策树是递归决策树\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下列关于数据筛选的描述，正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p05:41","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于数据筛选的描述，正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"满足条件的数据显示出来，而删除掉不满足条件的数据"},{"label":"B","html":"不满足条件的数据用另外一个表格保存"},{"label":"C","html":"不满足条件的数据暂时隐藏起来，只显示满足条件的数据"},{"label":"D","html":"将满足条件的数据重点显示"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：不满足条件的数据暂时隐藏起来，只显示满足条件的数据”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":42,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下面关于数据价值的说法，正确的选项是（   ）？","answer":["C"],"dataset_description":null,"id":"p05:42","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下面关于数据价值的说法，正确的选项是（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>数据存在规律\u003c/p>"},{"label":"B","html":"\u003cp>数据的生成取决人的意志\u003c/p>"},{"label":"C","html":"\u003cp>数据分析用于发现数据中的规律\u003c/p>"},{"label":"D","html":"\u003cp>数据一定具有价值\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：数据分析用于发现数据中的规律”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":43,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"通过数据分析，企业管理者可以达到管理目标，下面关于数据分析目标的说法，不正确的是（   ）？","answer":["D"],"dataset_description":null,"id":"p05:43","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>通过数据分析，企业管理者可以达到管理目标，下面关于数据分析目标的说法，不正确的是（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"企业现状分析。"},{"label":"B","html":"运营过程中的原因分析。"},{"label":"C","html":"利用数据分析预测未来。"},{"label":"D","html":"以上三个都不正确。"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：以上三个都不正确。”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":44,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"下列关于指标体系的说法中，不正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p05:44","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于指标体系的说法中，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"指标体系，是指通过不同维度的指标，以量化的方式来表达业务问题。"},{"label":"B","html":"建立指标体系，从不同维度对其业务进行梳理，把业务有系统地组织起来。"},{"label":"C","html":"数据分析师可以单独设计业务指标体系。"},{"label":"D","html":"通过业务指标体系对业务进行监控，最大化地减少损失。"}],"explanation":{"topic":"本题解析","paragraphs":["业务指标体系需要业务、管理和数据人员共同确认目标、流程及统计口径，分析师不宜脱离业务单独设计，故 C 不正确。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"多个维度量化业务问题，符合指标体系作用。"},{"label":"B","selected":false,"reason":"指标有系统地组织业务，符合体系化要求。"},{"label":"C","selected":true,"reason":"指标口径需要业务、管理与数据人员共同确认，不能由分析师脱离业务单独决定。"},{"label":"D","selected":false,"reason":"体系可以支持业务监控，符合其用途；并非承诺能消除一切损失。"}]},"attachments":[]},{"number":45,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"在买方市场条件下,下述哪一种观念是正确的(    )？","answer":["C"],"dataset_description":null,"id":"p05:45","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>在买方市场条件下,下述哪一种观念是正确的( &nbsp; &nbsp;)？ \u003c/span>\u003c/p>","options":[{"label":"A","html":"推销观念"},{"label":"B","html":"生产观念"},{"label":"C","html":"市场营销观念"},{"label":"D","html":"产品观念"}],"explanation":{"topic":"本题解析","paragraphs":["买方市场中选择较多、竞争较强，企业应从顾客需求出发创造价值，属于市场营销观念，选 C。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"推销观念着重卖出现有产品，未以买方需求为起点。"},{"label":"B","selected":false,"reason":"生产观念强调供应和效率，不能充分应对买方有更多选择的情形。"},{"label":"C","selected":true,"reason":"买方市场应从顾客需求出发创造价值，符合市场营销观念。"},{"label":"D","selected":false,"reason":"产品观念偏重产品本身，容易忽略顾客真正需要什么。"}]},"attachments":[]},{"number":46,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"战略分析必须在企业经营活动之前制定，下面关于战略的说法，正确的是(    )。","answer":["B"],"dataset_description":null,"id":"p05:46","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>战略\u003c/span>\u003cspan>分析必须在企业经营活动之前制定，下面关于战略的说法，正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"行为模式"},{"label":"B","html":"计划"},{"label":"C","html":"定位"},{"label":"D","html":"计谋"}],"explanation":{"topic":"本题解析","paragraphs":["题干强调“经营活动之前制定”，对应战略作为事先计划，选 B。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"行为模式侧重已经表现出的行为规律，不突出“事前制定”。"},{"label":"B","selected":true,"reason":"“经营活动之前制定”强调事先安排，正对应计划。"},{"label":"C","selected":false,"reason":"定位侧重企业处于什么市场位置，不是题干所强调的时间特征。"},{"label":"D","selected":false,"reason":"计谋强调竞争中的具体手段，不是题干事前整体安排的核心含义。"}]},"attachments":[]},{"number":47,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"把数据各个类别的相应频数全部列出并用表格形式表现出来称为（   ）。","answer":["B"],"dataset_description":null,"id":"p05:47","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>把数据各个类别的相应频数全部列出并用表格形式表现出来称为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"频数"},{"label":"B","html":"频数分布"},{"label":"C","html":"频率"},{"label":"D","html":"累计频数"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：频数分布”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"下述关于数据分组整理的说法,正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p05:48","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下述关于数据分组整理的说法,正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"把数据按大小顺序排成一列"},{"label":"B","html":"按便于观察数据分布的特征来分组"},{"label":"C","html":"把数据按大小分成若干小组,累计各小组的数据个数"},{"label":"D","html":"把数据的平均数，中位数计算出来"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：把数据按大小分成若干小组,累计各小组的数据个数”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"企业可以从国际专利局的服务器上收集竞争对手的专利数据。中国专利法所指专利不包括（   ）。","answer":["C"],"dataset_description":null,"id":"p05:49","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>企业可以从国际专利局的服务器上收集竞争对手的专利数据。\u003c/span>\u003cspan>中国专利法所指专利不包括（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"外观"},{"label":"B","html":"\u003cp>实用新型\u003c/p>"},{"label":"C","html":"植物专利"},{"label":"D","html":"发明"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：植物专利”。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"按照所反映业务的内容和特点，业务指标可分为数量指标和质量指标,下述哪些选项属于质量指标(   )?","answer":["B"],"dataset_description":null,"id":"p05:50","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>按照所反映业务的内容和特点，业务指标可分为数量指标和质量指标,下述哪些选项属于质量指标( &nbsp; )?\u003c/span>\u003c/p>","options":[{"label":"A","html":"产品销售数量"},{"label":"B","html":"单位产品利润"},{"label":"C","html":"企业员工总数"},{"label":"D","html":"利润总额"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：单位产品利润”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"恩格尔系数是指食品支出在家庭支出中的比重。随着我国经济的发展，恩格尔系数在下降，这说明（   ）。","answer":["B"],"dataset_description":null,"id":"p05:51","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>恩格尔系数是指食品支出在家庭支出中的比重。随着我国经济的发展，恩格尔系数在下降，这说明（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"我国家庭的消费意识滞后"},{"label":"B","html":"我国的家庭收入水平在提高"},{"label":"C","html":"我国家庭的消费意识增强"},{"label":"D","html":"我国家庭的收入水平在下降"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：我国的家庭收入水平在提高”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"相对指标是两个（     ）对比计算的比率。","answer":["A"],"dataset_description":null,"id":"p05:52","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>相对指标是两个（ &nbsp; &nbsp; ）对比计算的比率。\u003c/span>\u003c/p>","options":[{"label":"A","html":"有联系的指标"},{"label":"B","html":"不相干的指标"},{"label":"C","html":"任意指标"},{"label":"D","html":"内部指标"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：有联系的指标”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"按（     ）的不同,业务指标可以被分为实物指标和价值指标。","answer":["A"],"dataset_description":null,"id":"p05:53","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>按（ &nbsp; &nbsp; ）的不同,业务指标可以被分为实物指标和价值指标。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"计量单位"},{"label":"B","html":"总体"},{"label":"C","html":"内容"},{"label":"D","html":"性质"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：计量单位”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列对抽样误差的描述正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p05:54","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列对抽样误差的描述正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>由抽样所引起的误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本分布可近似看作正偏分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>提高观测精度可减小抽样误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>减少样本容量可减少抽样误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：由抽样所引起的误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"为了了解使用有机农业技术的农民所占的比例，以下的抽样方式，正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p05:55","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>为了了解使用有机农业技术的农民所占的比例，以下的抽样方式，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>在全国范围内随机抽取若干个县，再对这些县内的全部农民进行调查\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan> \u003c/span>在全国范围内按农民姓名拼音排序后，等间隔抽取调查对象\u003c/p>"},{"label":"C","html":"\u003cp>在全国范围内随机抽取少量农民作为调查对象\u003c/p>"},{"label":"D","html":"\u003cp>只选择某一个农业大县的农民进行调查\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：在全国范围内随机抽取若干个县，再对这些县内的全部农民进行调查”。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"统计数据误差的来源是（ ）。","answer":["A"],"dataset_description":null,"id":"p05:56","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>统计数据误差的来源是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>既有登记性误差,也有代表性误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>只有登记性误差,没有代表性误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>没有登记性误差,只有代表性误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>既没有登记性误差,也没有代表性误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：既有登记性误差,也有代表性误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本，以下错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p05:57","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于样本，以下错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 在实际工作中，有必要对总体所有单位逐一进行研究\u003c/p>"},{"label":"B","html":"\u003cp> 样本是从总体中随机抽取的一部分单位\u003c/p>"},{"label":"C","html":"\u003cp>通过对样本的观察研究，去推论和估计总体情况\u003c/p>"},{"label":"D","html":"\u003cp> 样本的指标称为统计量\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：在实际工作中，有必要对总体所有单位逐一进行研究”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面不是顺序统计量的是（   ）。","answer":["D"],"dataset_description":null,"id":"p05:58","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下面不是顺序统计量的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"中位数"},{"label":"B","html":"\u003cp>四分位数\u003c/p>"},{"label":"C","html":"\u003cp>百分位数\u003c/p>"},{"label":"D","html":"\u003cp>算术平均数\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：算术平均数”。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于样本均值抽样分布的描述，哪一个选项是错误的（    ）？","answer":["D"],"dataset_description":null,"id":"p05:59","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下面关于样本均值抽样分布的描述，哪一个选项是错误的（ &nbsp; &nbsp;）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"抽样分布由不断抽取容量为n的样本并计算样本均值后构成"},{"label":"B","html":"均值抽样分布的均值为总体均值"},{"label":"C","html":"当样本容量充分大时，抽样分布服从近似正态分布"},{"label":"D","html":"均值抽样分布的标准差为总体标准差"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：均值抽样分布的标准差为总体标准差”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于抽样误差,下列叙述不正确的是（ ）。","answer":["A"],"dataset_description":null,"id":"p05:60","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于抽样误差,下列叙述不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>能够被控制和消除\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>增加样本量可以减小抽样误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>改进抽样方法使样本更具代表性可以减小抽样误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>选择变异程度小的研究指标可以减少抽样误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：能够被控制和消除”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于有限统汁总体的是（  ）。","answer":["D"],"dataset_description":null,"id":"p05:61","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下不属于有限统汁总体的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>人口总数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>企业数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>商店数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>连续大量生产产品的总产量\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：连续大量生产产品的总产量”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于参数和统计量的描述，错误的选项是（  ）。","answer":["C"],"dataset_description":null,"id":"p05:62","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于\u003c/span>\u003cspan>参数和统计量\u003c/span>\u003cspan>的描述，错误的选项是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>参数与总体对应\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>统计量与样本对应\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>参数是已知的\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>参数是未知的\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：参数是已知的”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列对统计推断的参数估计的描述中，有误的是（   ）。","answer":["D"],"dataset_description":null,"id":"p05:63","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列对统计推断的参数估计的描述中，有误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"通过对样本观察值的分析来估计和推断，即根据样本来推断总体分布的未知参数，称为参数估计"},{"label":"B","html":"参数估计有两种基本形式，点估计和区间估计"},{"label":"C","html":"通常用无偏性和有效性作为评价点估计优良性的标准"},{"label":"D","html":"点估计和区间估计都体现了估计的精度"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：点估计和区间估计都体现了估计的精度”。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下特殊人群不可以用滚雪球抽样法的是（  ）。","answer":["A"],"dataset_description":null,"id":"p05:64","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下特殊人群不可以用滚雪球抽样法的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>大学校园中的学生\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>女性同性恋\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>无家可归者\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>流动劳工\u003c/span>\u003c/p>"}],"explanation":{"topic":"滚雪球抽样","paragraphs":["先找到少量符合条件的对象，再请其推荐其他符合条件者，如此扩展样本。它通常用于难以建立抽样框、隐蔽或不易接触的人群。","优势是进入特殊群体较容易、能获得较深入的信息；局限是依赖关系网络，样本可能集中于某些圈子，入样概率通常未知，不能据此保证总体代表性或无偏。","“任何人群都适用、误差必然更小、可直接作严格概率推断”都超过了这种方法能保证的范围。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：大学校园中的学生”。"],"tip":"滚雪球靠推荐，适合难接触群体；网络偏差要警惕。","source":""},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"从一个红细胞总体平均值为5.0×1012个/L总体中抽取10个观察单位，其均值为4.9×1012个/L，与总体均值之间的差异是（ ）。","answer":["C"],"dataset_description":null,"id":"p05:65","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>从一个红细胞总体平均值为5.0×1012个/L总体中抽取10个观察单位，其均值为4.9×1012个/L，与总体均值之间的差异是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>绝对误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随机测量误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>均值的抽样误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>系统误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["样本均值4.9×10¹²与总体均值5.0×10¹²之间，因抽取不同观察单位而产生的差异属于均值抽样误差，选 C。","题干没有指出测量仪器出错或系统性偏差，不能凭两个均值不同就判断存在测量错误。"],"warning":""},"attachments":[]},{"number":66,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于简单随机抽样方法的是（  ）。","answer":["D"],"dataset_description":null,"id":"p05:66","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下不属于\u003c/span>\u003cspan>简单随机抽样方法\u003c/span>\u003cspan>的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抓阄\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>摇号\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>幸运大抽\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>按\u003c/span>\u003cspan>座位号抽奖\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：按座位号抽奖”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":67,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"统计总体的变异性是指（  ）。","answer":["A"],"dataset_description":null,"id":"p05:67","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>统计总体的变异性是指（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>可变标志的具体表现各不同\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>标志和指标各不同\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体单位有许多不同标志\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体有许多不同指标\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：可变标志的具体表现各不同”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"将总体中的所有单位或个体按一定的顺序排列起来然后每隔一定个数等距离地抽取样本的一种抽样方法是（  ）。","answer":["D"],"dataset_description":null,"id":"p05:68","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>将总体中的所有单位或个体按一定的顺序排列起来然后每隔一定个数等距离地抽取样本的一种抽样方法是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"整群抽样"},{"label":"B","html":"随机抽样"},{"label":"C","html":"分层随机抽样"},{"label":"D","html":"系统抽样"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：系统抽样”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量的所有可能值的概率分布是（ ）。","answer":["C"],"dataset_description":null,"id":"p05:69","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>样本统计量的所有可能值的概率分布是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本统计量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>参数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>简单随机抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：抽样分布”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本数目直接影响了统计推断的准确性和可靠性，以下观点错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p05:70","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>样本数目直接影响了统计推断的准确性和可靠性，以下观点错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>在大多数情况下，样本容量要足够大\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>需要进行权衡和折衷，以找到最佳平衡点的样本数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>在确定样本数目时，需要考虑多种因素\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>样本量越大，样本指标的代表性一定越好\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：样本量越大，样本指标的代表性一定越好”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于系统抽样的描述，错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p05:71","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下关于系统抽样的描述，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>以第一个单位作为\u003c/span>\u003cspan>起点\u003c/span>\u003c/p>"},{"label":"B","htm 3c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：总体单位之间在某些标志表现上有差异”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于总体和样本,以下描述错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p05:74","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于总体和样本,以下描述错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本中所包含的观察单位数即为样本量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样研究的目的就是用样本信息推论总体特征\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本应具有代表性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本是总体中任意选取的一部分\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：样本是总体中任意选取的一部分”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于统计量的优良标准，以下正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p05:75","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于统计量的优良标准，以下正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>无偏性、数量性、一致性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>无偏性、有效性、数量性\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>有效性、一致性、无偏性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>及时性、有效性、无偏性\u003c/span>\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：有效性、一致性、无偏性”。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"测算数据分布集中趋势特征的方法不包括（    ）。","answer":["D"],"dataset_description":null,"id":"p05:76","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>测算数据分布集中趋势特征的方法不包括（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"众数法"},{"label":"B","html":"中位数法"},{"label":"C","html":"均值法"},{"label":"D","html":"方差法"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：方差法”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列对于峰度的描述，错误的选项是（  ）。","answer":["B"],"dataset_description":null,"id":"p05:77","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列对于峰度的描述，错误的选项是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>峰度越大，说明分布数据中离群点越多\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>峰度越大，说明分布数据中异常点越少\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>峰度越小，说明分布越趋于均匀分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>峰度越小，说明分布数据中异常点越少\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：峰度越大，说明分布数据中异常点越少”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下表是关于一个城市家庭的年人均收入（万元）的抽样数据:\n收入≤66-77-88-99-1010-11≥11合计\n家庭18357624191414200\n根据表中数据，可计算样本均值和样本方差，请选择正确选项（   ）。","answer":["D"],"dataset_description":null,"id":"p05:78","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下表是关于一个城市家庭的年人均收入（万元）的抽样数据:\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ctable>\u003ctbody>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">收入\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">≤6\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">6-7\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">7-8\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">8-9\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">9-10\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">10-11\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">≥11\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">合计\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">家庭\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">18\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">35\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">76\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">24\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">19\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">14\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">14\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">200\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan>根据表中数据，可计算样本均值和样本方差，请选择正确选项（ &nbsp; ）。\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>","options":[{"label":"A","html":"样本均值:1.589；样本方差:0.517"},{"label":"B","html":"样本均值:1.589；样本方差:2.587"},{"label":"C","html":"样本均值:7.945；样本方差:0.517"},{"label":"D","html":"样本均值:7.945；样本方差:2.587"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：样本均值:7.945；样本方差:2.587”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在抽样调查方法中，抽样误差最大的是（   ）。","answer":["B"],"dataset_description":null,"id":"p05:79","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>在抽样调查方法中，抽样误差最大的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"单纯随机抽样"},{"label":"B","html":"整群抽样"},{"label":"C","html":"系统抽样"},{"label":"D","html":"分层抽样"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：整群抽样”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"有关统计量抽样分布方差的说法，正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p05:80","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>有关统计量抽样分布方差的说法，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>它说明了统计量抽样分布的中心位置所在\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>它是以统计量的数学期望为中心，反映抽样分布离散程度的核心指标\u003c/p>"},{"label":"C","html":"\u003cp>它是统计量的所有可能取值与期望离差绝对值的平均数\u003c/p>"},{"label":"D","html":"\u003cp>它是总体中所有个体值与总体均数离差平方的平均数\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：它是以统计量的数学期望为中心，反映抽样分布离散程度的核心指标”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于样本均值抽样分布的描述,错误的是（ ）。","answer":["B"],"dataset_description":null,"id":"p05:81","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下关于样本均值抽样分布的描述,错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>样本均值的抽样分布的均值等于总体均值\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan> \u003c/span>样本均值的抽样分布的标准差等于总体标准差（无需除以样本量）\u003c/p>"},{"label":"C","html":"\u003cp>样本均值的抽样分布的方差等于总体方差除以样本量\u003c/p>"},{"label":"D","html":"\u003cp>样本均值的抽样分布在样本量足够大时近似正态分布\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：样本均值的抽样分布的标准差等于总体标准差（无需除以样本量）”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于样本的说法,不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p05:82","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下关于样本的说法,不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本来自的总体中不能有变异存在\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本来自的总体应该是同质的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本中应有足够的个体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本是从总体中抽取的\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：样本来自的总体中不能有变异存在”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"F分布随着（ ）的不同而变化的一族分布。","answer":["A"],"dataset_description":null,"id":"p05:83","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>F分布随着（ ）的不同而变化的一族分布。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>分子和分母自由度\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本方差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本平均数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分母自由度\u003c/span>\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：分子和分母自由度”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在其他条件相同的条件下,重复抽样所需的样本单位数比不重复抽样","answer":["A"],"dataset_description":null,"id":"p05:84","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>在其他条件相同的条件下,重复抽样所需的样本单位数比不重复抽样\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>多\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>少\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>相等\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>难以判\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：多”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本量,正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p05:85","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于样本量,正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>尽量大\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>尽量小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>足量即可\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>调查者决定\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：足量即可”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列统计抽样方法中,适用于控制测试的是(   )。","answer":["C"],"dataset_description":null,"id":"p05:86","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列统计抽样方法中,适用于控制测试的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>均值法\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>比率法\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>属性抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>变量抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：属性抽样”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于样本均值抽样分布的描述,正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p05:87","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下关于样本均值抽样分布的描述,正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan> \u003c/span>样本均值的抽样分布的均值等于总体均值\u003c/p>"},{"label":"B","html":"\u003cp> 样本均值的抽样分布的标准差等于总体标准差\u003c/p>"},{"label":"C","html":"\u003cp>样本均值的抽样分布的标准差等于总体标准差除以样本量的平方根\u003c/p>"},{"label":"D","html":"\u003cp>样本均值在任何情况下都服从正态分布\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：样本均值的抽样分布的标准差等于总体标准差除以样本量的平方根”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于代表性误差,下列说法正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p05:88","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于代表性误差,下列说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>只有全面调查中才有\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>全面调查和非全面调查中都有\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>只有专门组织的重点调查中才有\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>只有非全面调查中才有\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：只有非全面调查中才有”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于抽样误差的观点，正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p05:89","paperId":"p05","paperT "html":"\u003cp>\u003cspan>同质性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>差异性\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：可数性”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在抽样过程中由于样本不能完全代表总体所产生的误差是：（   ）。","answer":["B"],"dataset_description":null,"id":"p05:92","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>在抽样过程中由于样本不能完全代表总体所产生的误差是：（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"实际误差"},{"label":"B","html":"偶然性"},{"label":"C","html":"技术性"},{"label":"D","html":"系统性"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：偶然性”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于区间估计的说法，正确的是（   ）。","answer":["B"],"dataset_description":null,"id":"p05:93","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于区间估计的说法，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"在进行区间估计时，置信区间的长度和估计的精度成正比"},{"label":"B","html":"在进行区间估计时，置信区间的长度和估计的精度成反比"},{"label":"C","html":"在进行区间估计时，置信概率和估计的可靠程度成反比"},{"label":"D","html":"在进行区间估计时，估计的可靠程度和精确程度是无关的"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：在进行区间估计时，置信区间的长度和估计的精度成反比”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于归纳推理,下列说法正确的是(   )。","answer":["D"],"dataset_description":null,"id":"p05:94","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于归纳推理,下列说法正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"归纳推理是一样到一样的推理"},{"label":"B","html":"归纳推理是一样到个别的推理"},{"label":"C","html":"归纳推理的结论一定是正确的"},{"label":"D","html":"归纳推理的结论是或然性的"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：归纳推理的结论是或然性的”。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":95,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于假说演绎法的叙述，错误的是（ ）","answer":["A"],"dataset_description":null,"id":"p05:95","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于假说演绎法的叙述，错误的是（ ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan> \u003c/span>无论实验结果与预期结论是否相符，不影响假说的正确性\u003c/p>"},{"label":"B","html":"\u003cp>通过实验检验演绎推理的结论\u003c/p>"},{"label":"C","html":"\u003cp>实验结果与预期结论相符，只能说明假说在该实验条件下成立，不能完全证明其绝对正确\u003c/p>"},{"label":"D","html":"\u003cp>在观察和分析基础上提出问题，通过推理提出解释问题的假说\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：无论实验结果与预期结论是否相符，不影响假说的正确性”。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":96,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于检验统计量，以下说法不正确的是","answer":["C"],"dataset_description":null,"id":"p05:96","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于检验统计量，以下说法不正确的是\u003c/span>\u003c/p>","options":[{"label":"A","html":"是一个随机变量"},{"label":"B","html":"\u003cp>分布已知\u003c/p>"},{"label":"C","html":"\u003cp> 用于估计总体参数\u003c/p>"},{"label":"D","html":"\u003cp>用于假设检验\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：用于估计总体参数”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":97,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于“拒绝域”的评述中,不正确的是(    )。","answer":["D"],"dataset_description":null,"id":"p05:97","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于“拒绝域”的评述中,不正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"拒绝域是样本空间的子集"},{"label":"B","html":"拒绝域的结构形式是先定的，与具体抽样结果无关"},{"label":"C","html":"拒绝域往往是通过某检验统计量诱导出来的"},{"label":"D","html":"拒绝域中涉及的临界值要通过抽样来确定"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：拒绝域中涉及的临界值要通过抽样来确定”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":98,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于显著性水平,以下表述错误的是（   ）。","answer":["D"],"dataset_description":null,"id":"p05:98","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于显著性水平,以下表述错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"假设检验事先规定的小概率标准"},{"label":"B","html":"取值愈大,则冒无显著性差异而被错判为显蓍性差异的风险也怠大"},{"label":"C","html":"实际上是犯第—类错误的概率"},{"label":"D","html":"就是临界值—检验接受域和拒绝域的分界点"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：就是临界值—检验接受域和拒绝域的分界点”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":99,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于采用正态近似Z统计量进行总体比例检验的说法，不正确的是","answer":["B"],"dataset_description":null,"id":"p05:99","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>关于采用正态近似Z统计量进行总体比例检验的说法，不正确的是\u003c/p>","options":[{"label":"A","html":"\u003cp>通常是在大样本条件下进行\u003c/p>"},{"label":"B","html":"\u003cp>可以在小样本条件下进行\u003c/p>"},{"label":"C","html":"\u003cp>用正态分布来确定临界值,即采用Z统计量\u003c/p>"},{"label":"D","html":"\u003cp>这种检验的理论基础是中心极限定理\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：可以在小样本条件下进行”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于假设检验的陈述中，正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p05:100","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下面关于假设检验的陈述中，正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"假设检验中如果结果拒绝了原假设,就说明备择假设一定是对的"},{"label":"B","html":"假设检验中如果接受了原假设,则原假设就一定是对的"},{"label":"C","html":"当拒绝原假设时,只能认为接受它的根据尚不充分,而不能认为它绝对错误"},{"label":"
