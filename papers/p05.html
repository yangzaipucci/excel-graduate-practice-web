₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：模型通过F检验,t检验一定也通过”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列有关大数据的说法，不正确的是（    ） 。","answer":["B"],"dataset_description":null,"id":"p05:103","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列有关大数据的说法，不正确的是（ &nbsp; &nbsp;） 。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据决策成为一种新的决策方式"},{"label":"B","html":"数据量达到1GB就是大数据"},{"label":"C","html":"大数据技术是以数据为本质的新一代革命性的信息技术"},{"label":"D","html":"大数据对科学研究、思维方式和社会发展都具有重要而深远的影响"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：数据量达到1GB就是大数据”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列有关大数据的说法中,不正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p05:104","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列有关大数据的说法中,不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据的速度快不仅仅指处理速度快,还体现在产生速度快"},{"label":"B","html":"大数据的数据体量大,在处理时需采用分治思想"},{"label":"C","html":"大数据的价值密度的高低与数据总量的大小成正比"},{"label":"D","html":"\u003cp>大数据技术使更多场景具备使用全量数据分析的可能\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：大数据的价值密度的高低与数据总量的大小成正比”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于云计算的说法不正确的是(   )？","answer":["B"],"dataset_description":null,"id":"p05:105","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于云计算的说法不正确的是( &nbsp; )？\u003c/span>\u003c/p>","options":[{"label":"A","html":"云计算实现了IT业务模式的创新，对于云计算的运营方而言，可以通过云计算对外提供服务获取商业收益；对于云计算的使用方，可以实现按需灵活获取云计算的IT资源服务"},{"label":"B","html":"云计算的服务不可量化"},{"label":"C","html":"云计算按照建设部署模式，包括公有云、私有云、混合云"},{"label":"D","html":"云计算起源可以追溯到1961年斯坦福大学教授提出的思想理念"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：云计算的服务不可量化”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于云计算的叙述中，不正确的是（    ）。","answer":["A"],"dataset_description":null,"id":"p05:106","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下关于云计算的叙述中，不正确的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"云计算将所有客户的计算都集中在一台大型计算机上进行"},{"label":"B","html":"云计算是基于互联网的相关服务的增加、使用和交付模式"},{"label":"C","html":"云计算支持用户在任意位置使用各种终端获取相应服务"},{"label":"D","html":"云计算的基础是面向服务的架构和虚拟化的系统部署"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：云计算将所有客户的计算都集中在一台大型计算机上进行”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下面关于大数据发展的3个阶段的叙述，错误的是（    ）。","answer":["C"],"dataset_description":null,"id":"p05:107","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下面关于大数据发展的3个阶段的叙述，错误的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"发展期"},{"label":"B","html":"应用期"},{"label":"C","html":"终结期"},{"label":"D","html":"开始期"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：终结期”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"关于大数据的叙述中,不正确的是(  )。","answer":["B"],"dataset_description":null,"id":"p05:108","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于大数据的叙述中,不正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据的特点是体量大、多样性、价值密度低和快速化"},{"label":"B","html":"数据分析与挖掘技术是大数据特有的技术"},{"label":"C","html":"大数据在电商、电信、金融等行业都有巨大的社会价值和产业空间"},{"label":"D","html":"分布式文件系统能提供高吞吐量数据访问,适合在大规模数据集上应用"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：数据分析与挖掘技术是大数据特有的技术”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于最大似然估计，下列说法正确的是（  )。","answer":["A"],"dataset_description":null,"id":"p05:109","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于最大似然估计，下列说法正确的是（ &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"最大似然估计是似然函数最大所对应的参数作为估计"},{"label":"B","html":"最大似然估计一定是最小方差无偏估计"},{"label":"C","html":"最大似然方程是最大似然估计的充分条件"},{"label":"D","html":"在最大似然函数古籍中，要估计的参数是一个不确定的量"}],"explanation":{"topic":"极大似然与贝叶斯估计","paragraphs":["极大似然估计把已观测样本固定，选择使似然 L(θ)=∏f(xᵢ;θ) 最大的参数。通常取对数把连乘变为连加，再求导、检查边界和极值。它并不等于“让参数本身的概率最大”。","贝叶斯估计为参数赋予先验分布，再用数据得到后验分布：后验∝似然×先验。频率学派常把参数视为固定未知量，贝叶斯方法则以概率分布表达对参数的不确定性。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：最大似然估计是似然函数最大所对应的参数作为估计”。"],"tip":"极大似然：固定数据选参数；贝叶斯：先验+数据→后验。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列有关线性回归的说法中，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p05:110","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列有关线性回归的说法中，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"一个变量取值一定时，另一个变量的取值与之有关但带有一定随机性的两个变量之间的关系叫相关关系"},{"label":"B","html":"在平面直角坐标系中用描点的方法得到表示两个变量的一组数据的图形叫做散点图"},{"label":"C","html":"线性回归直线方程最能代表线性相关的观测值x、y之间的关系"},{"label":"D","html":"任何一组观测值都能得到具有代表意义的回归直线方程"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：任何一组观测值都能得到具有代表意义的回归直线方程”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":111,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于线性规划问题的图解法，下面的叙述正确的有(  )。","answer":["C"],"dataset_description":null,"id":"p05:111","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于线性规划问题的图解法，下面的叙述正确的有( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可行解区无界时，一定没有最优解"},{"label":"B","html":"可行解区有界时，一定有最优解"},{"label":"C","html":"如果在两个点上达到最优解，则一定有无穷多个最优解"},{"label":"D","html":"最优解只能在可行解区的顶点上达到"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：如果在两个点上达到最优解，则一定有无穷多个最优解”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":112,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于无监督学习的说法,不正确的是(   )。","answer":["A"],"dataset_description":null,"id":"p05:112","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于无监督学习的说法,不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"聚类算法中最终的类别之间可能有少量样本的交叉"},{"label":"B","html":"K-means算法中可以随机划分样本为K堆，以K堆的平均重心作为初始的K个点"},{"label":"C","html":"自动编码器包含“编码”和“解码”两部分"},{"label":"D","html":"自动编码器可以用于图像抗噪和数据降维"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：聚类算法中最终的类别之间可能有少量样本的交叉”。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于系统优化的叙述中,不正确的是 ( )。","answer":["C"],"dataset_description":null,"id":"p05:113","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于系统优化的叙述中,不正确的是 ( )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"可以运用数学模型对问题进行优化"},{"label":"B","html":"系统优化时需要对结果进行完善和验证"},{"label":"C","html":"通过优化的目标与决策变量可以计算出满意解"},{"label":"D","html":"有时通过估算也可以实现系统优化"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：通过优化的目标与决策变量可以计算出满意解”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下关于最小二乘法的说法中正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p05:114","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下关于最小二乘法的说法中正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"最小二乘估计是线性有偏估计中方差最小的"},{"label":"B","html":"最小二乘估计是线性无偏估计中方差最小的"},{"label":"C","html":"最小二乘估计是线性有偏估计中方差最大的"},{"label":"D","html":"最小二乘估计是线性无偏估计中方差最大的"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：最小二乘估计是线性无偏估计中方差最小的”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下面关于方差分析内容的描述，正确的是(  )。","answer":["B"],"dataset_description":null,"id":"p05:115","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下面关于方差分析内容的描述，正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"F值可能是负数"},{"label":"B","html":"F值不可能是负数"},{"label":"C","html":"组间离均差不会等于组内离均差"},{"label":"D","html":"组间离均差不会小于组内离均差"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：F值不可能是负数”。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"对于线性规划问题，下列说法不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p05:116","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>对于线性规划问题，下列说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"线性规划问题可能没有可行解"},{"label":"B","html":"在图解法中，线性规划问题的可行域都是“凸”区域"},{"label":"C","html":"线性规划问题如有最优解，则最优解可以在可行域顶点上达到"},{"label":"D","html":"线性规划问题一般都有最优解"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：线性规划问题一般都有最优解”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"在方差分析中，用于检验的统计量是（  ）。","answer":["C"],"dataset_description":null,"id":"p05:117","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>在方差分析中，用于检验的统计量是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"组间平方和/组内平方和"},{"label":"B","html":"组间平方和/总平方和"},{"label":"C","html":"组间方差/组内方差"},{"label":"D","html":"组间方差/总方差"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：组间方差/组内方差”。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"以下属于行政法规的是（   ）。","answer":["D"],"dataset_description":null,"id":"p05:118","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下属于行政法规的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"《贵州省大数据发展应用促进条例》"},{"label":"B","html":"《天津市促进大数据发展应用条例》"},{"label":"C","html":"《海南省大数据开发应用条例》"},{"label":"D","html":"《关键信息基础设施安全保护条例》"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：《关键信息基础设施安全保护条例》”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"以下不属于大数据法律关系客体的是（   ）。","answer":["D"],"dataset_description":null,"id":"p05:119","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下不属于大数据法律关系客体的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"个人信息"},{"label":"B","html":"数据"},{"label":"C","html":"\u003cp>数据安全\u003c/p>"},{"label":"D","html":"\u003cp> 预防功能\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：预防功能”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"诸葛亮的“鞠躬尽瘁，死而后己”，《淮南子》中的“公正无私，一言而万民齐”,范仲淹所说的“先天下之忧而忧，后天下之乐而乐”，体现了传统文明继承的职业道德精华，即（  ）。","answer":["B"],"dataset_description":null,"id":"p05:120","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>诸葛亮的“鞠躬尽瘁，死而后己”，《淮南子》中的“公正无私，一言而万民齐”,范仲淹所说的“先天下之忧而忧，后天下之乐而乐”，体现了传统文明继承的职业道德精华，即（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"积极进取精神"},{"label":"B","html":"忠诚和奉献精神"},{"label":"C","html":"勤俭节约精神"},{"label":"D","html":"艰苦奋斗精神"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：忠诚和奉献精神”。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"验证性数据分析通常强调对已有假设的检验。下述属于验证性分析的是（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p05:121","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>验证性数据分析通常强调对已有假设的检验。下述属于验证性分析的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"收集相关理论,已有研究等形成明确、完善的假设。"},{"label":"B","html":"回归分析是验证性数据分析的一种方法。"},{"label":"C","html":"根据假设设计问卷,进行抽样测量。"},{"label":"D","html":"极大似然估计是验证性数据分析的一种方法。"},{"label":"E","html":"检验，修改原假设。"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：收集相关理论,已有研究等形成明确、完善的假设。；B：回归分析是验证性数据分析的一种方法。；C：根据假设设计问卷,进行抽样测量。；E：检验，修改原假设。”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"下列关于竞争者分析的描述中，正确的分析方法包括（  ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p05:122","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于竞争者分析的描述中，正确的分析方法包括（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"识别竞争者"},{"label":"B","html":"判定竞争者的战略和目标"},{"label":"C","html":"评估竞争者的优劣势"},{"label":"D","html":"评估竞争者反应模式"},{"label":"E","html":"认识市场需求特征"}],"explanation":{"topic":"本题解析","paragraphs":["竞争者分析通常包括识别对手、判断战略目标、评估优劣势及预测反应模式，因此选 A、B、C、D。"],"warning":"","optionAnalysis":[{"label":"A","selected":true,"reason":"先识别谁在争夺相同客户，是竞争者分析的起点。"},{"label":"B","selected":true,"reason":"战略与目标解释对手打算如何竞争。"},{"label":"C","selected":true,"reason":"优劣势用于评价对手的能力和限制。"},{"label":"D","selected":true,"reason":"反应模式帮助预测对手面对企业行动会怎样应对。"},{"label":"E","selected":false,"reason":"市场需求属于更广的市场分析，不是本题列举的竞争者诊断步骤。"}]},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"以下属于企业内部信息源的有(   ).","answer":["A","B","C","D"],"dataset_description":null,"id":"p05:123","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下属于企业内部信息源的有( &nbsp; ).\u003c/span>\u003c/p>","options":[{"label":"A","html":"客户名称表"},{"label":"B","html":"购货销货记录"},{"label":"C","html":"推销员报告"},{"label":"D","html":"客户和中间商的通讯"},{"label":"E","html":"行业统计年鉴"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：客户名称表；B：购货销货记录；C：推销员报告；D：客户和中间商的通讯”。多选题应检查所有选项，不能只选其中一项。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"在下列描述中，哪些可用定性变量进行分析（   ）。","answer":["B","D"],"dataset_description":null,"id":"p05:124","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>在下列描述中，哪些可用定性变量进行分析（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"商品销售额"},{"label":"B","html":"上班出行方式"},{"label":"C","html":"家庭收入"},{"label":"D","html":"居住地区"},{"label":"E","html":"年龄"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、D。对应内容为“B：上班出行方式；D：居住地区”。多选题应检查所有选项，不能只选其中一项。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于t分布，以下说法正确的是（ ）。","answer":["A","B","D"],"dataset_description":null,"id":"p05:125","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于t分布，以下说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>t分布曲线是连续的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>以0为中心的对称分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan> t分布就标准正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>自由度越小，t分布两侧尾部的面积较标准正态分布的大\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>t分布的曲线形状固定\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：t分布曲线是连续的；B：以0为中心的对称分布；D：自由度越小，t分布两侧尾部的面积较标准正态分布的大”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"导致非抽样误差的来源有（   ）。","answer":["B","C","D","E"],"dataset_description":null,"id":"p05:126","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>导致非抽样误差的来源有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本量较小"},{"label":"B","html":"问卷设计原因造成被调查者对调查问题理解有偏误"},{"label":"C","html":"被调查者拒绝接受调查"},{"label":"D","html":"调查人员有意作弊"},{"label":"E","html":"抽样数据不完善"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、D、E。对应内容为“B：问卷设计原因造成被调查者对调查问题理解有偏误；C：被调查者拒绝接受调查；D：调查人员有意作弊；E：抽样数据不完善”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于总体和样本说法错误是（    ）。","answer":["D","E"],"dataset_description":null,"id":"p05:127","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于总体和样本说法错误是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"总体的指标称为参数"},{"label":"B","html":"\u003cp>样本的指标称为统计量\u003c/p>"},{"label":"C","html":"\u003cp>总体中随机抽取的部分观察单位组成了样本\u003c/p>"},{"label":"D","html":"\u003cp> 总体中随机抽取的部分观察单位的变量值组成了样本\u003c/p>"},{"label":"E","html":"\u003cp> 总体中随意抽取的部分观察单位的变量值组成了样本\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D、E。对应内容为“D：总体中随机抽取的部分观察单位的变量值组成了样本；E：总体中随意抽取的部分观察单位的变量值组成了样本”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于任意抽样的描述，正确的是（  ）。","answer":["A","C","D","E"],"dataset_description":null,"id":"p05:128","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于任意抽样的描述，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>以便利为原则\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>费多和时间长\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>具有\u003c/span>\u003cspan>随意性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>具有\u003c/span>\u003cspan>偶然性\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>具有\u003c/span>\u003cspan>显著的偏差\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、D、E。对应内容为“A：以便利为原则；C：具有随意性；D：具有偶然性；E：具有显著的偏差”。多选题应检查所有选项，不能只选其中一项。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"分层抽样误差的大小取决于（   ）。","answer":["B","C","E"],"dataset_description":null,"id":"p05:129","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>分层抽样误差的大小取决于（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"各组间的标志变异程度"},{"label":"B","html":"各组样本容量占总体比重的分配状况"},{"label":"C","html":"各组样本容量的大小"},{"label":"D","html":"总体标志值的变异程度"},{"label":"E","html":"各组内标志值的变异程度"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、E。对应内容为“B：各组样本容量占总体比重的分配状况；C：各组样本容量的大小；E：各组内标志值的变异程度”。多选题应检查所有选项，不能只选其中一项。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于样本众数的叙述，正确的选项是（   ）。","answer":["A","D"],"dataset_description":null,"id":"p05:130","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于样本众数的叙述，正确的选项是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本数据可能存在多个众数"},{"label":"B","html":"众数主要适用于定量样本数据"},{"label":"C","html":"众数是指样本数据中最大的数"},{"label":"D","html":"众数不受样本极端值的影响"},{"label":"E","html":"众数是测度样本离散趋势的统计量"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、D。对应内容为“A：样本数据可能存在多个众数；D：众数不受样本极端值的影响”。多选题应检查所有选项，不能只选其中一项。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"多阶段抽样是将抽样过程分阶段进行，以下描述正确的是（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p05:131","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>多阶段抽样是将抽样过程分阶段进行，以下描述正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>各阶段抽样方法可用简单随机抽样法\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>多阶段抽样易于组织实施\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>每个阶段使用的抽样方法可以不同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>多阶段容易控制抽样质\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>多阶段抽样能够省时，省力，和省钱\u003c/span>\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：各阶段抽样方法可用简单随机抽样法；B：多阶段抽样易于组织实施；C：每个阶段使用的抽样方法可以不同；D：多阶段容易控制抽样质；E：多阶段抽样能够省时，省力，和省钱”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"对于t分布，以下正确的是（ ）。","answer":["C","D"],"dataset_description":null,"id":"p05:132","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>对于t分布，以下正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>t分布是一条曲线\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布以1为中心,左右对称\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>t分布是单峰分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>自由度等于无穷大时，t分布就是标准正态分\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>自由度同时,t的绝对值越大，\u003c/span>\u003cspan>尾端概率\u003c/span>\u003cspan>P越大\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C、D。对应内容为“C：t分布是单峰分布；D：自由度等于无穷大时，t分布就是标准正态分”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本，以下正确的是（  ）。","answer":["C","D"],"dataset_description":null,"id":"p05:133","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于样本，以下正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本在总体中是大量的甚至是无限的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>在实际工作中，有必要对每个单位逐一进行研究\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽取一部分单位组成样本进行调查研究\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>根据对抽取样本观察研究结果，去推论和估计总体情况\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本内容是无单位的\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C、D。对应内容为“C：抽取一部分单位组成样本进行调查研究；D：根据对抽取样本观察研究结果，去推论和估计总体情况”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于t分布的叙述，正确的选项包括（  ）。","answer":["A","C","E"],"dataset_description":null,"id":"p05:134","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>下列关于t分布的叙述，正确的选项包括（ &nbsp;）。\u003c/p>","options":[{"label":"A","html":"自由度越大，t分布越接近标准正太分布"},{"label":"B","html":"随自由度的减小，t分布逐渐逼近标准正太分布"},{"label":"C","html":"t分布曲线是单峰分布，它以0为中心，左右对称"},{"label":"D","html":"\u003cp>t分布的概率密度函数在正半轴上呈左偏态分布\u003c/p>"},{"label":"E","html":"t分布不是一条曲线，而是很多曲线的集合"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、E。对应内容为“A：自由度越大，t分布越接近标准正太分布；C：t分布曲线是单峰分布，它以0为中心，左右对称；E：t分布不是一条曲线，而是很多曲线的集合”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于样本均值服从正态分布的观点,说法正确的是（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p05:135","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下列关于样本均值服从正态分布的观点,说法正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>总体分布是正态分布，样本量为30以上的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>总体分布是正态分布，样本量在20以下的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>总体分布是非正态分布，样本量为30以上的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>总体分布为未知分布，样本量为30以上的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>总体分布非正态分布，样本容量在30以下的抽样下，\u003cspan>样本均值服从正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：总体分布是正态分布，样本量为30以上的抽样下，样本均值服从正态分布；B：总体分布是正态分布，样本量在20以下的抽样下，样本均值服从正态分布；C：总体分布是非正态分布，样本量为30以上的抽样下，样本均值服从正态分布；D：总体分布为未知分布，样本量为30以上的抽样下，样本均值服从正态分布”。多选题应检查所有选项，不能只选其中一项。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"关于原假设和备择假设，正确的是（  ）。","answer":["A","B","E"],"dataset_description":null,"id":"p05:136","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于原假设和备择假设，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"原假设表示为H\u003csub>0\u003c/sub>，是预先假定的状态"},{"label":"B","html":"备择假设表示为H\u003csub>1\u003c/sub>，是我们希望的状态"},{"label":"C","html":"进行假设检验是为了证明原假设"},{"label":"D","html":"进行假设检验是为了证明备择假设"},{"label":"E","html":"进行假设检验是为了拒绝原假设"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、E。对应内容为“A：原假设表示为H0，是预先假定的状态；B：备择假设表示为H1，是我们希望的状态；E：进行假设检验是为了拒绝原假设”。多选题应检查所有选项，不能只选其中一项。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"关于云计算，下列说法正确的是(    )。","answer":["A","B","C"],"dataset_description":null,"id":"p05:137","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>关于云计算，下列说法正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"云计算是基于互联网的相关服务的增加,使用和交付模式"},{"label":"B","html":"云计算不针对特定的应用，在“云”的支撑下可以构造出千变万化的应用"},{"label":"C","html":"云计算支持用户在任意位置，使用各种终端获取应用服务"},{"label":"D","html":"云计算通常涉及通过互联网来提供静态难扩展且是实体化的资源"},{"label":"E","html":"云计算无法作用大数据处理的底层计算资源"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：云计算是基于互联网的相关服务的增加,使用和交付模式；B：云计算不针对特定的应用，在“云”的支撑下可以构造出千变万化的应用；C：云计算支持用户在任意位置，使用各种终端获取应用服务”。多选题应检查所有选项，不能只选其中一项。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"下述关于方差分析的基本思想，不正确的是（  ）。","answer":["A","B","C"],"dataset_description":null,"id":"p05:138","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>下述关于方差分析的基本思想，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"组间均方大于组内均方"},{"label":"B","html":"误差均方必然小于组间均方"},{"label":"C","html":"误差均方必然小于组间均方"},{"label":"D","html":"总离均差平方和及其自由度按设计可以分解成几种不同的来源"},{"label":"E","html":"组间方差显著大于组内方差时，该因素对所考察指标的影响显著"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、B、C。对应内容为“A：组间均方大于组内均方；B：误差均方必然小于组间均方；C：误差均方必然小于组间均方”。多选题应检查所有选项，不能只选其中一项。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"以下能够引起数据相关法律关系变更或者消灭的是（  ）。","answer":["A","B","C"],"dataset_description":null,"id":"p05:139","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下能够引起数据相关法律关系变更或者消灭的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"自然人死亡"},{"label":"B","html":"公司被注销"},{"label":"C","html":"不可抗力事件"},{"label":"D","html":"个人意愿"},{"label":"E","html":"社会舆论"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：自然人死亡；B：公司被注销；C：不可抗力事件”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"以下属于算法风险的表现有（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p05:140","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>\u003cspan>以下属于算法风险的表现有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"算法存在泄露风险"},{"label":"B","html":"算法面临可信赖性问题"},{"label":"C","html":"算法难以随时可用"},{"label":"D","html":"算法漏洞"},{"label":"E","html":"算法的不确定性"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：算法存在泄露风险；B：算法面临可信赖性问题；C：算法难以随时可用；D：算法漏洞；E：算法的不确定性”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“data05.xlsx”中的工作簿文件扩展名为（）","answer":["A"],"dataset_description":"Excel表格文件“data05.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p05:141","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>文件“data05.xlsx”中的工作簿文件扩展名为（） &nbsp; \u003c/p>","options":[{"label":"A","html":".xlsx"},{"label":"B","html":".xlsm"},{"label":"C","html":".xls"},{"label":"D","html":".docx"}],"explanation":{"topic":"工作簿文件扩展名","paragraphs":["题目给出的素材文件名以 .xlsx 结尾，因此扩展名是 .xlsx，选 A。",".xlsm 是启用宏的工作簿，.xls 是旧版工作簿，.docx 是 Word 文档；不能把它们与当前素材的实际扩展名混同。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data05.xlsx","href":"../materials/p05/data05.xlsx"}]},{"number":142,"type":"多选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":2,"question":"将网页数据爬取到Excel文件\"data05.xlsx\"后，可以将其保存为（）类型？（多选）","answer":["A","B","C","D"],"dataset_description":"Excel表格文件“data05.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p05:142","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>将网页数据爬取到Excel文件&quot;data05.xlsx&quot;后，可以将其保存为（）类型？（多选）\u003c/p>","options":[{"label":"A","html":"CSV"},{"label":"B","html":"XLSX"},{"label":"C","html":"XLS"},{"label":"D","html":"TXT"}],"explanation":{"topic":"将表格保存为不同格式","paragraphs":["CSV、XLSX、XLS、TXT 都能保存表格数据，因此四项全选。使用“另存为”，在文件类型中选择相应格式。","XLSX/XLS 可保留较多工作簿结构；CSV/TXT 是文本格式，通常只保存当前工作表的数据，不能完整保留图表、多工作表和格式。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data05.xlsx","href":"../materials/p05/data05.xlsx"}]},{"number":143,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":3,"question":"文件“data05.xlsx”中的“Sheet1”中“气象站气压（毫米汞柱）”中的具体数据分布情况为（）","answer":["D"],"dataset_description":"Excel表格文件“data05.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p05:143","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>文件“data05.xlsx”中的“Sheet1”中“气象站气压（毫米汞柱）”中的具体数据分布情况为（）\u003c/p>","options":[{"label":"A","html":"平均值：763.05，计数：171，求和：139717.9"},{"label":"B","html":"平均值：711.98，计数：171，求和：129717.9"},{"label":"C","html":"平均值：855.72，计数：171，求和：139717.9"},{"label":"D","html":"平均值：763.05，计数：171，求和：129717.9"}],"explanation":{"topic":"气压的均值、计数与和","paragraphs":["C2:C171 有170个气压数值，求和129717.9，均值129717.9÷170=763.0464706，四舍五入763.05。因此与 D 的均值、和一致。","使用 =AVERAGE(C2:C171)、=SUM(C2:C171) 核算。"],"tip":"","warning":"选项“计数171”包含表头；COUNT 数值计数是170。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data05.xlsx","href":"../materials/p05/data05.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"data05.xlsx\"的工作表\"Sheet1\"中，请计算相对湿度（%）的平均值，并选择下列正确的选项。","answer":["D"],"dataset_description":"Excel表格文件“data05.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p05:144","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>在文件&quot;data05.xlsx&quot;的工作表&quot;Sheet1&quot;中，请计算相对湿度（%）的平均值，并选择下列正确的选项。\u003c/p>","options":[{"label":"A","html":"相对湿度均值为77.30357143%"},{"label":"B","html":"相对湿度均值为79.30357143%"},{"label":"C","html":"相对湿度均值为82.30693642%"},{"label":"D","html":"相对湿度均值为81.02941176%"}],"explanation":{"topic":"相对湿度平均值","paragraphs":["相对湿度在 D 列，用 =AVERAGE(D2:D171)，结果约81.02941176，按列标题“%”理解为81.02941176%，选 D。","本素材用79这类数表示79%，并非0.79的比例小数。不要对原数直接再套百分比显示而放大100倍。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data05.xlsx","href":"../materials/p05/data05.xlsx"}]},{"number":145,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":5,"question":"文件“data05.xlsx”中的“Sheet1” 将日期按照“年-月-日”和“HH:MM:SS”分开，分别在F和G列中操作，列名分别为“年月日”和“时间”，使用TEXT函数进行分离，数据格式分别为“yyyy-mm-dd”和“hh:mm:ss”。再按照分类字段“年月日”，汇总方式“平均值”，选定汇总项“气象站气压（毫米汞柱）”，“ 2023-2-14”的气温平均值为（）。","answer":["A"],"dataset_description":"Excel表格文件“data05.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p05:145","paperId":"p05","paperTitle":"Excel 模拟卷 05","question_html":"\u003cp>文件“data05.xlsx”中的“Sheet1” 将日期按照“年-月-日”和“HH:MM:SS”分开，分别在F和G列中操作，列名分别为“年月日”和“时间”\u003cspan>，使用TEXT函数进行分离，数据格式分别为“yyyy-mm-dd”和“hh:mm:ss”\u003c/span>。再按照分类字段“年月日”，汇总方式“平均值”，选定汇总项“气象站气压（毫米汞柱）”，“ 2023-2-14”的气温平均值为（）。\u003c/p>","options":[{"label":"A","html":"764.13"},{"label":"B","html":"760.18"},{"label":"C","html":"759.79"},{"label":"D","html":"750.64"}],"explanation":{"topic":"日期分组与数据透视分析","paragraphs":["用 =TEXT(A2,\   const PREFIX='excel-practice:v1:';
  function same(a,b){return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&[...a].sort().join('|')===[...b].sort().join('|');}
  function grade(questions,answers){
    const details=questions.map(q=>{const selected=Array.isArray(answers[q.id])?answers[q.id]:[];return {id:q.id,selected,correct:same(selected,q.answer),blank:selected.length===0};});
    const correct=details.filter(x=>x.correct).length,blank=details.filter(x=>x.blank).length;
    return {total:details.length,correct,blank,incorrect:details.length-correct-blank,score:details.length?Math.round(correct/details.length*10000)/100:0,details,wrongIds:details.filter(x=>!x.correct).map(x=>x.id)};
  }
  function updateWrongs(existing,questions,answers,now){
    const result=JSON.parse(JSON.stringify(existing||{}));
    for(const d of grade(questions,answers).details){
      const old=result[d.id];
      if(d.correct){if(old)result[d.id]={...old,masteredAt:now,lastReviewed:now,reviews:(old.reviews||0)+1};}
      else result[d.id]={id:d.id,wrongCount:(old?.wrongCount||0)+1,firstWrong:old?.firstWrong||now,lastWrong:now,lastReviewed:now,reviews:(old?.reviews||0)+1,masteredAt:null,lastSelection:d.selected};
    }
    return result;
  }
  function validAnswers(questions,answers){const out={};for(const q of questions){const allowed=new Set(q.options.map(o=>o.label));let selected=Array.isArray(answers?.[q.id])?[...new Set(answers[q.id])].filter(x=>allowed.has(x)):[];if(q.type!=='多选题')selected=selected.slice(0,1);if(selected.length)out[q.id]=selected;}return out;}
  return {PREFIX,same,grade,updateWrongs,validAnswers};
});

function activeWrongs(paperId){const w=wrongs();return Object.keys(w).filter(id=>all[id]&&!w[id].masteredAt&&(!paperId||all[id].paperId===paperId)).sort((a,b)=>(w[b].lastWrong||0)-(w[a].lastWrong||0));}
function masteredWrongs(paperId){const w=wrongs();return Object.keys(w).filter(id=>all[id]&&w[id].masteredAt&&(!paperId||all[id].paperId===paperId)).sort((a,b)=>w[b].masteredAt-w[a].masteredAt);}
function notice(){return storageFailed?'<div class="notice" role="alert">浏览器暂不允许保存。请关闭无痕模式或允许网站储存数据，避免离开后丢失进度。</div>':'';}
function time(ms){let s=Math.floor((ms||0)/1000);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function toast(text){$('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;el.setAttribute('role','status');document.body.append(el);setTimeout(()=>el.remove(),2600);}
function topbar(){const home=D.page==='paper'?'../index.html':'index.html',wrong=D.page==='paper'?'../wrongs.html':'wrongs.html';return `<header class="topbar"><a class="brand" href="${home}"><span class="mark">E</span><span>Excel 研习室</span></a><nav class="toplinks"><a href="${home}">全部试卷</a><a href="${wrong}">错题本</a></nav></header>`;}
function save(){if(state)write('session:'+scope,state);}
function safeState(value){if(!value||!Array.isArray(value.ids)||!value.ids.length||value.ids.some(id=>!all[id])||new Set(value.ids).size!==value.ids.length)return null;const qs=value.ids.map(id=>all[id]);return {...value,ids:qs.map(q=>q.id),answers:C.validAnswers(qs,value.answers),index:Math.max(0,Math.min(qs.length-1,Number(value.index)||0)),elapsedMs:Math.max(0,Number(value.elapsedMs)||0),submitted:!!value.submitted};}

}

const p=paper(),isWrong=D.page==='wrongs',active=activeWrongs(isWrong?null:p.id),mastered=masteredWrongs(isWrong?null:p.id),draft=safeState(read('session:'+scope,null));

ton>${active.length?`<button class="btn" data-action="begin-wrongs">本卷错题 · ${active.length}</button>`:''}</div></div>`}<div class="panel"><h2>本次计分规则</h2><p class="muted">每题等权，答对题数 ÷ 本次题数 × 100。多选题全部选对才得分，未答计 0 分。成绩为练习分，不采用原网站未核实的考试题型权重。</p></div><a href="${isWrong?'index.html':'../index.html'}">← 返回全部试卷</a></main></div>`;

function begin(ids,kind,confirmed=false){
studying=false;
if(!ids.length){toast('当前没有待复习错题');return;}
const old=safeState(read('session:'+scope,null));
if(old&&!old.submitted&&!confirmed){showDialog('开始新的练习？','<p>这会替换当前未交卷的作答进度。已保存的错题与历史成绩会继续保留。</p>','<button class="btn" data-action="close-dialog">保留当前进度</button><button class="btn primary" data-action="confirm-new">开始新练习</button>');pending={ids,kind};return;}

}
let pending=null;

r)?'回答正确':selected.length?'回答错误':'未作答'}</b></p><p>你的答案：${selected.length?selected.join('、'):'未答'}<br>${q.explanation?.warning?'原站答案（请看核对提示）':'正确答案'}：${q.answer.join('、')}</p><small>答案来源：网站官方答案标记</small></div>${explanation(q)}`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="previous" ${state.index===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="grid">答题卡</button><button class="btn primary" data-action="next" ${show&&state.index===ids.length-1?'disabled':''}>${!show&&state.index===ids.length-1?'检查交卷':'下一题'}</button></nav>`;

function navigate(index){stash();state.index=index;save();renderQuestion();window.scrollTo(0,0);}

function submit(){if(!state||state.submitted)return;stash();const now=Date.now();state.submitted=true;state.submittedAt=now;write('wrongs',C.updateWrongs(wrongs(),current,state.answers,now));const g=C.grade(current,state.answers),h=read('history:'+scope,[]);write('history:'+scope,[{attempt:state.attempt,score:g.score,total:g.total,correct:g.correct,at:now,kind:state.kind},...h.filter(x=>x.attempt!==state.attempt)].slice(0,20));save();closeDialog();review=false;reviewIds=null;result();window.scrollTo(0,0);}
function result(){const g=C.grade(current,state.answers);root.innerHTML=`<div class="shell">${topbar()}<main class="result"><div class="eyebrow">本次练习已完成</div><h1>${D.page==='wrongs'?'错题重刷成绩':esc(paper().title)}</h1><div class="score">${g.score}<small> 分</small></div><div class="result-rule">练习百分制 · 答对 ${g.correct} / ${g.total} 题 · 用时 ${time(state.elapsedMs)}</div>${notice()}<div class="stats"><div><strong>${g.correct}</strong><span>答对</span></div><div><strong>${g.incorrect}</strong><span>答错</span></div><div><strong>${g.blank}</strong><span>未答</span></div></div><div class="actions"><button class="btn primary" data-action="review-all">查看答案与解析</button>${g.wrongIds.length?'<button class="btn" data-action="review-wrong">查看本次错题</button><button class="btn" data-action="retry">重刷本次错题</button>':''}<button class="btn" data-action="intro">${D.page==='wrongs'?'返回错题本':'返回试卷入口'}</button></div><div class="saved-note">${g.wrongIds.length?`本次 ${g.wrongIds.length} 道错题／未答题已保存至错题本。`:'本次全部答对。之前收录的题已标为“已掌握”，历史仍保留。'}${storageFailed?' 当前浏览器不允许储存，请先解决上方提示。':' 下次打开同一浏览器即可继续复习。'}</div><p class="result-rule" style="margin-top:20px">计分规则：答对题数 ÷ 本次题数 × 100；多选题全部选对才得分。此分数为练习成绩，不是原网站正式考试评分。</p></main></div>`;}

function explanation(q){const x=q.explanation;if(!x)return '<section class="explanation"><h3>本题解析</h3><p>本题说明待核对。</p></section>';const direct=x.optionAnalysis,paras=x.paragraphs||[];return `<section class="explanation"><h3>本题解析</h3>${direct?`<div class="option-analysis">${direct.map(o=>`<p><b>${esc(o.label)} · ${o.selected?'本题应选':'本题不选'}：</b>${esc(o.reason)}</p>`).join('')}</div>`:paras.map(t=>`<p>${esc(t)}</p>`).join('')}${x.warning?`<p class="explanation-warning"><b>原题核对：</b>${esc(x.warning)}</p>`:''}<small>独立整理；有疑义时保留原站评分答案并注明。</small></section>`;}

function startStudy(ids){if(!ids.length){toast('暂无可背的题目');return;}studying=true;studyIds=ids;const saved=read('study:'+scope,null);studyIndex=saved&&ids.includes(saved.id)?ids.indexOf(saved.id):0;studyReveal=true;renderStudy();window.scrollTo(0,0);}

function renderStudy(){const q=all[studyIds[studyIndex]];write('study:'+scope,{id:q.id,at:Date.now()});root.innerHTML=`<div class="shell"><header class="quiz-head"><div class="quiz-head-row"><div><div class="quiz-title">${esc(q.paperTitle)} · 背题模式</div><div class="quiz-meta">第 ${studyIndex+1} / ${studyIds.length} 题 · 背题不计分，不改变考试进度或错题状态</div></div><button class="btn small" data-action="intro">退出背题</button></div><div class="progress-track"><span style="width:${(studyIndex+1)/studyIds.length*100}%"></span></div></header><main class="question-wrap">${notice()}<div class="q-label"><span class="number">${q.number}</span><span class="pill">${esc(q.type)}</span></div><div class="q-source">${esc(q.book)} 第 ${q.chapter} 章</div>${q.dataset_description?`<details class="dataset"><summary>操作题说明与 Excel 素材</summary><p>${esc(q.dataset_description)}</p>${q.attachments.map(a=>`<a download href="${esc(a.href)}">下载 ${esc(a.name)} ↗</a>`).join('')}</details>`:''}<section class="question-text">${q.question_html}</section><div class="options">${q.options.map(o=>`<div class="option ${studyReveal&&q.answer.includes(o.label)?'is-correct':''}"><span class="option-letter">${esc(o.label)}</span><div class="option-content">${o.html}</div>${studyReveal&&q.answer.includes(o.label)?'<span class="option-tag">正确选项</span>':''}</div>`).join('')}</div><button class="btn" data-action="study-reveal">${studyReveal?'隐藏答案和解析 · 自测':'显示答案和解析'}</button>${studyReveal?`<div class="review-note"><b>${q.explanation?.warning?'原站答案（请看核对提示）':'正确答案'}：${q.answer.join('、')}</b></div>${explanation(q)}`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="study-prev" ${studyIndex===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="study-grid">背题目录</button><button class="btn primary" data-action="study-next" ${studyIndex===studyIds.length-1?'disabled':''}>下一题</button></nav>`;}

function exportProgress(){const backup={format:'excel-practice-backup',version:1,createdAt:Date.now(),entries:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(P))backup.entries[k.slice(P.length)]=JSON.parse(localStorage.getItem(k));}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Excel刷题进度与错题备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出，可保存到手机文件');}
async function importProgress(file){try{if(!file||file.size>10000000)throw Error('备份文件过大或未选择');const b=JSON.parse(await file.text());if(b.format!=='excel-practice-backup'||b.version!==1||!b.entries||typeof b.entries!=='object')throw Error('这不是本程序的备份文件');const checked={};for(const [k,v] of Object.entries(b.entries)){if(k==='wrongs'){if(!v||Array.isArray(v)||typeof v!=='object')throw Error('错题数据格式不正确');checked[k]={};for(const [id,w] of Object.entries(v)){if(!all[id]||w?.id!==id||!Number.isFinite(w.wrongCount)||w.wrongCount<1)throw Error('备份包含未知题目');checked[k][id]={id,wrongCount:w.wrongCount,firstWrong:Number(w.firstWrong)||Date.now(),lastWrong:Number(w.lastWrong)||Date.now(),lastReviewed:Number(w.lastReviewed)||Date.now(),reviews:Number(w.reviews)||0,masteredAt:w.masteredAt?Number(w.masteredAt):null,lastSelection:Array.isArray(w.lastSelection)?w.lastSelection.filter(x=>all[id].options.some(o=>o.label===x)):[]};}}else if(k.startsWith('study:')&&(papers.some(p=>k==='study:'+p.id)||k==='study:all-wrongs')){if(!v||!all[v.id])throw Error('背题进度格式不正确');checked[k]={id:v.id,at:Number(v.at)||Date.now()};}else if(k.startsWith('session:')&&(papers.some(p=>k==='session:'+p.id)||k==='session:all-wrongs')){if(v===null)continue;const s=safeState(v);if(!s)throw Error('作答进度格式不正确');checked[k]=s;}else if(k.startsWith('history:')&&(papers.some(p=>k==='history:'+p.id)||k==='history:all-wrongs')){if(!Array.isArray(v)||v.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100||!Number.isFinite(x.total)))throw Error('成绩记录格式不正确');checked[k]=v.slice(0,20);}}
pendingImport=checked;showDialog('导入备份',`<p>将导入 ${Object.keys(checked.wrongs||{}).length} 道错题历史，并恢复备份中的作答进度。</p><p class="muted">备份中的同名记录会覆盖当前记录。建议先导出当前备份。</p>`,'<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-import">确认导入</button>');}catch(e){toast('无法导入：'+e.message);}}
let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
