</style></head><body><div id="app"></div><dialog id="modal"></dialog><input type="file" id="import-file" accept="application/json,.json" hidden><script>const APP_DATA={"page":"paper","paperId":"p03","papers":[{"id":"p03","title":"Excel 模拟卷 03","originalTitle":"26模拟试卷(Excel) -03","source":"https://www.zlbbda.com.cn/studysome/exercise?testPapeId=169","questions":[{"number":1,"type":"判断题","book":"《大数据分析素养》","chapter":1,"question":"定量数据以数字形式表示，可以进行精确的测量和计算\n（  ）。","answer":["A"],"dataset_description":null,"id":"p03:1","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>定量数据以数字形式表示，可以进行精确的测量和计算\u003c/span>\u003c/p>\u003cp>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":2,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"营销成本可以拆解为广告费用和推广费用，不包括渠道费用（  ）。","answer":["B"],"dataset_description":null,"id":"p03:2","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>营销成本可以拆解为广告费用和推广费用，不包括渠道费用\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>。\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["营销成本不仅有广告和推广，还可能含分销佣金、渠道维护、平台服务等渠道费用，因此“不包括渠道费用”错误。"],"warning":""},"attachments":[]},{"number":3,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"点击率不是行为指标（  ）。","answer":["B"],"dataset_description":null,"id":"p03:3","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>点击率不是行为指标\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["点击率记录曝光后发生点击的比例，反映用户行为或行为转化，故“不是行为指标”错误。"],"warning":""},"attachments":[]},{"number":4,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"留存率不是用户指标（  ）。","answer":["B"],"dataset_description":null,"id":"p03:4","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>留存率不是用户指标\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["留存率衡量某批用户在后续时间仍活跃或继续使用的比例，是用户指标，题干否定了这一点，判错。"],"warning":""},"attachments":[]},{"number":5,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"SWOT分析法是基于内外部竞争环境和竞争条件下的态势分析（  ）。","answer":["A"],"dataset_description":null,"id":"p03:5","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>SWOT分析法是基于内外部竞争环境和竞争条件下的态势分析\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["SWOT 将内部优势 S、劣势 W 与外部机会 O、威胁 T 联系起来，用于分析所处态势，题干正确。"],"warning":""},"attachments":[]},{"number":6,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"企业的消费者属于内部利益相关者（  ）。","answer":["B"],"dataset_description":null,"id":"p03:6","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>企业的消费者属于内部利益相关者\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["消费者购买企业产品，但一般不属于企业内部组织成员，因此是外部利益相关者，题干错误。"],"warning":""},"attachments":[]},{"number":7,"type":"判断题","book":"《大数据分析素养》","chapter":2,"question":"内部利益相关者是与企业的日常运营、决策制定和长期发展紧密相关（  ）。","answer":["A"],"dataset_description":null,"id":"p03:7","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>内部利益相关者是与企业的日常运营、决策制定和长期发展紧密相关\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["员工、管理者等内部利益相关者参与或直接关联企业运营、决策和发展，题干正确。"],"warning":""},"attachments":[]},{"number":8,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"借助数据图形的展现手段能有效、直观地发现企业业务指标存在的问题（  ）。","answer":["A"],"dataset_description":null,"id":"p03:8","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>借助数据图形的展现手段能有效、直观地发现企业业务指标存在的问题\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":9,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"数据清洗技术可以用于去除重复数据（  ）。","answer":["A"],"dataset_description":null,"id":"p03:9","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>数据清洗技术可以用于去除重复数据（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":10,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"数据处理的多次迭代不可以逐步消除数据处理中的错误和偏差（  ）。","answer":["B"],"dataset_description":null,"id":"p03:10","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>数据处理的多次迭代不可以逐步消除数据处理中的错误和偏差\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":11,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"通过比较观察到的数据与预期结果之间的差异，评估所提出假设的有效性不属于假设检验（  ）。","answer":["B"],"dataset_description":null,"id":"p03:11","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>通过比较观察到的数据与预期结果之间的差异，评估所提出假设的有效性不属于假设检验\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":12,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"直方图通过四分位数将数据集分为四部分（  ）。","answer":["B"],"dataset_description":null,"id":"p03:12","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>直方图通过四分位数将数据集分为四部分\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":13,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"居民消费价格指数不属于宏观经济数据（  ）。","answer":["B"],"dataset_description":null,"id":"p03:13","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>居民消费价格指数不属于宏观经济数据\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"居民消费价格指数","paragraphs":["CPI 衡量居民消费品和服务价格水平的变动，常用于分析通货膨胀和居民购买力，是典型宏观经济指标。","题干说它“不属于宏观经济数据”，否定了其实际用途，因此错误。"],"warning":""},"attachments":[]},{"number":14,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"人均国内生产总值是总量指标（  ）。","answer":["B"],"dataset_description":null,"id":"p03:14","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>人均国内生产总值\u003c/span>\u003cspan>是总量指标\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":15,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"定序尺度可以描述降水量的变化（  ）。","answer":["B"],"dataset_description":null,"id":"p03:15","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>定序尺度可以描述降水量的变化\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":16,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"绝对指标是计算相对指标和平均指标的基础（  ）。","answer":["A"],"dataset_description":null,"id":"p03:16","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>绝对指标是计算相对指标和平均指标的基础\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":17,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"学生上课的出勤率为动态相对数（  ）。","answer":["B"],"dataset_description":null,"id":"p03:17","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>学生上课的出勤率为动态相对数\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"简单随机抽样通常是从总体中连续抽取的。","answer":["B"],"dataset_description":null,"id":"p03:18","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>简单随机抽样通常是从总体中连续抽取的。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"整群抽样的划分标志不一定与调查标志有关（  ）。","answer":["A"],"dataset_description":null,"id":"p03:19","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>整群抽样的划分标志不一定与调查标志有关（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"无偏性是指统计量存在系统偏差（  ）。","answer":["B"],"dataset_description":null,"id":"p03:20","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>无偏性是指统计量存在系统偏差\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"正态总体有已知方差，样本均值塣是充分统计量。","answer":["A"],"dataset_description":null,"id":"p03:21","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>正态总体有已知\u003c/span>方差\u003cspan>，样本均值塣是充分统计量。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本特征值叫作参数,是描述一个样本情况的统计指标（  ）。","answer":["B"],"dataset_description":null,"id":"p03:22","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>样本特征值叫作\u003c/span>\u003cspan>参数\u003c/span>\u003cspan>,是描述一个样本情况的统计指标（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"对于任何样本容量,样本比例的抽样分布都可用正态分布近似（  ）。","answer":["B"],"dataset_description":null,"id":"p03:23","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>对于任何样本容量,样本比例的抽样分布都可用正态分布近似（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"总体参数的值通常是未知的（  ）。","answer":["A"],"dataset_description":null,"id":"p03:24","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>总体\u003c/span>参数的值通常是未知的\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"抽样误差是指由于随机抽样的偶然因素引起抽样指标与总体参数的绝对离差（  ）。","answer":["A"],"dataset_description":null,"id":"p03:25","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>抽样误差是指由于随机抽样的偶然因素引起抽样指标与\u003c/span>\u003cspan>总体参数\u003c/span>\u003cspan>的绝对离差\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"总体的中位数不属于总体参数（  ）。","answer":["B"],"dataset_description":null,"id":"p03:26","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>总体的中位数不属于总体参数（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量不是随机变量（  ）。","answer":["B"],"dataset_description":null,"id":"p03:27","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>样本统计量不是随机变量（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"落在拒绝域的概率等于置信水平（ ）。","answer":["B"],"dataset_description":null,"id":"p03:28","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>落在拒绝域的概率等于置信水平（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"最大似然估计不属于参数估计（ ）。","answer":["B"],"dataset_description":null,"id":"p03:29","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>最大似然估计不属于参数估计（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"备择假设是包含关于总体分布的一切使原假设不成立的命题（ ）。","answer":["A"],"dataset_description":null,"id":"p03:30","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>备择假设是包含关于总体分布的一切使原假设不成立的命题（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"在购买葡萄的时候往往先尝一尝的方法属于归纳法（ ）。","answer":["A"],"dataset_description":null,"id":"p03:31","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在购买葡萄的时候往往先尝一尝的方法属于归纳法（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"原假设：寒冷会导致人们的情绪变差；备择假设：寒冷不会导致人们的情绪变差。","answer":["A"],"dataset_description":null,"id":"p03:32","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>原假设：寒冷会导致人们的情绪变差；备择假设：寒冷不会导致人们的情绪变差\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"t分布检验法是用来判断两组数据均值是否存在显著性差异的检验方法","answer":["A"],"dataset_description":null,"id":"p03:33","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>t分布检验法是用来判断两组数据均值是否存在显著性差异的检验方法\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据的数据质量难以保证,但价值密度高（ ）。","answer":["B"],"dataset_description":null,"id":"p03:34","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>大数据的数据质量难以保证,但价值密度高（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":35,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"NOSQL数据组织方式不包括文档（ ）。","answer":["B"],"dataset_description":null,"id":"p03:35","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>NOSQL数据组织方式不包括文档\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据结构、数据库与存储","paragraphs":["结构化数据具有明确模式，如关系表的行列；半结构化数据有标签或键等组织方式，如 JSON、XML；非结构化数据如图片、音视频和自由文本。来源内部或外部与结构类型是两个不同维度。","NoSQL 常包括键值、文档、列族和图等模型，不是只能存文本或只能用表格。关系数据库以表和关系为主要模型，数据模型与物理存储方式不能混为一谈。","存储需兼顾容量扩展、检索效率、备份恢复、权限和安全；加密主要保护保密性，不能单靠更严格加密来解决容量增长。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"来源和结构分开看；NoSQL 不只键值一种。","source":""},"attachments":[]},{"number":36,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"网络是大数据最重要的来源之一，网络数据是真实的（ ）。","answer":["B"],"dataset_description":null,"id":"p03:36","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>网络是大数据最重要的来源之一，网络数据是真实的（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":37,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"降维技术是指在保证数据所具有的代表性特性情况下,将高维数据转化为低维数据的过程（  ）。","answer":["A"],"dataset_description":null,"id":"p03:37","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>降维技术是指在保证数据所具有的代表性特性情况下,将高维数据转化为低维数据的过程（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"降维与特征表示","paragraphs":["降维将高维特征映射或筛选为较少维度，在尽量保留重要结构和信息的同时降低冗余、噪声与计算成本。通常是高维到低维，而不是反过来扩维。","特征选择保留原特征的子集；特征提取构造新特征，如主成分分析以方差方向构造线性组合。降维一般存在信息取舍，不能保证毫无信息损失或必然提高所有模型准确率。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"降维减少特征维度；选择保留原列，提取产生新列。","source":""},"attachments":[]},{"number":38,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"数学模型是运用数理逻辑方法建构的科学或工程模型（ ）。","answer":["A"],"dataset_description":null,"id":"p03:38","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>数学模型是运用数理逻辑方法建构的科学或工程模型（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":39,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"整数规划是全部或部分变量被限制为整数（ ）。","answer":["A"],"dataset_description":null,"id":"p03:39","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>整数规划是全部或部分变量被限制为整数（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"线性回归模型意味着模型变量是线性的","answer":["B"],"dataset_description":null,"id":"p03:40","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>线性回归模型意味着模型变量是线性的\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"在电子表格（excel）中，行号是以（   ）排列的。","answer":["C"],"dataset_description":null,"id":"p03:41","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在电子表格（excel）中，行号是以（ &nbsp; ）排列的。\u003c/span>\u003c/p>","options":[{"label":"A","html":"英文字母序列。"},{"label":"B","html":"汉语拼音。"},{"label":"C","html":"阿拉伯数字"},{"label":"D","html":"任意字符。"}],"explanation":{"topic":"Excel 单元格、文件与基本操作","paragraphs":["Excel 的 A1 引用方式以字母表示列、数字表示行，例如 D4 表示第4列第4行，连续区域用冒号连接。现代 .xlsx 工作表共有1,048,576行、16,384列。","日期通常以序列数保存，显示格式只改变外观；时间是一天的小数部分，显示文本与真实日期值需区分。自动填充可快速生成日期序列。",".xlsx 是常见无宏工作簿格式，.xlsm 可保存宏，.xls 为旧格式。CSV/TXT 适合平面文本数据，通常不能完整保留多工作表、图表和格式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：阿拉伯数字”。"],"tip":"列字母、行数字；显示格式和单元格实际值分开看。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[]},{"number":42,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下述关于数据分析目标的说法，正确的选项是(   )。","answer":["C"],"dataset_description":null,"id":"p03:42","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下述关于数据分析目标的说法，正确的选项是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"解决其他学科不能解决的数据分析问题"},{"label":"B","html":"根据客户的需要提供所要的结论"},{"label":"C","html":"从数据中发现规律，并依据相关学科解释数据"},{"label":"D","html":"为“预设结论”寻找支持"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：从数据中发现规律，并依据相关学科解释数据”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":43,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"电子表格（excel）具有非常强大的功能，最突出的功能是（   ）。","answer":["D"],"dataset_description":null,"id":"p03:43","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>电子表格（excel）具有非常强大的功能，最突出的功能是（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"处理文档。"},{"label":"B","html":"制作表格。"},{"label":"C","html":"数据库管理。"},{"label":"D","html":"处理表格数据。"}],"explanation":{"topic":"Excel 单元格、文件与基本操作","paragraphs":["Excel 的 A1 引用方式以字母表示列、数字表示行，例如 D4 表示第4列第4行，连续区域用冒号连接。现代 .xlsx 工作表共有1,048,576行、16,384列。","日期通常以序列数保存，显示格式只改变外观；时间是一天的小数部分，显示文本与真实日期值需区分。自动填充可快速生成日期序列。",".xlsx 是常见无宏工作簿格式，.xlsm 可保存宏，.xls 为旧格式。CSV/TXT 适合平面文本数据，通常不能完整保留多工作表、图表和格式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：处理表格数据。”。"],"tip":"列字母、行数字；显示格式和单元格实际值分开看。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[]},{"number":44,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"品牌承载的更多是一部分消费者对某个产品或服务的认可，下面对于品牌最基本的含义的说法，正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p03:44","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>品牌承载的更多是一部分消费者对某个产品或服务的认可，下面对于品牌最基本的含义的说法，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"消费者类型"},{"label":"B","html":"消费者文化"},{"label":"C","html":"消费者利益"},{"label":"D","html":"商品属性"}],"explanation":{"topic":"本题解析","paragraphs":["品牌的基本层次是让消费者联想到产品属性，如耐用、性能或品质，所以本题选 D。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"消费者类型是用户形象层面的联想，不是品牌最基本的属性层。"},{"label":"B","selected":false,"reason":"文化属于品牌更深层的含义，不是最基本层次。"},{"label":"C","selected":false,"reason":"利益是产品属性给客户带来的好处，位于属性之上的解释层。"},{"label":"D","selected":true,"reason":"品牌首先使人联想到商品的具体属性，如性能或品质，对应题目“最基本”。"}]},"attachments":[]},{"number":45,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"下面关于问题识别依据的说法，哪一项表述是不正确的(   )。","answer":["D"],"dataset_description":null,"id":"p03:45","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下面关于问题识别依据的说法，哪一项表述是不正确的( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"识别问题需要找到企业内部利益相关者"},{"label":"B","html":"问题的核心是什么"},{"label":"C","html":"问题在企业中具有的重要程度"},{"label":"D","html":"问题通常是显而易见的"}],"explanation":{"topic":"本题解析","paragraphs":["业务问题往往隐藏在流程、指标或利益相关者的不同表述中，并非显而易见，所以 D 不正确。"],"warning":"","optionAnalysis":[{"label":"A","selected":false,"reason":"找到相关业务人员，有助于理解问题及影响，是合理依据。"},{"label":"B","selected":false,"reason":"界定核心才能避免把症状误当成原因，是合理步骤。"},{"label":"C","selected":false,"reason":"重要程度有助于确定问题优先级，应当考虑。"},{"label":"D","selected":true,"reason":"很多业务问题隐藏在数据和流程中，并非显而易见；这句错误。"}]},"attachments":[]},{"number":46,"type":"单选题","book":"《大数据分析素养》","chapter":2,"question":"以下关于客单价描述，错误的是(   )。","answer":["A"],"dataset_description":null,"id":"p03:46","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下关于客单价描述，错误的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>反映单位时间有多少客户购买产品\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>单一客户的平均每次交易中的购买金额\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>等于销售总额除以顾客总数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>等于销售总额除以成交总笔数\u003c/span>\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["客单价讲平均每客或每笔交易金额，不是“有多少客户”，因此 A 把金额指标混成了人数指标。"],"warning":"","optionAnalysis":[{"label":"A","selected":true,"reason":"它描述客户人数，而客单价描述平均金额，错在把数量与金额混淆。"},{"label":"B","selected":false,"reason":"平均每次交易金额符合题干采用的客单价含义。"},{"label":"C","selected":false,"reason":"按顾客数计算的是每客平均消费，属于常见口径；需明确是否去重。"},{"label":"D","selected":false,"reason":"按交易笔数计算的是每单平均金额，符合本题采用的交易口径。"}]},"attachments":[]},{"number":47,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"为了计算企业的各类业务指标，我们需要对业务的状态及相互关系进行符号记载， 并通过电子文档或数据库予以保存。下述哪个选项表示这种符号(   )？","answer":["A"],"dataset_description":null,"id":"p03:47","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>为了计算企业的各类业务指标，我们需要\u003c/span>\u003cspan>对业务的状态及相互关系进行符号记载， 并通过电子文档或数据库予以保存。下述哪个选项表示这种符号( &nbsp; )？\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据"},{"label":"B","html":"字段"},{"label":"C","html":"记录"},{"label":"D","html":"大数据"}],"explanation":{"topic":"数据结构、数据库与存储","paragraphs":["结构化数据具有明确模式，如关系表的行列；半结构化数据有标签或键等组织方式，如 JSON、XML；非结构化数据如图片、音视频和自由文本。来源内部或外部与结构类型是两个不同维度。","NoSQL 常包括键值、文档、列族和图等模型，不是只能存文本或只能用表格。关系数据库以表和关系为主要模型，数据模型与物理存储方式不能混为一谈。","存储需兼顾容量扩展、检索效率、备份恢复、权限和安全；加密主要保护保密性，不能单靠更严格加密来解决容量增长。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：数据”。"],"tip":"来源和结构分开看；NoSQL 不只键值一种。","source":""},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"人力资源部门的数据属于公司内部数据，下面属于国家法定福利内容的是（   ）。","answer":["A"],"dataset_description":null,"id":"p03:48","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>人力资源部门的数据属于公司内部数据，下面属于国家法定福利内容的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"养老保险"},{"label":"B","html":"培训"},{"label":"C","html":"企业年金"},{"label":"D","html":"奖金"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：养老保险”。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在绘制折线图时，下列做法错误的是（   ）。","answer":["A"],"dataset_description":null,"id":"p03:49","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在绘制折线图时，下列做法错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"将各矩形竖边中点用直线连接起来即可"},{"label":"B","html":"折线图下所围成的面积与直方图面积相等"},{"label":"C","html":"折线图表示的频数分布与直方图一致"},{"label":"D","html":"两终点与横轴相交"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：将各矩形竖边中点用直线连接起来即可”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"在下列计量尺度中，适用于反映业务对象的结构，比重，速度，和密度数量关系的是哪一个选项（ ）？","answer":["B"],"dataset_description":null,"id":"p03:50","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在下列计量尺度中，适用于反映业务对象的结构，比重，速度，和密度数量关系的是哪一个选项（ ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"定距尺度"},{"label":"B","html":"定比尺度"},{"label":"C","html":"定序尺度"},{"label":"D","html":"定类尺度"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：定比尺度”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"全国粮食产量与全国人口比较,属于（   ）。","answer":["B"],"dataset_description":null,"id":"p03:51","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>全国粮食产量与全国人口比较,属于（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"平均指标"},{"label":"B","html":"强度相对指标"},{"label":"C","html":"计划完成相对指标"},{"label":"D","html":"比较相对指标"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：强度相对指标”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"如果按照从低层到高层的排列顺序将测量尺度进行排列，在下述选项中，正确的是(    )。","answer":["B"],"dataset_description":null,"id":"p03:52","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>如果按照从低层到高层的排列顺序将测量尺度进行排列，在下述选项中，正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"定序尺度，定距尺度，定比尺度，定类尺度"},{"label":"B","html":"定类尺度，定序尺度，定距尺度，定比尺度"},{"label":"C","html":"定序尺度，定比尺度，定距尺度，定类尺度"},{"label":"D","html":"定类尺度，定距尺度，定序尺度，定比尺度"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：定类尺度，定序尺度，定距尺度，定比尺度”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"统计指标研究的对象是大量社会现象。以下观点中，正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p03:53","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>统计指标研究的对象是大量社会现象。以下观点中，正确的是（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"抽象的数量特征和数量关系"},{"label":"B","html":"社会经济现象的规律性"},{"label":"C","html":"社会经济现象的数量特征和数量关系"},{"label":"D","html":"社会经济统计认识过程的规律"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：社会经济现象的数量特征和数量关系”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"从某个总体中抽取一个样本容量为10的样本，样本均值的抽样标准误为3，总体的方差等于（ ）。","answer":["A"],"dataset_description":null,"id":"p03:54","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>从某个总体中抽取一个样本容量为10的样本，样本均值的抽样标准误为3，总体的方差等于（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>90\u003c/p>"},{"label":"B","html":"\u003cp>60\u003c/p>"},{"label":"C","html":"\u003cp>80\u003c/p>"},{"label":"D","html":"\u003cp>75\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["均值标准误 SE=σ/√n。已知 SE=3、n=10，所以总体方差σ²=SE²×n=9×10=90，选 A。","注意所求是方差，不是标准差；标准差为√90。"],"warning":""},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于参数“率”的抽样误差的论述，正确的是（ ）。","answer":["A"],"dataset_description":null,"id":"p03:55","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于参数“率”的抽样误差的论述，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>随机抽样得到的样本率通常存在抽样误差，且抽样误差可以通过标准误进行估计\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>从总体中随机抽取的样本，率的抽样误差不可计算\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>各样本率之间的差异不能反映率的抽样误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>率的抽样误差无法控制\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：随机抽样得到的样本率通常存在抽样误差，且抽样误差可以通过标准误进行估计”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"相关程度看的是相关系数的绝对值，下面表述错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:56","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>相关程度看的是相关系数的绝对值，下面表述错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>相关系数的绝对值越大，相关程度越高\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>相关系数为0时，说明没有明显的线性相关关系\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>当相关系数的区间为[0，1]时，相关系数越大，相关程度越高\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>当相关系数的区间为[0，-1]时，相关系数越小，相关程度越低\u003c/span>\u003c/p>"}],"explanation":{"topic":"协方差与相关系数","paragraphs":["协方差 Cov(X,Y)=E[(X−EX)(Y−EY)] 表示共同变化方向，但大小受单位影响。相关系数 r=Cov(X,Y)/(σXσY) 消除量纲，范围在−1到1之间，绝对值越大表示线性相关越强。","r>0 为同向，r\u003c0 为反向，r≈0 只表示线性关系弱，并不排除非线性关系，更不能推出独立；相关也不等于因果。","协方差矩阵对称，对角线是各变量方差，非对角线是成对协方差；方差非负，协方差可以为负。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：当相关系数的区间为[0，-1]时，相关系数越小，相关程度越低”。"],"tip":"r 看符号和绝对值；相关≠因果，零相关≠没关系。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"对于分层抽样，以下说法正确的是(    )。","answer":["A"],"dataset_description":null,"id":"p03:57","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>对于分层抽样，以下说法正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"不同类别的单位被抽中的概率可能不相等"},{"label":"B","html":"分层抽样误差只受层间方差的影响，不受层内方差的影响"},{"label":"C","html":"分层抽样在分层时应使各层之间的差异尽可能小"},{"label":"D","html":"由于在分层时使用了一些辅助信息，因此分层抽样违背了随机原则"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：不同类别的单位被抽中的概率可能不相等”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"一个学校有1003位学生，现在需要从全校学生中采用随机起点等距抽样的方法抽取出100名学生作为调查样本，下列错误的做法是（  ）。","answer":["B"],"dataset_description":null,"id":"p03:58","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cstrong> \u003c/strong>\u003cspan>一个学校有1003位学生，现在需要从全校学生中采用随机起点等距抽样的方法抽取出100名学生作为调查样本，\u003c/span>\u003cspan>下列错误的做法是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>将随机剔除3名学生后的1000名学生随机分为100个组\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>保留3名学生，将其编入到最后面组\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本距离近似10\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>每隔10个编号抽取1个样本\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：保留3名学生，将其编入到最后面组”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于t分布下列说法错误的是（ ）。","answer":["D"],"dataset_description":null,"id":"p03:59","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于t分布下列说法错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>当自由度n趋向无穷大，t分布趋向标准标准正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布是一簇曲线\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>自由度相同时，t的绝对值越大，概率P越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan> t分布是以1为中心、左右对称的单峰曲线\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：t分布是以1为中心、左右对称的单峰曲线”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例正确的说法是（ ）。","answer":["A"],"dataset_description":null,"id":"p03:60","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于样本比例正确的说法是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>随着样本容量的增大，样本比例的方差愈来愈小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随着样本容量的增大，样本比例的方差愈来愈大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随着样本容量的增大，样本比例的方差不会发生改变\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>随着样本容量的增大，样本比例的方差在某些区间会变大，在某些区间会变小\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：随着样本容量的增大，样本比例的方差愈来愈小”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量是（   ）变量，随着抽到的样本单位不同取其值也会有所变化。","answer":["C"],"dataset_description":null,"id":"p03:61","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>样本统计量是（ &nbsp; ）变量，随着抽到的样本单位不同取其值也会有所变化。\u003c/span>\u003c/p>","options":[{"label":"A","html":"正常"},{"label":"B","html":"要素"},{"label":"C","html":"随机"},{"label":"D","html":"整体"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：随机”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在相同的条件下，有限总体不重复抽样的抽样误差（ ）。","answer":["B"],"dataset_description":null,"id":"p03:62","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在相同的条件下，有限总体不重复抽样的抽样误差（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>一定比重复抽样的抽样误差大\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>一定比重复抽样的抽样误差小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>与重复抽样的抽样误差相等\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>有时比重复抽样的抽样误差大，有时比重复抽样的抽样误差小\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：一定比重复抽样的抽样误差小”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列属于系统误差的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:63","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列属于系统误差的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>调查员因粗心将数据登记错误\u003c/p>"},{"label":"B","html":"\u003cp>测量时多次读数取平均，但每次读数略有波动\u003c/p>"},{"label":"C","html":"\u003cp>化学实验时酒精溅入反应容器导致结果异常\u003c/p>"},{"label":"D","html":"\u003cp>伏安法测电阻时电表内阻对实验结果的影响\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：伏安法测电阻时电表内阻对实验结果的影响”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于样本单位数的说法,错误的选项是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:64","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下面关于样本单位数的说法,\u003c/span>错误\u003cspan>的\u003c/span>选项\u003cspan>是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>若要求抽样的可靠程度较高,抽样的数目就要多些\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>若总体变异程度大,则需多抽取一些样本单位\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>在\u003c/span>相同\u003cspan>的\u003c/span>置信水平\u003cspan>下,重复抽样\u003c/span>比不\u003cspan>重复抽样需要抽取\u003c/span>更多的\u003cspan>样本\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>在相同的误差范围内，分层抽样和等距抽样通常比随机抽样需要更多的样本单位数\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：在相同的误差范围内，分层抽样和等距抽样通常比随机抽样需要更多的样本单位数”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于等距抽样中点法的说法，正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p03:65","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下面关于等距抽样中点法的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>每隔k+1个单位抽取一个样本单位\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>取总体的中间组的中间项为第一个样本\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>在总体的第一组，取中间项为第一个样本\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>缺点是降低整个样本对总体的代表性\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：在总体的第一组，取中间项为第一个样本”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":66,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于任意抽样的说法，正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p03:66","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于任意抽样的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>最简单省事的一种抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>比其它形式的抽样调查更不容易出现统计偏差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>适用于正式的抽样调查\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本具有足够的代表性\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：最简单省事的一种抽样”。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":67,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在抽样时,将总体中各单位归并成若干个互不交叉、互不重复的集合,然后以之为抽样单位抽取样本的一种抽样方式称为（   ）。","answer":["A"],"dataset_description":null,"id":"p03:67","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在抽样时,将总体中各单位归并成若干个互不交叉、互不重复的集合,然后以之为抽样单位抽取样本的一种抽样方式称为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"整群抽样"},{"label":"B","html":"等距抽样"},{"label":"C","html":"分层抽样"},{"label":"D","html":"两阶段随机抽样"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：整群抽样”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列场合适合用t统计量的是(   )","answer":["C"],"dataset_description":null,"id":"p03:68","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列场合适合用t统计量的是( &nbsp; )\u003c/span>\u003c/p>","options":[{"label":"A","html":"正态总体,大样本,方差未知"},{"label":"B","html":"非正态总体,大样本,方差未知"},{"label":"C","html":"正态总体,小样本,方差未知"},{"label":"D","html":"非正态总体,小样本,方差未知"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：正态总体,小样本,方差未知”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于同质性，大量性，和差异性的适用范围，正确的是(  )。","answer":["A"],"dataset_description":null,"id":"p03:69","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下关于同质性，大量性，和差异性的适用范围，正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>有限总体和无限总体都具有\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>只有无限总体具有\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>只有有限总体具有\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>有限总体和无限总体都不具有\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：有限总体和无限总体都具有”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于正态分布的特征不正确的叙述是（ ）。","answer":["D"],"dataset_description":null,"id":"p03:70","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于正态分布的特征不正确的叙述是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>在直角坐标的横轴上方呈钟形曲线\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>两端与χ轴永不相交\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>以均值为对称轴\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正态分布有两个参数：一个为位置参数σ，一个为形态参数μ\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：正态分布有两个参数：一个为位置参数σ，一个为形态参数μ”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于循环等距抽样的描述，错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p03:71","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于循环等距抽样的描述，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽满k个为止\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>当有限总体的N不能被样本n所整除，组数k不是一个整数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>将总体各单位按顺序排成首尾相接的循环圆形\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>用N/n确定抽样间隔k\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：抽满k个为止”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":72,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面不能够用来描述样本数据分散程度的统计量是（   ）。","answer":["A"],"dataset_description":null,"id":"p03:72","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下面不能够用来描述样本数据分散程度的统计量是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"样本中位数"},{"label":"B","html":"样本极差"},{"label":"C","html":"样本方差"},{"label":"D","html":"样本标准差"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：样本中位数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":73,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"如果偏态系数取值为2，说明数据分布（  ）。","answer":["A"],"dataset_description":null,"id":"p03:73","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>如果偏态系数取值为2，说明数据分布（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"严重右偏"},{"label":"B","html":"轻度左偏"},{"label":"C","html":"中度左偏"},{"label":"D","html":"严重左偏"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：严重右偏”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"对于下列样本10，25，36，39，53，68，极差统计量为（  ）。","answer":["B"],"dataset_description":null,"id":"p03:74","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>对于下列样本10，25，36，39，53，68，极差统计量为（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>29\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>58\u003c/p>"},{"label":"C","html":"\u003cp>68\u003c/p>"},{"label":"D","html":"\u003cp>25\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["极差等于最大值减最小值：68−10=58，因此选 B。","它描述全距，不是中间两个数之差，也不是只报最大值。"],"warning":""},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于非参数统计叙述中，正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:75","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于非参数统计叙述中，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>对总体分布类型有严格规定\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>适用范围较窄\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>要求总体服从特定的分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>适用于\u003c/span>\u003cspan>样本量小的情况\u003c/span>\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：适用于样本量小的情况”。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"系统抽样是将总体的全部单元按照一定顺序排列,先随机抽取第一个样本,再以此样本为起点,按照某种确定的规则顺序抽取其余的样本单元的抽样方法。根据上述定义,下列抽样中属于系统抽样的是（   ）。","answer":["A"],"dataset_description":null,"id":"p03:76","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>系统抽样是将总体的全部单元按照一定顺序排列,先随机抽取第一个样本,再以此样本为起点,按照某种确定的规则顺序抽取其余的样本单元的抽样方法。根据上述定义,下列抽样中属于系统抽样的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>研究人员为了从标有1—15号的15个球中选3个作样本，先随机选取2号球，再抽取7号、12号入样\u003c/p>"},{"label":"B","html":"\u003cp>工厂生产的产品，用传送带将产品送入包装车间，检验人员从传送带上每隔五分钟抽一件产品进行检验\u003c/p>"},{"label":"C","html":"\u003cp>研究人员为了进行某项市场调查，在商场门口随机选择消费者进行询问，直到询问人数满足事先规定为止\u003c/p>"},{"label":"D","html":"\u003cp>电影院为了解观众对某部电影的观感，邀请每排座位号为14的观众填写调查问卷\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：研究人员为了从标有1—15号的15个球中选3个作样本，先随机选取2号球，再抽取7号、12号入样”。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于分层抽样，在下列说法中错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:77","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于分层抽样，在下列说法中错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>按照特征进行分层\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>适用于层内差异小，层间差异大的数据\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>是几种常用的概率抽样方法中抽样误差最小的一种抽样方法\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>适用于层内差异大，层间差异小的数据\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：适用于层内差异大，层间差异小的数据”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于统计总体的描述，不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p03:78","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下关于统计总体的描述，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>在所有方面都是相同的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>少数单位不能形成总体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体的所有单位都必须具有某一共同性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>由许多个单位组成的\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：在所有方面都是相同的”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于相关系数范围的说法，正确的是(  )。","answer":["A"],"dataset_description":null,"id":"p03:79","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下关于相关系数范围的说法，正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>-1到 +1之间\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>0到1之间\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>-1到 0之间\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>1到正无穷\u003c/span>\u003c/p>"}],"explanation":{"topic":"协方差与相关系数","paragraphs":["协方差 Cov(X,Y)=E[(X−EX)(Y−EY)] 表示共同变化方向，但大小受单位影响。相关系数 r=Cov(X,Y)/(σXσY) 消除量纲，范围在−1到1之间，绝对值越大表示线性相关越强。","r>0 为同向，r\u003c0 为反向，r≈0 只表示线性关系弱，并不排除非线性关系，更不能推出独立；相关也不等于因果。","协方差矩阵对称，对角线是各变量方差，非对角线是成对协方差；方差非负，协方差可以为负。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：-1到 +1之间”。"],"tip":"r 看符号和绝对值；相关≠因果，零相关≠没关系。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于简单随机抽样的说法，正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p03:80","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下面关于简单随机抽样的说法，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"间隔抽样"},{"label":"B","html":"分层抽样"},{"label":"C","html":"整群抽样"},{"label":"D","html":"同等频率抽样"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：同等频率抽样”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"抽样设计的原则不包括（  ）。","answer":["D"],"dataset_description":null,"id":"p03:81","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>抽样设计的原则不包括（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>目的性原则\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>可行性原则\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>可测性原则\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>创新性原则\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：创新性原则”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"有关抽样误差说法正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p03:82","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>有关抽样误差说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体异质性程度相同，样本容量越大，抽样误差越大\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>参数值与统计值之间的差异就是抽样误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本规模相同，总体异质性程度越高，抽样误差越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样中因违反抽样规则产生误差属于抽样误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：参数值与统计值之间的差异就是抽样误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"分层抽样的优点不包括（   ）。","answer":["C"],"dataset_description":null,"id":"p03:83","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>分层抽样的优点不包括（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"抽样误差比较小"},{"label":"B","html":"在不同层中抽样的比例可以不同"},{"label":"C","html":"便于组织,节省经费"},{"label":"D","html":"可对不同层独立进行分析"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：便于组织,节省经费”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"某地区进行儿童疫苗接种率调查，首先将该地区分为好中差三类，然后在每类中随机抽1/10的学龄儿童进行调查，这种抽样方法属于（   ）。","answer":["C"],"dataset_description":null,"id":"p03:84","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>某地区进行儿童疫苗接种率调查，首先将该地区分为好中差三类，然后在每类中随机抽1/10的学龄儿童进行调查，这种抽样方法属于（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"多级抽样"},{"label":"B","html":"系统抽样"},{"label":"C","html":"分层抽样"},{"label":"D","html":"整群抽样"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：分层抽样”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"总体的差异性是指（  ）。","answer":["A"],"dataset_description":null,"id":"p03:85","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>总体的差异性是指（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体单位标志的不同表现\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体单位不同的标志\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>表现总体特征的各种指标\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>表现总体特征的各种标志\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：总体单位标志的不同表现”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量服从的分布取决于（ ）。","answer":["A"],"dataset_description":null,"id":"p03:86","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>样本统计量服从的分布取决于（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>总体分布和样本容量\u003c/p>"},{"label":"B","html":"\u003cp>样本容量大小\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体参数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样方法\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：总体分布和样本容量”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于总体和样本,以下描述错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:87","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于总体和样本,以下描述错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本中所包含的观察单位数即为样本量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样研究的目的就是用样本信息推论总体特征\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本应具有代表性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本是总体中任意选取的一部分\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：样本是总体中任意选取的一部分”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本比例的抽样分布服从（ ）。","answer":["A"],"dataset_description":null,"id":"p03:88","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>样本比例的抽样分布服从（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>F分布\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>均匀分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>二项分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：正态分布”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于置信区间的说法，正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:89","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于置信区间的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>较窄的置信区间比较宽的置信区间能提供较少的有关总体参数的信息\u003c/p>"},{"label":"B","html":"\u003cp>较长的置信区间表明这种估计有较高的可信程度\u003c/p>"},{"label":"C","html":"\u003cp>较窄的置信区间表明这种估计有较低的可信程度\u003c/p>"},{"label":"D","html":"\u003cp>较窄的置信区间比较宽的置信区间能提供更多的有关总体参数的信息\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：较窄的置信区间比较宽的置信区间能提供更多的有关总体参数的信息”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":90,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于t分布，下面哪一种说法是正确的（ ）。","answer":["C"],"dataset_description":null,"id":"p03:90","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于t分布，下面哪一种说法是正确的（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>t分布与梯形分布特征相似\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布与标准正态分布特征相同\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>标准正态分布可视为自由度趋于无穷大时t分布的极限形式\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>t分布与均匀分布图形相同\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：标准正态分布可视为自由度趋于无穷大时t分布的极限形式”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":91,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"偏态系数测度了数据分布的非对称性程度。如果一组数据的分布是对称的,则偏态系数（   ）。","answer":["B"],"dataset_description":null,"id":"p03:91","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>偏态系数测度了数据分布的非对称性程度。如果一组数据的分布是对称的,则偏态系数（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"等于1"},{"label":"B","html":"等于0"},{"label":"C","html":"大于0"},{"label":"D","html":"大于1"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：等于0”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于非参数统计量的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:92","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下不属于非参数统计量的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>中位数统计量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>百分位数统计量\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>比例统计量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>方差统计量\u003c/span>\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：方差统计量”。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"进行假设检验时，对选取的统计量说法，不正确的是(   )。","answer":["B"],"dataset_description":null,"id":"p03:93","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>进行假设检验时，对选取的统计量说法，不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"是样本的函数"},{"label":"B","html":"不能包含总体分布中的任何参数"},{"label":"C","html":"可以包含总体分布中的已知参数"},{"label":"D","html":"其值可以由取定的样本值计算出来"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：不能包含总体分布中的任何参数”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"小样本、正态总体且总体方差未知时，用于总体均值推断的检验统计量服从什么分布？","answer":["B"],"dataset_description":null,"id":"p03:94","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>小样本、正态总体且总体方差未知时，用于总体均值推断的检验统计量服从什么分布？\u003c/span>\u003c/p>","options":[{"label":"A","html":"正态分布"},{"label":"B","html":"t分布
