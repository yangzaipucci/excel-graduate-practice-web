"},{"label":"C","html":"二项分布"},{"label":"D","html":"卡方分布"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：t分布”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":95,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于假说演绎法的叙述，错误的是（ ）","answer":["A"],"dataset_description":null,"id":"p03:95","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于假说演绎法的叙述，错误的是（ ）\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan> \u003c/span>无论实验结果与预期结论是否相符，不影响假说的正确性\u003c/p>"},{"label":"B","html":"\u003cp>通过实验检验演绎推理的结论\u003c/p>"},{"label":"C","html":"\u003cp>实验结果与预期结论相符，只能说明假说在该实验条件下成立，不能完全证明其绝对正确\u003c/p>"},{"label":"D","html":"\u003cp>在观察和分析基础上提出问题，通过推理提出解释问题的假说\u003c/p>"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：无论实验结果与预期结论是否相符，不影响假说的正确性”。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":96,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"假设检验中的显著性水平一般用α来表示，下述关于α的观点正确的选项是（ ）。","answer":["A"],"dataset_description":null,"id":"p03:96","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>假设检验中的显著性水平一般用α来表示，下述关于α的观点正确的选项是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"犯第一类错误的概率不超过α"},{"label":"B","html":"犯第二类错误的概率不超过α"},{"label":"C","html":"犯两类错误的概率之和不超过α"},{"label":"D","html":"犯第一类错误的概率不超过1-α"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：犯第一类错误的概率不超过α”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":97,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列关于归纳法和演绎法的说法，不正确的是(   )。","answer":["D"],"dataset_description":null,"id":"p03:97","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于归纳法和演绎法的说法，不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"归纳法是从个别出发以达到一般性"},{"label":"B","html":"演绎法是从一般到个别"},{"label":"C","html":"演绎法是先推论后观察"},{"label":"D","html":"归纳法是从推论开始"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：归纳法是从推论开始”。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":98,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于假设检验的说法中,下面正确的是(    )。","answer":["C"],"dataset_description":null,"id":"p03:98","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于假设检验的说法中,下面正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"做显著性检验的目的就是为了接受原假设"},{"label":"B","html":"一旦检验法选择正确,计算没有错误,就不会作出错误判断"},{"label":"C","html":"一旦样本容量一定,犯第一类错误和第二类错误的概率不可能同时减小"},{"label":"D","html":"显著性水平就是原假设为真时,接受原假设的概率"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：一旦样本容量一定,犯第一类错误和第二类错误的概率不可能同时减小”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":99,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于两个总体方差是否相等的检验问题，应采用的检验统计量是（   ）。","answer":["A"],"dataset_description":null,"id":"p03:99","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于两个总体方差是否相等的检验问题，应采用的检验统计量是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"F检验统计量"},{"label":"B","html":"t检验统计量"},{"label":"C","html":"Z检验统计量"},{"label":"D","html":"卡方检验统计量"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：F检验统计量”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列说法正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p03:100","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列说法正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"如果备择假设是正确的,但做出的决策是拒绝备择假设,则犯了弃真错误"},{"label":"B","html":"如果备择假设是错误的,但做出的决策是接收备择假设,则犯了采伪错误"},{"label":"C","html":"如果零假设是正确的,但做出的决策是接受备择假设,则犯了弃真错误"},{"label":"D","html":"如果零假设是错误的,但做出的决策是接收备择假设,则犯了采伪错误"}],"explanation":{"topic":"假设检验的两类错误","paragraphs":["第一类错误是原假设 H₀ 为真却拒绝它，也叫弃真，其概率通常用 α 表示。第二类错误是 H₀ 为假却未拒绝它，也叫取伪，其概率用 β 表示，检验功效为 1−β。","在样本量、效应大小和检验方案等条件固定时，降低 α 常会增加 β。增加有效样本量可以改善检验功效，不能说两类错误在任何情况下都固定互补或相加等于1。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：如果零假设是正确的,但做出的决策是接受备择假设,则犯了弃真错误”。"],"tip":"弃真 α；取伪 β；功效 1−β。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":101,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于原假设和备择假设，错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:101","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于原假设和备择假设，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"原假设表示为H\u003csub>0\u003c/sub>，是预先假定的状态"},{"label":"B","html":"备择假设表示为H\u003csub>1\u003c/sub>，是我们希望的状态"},{"label":"C","html":"进行假设检验是为了拒绝原假设"},{"label":"D","html":"进行假设检验是为了证明备择假设"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：进行假设检验是为了证明备择假设”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":102,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于正态分布,以下说法正确的是(    )。","answer":["B"],"dataset_description":null,"id":"p03:102","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于正态分布,以下说法正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"当数据不满足正态分布时,只能采用F分布进行假设检验"},{"label":"B","html":"只有原始分布服从正态分布,转换成Z分数后才服从标准正态分布"},{"label":"C","html":"当样本量大于100时,任意样本分布都可以近似为正态分布"},{"label":"D","html":"只有两个总体都服从正态分布,才能用Z分数来比较两个分数的相对位置"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：只有原始分布服从正态分布,转换成Z分数后才服从标准正态分布”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"大数据年代，因为我们采集了全样数据，而不是一部分数据，数据中的异常,纰漏,疏忽,错误都是数据的实际情况，我们没有必要进行任何清除，其结果是最接近客观事实的，这是什么思维(    )。","answer":["B"],"dataset_description":null,"id":"p03:103","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>大数据年代，因为我们采集了全样数据，而不是一部分数据，数据中的异常,纰漏,疏忽,错误都是数据的实际情况，我们没有必要进行任何清除，其结果是最接近客观事实的，这是什么思维( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"抽样思维"},{"label":"B","html":"容错思维"},{"label":"C","html":"相关思维"},{"label":"D","html":"全样思维"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：容错思维”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"大数据时代下，通过大量的数据分析得出的结果将更加现实和准确。下面关于大数据助力决策的表述，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:104","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>大数据时代下，通过大量的数据分析得出的结果将更加现实和准确。下面关于大数据助力决策的表述，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>提供全面的信息\u003c/p>"},{"label":"B","html":"\u003cp>发现潜在的关联和趋势\u003c/p>"},{"label":"C","html":"\u003cp>辅助决策模型\u003c/p>"},{"label":"D","html":"\u003cp>对数据静态分析\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：对数据静态分析”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于大数据可视化的说法，不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p03:105","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下关于大数据可视化的说法，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据可视化利用计算机图形学和图像处理技术，将数据转换为图形或图像在屏幕上显示出来，并进行各种交互处理的理论，方法和技术"},{"label":"B","html":"能够把抽象，枯燥或难以理解的内容，包括看似毫无意义的数据，信息，知识等等以一种容易理解的视觉方式展示出来"},{"label":"C","html":"涉及到计算机图形学，图像处理，计算机视觉，计算机辅助设计等多个领域，成为研究数据表示，数据处理，决策分析等一系列问题的综合技术"},{"label":"D","html":"对多维数据进行切片，切块，旋转等动作剖析数据，从而多角度多侧面观察数据"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：对多维数据进行切片，切块，旋转等动作剖析数据，从而多角度多侧面观察数据”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下述数据存储单位哪个表示的单位最大（   ）。","answer":["B"],"dataset_description":null,"id":"p03:106","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下述数据存储单位哪个表示的单位最大（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"MB"},{"label":"B","html":"PB"},{"label":"C","html":"TB"},{"label":"D","html":"KB"}],"explanation":{"topic":"数据容量单位","paragraphs":["bit 是二进制位，byte 是字节，1 byte=8 bit。常见单位从小到大为 B、KB、MB、GB、TB、PB、EB、ZB、YB，不要把位与字节混为一谈。","严格的十进制前缀每级1000，二进制前缀 KiB、MiB、GiB 每级1024。教材和操作系统有时用 KB/MB 表示1024倍关系，做题时需结合选项约定，而不能认为两种口径永远相同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：PB”。"],"tip":"B 与 b 不同；K→M→G→T→P→E。","source":""},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"关于大数据的叙述中,不正确的是(    )。","answer":["B"],"dataset_description":null,"id":"p03:107","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于大数据的叙述中,不正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"大数据的四个特点是体量大、多样性、价值密度低和快速化"},{"label":"B","html":"数据分析与挖掘技术是大数据特有的技术"},{"label":"C","html":"大数据在电商、电信、金融等行业都有巨大的社会价值和产业空间"},{"label":"D","html":"分布式文件系统能提供高吞吐量数据访问,适合在大规模数据集上应用"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：数据分析与挖掘技术是大数据特有的技术”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于大数据特点的叙述不正确的是(   )。","answer":["B"],"dataset_description":null,"id":"p03:108","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于大数据特点的叙述不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据体量巨大"},{"label":"B","html":"处理速度慢"},{"label":"C","html":"数据类型繁多"},{"label":"D","html":"价值密度低"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：处理速度慢”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于“机器学习”的说法，不正确的一项是(  )。","answer":["D"],"dataset_description":null,"id":"p03:109","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于“机器学习”的说法，不正确的一项是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"“机器学习”是一种计算机程序"},{"label":"B","html":"“机器学习”时，计算机运用机器学习原理进行自动学习"},{"label":"C","html":"“机器学习”能够形成持续学习能力，不断获得提升"},{"label":"D","html":"“机器学习”就是人类利用机器(计算机)进行学习，并从事相关工作"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：“机器学习”就是人类利用机器(计算机)进行学习，并从事相关工作”。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下哪项关于决策树的说法是错误的(   )。","answer":["A"],"dataset_description":null,"id":"p03:110","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下哪项关于决策树的说法是错误的( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>冗余属性一定会对决策树的准确率造成不利的影响\u003c/p>"},{"label":"B","html":"\u003cp>子树可能在决策树中重复多次\u003c/p>"},{"label":"C","html":"\u003cp>决策树算法对于噪声的干扰非常敏感\u003c/p>"},{"label":"D","html":"\u003cp>寻找最佳决策树是NP完全问题\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：冗余属性一定会对决策树的准确率造成不利的影响”。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":111,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列有关线性回归的说法，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:111","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列有关线性回归的说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"相关关系的两个变量是非确定关系"},{"label":"B","html":"散点图能直观地反映数据的相关程度"},{"label":"C","html":"回归直线最能代表线性相关的两个变量之间的关系"},{"label":"D","html":"散点图中的点越集中，两个变量的相关性越强"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：散点图中的点越集中，两个变量的相关性越强”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":112,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"方差分析的主要目的是判断（  ）。","answer":["C"],"dataset_description":null,"id":"p03:112","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>方差分析的主要目的是判断（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"各总体是否存在不同方差"},{"label":"B","html":"用于样本数据之间是否有显着差异"},{"label":"C","html":"用于两个及两个以上样本均值差别的显著性检验"},{"label":"D","html":"分类型因变量对数值型因变量的影响是否显著"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：用于两个及两个以上样本均值差别的显著性检验”。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于朴素贝叶斯，下列说法错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:113","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于朴素贝叶斯，下列说法错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"它是一个分类算法"},{"label":"B","html":"朴素的意义在于它的一个天真的假设，所有特征之间是相互独立的"},{"label":"C","html":"\u003cp>它实际上是将多条件概率转换成了单一条件概率，简化了计算\u003c/p>"},{"label":"D","html":"朴素贝叶斯不需要使用联合概率"}],"explanation":{"topic":"朴素贝叶斯分类","paragraphs":["贝叶斯分类按后验概率 P(类别|特征) 选择类别。朴素贝叶斯的“朴素”是给定类别后，各特征条件独立的假设，并非无条件要求所有特征彼此独立。","后验与“类别先验×各特征条件概率的乘积”成比例；取对数可避免很小概率连乘下溢，平滑可处理零频次。它既可二分类，也可多分类。","训练不需要复杂的迭代求最优边界，但预测仍需参数估计；相关特征可能削弱独立假设，不能据此断言算法完全不能用。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：朴素贝叶斯不需要使用联合概率”。"],"tip":"给定类别后条件独立；先验×似然比后验。","source":""},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"在下列整数规划模型的表述中，正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p03:114","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在下列整数规划模型的表述中，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"求解整数规划可以采用求解其相应的松驰问题，然后对其非整数值的解四舍五入的方法得到整数解"},{"label":"B","html":"用分枝定界法求解一个极大化的整数规划问题，当得到多于一个可行解时，通常任取其中一个作为下界"},{"label":"C","html":"用割平面法求解整数规划时，构造的割平面可能割去一些不属于最优解的整数解"},{"label":"D","html":"用割平面法求解整数规划问题时，必须首先将原问题的非整数的约束系数及右端常数化为整数"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：用割平面法求解整数规划问题时，必须首先将原问题的非整数的约束系数及右端常数化为整数”。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"在决策树模型中，下述用作分裂节点的说法，不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p03:115","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在决策树模型中，下述用作分裂节点的说法，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>决策树的贪婪思想可能导致局部最优解\u003c/p>"},{"label":"B","html":"\u003cp>信息增益可以使用熵得到\u003c/p>"},{"label":"C","html":"\u003cp>信息增益可以作为选择节点的标准\u003c/p>"},{"label":"D","html":"\u003cp>用基尼系数可以计算信息增益\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：用基尼系数可以计算信息增益”。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下关于数学建模的叙述，不正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p03:116","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下关于数学建模的叙述，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数学模型是对现实世界的一种简化的抽象描述"},{"label":"B","html":"数学建模时需要在简单性和准确性之间求得平衡"},{"label":"C","html":"数学模型应该用统一的，普适的标准对其进行评价"},{"label":"D","html":"数学建模需要从失败和用户的反馈中学习和改进"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：数学模型应该用统一的，普适的标准对其进行评价”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下面关于最大似然估计的说法中，错误的是（  ）。","answer":["C"],"dataset_description":null,"id":"p03:117","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下面关于最大似然估计的说法中，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan> \u003c/span>最大似然估计是使似然函数最大化的参数估计方法\u003c/p>"},{"label":"B","html":"\u003cp>最大似然估计是估计未知参数的一种方法\u003c/p>"},{"label":"C","html":"\u003cp>在最大似然估计中，要估计的参数是一个不确定的量\u003c/p>"},{"label":"D","html":"\u003cp>在最大似然估计中，可以使用对数形式的似然函数来进行估计\u003c/p>"}],"explanation":{"topic":"极大似然与贝叶斯估计","paragraphs":["极大似然估计把已观测样本固定，选择使似然 L(θ)=∏f(xᵢ;θ) 最大的参数。通常取对数把连乘变为连加，再求导、检查边界和极值。它并不等于“让参数本身的概率最大”。","贝叶斯估计为参数赋予先验分布，再用数据得到后验分布：后验∝似然×先验。频率学派常把参数视为固定未知量，贝叶斯方法则以概率分布表达对参数的不确定性。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：在最大似然估计中，要估计的参数是一个不确定的量”。"],"tip":"极大似然：固定数据选参数；贝叶斯：先验+数据→后验。","source":""},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"在我国法律体系中，效力等级仅次于宪法的是（   ）。","answer":["A"],"dataset_description":null,"id":"p03:118","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在我国法律体系中，效力等级仅次于宪法的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"法律"},{"label":"B","html":"行政法规"},{"label":"C","html":"规章"},{"label":"D","html":"地方性法规"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：法律”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"法律关系作为一定社会关系的特殊形式，正在于它体现（  ）。","answer":["C"],"dataset_description":null,"id":"p03:119","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>法律关系作为一定社会关系的特殊形式，正在于它体现（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"社会道德性"},{"label":"B","html":"团体意志性"},{"label":"C","html":"国家意志性"},{"label":"D","html":"社会意志性"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：国家意志性”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"算法决策的困境主要源于人工智能自主学习能力导致的算法结果的（  ）。","answer":["B"],"dataset_description":null,"id":"p03:120","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>算法决策的困境主要源于人工智能自主学习能力导致的算法结果的（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"不可知"},{"label":"B","html":"不可预见性"},{"label":"C","html":"不稳定性"},{"label":"D","html":"不可推广性"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：不可预见性”。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"关于数据资源长远价值的说法，以下说法正确的包括（    ）。","answer":["A","C"],"dataset_description":null,"id":"p03:121","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于数据资源长远价值的说法，以下说法正确的包括（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"具有不稳定性。"},{"label":"B","html":"所有数据都有保留价值。"},{"label":"C","html":"仅仅未来真正用得上的数据。"},{"label":"D","html":"从垃圾数据中发现价值。"},{"label":"E","html":"上述说法都不对。"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C。对应内容为“A：具有不稳定性。；C：仅仅未来真正用得上的数据。”。多选题应检查所有选项，不能只选其中一项。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"用户行为数据用于用户行为分析场景，下列各项中属于行为的属性包括（   ）？","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p03:122","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>用户行为数据用于用户行为分析场景，下列各项中属于行为的属性包括（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"时间"},{"label":"B","html":"地点"},{"label":"C","html":"人物"},{"label":"D","html":"交互"},{"label":"E","html":"交互内容"}],"explanation":{"topic":"本题解析","paragraphs":["一个行为事件应回答何时、何地、谁、做了什么以及作用于什么内容，所以五项全选。"],"warning":"","optionAnalysis":[{"label":"A","selected":true,"reason":"时间说明行为何时发生。"},{"label":"B","selected":true,"reason":"地点或场景说明行为在哪里发生。"},{"label":"C","selected":true,"reason":"人物说明行为由哪个用户发生。"},{"label":"D","selected":true,"reason":"交互说明发生了点击、浏览、购买等什么动作。"},{"label":"E","selected":true,"reason":"交互内容说明动作作用于哪个商品、页面或对象。"}]},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"数据清洗时,处理缺失值的方法包括(    ) 。","answer":["B","C","D","E"],"dataset_description":null,"id":"p03:123","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>数据清洗时,处理缺失值的方法包括( &nbsp; &nbsp;) 。\u003c/span>\u003c/p>","options":[{"label":"A","html":"删除单元格"},{"label":"B","html":"删除记录"},{"label":"C","html":"数据补齐"},{"label":"D","html":"不处理"},{"label":"E","html":"删除整列"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、D、E。对应内容为“B：删除记录；C：数据补齐；D：不处理；E：删除整列”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"把测量对象划分为若干互斥的类别，使达到同类同质，异类异质。下面属于定类尺度的有（   ）。","answer":["B","C","E"],"dataset_description":null,"id":"p03:124","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>把测量对象划分为若干互斥的类别，使达到同类同质，异类异质。\u003c/span>\u003cspan>下面属于定类尺度的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"教育程度"},{"label":"B","html":"专业"},{"label":"C","html":"班级"},{"label":"D","html":"考试成绩"},{"label":"E","html":"性别"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、C、E。对应内容为“B：专业；C：班级；E：性别”。多选题应检查所有选项，不能只选其中一项。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于相关系数区间的观点，错误的是(  )。","answer":["B","C","D","E"],"dataset_description":null,"id":"p03:125","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于相关系数区间的观点，错误的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>位于-1和+1之间\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>位于0和1之间\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>位于-1和0之间\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>位于0到正无穷之间\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>位于负无穷到正无穷之间\u003c/span>\u003c/p>"}],"explanation":{"topic":"协方差与相关系数","paragraphs":["协方差 Cov(X,Y)=E[(X−EX)(Y−EY)] 表示共同变化方向，但大小受单位影响。相关系数 r=Cov(X,Y)/(σXσY) 消除量纲，范围在−1到1之间，绝对值越大表示线性相关越强。","r>0 为同向，r\u003c0 为反向，r≈0 只表示线性关系弱，并不排除非线性关系，更不能推出独立；相关也不等于因果。","协方差矩阵对称，对角线是各变量方差，非对角线是成对协方差；方差非负，协方差可以为负。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B、C、D、E。对应内容为“B：位于0和1之间；C：位于-1和0之间；D：位于0到正无穷之间；E：位于负无穷到正无穷之间”。多选题应检查所有选项，不能只选其中一项。"],"tip":"r 看符号和绝对值；相关≠因果，零相关≠没关系。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于总体与样本的叙述正确的有（  ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p03:126","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于总体与样本的叙述正确的有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体是根据研究目的确定的同质观察单位的全体\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体是同质的所有观察单位某种变量值的集合\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>观察单位亦称个体，是统计研究中最基本的单位\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>有的总体是在确定的同质基础上明确了一定时间、一定空间的有限个观察单位，称为有限总体\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>有时总体是抽象的，观察单位数是无限的，该总体称无限总体\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：总体是根据研究目的确定的同质观察单位的全体；B：总体是同质的所有观察单位某种变量值的集合；C：观察单位亦称个体，是统计研究中最基本的单位；D：有的总体是在确定的同质基础上明确了一定时间、一定空间的有限个观察单位，称为有限总体；E：有时总体是抽象的，观察单位数是无限的，该总体称无限总体”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于F分布特点的叙述，正确的是（   ）。","answer":["A","C"],"dataset_description":null,"id":"p03:127","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于F分布特点的叙述，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"F分布是一个正偏态分布"},{"label":"B","html":"F分布具有可加性，F分布的和也是F分布"},{"label":"C","html":"F总为正值"},{"label":"D","html":"当组间自由度为1时，F值与t值相同"},{"label":"E","html":"F可以为负值"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C。对应内容为“A：F分布是一个正偏态分布；C：F总为正值”。多选题应检查所有选项，不能只选其中一项。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下在大型调查时不适用的抽样方法有（  ）。","answer":["B","D"],"dataset_description":null,"id":"p03:128","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下在大型调查时不适用的抽样方法有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>单纯随机抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>方便抽样\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan> \u003c/span>多阶段抽样\u003c/p>"},{"label":"D","html":"\u003cp>配额抽样\u003c/p>"},{"label":"E","html":"\u003cp>整群抽样\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B、D。对应内容为“B：方便抽样；D：配额抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"在以下说法中，属于配额抽样的是（  ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p03:129","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>在以下说法中，属于配额抽样的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>可根据\u003c/span>\u003cspan>预先确定的特征\u003c/span>\u003cspan>分类\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>可\u003c/span>\u003cspan>预先\u003c/span>\u003cspan>确定样本数额\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>可根据\u003c/span>\u003cspan>预先确定的属性\u003c/span>\u003cspan>分层\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>在\u003c/span>配额\u003cspan>内主观抽选样本\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>在\u003c/span>配额\u003cspan>内随机抽选样本\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：可根据预先确定的特征分类；B：可预先确定样本数额；C：可根据预先确定的属性分层；D：在配额内主观抽选样本”。多选题应检查所有选项，不能只选其中一项。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于统计量的描述正确的是（  ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p03:130","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于统计量的描述正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本统计量的值完全依赖于所抽取的样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>根据样本统计量来推断总体参数具有某种不确定性\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本统计量的分布具有某种确定的性质\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本统计量的值并不完全依赖于所抽取的样本\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本均值是最常用的统计量\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：样本统计量的值完全依赖于所抽取的样本；B：根据样本统计量来推断总体参数具有某种不确定性；C：样本统计量的分布具有某种确定的性质；E：样本均值是最常用的统计量”。多选题应检查所有选项，不能只选其中一项。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于系统抽样要素的是（  ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p03:131","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下属于系统抽样要素的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>所选样本的数量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>取样间隔\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本总容量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体单位分布\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>选取样本占样本总容量的比例\u003c/span>\u003c/p>"}],"explanation":{"topic":"系统抽样与等距抽样","paragraphs":["将总体按一定顺序排列，确定抽样间隔 k≈N/n，先随机选择起点，再依间隔依次抽取。比如 N=1000、n=100，间隔10，起点 r 在1至10中随机选，抽 r、r+10、…、r+990。","总体排序可按有关标志、无关标志或自然顺序。必须注意与间隔一致的周期性，否则可能发生系统偏差。随机起点是概率抽样的重要条件，固定挑一个方便起点并不等价。","当 N/n 非整数时，要采用明确的舍弃、循环或小数间隔方案，不能不加说明地随意漏掉一部分总体。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：所选样本的数量；B：取样间隔；C：样本总容量；E：选取样本占样本总容量的比例”。多选题应检查所有选项，不能只选其中一项。"],"tip":"系统抽样=排序+间隔+随机起点；警惕周期性。","source":""},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于抽样误差描述正确的是（ ）。","answer":["A","C","D","E"],"dataset_description":null,"id":"p03:132","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于抽样误差描述正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>是可控制的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>不是抽样所特有的误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样方法不同，产生的抽样误差也不同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>是不可避免的\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>与调查误差不同\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、D、E。对应内容为“A：是可控制的；C：抽样方法不同，产生的抽样误差也不同；D：是不可避免的；E：与调查误差不同”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于偏度和峰度的描述，正确的选项是（  ）。","answer":["A","B","E"],"dataset_description":null,"id":"p03:133","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于偏度和峰度的描述，正确的选项是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>用来检验数据是否服从正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>可以构造偏度，峰度检验法\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>峰度是描述正态分布数据的度量指标\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>偏度是描述非正态分布数据的度量指标\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>可以让我们更好的了解分布的形态\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、E。对应内容为“A：用来检验数据是否服从正态分布；B：可以构造偏度，峰度检验法；E：可以让我们更好的了解分布的形态”。多选题应检查所有选项，不能只选其中一项。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下参数不能用于描述总体集中趋势的是（  ）。","answer":["D","E"],"dataset_description":null,"id":"p03:134","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下参数不能用于描述总体集中趋势的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>总体平均数\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体中位数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>总体众数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体标准差\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>总体极差\u003c/span>\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D、E。对应内容为“D：总体标准差；E：总体极差”。多选题应检查所有选项，不能只选其中一项。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下述关于点估计的观点中，正确的有（    ）。","answer":["A","C","E"],"dataset_description":null,"id":"p03:135","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下述关于点估计的观点中，正确的有（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"简单易懂"},{"label":"B","html":"考虑了抽样误差大小"},{"label":"C","html":"没有考虑抽样误差大小"},{"label":"D","html":"可以对统计量与总体参数的接近程度给出一个概率度量"},{"label":"E","html":"不能对统计量与总体参数的接近程度给出一个概率度量"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、E。对应内容为“A：简单易懂；C：没有考虑抽样误差大小；E：不能对统计量与总体参数的接近程度给出一个概率度量”。多选题应检查所有选项，不能只选其中一项。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于假设检验的一般步骤的描述，包括以下哪些项（   ）。","answer":["A","C","D","E"],"dataset_description":null,"id":"p03:136","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下面关于假设检验的一般步骤的描述，包括以下哪些项（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"选定检验方法和计算检验统计量"},{"label":"B","html":"对统计参数作出区间估计"},{"label":"C","html":"建立假设和确定检验水准"},{"label":"D","html":"直接算出P值"},{"label":"E","html":"作出推断性结论"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、D、E。对应内容为“A：选定检验方法和计算检验统计量；C：建立假设和确定检验水准；D：直接算出P值；E：作出推断性结论”。多选题应检查所有选项，不能只选其中一项。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"下列关于云计算特点的说法中，正确的是（    ）。","answer":["A","C","D"],"dataset_description":null,"id":"p03:137","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>下列关于云计算特点的说法中，正确的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"用户可利用简单终端，通过“云”实现超级计算任务"},{"label":"B","html":"“云”具有固定的规模数量"},{"label":"C","html":"同一个“云”可同时支撑不同的应用"},{"label":"D","html":"“云”服务可按需购买"},{"label":"E","html":"在“云”端部署地理信息服务需要高额的成本"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、D。对应内容为“A：用户可利用简单终端，通过“云”实现超级计算任务；C：同一个“云”可同时支撑不同的应用；D：“云”服务可按需购买”。多选题应检查所有选项，不能只选其中一项。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"关于朴素贝叶斯算法，下列说法错误的是（  ）。","answer":["E","B"],"dataset_description":null,"id":"p03:138","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>关于朴素贝叶斯算法，下列说法错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"E","html":"\u003cp>对缺失数据非常敏感\u003c/p>"},{"label":"A","html":"\u003cp>是应用最为广泛的分类算法之一\u003c/p>"},{"label":"B","html":"\u003cp>分类效果比其他分类器好\u003c/p>"},{"label":"C","html":"\u003cp>在贝叶斯算法的基础上进行了相应的简化\u003c/p>"},{"label":"D","html":"\u003cp>需要估计的参数较少\u003c/p>"}],"explanation":{"topic":"朴素贝叶斯分类","paragraphs":["贝叶斯分类按后验概率 P(类别|特征) 选择类别。朴素贝叶斯的“朴素”是给定类别后，各特征条件独立的假设，并非无条件要求所有特征彼此独立。","后验与“类别先验×各特征条件概率的乘积”成比例；取对数可避免很小概率连乘下溢，平滑可处理零频次。它既可二分类，也可多分类。","训练不需要复杂的迭代求最优边界，但预测仍需参数估计；相关特征可能削弱独立假设，不能据此断言算法完全不能用。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 E、B。对应内容为“E：对缺失数据非常敏感；B：分类效果比其他分类器好”。多选题应检查所有选项，不能只选其中一项。"],"tip":"给定类别后条件独立；先验×似然比后验。","source":""},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"以下属于法律责任的构成要件的是（   ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p03:139","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下属于法律责任的构成要件的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>法律责任主体\u003c/p>"},{"label":"B","html":"\u003cp>违法行为\u003c/p>"},{"label":"C","html":"\u003cp>损害事实\u003c/p>"},{"label":"D","html":"\u003cp>客体\u003c/p>"},{"label":"E","html":"\u003cp>心理状态\u003c/p>"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：法律责任主体；B：违法行为；C：损害事实；E：心理状态”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"以下有关“数字鸿沟”的表述正确的有（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p03:140","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>以下有关“数字鸿沟”的表述正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数字鸿沟是信息时代的不公平"},{"label":"B","html":"数字鸿沟表现在信息基础设施、信息工具以及信息的获取使用过程中"},{"label":"C","html":"数字鸿沟中，先进的技术成果不能为人们公正的分享"},{"label":"D","html":"数字鸿沟使得信息富有者与信息贫困者之间产生的巨大差距"},{"label":"E","html":"数字鸿沟难以克服，不能降低存在范围"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：数字鸿沟是信息时代的不公平；B：数字鸿沟表现在信息基础设施、信息工具以及信息的获取使用过程中；C：数字鸿沟中，先进的技术成果不能为人们公正的分享；D：数字鸿沟使得信息富有者与信息贫困者之间产生的巨大差距”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“data03.xlsx”中在空白单元格，输入“=ROWS(A:A)”，得到的结果为（）。","answer":["D"],"dataset_description":"Excel表格文件“data03.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p03:141","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>文件“data03.xlsx”中在空白单元格，输入“=ROWS(A:A)”，得到的结果为（）。\u003c/p>","options":[{"label":"A","html":"256"},{"label":"B","html":"65536"},{"label":"C","html":"16384"},{"label":"D","html":"1048576"}],"explanation":{"topic":"整列的行数","paragraphs":["ROWS(A:A) 计算 A 整列包含多少行；.xlsx 工作表有1,048,576行，所以选 D。","65,536 是旧 .xls 格式的行数；16,384 是现代工作表的列数，不能混用。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data03.xlsx","href":"../materials/p03/data03.xlsx"}]},{"number":142,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":2,"question":"在文件\"data03.xlsx\"的工作表\"Sheet1\"中，单元格A2是什么格式的日期类型？","answer":["D"],"dataset_description":"Excel表格文件“data03.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p03:142","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>在文件&quot;data03.xlsx&quot;的工作表&quot;Sheet1&quot;中，单元格A2是什么格式的日期类型？\u003c/p>","options":[{"label":"A","html":"yyyy&quot;年&quot;m&quot;月&quot;d&quot;日&quot;"},{"label":"B","html":"yyyy&quot;年&quot;mm&quot;月&quot;dd&quot;日&quot;"},{"label":"C","html":"yyyy/mm/dd hh:mm:ss"},{"label":"D","html":"yyyy-mm-dd hh:mm:ss"}],"explanation":{"topic":"日期显示格式","paragraphs":["素材 A2 以年-月-日及时间显示，对应 yyyy-mm-dd hh:mm:ss，选 D。","yyyy 表示四位年份，dd 表示两位日；hh:mm:ss 为时分秒。斜杠格式与连字符格式不同。显示格式不改变单元格中存储的日期时间值。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data03.xlsx","href":"../materials/p03/data03.xlsx"}]},{"number":143,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":3,"question":"文件“data03.xlsx”中的“Sheet1”中，选定原始数据中“A1:E225”区域，使用“定位条件“查看数据表中的空值，并将其标记为红色，总共空值个数为（）。","answer":["C"],"dataset_description":"Excel表格文件“data03.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p03:143","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>文件“data03.xlsx”中的“Sheet1”中，选定原始数据中“A1:E225”区域，使用“定位条件“查看数据表中的空值，并将其标记为红色，总共空值个数为（）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"10"},{"label":"B","html":"8"},{"label":"C","html":"0"},{"label":"D","html":"100"}],"explanation":{"topic":"指定区域检查空值","paragraphs":["选中 A1:E225，按 F5 或“查找与选择→定位条件→空值”，只检查这一区域。原始素材该区域没有空单元格，空值数为0，选 C。","工作表其他位置的空白或仅设置格式的行不属于本题指定区域，不能计入。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data03.xlsx","href":"../materials/p03/data03.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"data03.xlsx\"的工作表\"Sheet1\"中，请计算相对湿度（%）的平均值，并选择下列正确的选项。","answer":["D"],"dataset_description":"Excel表格文件“data03.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p03:144","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>在文件&quot;data03.xlsx&quot;的工作表&quot;Sheet1&quot;中，请计算相对湿度（%）的平均值，并选择下列正确的选项。\u003c/p>","options":[{"label":"A","html":"相对湿度均值为77.30357143"},{"label":"B","html":"相对湿度均值为79.30357143"},{"label":"C","html":"相对湿度均值为77.30357143%"},{"label":"D","html":"相对湿度均值为79.30357143%"}],"explanation":{"topic":"相对湿度平均值","paragraphs":["相对湿度在 D 列，用 =AVERAGE(D2:D225)，结果约79.30357143，按列标题“%”理解为79.30357143%，选 D。","本素材用79这类数表示79%，并非0.79的比例小数。不要对原数直接再套百分比显示而放大100倍。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data03.xlsx","href":"../materials/p03/data03.xlsx"}]},{"number":145,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":5,"question":"文件“data03.xlsx”中的“Sheet1” 将日期按照“年-月-日”和“HH:MM:SS”分开，分别在F和G列中操作，列名分别为“年月日”和“时间”，使用TEXT函数进行分离，数据格式分别为“yyyy-mm-dd”和“hh:mm:ss”。在新的工作表中创建数据透视图，轴(类别)选择“年月日”，值（平均值项）选择“大气温度（摄氏度）”，值（平均值项）选择“气象站气压（毫米汞柱）”，值（平均值项）选择“相对湿度（%）”，大气温度最高的一天的“气象站气压（毫米汞柱）”和“相对湿度（%）”分别为（）。","answer":["A"],"dataset_description":"Excel表格文件“data03.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p03:145","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>\u003cspan>文件“data03.xlsx”中的“Sheet1” 将日期按照“年-月-日”和“HH:MM:SS”分开，分别在F和G列中操作，列名分别为“年月日”和“时间”，使用TEXT函数进行分离，数据格式分别为“yyyy-mm-dd”和“hh:mm:ss”。在新的工作表中创建数据透视图，轴(类别)选择“年月日”，值（平均值项）选择“大气温度（摄氏度）”，值（平均值项）选择“气象站气压（毫米汞柱）”，值（平均值项）选择“相对湿度（%）”，大气温度最高的一天的“气象站气压（毫米汞柱）”和“相对湿度（%）”分别为（）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"气象站气压：715.39，相对湿度：55.5"},{"label":"B","html":"气象站气压：725.39，相对湿度：60.5"},{"label":"C","html":"气象站气压：705.39，相对湿度：60.5"},{"label":"D","html":"气象站气压：719.39，相对湿度：55.5"}],"explanation":{"topic":"日期分组与数据透视分析","paragraphs":["日期时间按 =TEXT(A2,\"yyyy-mm-dd\") 和 =TEXT(A2,\"hh:mm:ss\") 分离。透视表按年月日分组，同时对温度、气压、湿度求日平均。","按日平均温度降序，取最高温那一天同一行的平均气压和平均湿度，约715.39与55.5，选 A。不是取气压自身最大值，也不是仅找单次最高温记录。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data03.xlsx","href":"../materials/p03/data03.xlsx"}]},{"number":146,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":6,"question":"在文件\"data03.xlsx\"的工作表\"Sheet1\"中，计算单元格A10的日期所在月份的最后一天，所使用的公式和结果分别为？","answer":["A"],"dataset_description":"Excel表格文件“data03.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p03:146","paperId":"p03","paperTitle":"Excel 模拟卷 03","question_html":"\u003cp>在文件&quot;data03.xlsx&quot;的工作表&quot;Sheet1&quot;中，计算单元格A10的日期所在月份的最后一天，所使用的公式和结果分别为？\u003c/p>","options":[{"label":"A","html":"\u003cp>=EOMONTH(A10,0)；2022/2/28\u003c/p>"},{"label":"B","html":"\u003cp>=EOMONTH(A10,1)；2022/3/31\u003c/p>"},{"label":"C","html":"\u003cp>=EOMONTH(A10,-1)；2022/8/31\u003c/p>"},{"label":"D","html":"\u003cp>=EOMONTH(A10,2)；2022/9/30\u003c/p>"}],"explanation":{"topic":"EOMONTH 求当月最后一天","paragraphs":["A10 的日期为 2022-02-02，使用 =EOMONTH(A10,0)，第二参数0表示不偏移月份，返回当月月末 2022-02-28，所以选 A。","参数1返回下个月月末，-1返回上个月月末。结果若显示序列数，应把结果单元格设置为日期格式。"],"tip":"EOMONTH 的0是当月，1是下月。","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data03.xlsx","href":"../materials/p03/data03.xlsx"}]},{"number":147,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":7,"question":"文件“data03.xlsx”中的“Sheet1”，按照classify列的数据分布，饼状图应为（）。","answer":["A"],"dataset_description":"Excel表格文件“data03.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p03:147","paperId":"p03","paper let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
