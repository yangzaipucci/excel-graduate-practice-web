estion_html":"\u003cp>\u003cspan>进行市场细分的目的，是为了发现市场营销机会，并确定企业为之服务的目标市场\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>。\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"本题解析","paragraphs":["细分是按需求差异把市场划组，以发现值得服务的机会并选择目标市场，题干正确。"],"warning":""},"attachments":[]},{"number":8,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"数据图形能够揭示业务指标背后的规律和趋势，帮助人们发现业务中的潜在问题和机会（  ）。","answer":["A"],"dataset_description":null,"id":"p04:8","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>数据图形能够揭示业务指标背后的规律和趋势，帮助人们发现业务中的潜在问题和机会\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":9,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"数据压缩不属于数据处理的任务（  ）。","answer":["B"],"dataset_description":null,"id":"p04:9","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>数据压缩不属于数据处理的任务\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":10,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":13,"type":"判断题","book":"《大数据分析素养》","chapter":3,"question":"企业的高,中层管理人员,企业员工,包括基层操作者,专业技术人员,基层管理人员均属于内部利益相关者（  ）。","answer":["A"],"dataset_description":null,"id":"p04:13","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>企业的高,中层管理人员,企业员工,包括基层操作者,专业技术人员,基层管理人员均属于\u003c/span>\u003cspan>内部利益相关者\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":14,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"总量指标都是用绝对数形式表现出来的（  ）。","answer":["A"],"dataset_description":null,"id":"p04:14","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>总量指标都是用绝对数形式表现出来的\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":15,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"产品等级可用定类尺度进行计量（  ）。","answer":["B"],"dataset_description":null,"id":"p04:15","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>产品等级可用定类尺度进行计量\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":16,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"计划完成程度相对数的数值大于100%,就说明完成并超额完成了计划（  ）。","answer":["B"],"dataset_description":null,"id":"p04:16","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>计划完成程度相对数的数值大于100%,就说明完成并超额完成了计划\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":17,"type":"判断题","book":"《大数据分析素养》","chapter":4,"question":"定序尺度又称顺序尺度（  ）。","answer":["A"],"dataset_description":null,"id":"p04:17","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>定序尺度又称顺序尺度\u003c/span>\u003cspan>（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":18,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"t分布的自由度越小,分布曲线愈高耸（ ）。","answer":["B"],"dataset_description":null,"id":"p04:18","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>t分布的自由度越小,\u003c/span>\u003cspan>分布曲线愈\u003c/span>\u003cspan>高耸\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":19,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"考虑到调查对象的复杂性和总体样本量庞大等因素，简单随机抽样通常是和其他抽样方法结合使用。","answer":["A"],"dataset_description":null,"id":"p04:19","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>考虑到调查对象的复杂性和总体样本量庞大等因素，简单随机抽样通常是和其他抽样方法结合使用。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":20,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"整群抽样的主要优点是估计的精度较好（  ）。","answer":["B"],"dataset_description":null,"id":"p04:20","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>整群抽样的主要优点是估计的精度较好\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":21,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"总体与总体单位不具有相对性（  ）。","answer":["B"],"dataset_description":null,"id":"p04:21","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>总体与总体单位不具有相对性（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":22,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"在大样本条件下，如果总体为正态分布，样本统计量服从正态分布（  ）。","answer":["A"],"dataset_description":null,"id":"p04:22","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在大样本条件下，如果总体为正态分布，样本统计量服从正态分布\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":23,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"一致性是指随着样本容量的增大，统计量的方差趋于0。","answer":["B"],"dataset_description":null,"id":"p04:23","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>一致性是指随着样本容量的增大，统计量的方差趋于0。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":24,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"整群抽样的目的是缩小抽样误差（  ）。","answer":["B"],"dataset_description":null,"id":"p04:24","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>整群抽样的目的是缩小抽样误差（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":25,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"非参数统计推断的准确度较低（  ）","answer":["B"],"dataset_description":null,"id":"p04:25","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>非参数统计推断的准确度较低\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":26,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"分层抽样的样本是在各组中随机抽取，而整群抽样则是要么整组抽取，要么整组不被抽取（  ）。","answer":["A"],"dataset_description":null,"id":"p04:26","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>分层抽样的样本是在各组中随机抽取，而整群抽样则是要么整组抽取，要么整组不被抽取（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"分层抽样与整群抽样的区别","paragraphs":["分层抽样先把总体分成互不重叠的层，再在每一层抽若干单位，目的是保证各层代表性并降低误差；有效分层通常层内相似、层间差异较大。","整群抽样把总体分为互不重叠的群，抽取一部分群，对抽中群内的单位全部调查。它通常便于组织、节省成本，但群内相关性高时误差可能增大。","“每组都抽一些”是分层；“只抽部分组，组内全查”是整群；“抽组后组内再抽一部分”则是多阶段。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"分层每层抽，整群抽群全查，多阶段群内再抽。","source":""},"attachments":[]},{"number":27,"type":"判断题","book":"《大数据分析素养》","chapter":5,"question":"群通常是由那些地理位置邻近的或隶属于同一系统的单位所构成（  ）。","answer":["A"],"dataset_description":null,"id":"p04:27","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>群通常是由那些地理位置邻近的或隶属于同一系统的单位所构成\u003c/span>\u003cspan>（ &nbsp;）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整群抽样中的群","paragraphs":["整群抽样先把总体划分为若干群，再抽取部分群，对被抽中群内的单位调查。群可以按地域邻近、学校班级或组织系统等自然边界形成。","所以题干对群的常见构成方式描述正确。需注意整群与分层不同：抽群通常希望群内有异质性、群间有一定相似性。"],"warning":""},"attachments":[]},{"number":28,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"显著性检验基于样本数据与原假设之间的差异是否显著，如果差异足够显著，就拒绝原假设（ ）。","answer":["A"],"dataset_description":null,"id":"p04:28","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>显著性检验基于样本数据与原假设之间的差异是否显著，如果差异足够显著，就拒绝原假设（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":29,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"假设检验也称为显著性检验（ ）。","answer":["A"],"dataset_description":null,"id":"p04:29","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>假设检验也称为显著性检验（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":30,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"卡方统计量p值越小,说明观察值和理论值偏离程度越大,不拒绝原假设（ ）。","answer":["B"],"dataset_description":null,"id":"p04:30","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>卡方统计量p值越小,说明观察值和理论值偏离程度越大,不拒绝原假设\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":31,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"卡方检验的零假设是观察频数与期望频数存在差异（ ）。","answer":["B"],"dataset_description":null,"id":"p04:31","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>卡方检验的零假设是观察频数与期望频数存在差异\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":32,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"样本推断总体的结果是必然的（ ）。","answer":["B"],"dataset_description":null,"id":"p04:32","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>样本推断总体的结果是必然的（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":33,"type":"判断题","book":"《大数据分析素养》","chapter":6,"question":"假设检验是显著性检验的一种常见形式（ ）。","answer":["B"],"dataset_description":null,"id":"p04:33","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>假设检验是显著性检验的一种常见形式（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":34,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"云计算具有高可靠性,不存在系统危险性（ ）。","answer":["B"],"dataset_description":null,"id":"p04:34","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>云计算具有高可靠性,不存在系统危险性\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":35,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"在分析大数据之前,必须对数据进行清洗和预处理,以确保数据的真实性（ ）。","answer":["A"],"dataset_description":null,"id":"p04:35","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在分析大数据之前,必须对数据进行清洗和预处理,以确保数据的真实性（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":36,"type":"判断题","book":"《大数据分析素养》","chapter":7,"question":"大数据由于体量不断加大,单位数据的价值密度在不断降低,然而数据的整体价值在提高（ ）。","answer":["A"],"dataset_description":null,"id":"p04:36","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>大数据由于体量不断加大,单位数据的价值密度在不断降低,然而数据的整体价值在提高（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":37,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"0-1规划问题可用隐枚举法求解（ ）。","answer":["A"],"dataset_description":null,"id":"p04:37","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>0-1规划问题可用隐枚举法求解（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":38,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"方差分析中,拒绝原假设时，可推断各水平的效应完全没有相同的（ ）。","answer":["B"],"dataset_description":null,"id":"p04:38","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>方差分析中,\u003c/span>\u003cspan>拒绝原假设时，可推断各水平的效应完全没有相同的\u003c/span>\u003cspan>（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题原站判断为“错误”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":39,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"在方差分析中，拒绝原假设说明各总体的均值不全相等（  ）。","answer":["A"],"dataset_description":null,"id":"p04:39","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在方差分析中，拒绝原假设说明各总体的均值不全相等（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":40,"type":"判断题","book":"《大数据分析素养》","chapter":8,"question":"整数规划是全部或部分变量被限制为整数（ ）。","answer":["A"],"dataset_description":null,"id":"p04:40","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>整数规划是全部或部分变量被限制为整数（ ）\u003c/span>\u003cspan>。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>正确\u003c/p>"},{"label":"B","html":"\u003cp>错误\u003c/p>"}],"explanation":{"topic":"整数规划与分支定界","paragraphs":["整数规划要求部分或全部决策变量取整数；全部整数为纯整数、部分整数为混合整数，0-1规划要求指定变量只能取0或1，限制的是变量而不是目标函数系数。","去掉整数限制得到线性松弛。最大化问题的松弛最优值给出上界，已找到的整数可行解给出下界；最小化问题方向相反。不能简单四舍五入松弛解来保证可行或最优。","分支定界对非整数变量分支，并用界限剪枝：子问题不可行、界不可能改善当前解、或已得到该节点整数最优解时，可终止该节点的进一步分支。","本题原站判断为“正确”。核对时注意题干中的否定、范围和适用条件，按上面的知识点理解，不只记字母。"],"tip":"最大化：松弛上界、整数下界；0-1限制变量。","source":""},"attachments":[]},{"number":41,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"数据分析师需要具备业务能力，下面关于业务能力的说法，不正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p04:41","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>数据分析师需要具备业务能力，下面关于业务能力的说法，不正确的是\u003c/span>\u003cspan>( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"行业背景知识"},{"label":"B","html":"企业业务流程"},{"label":"C","html":"数据图表"},{"label":"D","html":"自己独到的见解"}],"explanation":{"topic":"数据分析方法与问题构建","paragraphs":["分析先明确业务问题、对象、时间范围和衡量指标，再收集与处理数据、探索规律、建模验证，最后将结果转为可执行建议。技术手段必须服务业务目标，而非为用工具而用工具。","探索性分析借助图表和描述统计发现模式、生成假设；验证性分析围绕预先提出的假设设计检验，统计测试是常见工具。两者互补，不是完全割裂。","表格适合精确列示和比较，图形适合直观呈现；因素分析、对比分析和综合评价分别强调驱动因素、基准差异和多指标综合。报告要说明口径、证据和局限。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：数据图表”。"],"tip":"先问题后数据；探索找线索，验证检假设。","source":""},"attachments":[]},{"number":42,"type":"单选题","book":"《大数据分析素养》","chapter":1,"question":"下面关于因素分析法的观点，正确的是（   ）。","answer":["D"],"dataset_description":null ，但它不是 SWOT 四项中的标准名称。"},{"label":"B","selected":true,"reason":"SWOT 中 T 是 Threats，即威胁。"},{"label":"C","selected":false,"reason":"竞争是环境状态，不是 SWOT 的 T。"},{"label":"D","selected":false,"reason":"战略是分析可能支持的决策，不是 SWOT 四项之一。"}]},"attachments":[]},{"number":47,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"下列政府举措中，不能够直接促进城镇居民人均可支配收入增长的是（   ）。","answer":["B"],"dataset_description":null,"id":"p04:47","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列政府举措中，不能够直接促进城镇居民人均可支配收入增长的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"减税"},{"label":"B","html":"发行政府债券"},{"label":"C","html":"将学前教育纳入义务教育"},{"label":"D","html":"提高退休职工养老金发放标准"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：发行政府债券”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":48,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"在绘制折线图时，下列做法错误的是（   ）。","answer":["A"],"dataset_description":null,"id":"p04:48","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在绘制折线图时，下列做法错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"将各矩形竖边中点用直线连接起来即可"},{"label":"B","html":"折线图下所围成的面积与直方图面积相等"},{"label":"C","html":"折线图表示的频数分布与直方图一致"},{"label":"D","html":"两终点与横轴相交"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：将各矩形竖边中点用直线连接起来即可”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":49,"type":"单选题","book":"《大数据分析素养》","chapter":3,"question":"数据清洗中的一致性检查是根据列的合理取值范围和相互关系来检查数据，下列关于数据列的取值范围原则，不正确的是（   ）。","answer":["A"],"dataset_description":null,"id":"p04:49","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>数据清洗中的一致性检查是根据列的合理取值范围和相互关系来检查数据，\u003c/span>\u003cspan>下列关于数据列的取值范围原则，不正确的是（ &nbsp; ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"不检查数据的规范性"},{"label":"B","html":"避免逻辑上不符"},{"label":"C","html":"避免相互矛盾"},{"label":"D","html":"查看是否超出正常范围"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：不检查数据的规范性”。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":50,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"在计算计划完成相对数指标时，分子和分母的数值是（     ）。","answer":["D"],"dataset_description":null,"id":"p04:50","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在计算计划完成相对数指标时，分子和分母的数值是（ &nbsp; &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"只能是绝对数"},{"label":"B","html":"只能是相对数"},{"label":"C","html":"只能是平均数"},{"label":"D","html":"既可以是绝对数，也可以是相对数或平均数"}],"explanation":{"topic":"相对指标和统计指数","paragraphs":["结构相对数=部分/总体，比例相对数=同一总体不同部分相互比较；比较相对数比较同一时期不同对象的同类指标；动态相对数比较同一对象不同时期的同类指标。","强度相对数以两个有关但性质不同的总量相除，如人口密度、人均产量，常有“人/平方公里、千克/人”等复合单位，并非所有相对数都是无名数。","计划完成程度=实际/计划×100%。对越大越好的指标超过100%常表示超额；对成本、能耗等越低越好的指标，不能机械认为超过100%就好。恩格尔系数降低表示食品支出占比降低，不能单凭它推断食品支出绝对额下降。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：既可以是绝对数，也可以是相对数或平均数”。"],"tip":"结构部分比整体，比例部分比部分；计划要看指标方向。","source":""},"attachments":[]},{"number":51,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"以下属于位置平均数的是（   ）。","answer":["A"],"dataset_description":null,"id":"p04:51","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下属于位置平均数的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"众数"},{"label":"B","html":"极差"},{"label":"C","html":"几何平均数"},{"label":"D","html":"算术平均数"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：众数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":52,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"下面能够用连续数值来表现的是（  ）。","answer":["B"],"dataset_description":null,"id":"p04:52","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下面能够用连续数值来表现的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"定性数据"},{"label":"B","html":"定量数据"},{"label":"C","html":"分类数据"},{"label":"D","html":"顺序数据"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：定量数据”。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":53,"type":"单选题","book":"《大数据分析素养》","chapter":4,"question":"统计指标的研究离不开统计学知识，下面关于统计学的陈述，正确的是（   ）。","answer":["B"],"dataset_description":null,"id":"p04:53","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>统计指标的研究离不开统计学知识，下面关于统计学的陈述，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"实质性科学"},{"label":"B","html":"方法论科学"},{"label":"C","html":"纯自然科学"},{"label":"D","html":"社会学科学"}],"explanation":{"topic":"总量指标、数量指标与质量指标","paragraphs":["总量指标反映总体规模或总水平，有明确时空范围和计量单位，例如产量、销售额、人数。实物单位如吨、台，价值单位如元，劳动单位如工时。","时期指标是一段时间内累计发生量，如月销售额；时点指标是某一时刻的存量，如年末库存。时期指标可按不重叠时期累加，时点存量一般不能直接跨时点相加。","数量指标侧重规模，质量指标侧重效率、水平或相互关系，如平均价格、利润率、劳动生产率。不要把任何一个“用数字表示”的指标都叫数量指标或总量指标。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：方法论科学”。"],"tip":"规模看数量，效率看质量；时期是流量，时点是存量。","source":""},"attachments":[]},{"number":54,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于简单随机抽样的说法，正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p04:54","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下面关于简单随机抽样的说法，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"间隔抽样"},{"label":"B","html":"分层抽样"},{"label":"C","html":"整群抽样"},{"label":"D","html":"同等频率抽样"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：同等频率抽样”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":55,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于卡方分布，以下说法不正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p04:55","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于卡方分布，以下说法不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"卡方值大于等于零"},{"label":"B","html":"曲线形状受自由度的影响"},{"label":"C","html":"是连续型分布"},{"label":"D","html":"是对称分布"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：是对称分布”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":56,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在抽样过程中由于样本不能完全代表总体所产生的误差是：（   ）。","answer":["B"],"dataset_description":null,"id":"p04:56","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在抽样过程中由于样本不能完全代表总体所产生的误差是：（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"实际误差"},{"label":"B","html":"偶然性"},{"label":"C","html":"技术性"},{"label":"D","html":"系统性"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：偶然性”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":57,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"统计包括三个含义，以下不属于统计领域的是（  ）。","answer":["D"],"dataset_description":null,"id":"p04:57","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>统计包括三个含义，以下不属于统计领域的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>统计科学\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>统计资料\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>统计工作\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>统计方法\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计的三个含义","paragraphs":["教材通常将统计概括为统计工作、统计资料和统计科学三个相互联系的含义。工作产生资料，科学研究统计理论与方法。","统计方法属于统计科学的内容，不是这三个并列含义之一，所以此题选 D；不是说方法不属于广义统计领域。"],"warning":""},"attachments":[]},{"number":58,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于分层抽样特征的是（  ）。","answer":["D"],"dataset_description":null,"id":"p04:58","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下不属于分层抽样特征的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>按比例分配样本\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>层内同质性强\u003c/p>"},{"label":"C","html":"\u003cp>层间异质性强\u003c/p>"},{"label":"D","html":"\u003cp>每个个体被抽中的概率相等\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：每个个体被抽中的概率相等”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":59,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于滚雪球抽样优点的是（  ）。","answer":["C"],"dataset_description":null,"id":"p04:59","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下不属于滚雪球抽样优点的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>适用范围广\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>成本低廉\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>样本代表性较强\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>可以获得深入信息\u003c/span>\u003c/p>"}],"explanation":{"topic":"滚雪球抽样","paragraphs":["先找到少量符合条件的对象，再请其推荐其他符合条件者，如此扩展样本。它通常用于难以建立抽样框、隐蔽或不易接触的人群。","优势是进入特殊群体较容易、能获得较深入的信息；局限是依赖关系网络，样本可能集中于某些圈子，入样概率通常未知，不能据此保证总体代表性或无偏。","“任何人群都适用、误差必然更小、可直接作严格概率推断”都超过了这种方法能保证的范围。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：样本代表性较强”。"],"tip":"滚雪球靠推荐，适合难接触群体；网络偏差要警惕。","source":""},"attachments":[]},{"number":60,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于t分布的表述，错误的是（ ）。","answer":["A"],"dataset_description":null,"id":"p04:60","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于t分布的表述，错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>以均值为1左右对称分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随着自由度的大小而变化的一簇曲线\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>自由度大于30时，接近正态分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>变量取值在-∞到+∞之间\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：以均值为1左右对称分布”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":61,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"对于偏态分布数据，比较适宜的描述其分布的集中趋势的指标为（   ）。","answer":["C"],"dataset_description":null,"id":"p04:61","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>对于偏态分布数据，比较适宜的描述其分布的集中趋势的指标为（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"算术平均数"},{"label":"B","html":"几何平均数"},{"label":"C","html":"\u003cp>中位数\u003c/p>"},{"label":"D","html":"\u003cp>调和平均数\u003c/p>"}],"explanation":{"topic":"集中趋势、位置与离散程度","paragraphs":["均值、中位数、众数描述中心位置；极差、方差、标准差、四分位距描述离散程度。均值利用全部数值但易受极端值影响，中位数和四分位数对极端值较稳健，偏态数据常优先看中位数。","将数据排序后，奇数个取中间值，偶数个取中间两个的平均数；众数是频数最多的值，可能不唯一；极差=最大值−最小值，方差=标准差²。","偏度衡量不对称，正偏为右长尾、负偏为左长尾；峰度反映尾部及极端值特征。正态分布的普通峰度为3、超额峰度为0，须先分清定义。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：中位数”。"],"tip":"中心看均值/中位数/众数；分散看差；形状看偏峰。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":62,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于样本比例p正确的说法是（ ）。","answer":["A"],"dataset_description":null,"id":"p04:62","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于样本比例p正确的说法是（ ）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"随着样本容量的增大，p 的方差愈来愈小"},{"label":"B","html":"随着样本容量的增大，p 的方差愈来愈大"},{"label":"C","html":"随着样本容量的增大，p 的方差不会发生改变"},{"label":"D","html":"随着样本容量的增大，p 的方差在某些区间会变大，在某些区间会变小"}],"explanation":{"topic":"样本比例与其标准误","paragraphs":["设总体比例为 p，独立随机抽样时样本比例 p̂ 的期望为 p，方差为 p(1−p)/n，标准误为 √[p(1−p)/n]。不放回抽取有限总体时，还要考虑有限总体修正。","样本比例本质上是成功次数除以样本量，有限样本下并不严格服从连续正态分布。通常需 np 和 n(1−p) 都足够大，才使用正态近似。不能把“任意样本容量都近似正态”当成结论。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：随着样本容量的增大，p 的方差愈来愈小”。"],"tip":"比例标准误：根号下 p(1−p)/n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":63,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于抽样调查的说法，正确的有（  ）。","answer":["B"],"dataset_description":null,"id":"p04:63","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于抽样调查的说法，正确的有（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样调查具有周期性\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样调查具有经济\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样调查一般需要规定统一的标准调查时间\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样调查只适用于某些特定领域\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样调查的经济性","paragraphs":["抽样调查只调查总体中的一部分单位，相比普查通常节省人力、物力和时间，因此 B 所说的经济性是其常见优点。","抽样调查不必都按固定周期开展，也不只适用于少数特定领域。是否设定统一标准时点取决于调查对象和设计，不能把普查的安排一概作为所有抽样调查的必要条件。"],"warning":""},"attachments":[]},{"number":64,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于t分布的叙述，不正确的是（ ）。","answer":["B"],"dataset_description":null,"id":"p04:64","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下关于t分布的叙述，不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>当\u003c/span>\u003cspan>t值离中心越远，该t值对应的概率密度会逐渐减小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布可以用一条曲线描述\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>t分布的概率密度函数在均值处达到最大值\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>t分布的极限分布是标准正态分布\u003c/span>\u003c/p>\u003cp>\u003cspan> \u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：t分布可以用一条曲线描述”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":65,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面不是顺序统计量的是（   ）。","answer":["D"],"dataset_description":null,"id":"p04:65","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下面不是顺序统计量的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"中位数"},{"label":"B","html":"\u003cp>四分位数\u003c/p>"},{"label":"C","html":"\u003cp>百分位数\u003c/p>"},{"label":"D","html":"\u003cp>算术平均数\u003c/p>"}],"explanation":{"topic":"非参数统计","paragraphs":["非参数方法通常不要求总体必须属于某个已知参数分布族，常利用秩、符号、次序或频数进行推断，但仍可能要求独立性、连续性等条件，并非“完全没有假设”。","中位数、分位数、极值和秩属于常见的位置或次序信息。均值、方差是样本矩相关统计量；不要把“任何样本统计量”都理解为非参数方法。","非参数方法适合偏态、等级等场景，其效率要结合实际分布判断，不能一概说准确度必然高或必然低。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：算术平均数”。"],"tip":"非参数少依赖分布形式，不等于没有条件。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":66,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下述关于样本指标的说法，不正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:66","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下述关于\u003c/span>\u003cspan>样本指标\u003c/span>\u003cspan>的说法，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本\u003c/span>\u003cspan>指标\u003c/span>\u003cspan>的\u003c/span>\u003cspan>值是确定的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本指标是根据抽样计算的指标\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本指标的计算随着样本的不同而不同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本\u003c/span>\u003cspan>指标\u003c/span>\u003cspan>的\u003c/span>\u003cspan>值是不确定的\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：样本指标的值是确定的”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":67,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于分层抽样和整群抽样的相同点与联系，以下错误的是（  ）。","answer":["C"],"dataset_description":null,"id":"p04:67","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于分层抽样和整群抽样的相同点与联系，以下错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>都是依据某一标准将总体分为不同的组\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>都是随机抽样的一种\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>划分的依据基本相同\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样误差不同\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层抽样与整群抽样的区别","paragraphs":["分层抽样先把总体分成互不重叠的层，再在每一层抽若干单位，目的是保证各层代表性并降低误差；有效分层通常层内相似、层间差异较大。","整群抽样把总体分为互不重叠的群，抽取一部分群，对抽中群内的单位全部调查。它通常便于组织、节省成本，但群内相关性高时误差可能增大。","“每组都抽一些”是分层；“只抽部分组，组内全查”是整群；“抽组后组内再抽一部分”则是多阶段。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：划分的依据基本相同”。"],"tip":"分层每层抽，整群抽群全查，多阶段群内再抽。","source":""},"attachments":[]},{"number":68,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"指出下面的说法哪一个正确（  ）。","answer":["A"],"dataset_description":null,"id":"p04:68","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>指出下面的说法哪一个正确（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本量越大，抽样误差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本量越大，抽样误差越大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本量越小，抽样误差越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>样本的抽样误差与样本量无关\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：样本量越大，抽样误差越小”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":69,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列场合适合用t统计量的是(   )","answer":["C"],"dataset_description":null,"id":"p04:69","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列场合适合用t统计量的是( &nbsp; )\u003c/span>\u003c/p>","options":[{"label":"A","html":"正态总体,大样本,方差未知"},{"label":"B","html":"非正态总体,大样本,方差未知"},{"label":"C","html":"正态总体,小样本,方差未知"},{"label":"D","html":"非正态总体,小样本,方差未知"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：正态总体,小样本,方差未知”。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":70,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在某市随机抽取9个家庭，调查得到每个家庭的人均月收入的样本如下（单位：元）:\n1080 750 1080 850 1080 960 2000 1250 1680\n这个样本的众数为：","answer":["B"],"dataset_description":null,"id":"p04:70","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在某市随机抽取9个家庭，调查得到每个家庭的人均月收入的样本如下（单位：元）:\u003c/span>\u003c/p>\u003cp>\u003cspan>1080 750 1080 850 1080 960 2000 1250 1680\u003c/span>\u003c/p>\u003cp>\u003cspan>这个样本的众数为：\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>1680\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>1080\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>960\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>2000\u003c/span>\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["众数是出现次数最多的数。1080出现3次，其他收入各出现1次，所以众数1080，选 B。","众数与均值、中位数不同，不要求把各值相加。"],"warning":""},"attachments":[]},{"number":71,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下不属于配额抽样优点的是（  ）。","answer":["B"],"dataset_description":null,"id":"p04:71","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下不属于配额抽样优点的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>费用不高\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>偏差小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>能满足总体比例的要求\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>易于实施\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：偏差小”。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":72,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"从一个总体中抽取一个样本容量为30的样本，样本均值的标准误为5，总体的方差等于（ ）。","answer":["B"],"dataset_description":null,"id":"p04:72","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>从一个总体中抽取一个样本容量为30的样本，样本均值的标准误为5，总体的方差等于（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>960\u003c/p>"},{"label":"B","html":"\u003cp>750\u003c/p>"},{"label":"C","html":"\u003cp>850\u003c/p>"},{"label":"D","html":"\u003cp>670\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["SE(X̄)=σ/√n，所以σ²=n×SE²=30×5²=750，选 B。","5是均值的标准误，不是总体标准差；不能直接平方5后就结束。"],"warning":""},"attachments":[]},{"number":73,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"相关程度看的是相关系数的绝对值，下面表述错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p04:73","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>相关程度看的是相关系数的绝对值，下面表述错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>相关系数的绝对值越大，相关程度越高\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>相关系数为0时，说明没有明显的线性相关关系\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>当相关系数的区间为[0，1]时，相关系数越大，相关程度越高\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>当相关系数的区间为[0，-1]时，相关系数越小，相关程度越低\u003c/span>\u003c/p>"}],"explanation":{"topic":"协方差与相关系数","paragraphs":["协方差 Cov(X,Y)=E[(X−EX)(Y−EY)] 表示共同变化方向，但大小受单位影响。相关系数 r=Cov(X,Y)/(σXσY) 消除量纲，范围在−1到1之间，绝对值越大表示线性相关越强。","r>0 为同向，r\u003c0 为反向，r≈0 只表示线性关系弱，并不排除非线性关系，更不能推出独立；相关也不等于因果。","协方差矩阵对称，对角线是各变量方差，非对角线是成对协方差；方差非负，协方差可以为负。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：当相关系数的区间为[0，-1]时，相关系数越小，相关程度越低”。"],"tip":"r 看符号和绝对值；相关≠因果，零相关≠没关系。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":74,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"在大型调查时最常采用的一种抽样方法是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:74","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在大型调查时最常采用的一种抽样方法是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>多阶段抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>分层抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>单纯随机抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>系统抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：多阶段抽样”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":75,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"反映抽样指标与总体指标之间抽样误差可能范围的指标是（ ）。","answer":["B"],"dataset_description":null,"id":"p04:75","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>反映抽样指标与总体指标之间抽样误差可能范围的指标是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样平均误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样极限误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样误差系数\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>概率度\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：抽样极限误差”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":76,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"样本统计量与相应的总体参数之间的差距是（ ）。","answer":["A"],"dataset_description":null,"id":"p04:76","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>样本统计量与相应的总体参数之间的差距是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>取样误差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>估计误差\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>测量误差\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>随机误差\u003c/span>\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：取样误差”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":77,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于抽样极限误差、抽样平均误差及概率度之间关系陈述正确的有（ ）。","answer":["B"],"dataset_description":null,"id":"p04:77","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于抽样极限误差、抽样平均误差及概率度之间关系陈述正确的有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>概率度一定时,抽样平均误差越大,则极限误差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>概率度一定时,抽样平均误差越大,则极限误差越大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>极限误差一定时,抽样平均误差越大,则概率度越大\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样平均误差一定时,概率度越大,则极限误差越小\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样极限误差与概率度","paragraphs":["常见教材记号为 Δ=z×SE：Δ 是给定置信水平下的抽样误差界限，SE 是抽样标准误，z 是相应的概率度或临界值。三者不是互相独立的量。","固定标准误时，要求更高置信水平需要更大的 z 和更宽的误差界限；固定误差界限而提高置信水平，则要降低标准误，通常需要增大样本量。","这里的“最大误差”是对应概率保证程度的界限，并非随机抽样所有可能结果都绝对不会越界。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：概率度一定时,抽样平均误差越大,则极限误差越大”。"],"tip":"误差界限=临界值×标准误。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":78,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于代表性误差的说法，正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p04:78","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于代表性误差的说法，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>代表性误差是指调查方案规定不明确导致的填报错误\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>代表性误差通常是可以消除的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>代表性误差可以事先进行控制或计算\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>代表性误差是被调查者有意虚报或瞒报调查数据造成的\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：代表性误差可以事先进行控制或计算”。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":79,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于滚雪球抽样的说法，正确的是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:79","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于滚雪球抽样的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样从几个样本开始\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本识别成本较高\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>获取样本\u003c/span>\u003cspan>成本\u003c/span>\u003cspan>高\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>结果的可推论性很高\u003c/span>\u003c/p>"}],"explanation":{"topic":"滚雪球抽样","paragraphs":["先找到少量符合条件的对象，再请其推荐其他符合条件者，如此扩展样本。它通常用于难以建立抽样框、隐蔽或不易接触的人群。","优势是进入特殊群体较容易、能获得较深入的信息；局限是依赖关系网络，样本可能集中于某些圈子，入样概率通常未知，不能据此保证总体代表性或无偏。","“任何人群都适用、误差必然更小、可直接作严格概率推断”都超过了这种方法能保证的范围。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：抽样从几个样本开始”。"],"tip":"滚雪球靠推荐，适合难接触群体；网络偏差要警惕。","source":""},"attachments":[]},{"number":80,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于多阶段抽样，下列说法错误的是（  ）。","answer":["C"],"dataset_description":null,"id":"p04:80","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于多阶段抽样，下列说法错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>多阶段抽样在每个阶段的抽样方法可以不同\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>在大范围的抽样调查中，采用多阶段抽样是必要的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>多阶段抽样是对三个及三个以上抽样阶段抽样方法的统称\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>多阶段的抽样设计比较复杂\u003c/span>\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：多阶段抽样是对三个及三个以上抽样阶段抽样方法的统称”。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":81,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于充分统计量，下列说法错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:81","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于充分统计量，下列说法错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>充分统计量是唯一的\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>充分统计量不是唯一的\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>正态总体有已知\u003c/span>方差\u003cspan>，样本均值塣是充分统计量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>一个统计量是否充分，与总体分布有密切关系\u003c/span>\u003c/p>"}],"explanation":{"topic":"点估计与估计量的优良性","paragraphs":["点估计用一个样本统计量估计未知总体参数；估计量是抽样前的随机函数，估计值是代入这一次样本后得到的数。区间估计进一步表达抽样不确定性。","无偏性指 E(θ̂)=θ；有效性常在无偏估计量间比较方差，方差小的更稳定；一致性指 n 增大时 θ̂ 依概率趋近 θ；充分性指统计量保留了样本中关于参数的全部信息。","一致性不能仅由“方差趋于0”无条件推出，还需偏差等条件；固定样本的一个估计值也不能称为“必然等于参数”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：充分统计量是唯一的”。"],"tip":"无偏看期望，有效看方差，一致看大样本趋近。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":82,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"为了评估样本统计量的优良性，我们需要用到评价指标，下面哪一个选项不能够作为评价指标（  ）？","answer":["D"],"dataset_description":null,"id":"p04:82","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>为了评估样本统计量的优良性，我们需要用到评价指标，下面哪一个选项不能够作为评价指标（ &nbsp;）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>统计量的无偏性\u003c/p>"},{"label":"B","html":"\u003cp>统计量的一致性\u003c/p>"},{"label":"C","html":"\u003cp>统计量的有效性\u003c/p>"},{"label":"D","html":"\u003cp>统计量的可靠性\u003c/p>"}],"explanation":{"topic":"总体、样本、参数与统计量","paragraphs":["总体是研究目标所涉及的全部单位，样本是从其中抽取的一部分单位。参数概括总体，例如总体均值 μ；统计量是样本的函数，例如样本均值 X̄，不能在统计量定义中含未知总体参数。","对一个确定总体，参数固定但通常未知；抽样前统计量具有随机性，抽样后算出的统计量值确定。换样本可能得到不同值，但也可能恰好相同。","统计量的抽样分布指重复抽样下该统计量所有可能取值的概率分布，不是样本内每个观测值的分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：统计量的可靠性”。"],"tip":"总体用参数，样本用统计量；固定未知≠已知。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":83,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下特殊人群不可以用滚雪球抽样法的是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:83","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下特殊人群不可以用滚雪球抽样法的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>大学校园中的学生\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>女性同性恋\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>无家可归者\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>流动劳工\u003c/span>\u003c/p>"}],"explanation":{"topic":"滚雪球抽样","paragraphs":["先找到少量符合条件的对象，再请其推荐其他符合条件者，如此扩展样本。它通常用于难以建立抽样框、隐蔽或不易接触的人群。","优势是进入特殊群体较容易、能获得较深入的信息；局限是依赖关系网络，样本可能集中于某些圈子，入样概率通常未知，不能据此保证总体代表性或无偏。","“任何人群都适用、误差必然更小、可直接作严格概率推断”都超过了这种方法能保证的范围。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：大学校园中的学生”。"],"tip":"滚雪球靠推荐，适合难接触群体；网络偏差要警惕。","source":""},"attachments":[]},{"number":84,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于卡方分布，以下不正确的是（ ）。","answer":["D"],"dataset_description":null,"id":"p04:84","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于卡方分布，以下不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>随着自由度的增大，分布趋近于正态分布\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随着自由度的增大，分布向\u003c/span>正无穷\u003cspan>方向延伸\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>随着自由度的增大，分布曲线也越来越低阔\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>不同的自由度决定不同的卡方分布，自由度越大，分布越偏斜\u003c/span>\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：不同的自由度决定不同的卡方分布，自由度越大，分布越偏斜”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":85,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"与其他抽样方法比较，整群抽样误差（   ）。","answer":["B"],"dataset_description":null,"id":"p04:85","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>与其他抽样方法比较，整群抽样误差（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"较小"},{"label":"B","html":"较大"},{"label":"C","html":"相同"},{"label":"D","html":"无法比较"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：较大”。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":86,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列说法不正确的是（  ）。","answer":["B"],"dataset_description":null,"id":"p04:86","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列说法不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>样本均值和样本方差是样本统计量\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>样本均值和样本方差是参数\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>样本统计量是随机变量\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>总体参数是一个未知的常数\u003c/span>\u003c/p>"}],"explanation":{"topic":"样本均值的抽样分布","paragraphs":["对于独立同分布样本，E(X̄)=μ，Var(X̄)=σ²/n，标准误 SE(X̄)=σ/√n。因此增加样本量不会改变均值的期望，却会缩小标准误。","总体正态时，任意 n 的样本均值都正态；总体非正态时，需要中心极限定理的适用条件和足够大的样本，才能近似正态。并非所有“样本统计量”都会正态。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：样本均值和样本方差是参数”。"],"tip":"期望不变，方差除以 n，标准误除以 √n。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":87,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下面有关抽样分布的说法, 错误的是（ ）。","answer":["D"],"dataset_description":null,"id":"p04:87","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下面有关抽样分布的说法, 错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>随着样本容量的增加，抽样分布趋于正态\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>随着样本容量的增加，抽样分布的方差趋小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样分布的方差与总体方差的大小有关\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>正态总体抽样所有统计量服从正态分布\u003c/span>\u003c/p>"}],"explanation":{"topic":"正态分布","paragraphs":["正态分布 N(μ,σ²) 关于 μ 对称，均值、中位数、众数都等于 μ。μ 决定位置，σ 决定宽窄：σ 大则宽而矮，σ 小则窄而高，总面积始终为1。","标准正态分布的均值为0、标准差为1。标准化用 Z=(X−μ)/σ。正态分布的取值范围是整个实数轴，不只限于 μ 附近或正数。","“原数据正态”与“统计量正态”应分开判断：正态样本的均值正态，样本方差经过缩放后则是卡方分布。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：正态总体抽样所有统计量服从正态分布”。"],"tip":"正态三种中心相同；μ 定位、σ 定宽。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":88,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"判断抽样是调查者根据主观经验和判断从总体中选取有代表性的个体构成样本的一种非概率抽样方法，下列观点错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:88","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>判断抽样是调查者根据主观经验和判断从总体中选取有代表性的个体构成样本的一种非概率抽样方法，下列观点错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>抽样结果可以计算抽样误差\u003c/p>"},{"label":"B","html":"\u003cp>适用于总体中的个体差异较小的情况\u003c/p>"},{"label":"C","html":"\u003cp>适用于样本容量很小的情况\u003c/p>"},{"label":"D","html":"\u003cp>可能得到一个不具代表性的样本\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：抽样结果可以计算抽样误差”。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":89,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"关于卡方分布，以下说法不正确的是（ ）。","answer":["C"],"dataset_description":null,"id":"p04:89","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于卡方分布，以下说法不正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>卡方值大于等于零\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>曲线形状受自由度的影响\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>分布曲线不连续\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>分布曲线不对称\u003c/span>\u003c/p>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：分布曲线不连续”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":90,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"下列不属于多阶段抽样优点的是（   ）。","answer":["D"],"dataset_description":null,"id":"p04:90","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列不属于多阶段抽样优点的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>有利于抽样的组织和实施\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>有利于满足各阶段对调查资料的需求\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>适合于大规模抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>便于取得总体中某些分类数据\u003c/span>\u003c/p>"}],"explanation":{"topic":"多阶段抽样","paragraphs":["多阶段抽样逐级抽取单位，例如先抽学校，再从抽中学校抽学生。不同阶段的抽样单位和方法可以不同，最终个体的入样概率由各阶段共同决定。","它适合总体分散、规模很大的调查，便于组织并降低成本；缺点是设计、权重和误差计算较复杂，多级聚集也可能增加误差。","如果抽中学校内所有学生都调查，属于一次整群抽样；如果还抽一部分学生，才体现第二阶段抽取。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：便于取得总体中某些分类数据”。"],"tip":"先抽大单位，再抽小单位；每级都要有清楚的抽取规则。","source":""},"attachments":[]},{"number":91,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于F分布描述错误的是（   ）。","answer":["B"],"dataset_description":null,"id":"p04:91","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下关于F分布描述错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>是两个服从卡方分布的随机变量各除以其自由度后的比值的抽样分布\u003c/p>"},{"label":"B","html":"\u003cp>是一种对称分布\u003c/p>"},{"label":"C","html":"\u003cp>是单峰非对称曲线\u003c/p>"},{"label":"D","html":"\u003cp>位置不可互换\u003c/p>"}],"explanation":{"topic":"F 分布及方差比检验","paragraphs":["若 U、V 为独立卡方变量，自由度分别为 ν₁、ν₂，则 F=(U/ν₁)/(V/ν₂) 服从 F(ν₁,ν₂)。它非负，通常右偏，由两个有顺序的自由度共同决定。","交换分子分母要取倒数，并交换自由度：若 F~F(ν₁,ν₂)，则 1/F~F(ν₂,ν₁)。临界值还取决于显著性水平与单侧或双侧检验，不能随意交换顺序。","比较方差可用方差比；方差分析也使用 F，但不能据此说 F 直接检验“均值的方差相等”。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：是一种对称分布”。"],"tip":"F 是两个独立“卡方/自由度”的比值。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":92,"type":"单选题","book":"《大数据分析素养》","chapter":5,"question":"调查某人群免疫水平时，各年龄组按比例抽洋采血测抗体，属于（       ）。","answer":["C"],"dataset_description":null,"id":"p04:92","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>调查某人群免疫水平时，各年龄组按比例抽洋采血测抗体，属于（\u003c/span>\u003cspan> &nbsp; &nbsp; &nbsp; \u003c/span>\u003cspan>）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"随机抽样"},{"label":"B","html":"整群抽样"},{"label":"C","html":"分层抽样"},{"label":"D","html":"多级抽样"}],"explanation":{"topic":"分层随机抽样","paragraphs":["先按与调查变量有关的特征分成互不重叠、合起来覆盖总体的层，再分别随机抽样。各层都应有样本，层内同质程度越高，通常越有利于提高精度。","比例分配时 nₕ=n×Nₕ/N。例如各层人数占比为20%、30%、50%，总样本100，则分别抽20、30、50。配额抽样也分组分配名额，但组内未必随机，所以属于非概率方法。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：分层抽样”。"],"tip":"比例分层：各层样本量=总样本量×各层占比。","source":""},"attachments":[]},{"number":93,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"为了由样本推断总体，样本应当是总体中（   ）。","answer":["B"],"dataset_description":null,"id":"p04:93","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>为了由样本推断总体，样本应当是总体中（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"任意一部分"},{"label":"B","html":"有代表性的一部分"},{"label":"C","html":"有价值的一部分"},{"label":"D","html":"有意义的一部分"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：有代表性的一部分”。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":94,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"以下关于统计推断的说法，错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:94","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下关于统计推断的说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>用总体估计样本的过程\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>统计推断包括总体参数的估计和假设检验\u003c/p>"},{"label":"C","html":"\u003cp>统计推断是统计学的核心内容\u003c/p>"},{"label":"D","html":"\u003cp>用样本指标估计相应的总体指标\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：用总体估计样本的过程”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":95,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于点估计与区间估计特点的描述，不正确的是（   ）。","answer":["C"],"dataset_description":null,"id":"p04:95","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下面关于点估计与区间估计特点的描述，不正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"点估计具体到某一个点"},{"label":"B","html":"区间估计是一个区间"},{"label":"C","html":"区问估计比点估计更为准确,可靠"},{"label":"D","html":"点估计与区间估计是参数估计的两种推理模型"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：区问估计比点估计更为准确,可靠”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":96,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"如果样本个数为n，以下关于卡方检验的自由度（df）的说法，正确的是（   ）。","answer":["D"],"dataset_description":null,"id":"p04:96","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>如果样本个数为n，以下关于卡方检验的自由度（df）的说法，正确的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"对2×2列联表进行检验时，df = 4"},{"label":"B","html":"卡方适合性检验时，df = n-2"},{"label":"C","html":"对于一个3×4列联表进行检验时，df = 11"},{"label":"D","html":"如果χ²(0.05, df\u003csub>1\u003c/sub>) ＞ χ²(0.05, df\u003csub>2\u003c/sub>)，则df\u003csub>1\u003c/sub>&gt;df\u003csub>2\u003c/sub>"}],"explanation":{"topic":"卡方分布与卡方检验","paragraphs":["ν 个独立标准正态变量的平方和服从 χ²(ν)。取值非负，期望是 ν，方差是 2ν；形状随自由度改变，自由度大时逐渐接近正态。","正态总体方差检验用 (n−1)s²/σ₀²，自由度 n−1；r×c 列联表独立性检验的自由度为 (r−1)(c−1)。不同任务的自由度不能混用。","拟合优度和独立性检验中，χ²=Σ(观察频数−期望频数)²/期望频数。值越大通常表示偏离越明显，p 值足够小时拒绝原假设；总体方差检验的拒绝域则按备择假设确定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：如果χ²(0.05, df1) ＞ χ²(0.05, df2)，则df1>df2”。"],"tip":"卡方：均值 ν，方差 2ν；独立性 df=(行−1)(列−1)。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":97,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"关于检验统计量,下列说法中错误的是(   )。","answer":["B"],"dataset_description":null,"id":"p04:97","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于检验统计量,下列说法中错误的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"检验统计量是样本的函数"},{"label":"B","html":"检验统计量包含未知总体参数"},{"label":"C","html":"在原假设成立的前提下,检验统计量的分布是明确可知的"},{"label":"D","html":"检验同一总体参数可以用多个不同的检验统计量"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 B。对应内容为“B：检验统计量包含未知总体参数”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":98,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下列说法正确的是(   )。","answer":["C"],"dataset_description":null,"id":"p04:98","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列说法正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"如果备择假设是正确的,但做出的决策是拒绝备择假设,则犯了弃真错误"},{"label":"B","html":"如果备择假设是错误的,但做出的决策是接收备择假设,则犯了采伪错误"},{"label":"C","html":"如果零假设是正确的,但做出的决策是接受备择假设,则犯了弃真错误"},{"label":"D","html":"如果零假设是错误的,但做出的决策是接收备择假设,则犯了采伪错误"}],"explanation":{"topic":"假设检验的两类错误","paragraphs":["第一类错误是原假设 H₀ 为真却拒绝它，也叫弃真，其概率通常用 α 表示。第二类错误是 H₀ 为假却未拒绝它，也叫取伪，其概率用 β 表示，检验功效为 1−β。","在样本量、效应大小和检验方案等条件固定时，降低 α 常会增加 β。增加有效样本量可以改善检验功效，不能说两类错误在任何情况下都固定互补或相加等于1。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：如果零假设是正确的,但做出的决策是接受备择假设,则犯了弃真错误”。"],"tip":"弃真 α；取伪 β；功效 1−β。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":99,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"拒绝域是用来判断是否接受原假设H0的数量界限，下面说法错误的是（   ）。","answer":["C"],"dataset_description":null,"id":"p04:99","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>拒绝域是用来判断是否接受原假设H\u003c/span>\u003cspan>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>的数量界限，下面说法错误的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"当由样本值计算的具有统计量落入该区域内，则拒绝原假设H\u003csub>0\u003c/sub>"},{"label":"B","html":"当由样本值计算的具有统计量落入该区域内，接受备择假设H\u003csub>1\u003c/sub>"},{"label":"C","html":"当计算的检验统计量落入该区域外，则不拒绝备择假设H\u003csub>1\u003c/sub>"},{"label":"D","html":"拒绝域的边界值称为临界值"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：当计算的检验统计量落入该区域外，则不拒绝备择假设H1”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":100,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在下列可用z检验统计量的条件中，正确的是(    )。","answer":["B"],"dataset_description":null,"id":"p04:100","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在下列可用z检验统计量的条件中，正确的是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp> 单个正态总体均值的检验，总体方差未知，小样本\u003c/p>"},{"label":"B","html":"\u003cp>单个正态总体均值的检验，总体方差已知，大样本\u003c/p>"},{"label":"C","html":"\u003cp>单个正态总体均值的检验，总体方差未知，大样本\u003c/p>"},{"label":"D","html":"\u003cp>单个正态总体均值的检验，总体方差已知，小样本\u003c/p>"}],"explanation":{"topic":"假设检验、拒绝域与 p 值","paragraphs":["先确定 H₀ 和 H₁，再预设显著性水平 α，选择在 H₀ 下分布已知或可近似的统计量，根据样本计算统计量或 p 值，最后作出拒绝或不拒绝 H₀ 的决定。","统计量应与临界值比较，p 值应与 α 比较。若 p≤α，通常拒绝 H₀；不能把统计量的数值直接与 α 比较。α 是在 H₀ 为真时允许的一类错误概率，不是“H₀ 为真的概率”。","H₁ 为“>”通常对应右尾，为“\u003c”对应左尾，为“≠”对应双尾。未拒绝 H₀ 代表证据不足，不证明 H₀ 必然为真。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：单个正态总体均值的检验，总体方差已知，大样本”。"],"tip":"p 对 α，统计量对临界值；不拒绝≠证明正确。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":101,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"下面关于统计归纳推断的主要内容的观点，不正确的是（  ）。","answer":["D"],"dataset_description":null,"id":"p04:101","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下面关于统计归纳推断的主要内容的观点，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"估计"},{"label":"B","html":"假设检验"},{"label":"C","html":"贝叶斯推理三种形式"},{"label":"D","html":"线性优化"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：线性优化”。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":102,"type":"单选题","book":"《大数据分析素养》","chapter":6,"question":"在总体均值的区间估计中，下列正确的说法是(   )。","answer":["C"],"dataset_description":null,"id":"p04:102","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>在总体均值的区间估计中，下列正确的说法是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>置信度一定时，样本容量增加，则置信区间的长度变长\u003c/p>"},{"label":"B","html":"\u003cp>置信度一定时，样本容量增加，则置信区间的长度不变\u003c/p>"},{"label":"C","html":"\u003cp>置信度变大，则置信区间的长度变长\u003c/p>"},{"label":"D","html":"\u003cp>样本容量和置信度同时减半，则置信区间的长度不变\u003c/p>"}],"explanation":{"topic":"置信区间与区间估计","paragraphs":["均值置信区间常写作“点估计 ± 临界值×标准误”。总体方差已知时用 Z 临界值；正态总体方差未知时通常用 t 临界值。区间宽度表达估计精度。","在其他条件相同时，提高置信水平会扩大区间；增加样本量会缩短区间；总体变异增大会扩大区间。不能同时无限提高可靠程度和精确程度而不增加信息。","95%置信度的频率学解释是：若反复抽样、按同一方法构造区间，约95%的区间覆盖固定的真实参数；并非已经算出的区间中，固定参数又随机地以95%概率移动。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：置信度变大，则置信区间的长度变长”。"],"tip":"置信水平高→区间宽；样本量大→区间窄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":103,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下面关于大数据发展的3个阶段的叙述，错误的是（    ）。","answer":["C"],"dataset_description":null,"id":"p04:103","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下面关于大数据发展的3个阶段的叙述，错误的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"发展期"},{"label":"B","html":"应用期"},{"label":"C","html":"终结期"},{"label":"D","html":"开始期"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：终结期”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":104,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"以下关于大数据叙述，不正确的一项是(    )。","answer":["D"],"dataset_description":null,"id":"p04:104","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下关于大数据叙述，不正确的一项是( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>大数据通常指无法在可承受时间范围内用常规工具进行抓取、管理和处理的数据集合\u003c/p>"},{"label":"B","html":"\u003cp>大数据不仅包含海量数据，还包含多种复杂类型的数据\u003c/p>"},{"label":"C","html":"\u003cp>大数据的核心价值之一在于对海量数据进行及时有效的分析\u003c/p>"},{"label":"D","html":"\u003cp>大数据仅指数据量大，不涉及数据类型和速度等其他特征\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：大数据仅指数据量大，不涉及数据类型和速度等其他特征”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":105,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"某超市的数据分析人员研究销售纪录数据后发现，买啤酒的人很大概率也会购买尿布，这种属于数据挖掘的哪类问题 (    )。","answer":["A"],"dataset_description":null,"id":"p04:105","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cstrong> \u003c/strong>\u003cspan>某超市的数据分析人员研究销售纪录数据后发现，买啤酒的人很大概率也会购买尿布，这种属于数据挖掘的哪类问题 ( &nbsp; &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"关联规则发现"},{"label":"B","html":"聚类"},{"label":"C","html":"分类"},{"label":"D","html":"自然语言处理"}],"expl
