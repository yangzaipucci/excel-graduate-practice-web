anation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：关联规则发现”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":106,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"下列哪个选项不属于云计算的特征（   ）。","answer":["D"],"dataset_description":null,"id":"p04:106","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列哪个选项不属于云计算的特征（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"虚拟化"},{"label":"B","html":"分布式"},{"label":"C","html":"并行计算"},{"label":"D","html":"独立性"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：独立性”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":107,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"关于数据可视化，下列说法正确的是（    ）。","answer":["C"],"dataset_description":null,"id":"p04:107","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于数据可视化，下列说法正确的是（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数据可视化是大数据生命周期管理的第一步，也是最重要的一步"},{"label":"B","html":"大数据可视化的实施不是指数据的转换过程，而是指数据呈现的效果"},{"label":"C","html":"开源项目就jupyter是一种数据可视化工具，它通过十多种编程语言实现大数据分析、可视化和软件开发的实时协作"},{"label":"D","html":"数据可视化系统主要是为了展示用户的已知的数据之间的规律，而不是为了发现这些数据所反映的实质"}],"explanation":{"topic":"图表选择与可视化","paragraphs":["比较不同类别的数量通常用条形或柱形图，条长表示数值，类别由坐标或标签区分；观察时间趋势通常用折线图；看两数值变量关系用散点图，每个点是一对观测。","直方图对连续数值分组，柱面积反映频数或频率；组距不等时需看密度而非只看高度。箱线图展示中位数、四分位数与离群情况；热力图以颜色编码矩阵数值。","饼图看同一整体内各部分占比，总体通常为100%，类别太多或小比例太多不利辨认。任何图表都不能单独证明广告造成销售上升等因果关系，坐标范围与尺度也要核对。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C。对应内容为“C：开源项目就jupyter是一种数据可视化工具，它通过十多种编程语言实现大数据分析、可视化和软件开发的实时协作”。"],"tip":"趋势线、类别柱、占比饼、关系点、分布直方/箱线。","source":""},"attachments":[]},{"number":108,"type":"单选题","book":"《大数据分析素养》","chapter":7,"question":"计算是基于（ ）的相关服务的增加，使用和交付模式，通常涉及通过互联网来提供动态易扩展且经常是虚拟化的资源。","answer":["B"],"dataset_description":null,"id":"p04:108","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>计算是基于（ ）的相关服务的增加，使用和交付模式，通常涉及通过互联网来提供动态易扩展且经常是虚拟化的资源。 &nbsp; &nbsp;\u003c/span>\u003c/p>","options":[{"label":"A","html":"计算机"},{"label":"B","html":"互联网"},{"label":"C","html":"智能手机"},{"label":"D","html":"通讯产品"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B。对应内容为“B：互联网”。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":109,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于线性规划叙述，正确的选项是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:109","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于线性规划叙述，正确的选项是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"线性规划问题，若有最优解，则必是一个基变量组成的可行基解"},{"label":"B","html":"线性规划问题一定有可行基解"},{"label":"C","html":"线性规划问题的最优解只能在最低点上达到"},{"label":"D","html":"单纯型法求解线性规划问题时，每换基迭代一次必使目标函数值下降一次"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A。对应内容为“A：线性规划问题，若有最优解，则必是一个基变量组成的可行基解”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":110,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"一个移动运营商需要对客户的流失进行预测，可以使用下面哪种机器学习方法比较合适(   )。","answer":["D"],"dataset_description":null,"id":"p04:110","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>一个移动运营商需要对客户的流失进行预测，可以使用下面哪种机器学习方法比较合适( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"一元线性回归算法"},{"label":"B","html":"关联方法"},{"label":"C","html":"聚类算法"},{"label":"D","html":"逻辑回归算法"}],"explanation":{"topic":"机器学习的任务与标签","paragraphs":["监督学习以带目标标签的训练样本学习输入到输出的映射：分类预测离散类别，回归预测连续数值。客户是否流失通常是二分类，可用逻辑回归、分类树等模型。","无监督学习通常没有目标标签，常见任务为聚类和降维；半监督学习同时利用少量标注和大量未标注样本。并非训练流程只有输入与输出，还包括预处理、拟合、验证和评估。","逻辑回归虽然名字含“回归”，常用于分类，将线性评分经 sigmoid 映射为0至1的概率；需要阈值才得到类别。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：逻辑回归算法”。"],"tip":"有标签学分类/回归，无标签做聚类/降维。","source":""},"attachments":[]},{"number":111,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于方差分析的叙述中，不正确的是（  ）。","answer":["C"],"dataset_description":null,"id":"p04:111","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于方差分析的叙述中，不正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"按照因素个数多少，可分为单因素方差分析，双因素方差分析，和多因素方差分析"},{"label":"B","html":"按照分析指标中变量个数多少的不同，可分为一元方差分析和多元方差分析"},{"label":"C","html":"协方差分析是指方差分析的解释变量仅包括离散型的因素"},{"label":"D","html":"基于自由分布理论，方差分析还包括非参数方差分析"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：协方差分析是指方差分析的解释变量仅包括离散型的因素”。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":112,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"有关线性回归的说法，错误的是（  ）。","answer":["D"],"dataset_description":null,"id":"p04:112","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>有关线性回归的说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"相关关系的两个变量不是因果关系"},{"label":"B","html":"散点图能直观地反映数据的相关程度"},{"label":"C","html":"回归直线最能代表线性相关的两个变量之间的关系"},{"label":"D","html":"任一组数据都有回归方程"}],"explanation":{"topic":"线性回归与最小二乘","paragraphs":["一元回归写为 y=β₀+β₁x+ε，β₀ 为截距、β₁ 为斜率，ε 为未解释的扰动。最小二乘选择参数使残差平方和 Σ(yᵢ−ŷᵢ)² 最小，不是使残差和或绝对值和最小。","“线性”通常指对参数线性，解释变量可以含 x² 等变换项。回归预测数值，分类预测类别；回归系数可正可负，取决于控制其他变量后的方向。","带截距的常规最小二乘中 R²=1−SSE/SST，范围0至1，表示样本内变异被解释的比例；一元回归中等于 Pearson r²。拟合好不等于因果成立，也不保证样本外预测好。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：任一组数据都有回归方程”。"],"tip":"最小二乘最小化残差平方和；R² 不带方向。","source":""},"attachments":[]},{"number":113,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于共轭梯度法的叙述,错误的是（  ）。","answer":["A"],"dataset_description":null,"id":"p04:113","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于共轭梯度法的叙述,错误的是（ &nbsp;）。 \u003c/span>\u003c/p>","options":[{"label":"A","html":"需要求二阶海斯矩阵"},{"label":"B","html":"除第一步以外的其余各步的搜索方向是将负梯度偏转一个角度"},{"label":"C","html":"共轭梯度法具有二次收敛性"},{"label":"D","html":"第一步迭代的搜索方向为初始点的负梯度"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：需要求二阶海斯矩阵”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":114,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"关于数学建模的假设,以下叙述不正确的是(  )。","answer":["C"],"dataset_description":null,"id":"p04:114","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于数学建模的假设,以下叙述不正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"不同的假设会得到不同的模型"},{"label":"B","html":"假设做得不合理,会导致模型失败或部分失败,应该修改或补充假设"},{"label":"C","html":"假设做得越详细,把复杂对象的各方面因素都考虑进去,得到的模型越好"},{"label":"D","html":"如果假设超出客观实际,常常会导致做出的数学模型没有价值"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C。对应内容为“C：假设做得越详细,把复杂对象的各方面因素都考虑进去,得到的模型越好”。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":115,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"以下哪项关于决策树的说法是错误的(   )。","answer":["A"],"dataset_description":null,"id":"p04:115","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下哪项关于决策树的说法是错误的( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>冗余属性一定会对决策树的准确率造成不利的影响\u003c/p>"},{"label":"B","html":"\u003cp>子树可能在决策树中重复多次\u003c/p>"},{"label":"C","html":"\u003cp>决策树算法对于噪声的干扰非常敏感\u003c/p>"},{"label":"D","html":"\u003cp>寻找最佳决策树是NP完全问题\u003c/p>"}],"explanation":{"topic":"决策树与节点划分","paragraphs":["决策树从根节点开始按特征条件逐层分支，内部节点作判断，叶节点给出类别或预测值。叶节点没有进一步分支，因此不是“仍可充当中间节点”的同一角色。","ID3 常用信息增益，C4.5 用信息增益率，CART 分类常用基尼指数、回归常用平方误差。不能把各算法的划分标准互换。","划分追求降低加权平均不纯度，不能保证每一个子节点的熵都严格小于父节点。深树易过拟合，可用深度限制、最小样本量或剪枝控制。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：冗余属性一定会对决策树的准确率造成不利的影响”。"],"tip":"ID3 增益，C4.5 增益率，CART 分类基尼；叶节点不再分。","source":""},"attachments":[]},{"number":116,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于方差分析的说法，不正确的是(   )。","answer":["A"],"dataset_description":null,"id":"p04:116","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于方差分析的说法，不正确的是( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"方差分析是一种检验若干个正态分布的均值和方差是否相等的一种统计方法"},{"label":"B","html":"方差分析是一种检验若干个独立正态总体均值是否相等的一种统计方法"},{"label":"C","html":"方差分析实际上是一种F检验"},{"label":"D","html":"方差分析基于偏差平方和的分解和比较"}],"explanation":{"topic":"方差分析","paragraphs":["方差分析用组间差异相对于组内随机波动的大小检验总体均值是否相同。单因素 K 组、总样本 N 时，组间自由度 K−1，组内自由度 N−K，F=组间均方/组内均方。","原假设是各组总体均值全相等，拒绝后只能说“至少有一组均值不同”，不能说每两组都不同，需要进一步比较才能定位。组内方差小也不能单独推出组间差异小。","经典模型通常要求观测独立、组内误差近似正态、各组方差相等；因子可以一个也可以多个，所以还有双因素和多因素方差分析。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A。对应内容为“A：方差分析是一种检验若干个正态分布的均值和方差是否相等的一种统计方法”。"],"tip":"ANOVA 用方差比，检验的是均值；拒绝=不全相等。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":117,"type":"单选题","book":"《大数据分析素养》","chapter":8,"question":"图解法的求解过程不包括（  ）。","answer":["D"],"dataset_description":null,"id":"p04:117","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>图解法的求解过程不包括（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"绘制目标函数等值线"},{"label":"B","html":"移动目标函数等值线求最优解"},{"label":"C","html":"画出可行解集合"},{"label":"D","html":"计算目标函数在各可行点处的值"}],"explanation":{"topic":"线性规划与单纯形法","paragraphs":["线性规划由决策变量、线性目标和线性约束组成，可求最大值或最小值。可行域是所有约束的公共交集；无可行解、无界和存在多个最优解都是可能结果。","在适当的标准型条件下，若存在有限最优解，可在基本可行解中找到最优解；二维图解用等值线沿改进方向移动，寻找可行边界上的最优位置。","单纯形法围绕基本可行解迭代，确定初始基、入基变量、出基变量和最优性判据；并非任意顶点都是最优，也不能认为最优解必唯一。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：计算目标函数在各可行点处的值”。"],"tip":"先可行，再优化；线性规划可能无解、无界或多解。","source":""},"attachments":[]},{"number":118,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"以下不属于大数据法律关系客体的是（   ）。","answer":["D"],"dataset_description":null,"id":"p04:118","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下不属于大数据法律关系客体的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"个人信息"},{"label":"B","html":"数据"},{"label":"C","html":"\u003cp>数据安全\u003c/p>"},{"label":"D","html":"\u003cp> 预防功能\u003c/p>"}],"explanation":{"topic":"大数据、数据价值与数据挖掘","paragraphs":["大数据不仅是体量大，还常用 Volume、Velocity、Variety、Value、Veracity 描述规模、速度、多样性、价值和真实性等特征。数据可以结构化、半结构化或非结构化，价值密度低不等于总体价值低。","数据挖掘从数据中发现可用模式，常见任务有分类、回归、聚类和关联规则。“买啤酒也常买尿布”描述商品共同出现，属于关联分析，不直接证明因果。","大量数据仍可能含偏差、噪声和遗漏，需要质量控制、清洗和场景解释；大数据分析不只服务互联网，也可用于医疗、工业、交通等领域。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：预防功能”。"],"tip":"体量大不等于质量高；关联规则看共现，不推因果。","source":""},"attachments":[]},{"number":119,"type":"单选题","book":"《大数据分析素养》","chapter":9,"question":"以下属于行政法规的是（   ）。","answer":["D"],"dataset_description":null,"id":"p04:119","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下属于行政法规的是（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"《贵州省大数据发展应用促进条例》"},{"label":"B","html":"《天津市促进大数据发展应用条例》"},{"label":"C","html":"《海南省大数据开发应用条例》"},{"label":"D","html":"《关键信息基础设施安全保护条例》"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 D。对应内容为“D：《关键信息基础设施安全保护条例》”。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":120,"type":"单选题","book":"《大数据分析素养》","chapter":10,"question":"与一般社会道德相比较，以下哪项不属于职业道德伦理（  ）。","answer":["D"],"dataset_description":null,"id":"p04:120","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>与一般社会道德相比较，以下哪项不属于职业道德伦理（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"职业道德伦理是在历史上形成的、特定的职业环境中产生和发展起来的，它常常形成世代相袭的职业传统和比较稳定的职业心理和习惯，因此具有较强的稳定性和连续性"},{"label":"B","html":"职业道德伦理反映着特定的职业关系，具有特定职业的业务特征，只对从事特定职业的人们具有约束力"},{"label":"C","html":"职业道德伦理通常以规章制度、工作守则、服务公约、劳动规程、行为须知等形式表现出来"},{"label":"D","html":"职业道德伦理依靠国家强制力保证实施"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 D。对应内容为“D：职业道德伦理依靠国家强制力保证实施”。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":121,"type":"多选题","book":"《大数据分析素养》","chapter":1,"question":"企业数据孤岛产生的原因较为复杂，下列观点中，正确的有(   )。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p04:121","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>企业数据孤岛产生的原因较为复杂，下列观点中，正确的有( &nbsp; )。\u003c/span>\u003c/p>","options":[{"label":"A","html":"以功能为标准的部门划分导致数据孤岛。"},{"label":"B","html":"不同类型,不同版本的信息化管理系统导致数据孤岛。"},{"label":"C","html":"机构设置不合理。"},{"label":"D","html":"各个部门职责权利不清晰。"},{"label":"E","html":"缺少正态信息技术规划。"}],"explanation":{"topic":"企业内外部数据与调查资料","paragraphs":["企业内部数据来自日常经营管理，如销售、财务、人事、物流和客户交易；外部数据来自政府、行业协会、竞争者、公开媒体或外部市场研究。结构化或非结构化都可能出现在任一来源。","内部利益相关者通常包含员工、管理层、股东等，消费者、供应商和监管者通常属于外部利益相关者。具体归类应结合关系而不是数据是否放在公司电脑。","一手资料为围绕本次问题直接收集的数据，二手资料是已有资料的再利用。观察法记录实际行为但不一定揭示动机，调查需注意目的、对象、偏差及合法合规。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：以功能为标准的部门划分导致数据孤岛。；B：不同类型,不同版本的信息化管理系统导致数据孤岛。；C：机构设置不合理。；D：各个部门职责权利不清晰。；E：缺少正态信息技术规划。”。多选题应检查所有选项，不能只选其中一项。"],"tip":"内部看业务产生地；一手看是否为本次调查直接获取。","source":""},"attachments":[]},{"number":122,"type":"多选题","book":"《大数据分析素养》","chapter":2,"question":"作为一名数据分析师，应该根据具体业务选择合适的指标衡量业务。无论何种业务，我们都可以使用下述哪些数据来设计业务指标（   ）？","answer":["A","B","C"],"dataset_description":null,"id":"p04:122","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>作为一名数据分析师，应该根据具体业务选择合适的指标衡量业务。无论何种业务，我们都可以使用下述哪些数据来设计业务指标（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"用户数据"},{"label":"B","html":"行为数据"},{"label":"C","html":"产品数据"},{"label":"D","html":"行业销售数据"},{"label":"E","html":"财务数据"}],"explanation":{"topic":"本题解析","paragraphs":["题库采用用户、行为、产品三维框架：用户回答谁，行为回答做什么，产品回答与什么对象互动，因此选 A、B、C。"],"warning":"“无论何种业务”表述过强；此处只说明题库采用的三维框架，不排斥财务和行业数据的重要性。","optionAnalysis":[{"label":"A","selected":true,"reason":"用户维度说明业务涉及谁，是题库三维框架之一。"},{"label":"B","selected":true,"reason":"行为维度说明用户做了什么，是题库三维框架之一。"},{"label":"C","selected":true,"reason":"产品维度说明行为作用的业务对象，是题库三维框架之一。"},{"label":"D","selected":false,"reason":"行业销售可用于分析，但不属于本题指定的用户、行为、产品三维。"},{"label":"E","selected":false,"reason":"财务数据有实际用途，但不属于本题指定的三维框架；不选不代表不能用于指标。"}]},"attachments":[]},{"number":123,"type":"多选题","book":"《大数据分析素养》","chapter":3,"question":"利用数据清洗方法对文本数据进行处理,这不属于（   ）方面的应用。","answer":["A","C","D","E"],"dataset_description":null,"id":"p04:123","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>利用数据清洗方法对文本数据进行处理,这不属于（ &nbsp; ）方面的应用。\u003c/span>\u003c/p>","options":[{"label":"A","html":"科学计算"},{"label":"B","html":"数据处理"},{"label":"C","html":"生产控制"},{"label":"D","html":"模式识别"},{"label":"E","html":"图形识别"}],"explanation":{"topic":"数据清洗与预处理","paragraphs":["数据清洗处理缺失、重复、异常和不一致，常见方法包括删除、填补、纠正和统一格式。选择方法要看缺失机制、比例和业务意义，不能一律删除或一律填均值。","修剪通常删除极端部分，缩尾将极端值替换为边界值；对数转换改变尺度，不能与修剪等同。异常点也可能是真实重要信号，需先核实。","处理流程还包括集成、转换、筛选、排序、编码和存储。分词、主题分析、情感分析属于文本处理。迭代是基于结果持续检查和改进，不只是机械指定执行次数。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、C、D、E。对应内容为“A：科学计算；C：生产控制；D：模式识别；E：图形识别”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先核实再清洗；删除、填补、变换各有条件。","source":""},"attachments":[]},{"number":124,"type":"多选题","book":"《大数据分析素养》","chapter":4,"question":"以定比尺度计量的统计数据可以进行下列哪些运算（   ）？","answer":["A","B","D"],"dataset_description":null,"id":"p04:124","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以定比尺度计量的统计数据可以进行下列哪些运算（ &nbsp; ）？\u003c/span>\u003c/p>","options":[{"label":"A","html":"加"},{"label":"B","html":"减"},{"label":"C","html":"并"},{"label":"D","html":"除"},{"label":"E","html":"交"}],"explanation":{"topic":"测量尺度与变量类型","paragraphs":["定类只分组，无天然顺序，如职业、血型；定序可排序，但等级间差距不能当成等距，如满意度和产品等级。给类别编数字不会自动把它变成可做算术的定量数据。","定距有相等单位间隔，但零点人为，如摄氏温度和日历年份，可解释差值，不能说20℃是10℃的两倍热。定比还具有绝对零点，如长度、重量、收入，可比较倍数。","测量层次从低到高为定类→定序→定距→定比。高层次可降级处理，反过来不行；定量变量还分离散型与连续型。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D。对应内容为“A：加；B：减；D：除”。多选题应检查所有选项，不能只选其中一项。"],"tip":"类只分、序能排、距可减、比可乘除。","source":""},"attachments":[]},{"number":125,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于抽样误差的说法正确的是（ ）。","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p04:125","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于抽样误差的说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>抽样误差是衡量样本代表性大小的标准\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样误差主要取决于总体的异质性程度和样本规模\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>同样本容量的前提下，总体异质性程度越高，抽样误差越大\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>同样本容量的前提下，总体异质性程度越低，抽样误差越小\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>如果总体异质性程度相同，样本规模越小，抽样误差越大\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：抽样误差是衡量样本代表性大小的标准；B：抽样误差主要取决于总体的异质性程度和样本规模；C：同样本容量的前提下，总体异质性程度越高，抽样误差越大；D：同样本容量的前提下，总体异质性程度越低，抽样误差越小；E：如果总体异质性程度相同，样本规模越小，抽样误差越大”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":126,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下面关于统计总体大量性特性的说法，错误的是（  ）。","answer":["A","C","D"],"dataset_description":null,"id":"p04:126","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下面关于统计总体大量性特性的说法，错误的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>一些单位组成\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>许多单位组成\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>个别事物也能构成总体\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>要求具有绝对单位数量\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>相对单位数量\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、C、D。对应内容为“A：一些单位组成；C：个别事物也能构成总体；D：要求具有绝对单位数量”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":127,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"对于t分布，以下正确的是（ ）。","answer":["C","D"],"dataset_description":null,"id":"p04:127","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>对于t分布，以下正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>t分布是一条曲线\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>t分布以1为中心,左右对称\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>t分布是单峰分布\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>自由度等于无穷大时，t分布就是标准正态分\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>自由度同时,t的绝对值越大，\u003c/span>\u003cspan>尾端概率\u003c/span>\u003cspan>P越大\u003c/span>\u003c/p>"}],"explanation":{"topic":"t 分布与 t 检验","paragraphs":["若总体正态且总体方差未知，用样本标准差 s 代替 σ 后，T=(X̄−μ)/(s/√n) 服从自由度 n−1 的 t 分布。不能因为用了样本方差就仍按已知方差的 Z 检验处理。","t 分布以0为中心、左右对称，尾部比标准正态更厚；自由度越大越接近标准正态。均值在自由度>1时为0，方差在自由度>2时为 ν/(ν−2)，并非所有自由度下均值和方差都存在。","双样本 t 检验用于均值比较；独立、配对、等方差与不等方差情形的公式和自由度不同。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 C、D。对应内容为“C：t分布是单峰分布；D：自由度等于无穷大时，t分布就是标准正态分”。多选题应检查所有选项，不能只选其中一项。"],"tip":"未知方差估均值，先想 t；自由度增大，厚尾变薄。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":128,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"关于整群抽样，下列说法错误的是（ ）。","answer":["C","D","E"],"dataset_description":null,"id":"p04:128","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>关于整群抽样，下列说法错误的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>便于组织，节省经费\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>容易控制抽样质量\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样误差小于分层抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>群间差异越大，精度越高\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>群内差异越小，精度越高\u003c/span>\u003c/p>"}],"explanation":{"topic":"整群抽样","paragraphs":["把总体分成互不重叠、互不遗漏的群，以群为抽样单位随机抽取部分群，再调查抽中群内全部个体。学校、街区、工厂等自然集合经常被作为群。","优点是便于集中调查、减少交通和组织成本；群内单位相似度高时，有效信息可能少于同规模的简单随机样本，因此精度并非它的必然优势。","若群大小悬殊，可考虑与规模成比例的抽取及相应权重，不能忽略群规模导致的入样概率差异。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 C、D、E。对应内容为“C：抽样误差小于分层抽样；D：群间差异越大，精度越高；E：群内差异越小，精度越高”。多选题应检查所有选项，不能只选其中一项。"],"tip":"整群省组织成本，但不保证误差最小。","source":""},"attachments":[]},{"number":129,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于任意抽样缺点的是（  ）。","answer":["A","B","D","E"],"dataset_description":null,"id":"p04:129","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下属于任意抽样缺点的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>易产生显著的偏差\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>不能直接代表总体\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>费时费力\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>推断效果差\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>抽样结果有偏差\u003c/span>\u003c/p>"}],"explanation":{"topic":"配额、判断与便利抽样","paragraphs":["便利（任意）抽样按容易接触选对象；判断抽样由研究者凭经验选对象；配额抽样先分配类别名额，再选满名额。这些方法通常没有已知的随机入样概率。","它们可省时省钱、用于探索研究，但主观偏差和选择偏差难以量化。配额结构像分层抽样，不代表每层都随机；判断“有代表性”也不能替代概率抽取。","不能直接用简单随机抽样的误差公式，宣称这些样本的误差必然很小。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、D、E。对应内容为“A：易产生显著的偏差；B：不能直接代表总体；D：推断效果差；E：抽样结果有偏差”。多选题应检查所有选项，不能只选其中一项。"],"tip":"分配名额≠层内随机；方便或经验选择属于非概率。","source":""},"attachments":[]},{"number":130,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"抽样检查一批食品，以下说法正确的是（ ）。","answer":["A","B","C"],"dataset_description":null,"id":"p04:130","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>抽样检查一批食品，以下说法正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>食品均一性越好，抽样误差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>抽样量越大，误差越小\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>抽样随机性越好，误差越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>抽样量越大，误差越大\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>食品均一性越好，抽样误差越大\u003c/span>\u003c/p>"}],"explanation":{"topic":"统计总体的特征和范围","paragraphs":["统计总体依据研究目的界定，具有同质性、大量性和差异性：单位在决定总体归属的共同属性上相同，在其他具体取值上可以不同。总体与总体单位具有相对性，研究范围变化时角色也会变化。","有限总体单位数有限且可界定；无限总体包含理论上无限多的单位。样本容量 n 是抽入的单位个数，不是均值或抽样比例。","合理样本量同时受精度、总体变异、置信水平、抽样方法、成本和研究目的影响。样本大能减少随机误差，却不能自动消除抽样框偏差和测量错误。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C。对应内容为“A：食品均一性越好，抽样误差越小；B：抽样量越大，误差越小；C：抽样随机性越好，误差越小”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先确定研究对象和范围，再区分“全部、个体、抽取的部分”。","source":""},"attachments":[]},{"number":131,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列抽样方法不属于非概率抽样的是（  ）。","answer":["A","C"],"dataset_description":null,"id":"p04:131","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列抽样方法不属于非概率抽样的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>分层抽样\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>判断抽样\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>等距抽样\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>滚雪球抽样\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>配额抽样\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题是反向选择题，要找出不符合上述条件或定义的选项。原站答案为 A、C。对应内容为“A：分层抽样；C：等距抽样”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":132,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下关于简单随机抽样的说法，正确的是（  ）。","answer":["A","C"],"dataset_description":null,"id":"p04:132","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下关于简单随机抽样的说法，正确的是（ &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>事先要对样本编号，工作量大\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>总体分布越分散时，抽样分析越精确\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>当样本容量较小时，影响样本的代表性\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>每个样本被抽中的\u003c/span>概率\u003cspan>不相等\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>样本容量大导致抽样的偏向性\u003c/span>\u003c/p>"}],"explanation":{"topic":"简单随机抽样","paragraphs":["简单随机抽样依随机机制抽取，在固定样本量的不放回设计中，每个可能样本有相同的被抽中机会。抽签、随机数表或随机数发生器是常见实现方式，编号只需唯一，不必机械限定为从1开始。","概率抽样还包括系统、分层、整群、多阶段等方法；判断、便利、配额和滚雪球通常属于非概率抽样，不能只因“看起来有代表性”就称为随机抽样。","设计需服务于研究目的、可操作、兼顾成本，并能评价精度。样本大并不保证某一次样本毫无偏离，也不意味着调查无需完整抽样框。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C。对应内容为“A：事先要对样本编号，工作量大；C：当样本容量较小时，影响样本的代表性”。多选题应检查所有选项，不能只选其中一项。"],"tip":"随机性来自抽取机制，不来自研究者的主观判断。","source":""},"attachments":[]},{"number":133,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"下列关于极限误差、平均误差,和概率度之间的关系陈述正确的有（ ）。","answer":["B","D","E"],"dataset_description":null,"id":"p04:133","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于极限误差、平均误差,和概率度之间的关系陈述正确的有（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>概率度一定时，平均误差越大，则极限误差越小\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>概率度一定时，平均误差越大，则极限误差越大\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>平均误差一定时，概率度越大，则极限误差越小\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>平均误差一定时，概率度越大，则极限误差越大\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>极限误差一定时，平均误差越大，则概率度越小\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样极限误差与概率度","paragraphs":["常见教材记号为 Δ=z×SE：Δ 是给定置信水平下的抽样误差界限，SE 是抽样标准误，z 是相应的概率度或临界值。三者不是互相独立的量。","固定标准误时，要求更高置信水平需要更大的 z 和更宽的误差界限；固定误差界限而提高置信水平，则要降低标准误，通常需要增大样本量。","这里的“最大误差”是对应概率保证程度的界限，并非随机抽样所有可能结果都绝对不会越界。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、D、E。对应内容为“B：概率度一定时，平均误差越大，则极限误差越大；D：平均误差一定时，概率度越大，则极限误差越大；E：极限误差一定时，平均误差越大，则概率度越小”。多选题应检查所有选项，不能只选其中一项。"],"tip":"误差界限=临界值×标准误。","source":"https://www.itl.nist.gov/div898/handbook/"},"attachments":[]},{"number":134,"type":"多选题","book":"《大数据分析素养》","chapter":5,"question":"以下属于偏倚类型的是哪些？","answer":["A","B","C","D","E"],"dataset_description":null,"id":"p04:134","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>以下属于偏倚类型的是哪些？\u003c/p>","options":[{"label":"A","html":"\u003cp>\u003cspan>选择性偏倚\u003c/span>\u003c/p>"},{"label":"B","html":"\u003cp>\u003cspan>无应答偏倚\u003c/span>\u003c/p>"},{"label":"C","html":"\u003cp>\u003cspan>测量偏倚\u003c/span>\u003c/p>"},{"label":"D","html":"\u003cp>\u003cspan>回忆偏倚\u003c/span>\u003c/p>"},{"label":"E","html":"\u003cp>\u003cspan>检查者偏倚\u003c/span>\u003c/p>"}],"explanation":{"topic":"抽样误差、非抽样误差与偏倚","paragraphs":["抽样误差来自只调查总体的一部分，即使严格随机也会因抽样波动产生。样本量增大、总体变异减小、设计更合适，通常能降低随机误差，但不能保证一次估计恰好等于真值。","登记、测量、录入、计算、漏报、无回答及抽样框遗漏等属于非抽样误差；它们在普查中也可能出现。系统偏差具有方向性，不能靠单纯增加样本量抵消。","总体真值通常未知，所以本次估计与真值之间的实际误差通常也未知；实践中用标准误和误差界限评价，而非声称实际误差总能直接算出。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D、E。对应内容为“A：选择性偏倚；B：无应答偏倚；C：测量偏倚；D：回忆偏倚；E：检查者偏倚”。多选题应检查所有选项，不能只选其中一项。"],"tip":"抽样误差靠设计和样本量控制；偏差要改调查过程。","source":""},"attachments":[]},{"number":135,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"总体X服从正态分布N(μ，σ2)，其中σ2已知，则下列关于总体均值μ区间估计的陈述不正确的是(  )。","answer":["B","D","E"],"dataset_description":null,"id":"p04:135","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>总体X服从正态分布N(μ，σ2)，其中σ2已知，则下列关于总体均值μ区间估计的陈述不正确的是( &nbsp;)。\u003c/span>\u003c/p>","options":[{"label":"A","html":"\u003cp>当置信水平减小时，估计的精确度提高\u003c/p>"},{"label":"B","html":"\u003cp>当置信水平减小时，估计的精确度降低\u003c/p>"},{"label":"C","html":"\u003cp>当置信水平增加时，估计的精确度降低\u003c/p>"},{"label":"D","html":"\u003cp>当置信水平增加时，估计的精确度提高\u003c/p>"},{"label":"E","html":"\u003cp>无论置信水平如何变化，估计的精确度不变\u003c/p>"}],"explanation":{"topic":"业务题分析与易混点","paragraphs":["总体方差与样本量固定时，置信水平提高使临界值变大，区间变宽、精确度降低；置信水平降低则相反。","因此 A、C 正确，B、D、E 错误，应选 B、D、E。这里“精确度高”指区间更窄，不是置信程度更高。"],"warning":""},"attachments":[]},{"number":136,"type":"多选题","book":"《大数据分析素养》","chapter":6,"question":"以下关于归纳推理的说法，正确的有（   ）。","answer":["A","C","D","E"],"dataset_description":null,"id":"p04:136","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下关于归纳推理的说法，正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"归纳推理是从个别到一般的推论"},{"label":"B","html":"归纳推理主张,如果前提为真并且是有效的,结论就为真且有效"},{"label":"C","html":"归纳推理要求被考察对象的数量要尽可能地多,范围要尽可能的广"},{"label":"D","html":"归纳推理的结论是或然性,其可靠性程度完全依赖于推论人所列举的事例的数量及其分布范围"},{"label":"E","html":"归纳推理是从特殊性到一般的认识过程"}],"explanation":{"topic":"归纳推理与演绎推理","paragraphs":["归纳由若干具体观察推向一般结论，例如用样本推测总体。由于只观察了部分对象，结论通常具有或然性，样本代表性和证据质量十分重要。","演绎由一般前提推到具体结论；前提真实且逻辑形式有效时，结论具有逻辑必然性。假说演绎通常先提出假说，推出可检验预测，再与观察比较，而不是把未经检验的推测当成事实。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、C、D、E。对应内容为“A：归纳推理是从个别到一般的推论；C：归纳推理要求被考察对象的数量要尽可能地多,范围要尽可能的广；D：归纳推理的结论是或然性,其可靠性程度完全依赖于推论人所列举的事例的数量及其分布范围；E：归纳推理是从特殊性到一般的认识过程”。多选题应检查所有选项，不能只选其中一项。"],"tip":"归纳：特殊→一般，可能；演绎：一般→特殊，依赖有效前提。","source":""},"attachments":[]},{"number":137,"type":"多选题","book":"《大数据分析素养》","chapter":7,"question":"云计算是基于互联网的相关服务的增加、使用、和交付模式，其特点有（    ）。","answer":["A","B","C","E"],"dataset_description":null,"id":"p04:137","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>云计算是基于互联网的相关服务的增加、使用、和交付模式，其特点有（ &nbsp; &nbsp;）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"成本低"},{"label":"B","html":"虚拟化"},{"label":"C","html":"易扩展"},{"label":"D","html":"实体化"},{"label":"E","html":"使用成本低"}],"explanation":{"topic":"云计算的模式与特点","paragraphs":["云计算通过网络按需提供可配置的计算、存储、网络和软件资源，强调资源池化、弹性扩缩、广泛网络访问和可计量服务。虚拟化是常见实现技术，但不等同于云计算全部内容。","IaaS 提供计算与存储等基础设施，PaaS 提供应用开发运行平台，SaaS 提供可直接使用的软件。公有云面向广泛客户，私有云为特定组织专用，混合云连接不同云环境。","高可用与冗余能降低风险，却不能保证“完全没有故障或安全风险”；按需和弹性也不代表资源无限、费用永远固定。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、E。对应内容为“A：成本低；B：虚拟化；C：易扩展；E：使用成本低”。多选题应检查所有选项，不能只选其中一项。"],"tip":"I 基础设施，P 平台，S 软件；高可靠≠零风险。","source":"https://csrc.nist.gov/pubs/sp/800/145/final"},"attachments":[]},{"number":138,"type":"多选题","book":"《大数据分析素养》","chapter":8,"question":"下列关于共轭梯度法的叙述，正确的是（ ）。","answer":["B","D","E"],"dataset_description":null,"id":"p04:138","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>下列关于共轭梯度法的叙述，正确的是（ ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"共轭梯度法具有二次收敛性"},{"label":"B","html":"共轭梯度法的第一个搜索方向应取为负梯度方向"},{"label":"C","html":"共轭梯度法需要计算二海斯矩阵"},{"label":"D","html":"共轭梯度法的收敛速度比最速下降法快"},{"label":"E","html":"除第一步以外的其余各步的搜索方向是将负梯度偏转一个角度"}],"explanation":{"topic":"非线性优化与梯度方法","paragraphs":["优化模型用变量、目标和约束表达问题。无约束可微最小化的梯度下降沿负梯度更新 xₖ₊₁=xₖ−αₖ∇f(xₖ)，步长影响收敛；正梯度通常是局部增大最快方向。","牛顿法利用二阶导数或 Hessian 构造方向，不能把一阶梯度方向与牛顿方向混同。共轭梯度利用共轭方向，在正定二次函数的精确运算下有有限步性质，一般非线性情形不能照搬保证。","一维搜索在给定方向上选步长；约束问题可用拉格朗日或 KKT 条件。一般非凸问题的局部最优不保证全局最优，建模假设需服务实际、接受验证。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 B、D、E。对应内容为“B：共轭梯度法的第一个搜索方向应取为负梯度方向；D：共轭梯度法的收敛速度比最速下降法快；E：除第一步以外的其余各步的搜索方向是将负梯度偏转一个角度”。多选题应检查所有选项，不能只选其中一项。"],"tip":"最小化走负梯度；局部最优不自动等于全局最优。","source":""},"attachments":[]},{"number":139,"type":"多选题","book":"《大数据分析素养》","chapter":9,"question":"数据法律关系中的客体有（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p04:139","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>数据法律关系中的客体有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"物"},{"label":"B","html":"人格利益"},{"label":"C","html":"行为"},{"label":"D","html":"智力成果"},{"label":"E","html":"思想"}],"explanation":{"topic":"法律层级、关系与责任","paragraphs":["宪法是根本法，具有最高法律效力；全国人大及其常委会制定法律，国务院制定行政法规。法律、行政法规、部门规章与司法解释的制定主体、作用和层级不能混同。","法律关系通常包含主体、客体和内容，内容体现权利义务；法律事实可以引起法律关系发生、变更和消灭。法的规范作用常概括为指引、评价、预测、教育和强制。","法律责任须结合违法行为、损害、因果关系及依法要求的过错等要件，具体责任可能有特殊规则。民事责任常见停止侵害、返还财产、赔偿损失等，刑事责任是严厉的制裁形式。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：物；B：人格利益；C：行为；D：智力成果”。多选题应检查所有选项，不能只选其中一项。"],"tip":"先看制定主体和法律层级，再看权利义务与责任。","source":"https://flk.npc.gov.cn/"},"attachments":[]},{"number":140,"type":"多选题","book":"《大数据分析素养》","chapter":10,"question":"以下有关“数字鸿沟”的表述正确的有（   ）。","answer":["A","B","C","D"],"dataset_description":null,"id":"p04:140","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>以下有关“数字鸿沟”的表述正确的有（ &nbsp; ）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"数字鸿沟是信息时代的不公平"},{"label":"B","html":"数字鸿沟表现在信息基础设施、信息工具以及信息的获取使用过程中"},{"label":"C","html":"数字鸿沟中，先进的技术成果不能为人们公正的分享"},{"label":"D","html":"数字鸿沟使得信息富有者与信息贫困者之间产生的巨大差距"},{"label":"E","html":"数字鸿沟难以克服，不能降低存在范围"}],"explanation":{"topic":"数字鸿沟、算法风险与伦理","paragraphs":["算法风险可能来自带偏差的训练数据、模型不透明、技术漏洞、隐私侵害和责任难以分配。训练数据带入歧视属于数据或算法偏见，黑箱强调人难以理解模型如何作出决定。","可解释性旨在帮助理解、审查、问责和纠错，不代表公开所有商业秘密；风险治理还需数据质量、安全测试、人工监督与申诉机制，不能只靠技术精度。","数字鸿沟是不同群体在接入、技能、使用和受益方面的差距；数据垄断可能阻碍公平竞争和开放共享。职业伦理强调专业责任、诚信、公正及保护相关者利益。","本题需按上述定义、适用条件和计算口径逐项判断。原站答案为 A、B、C、D。对应内容为“A：数字鸿沟是信息时代的不公平；B：数字鸿沟表现在信息基础设施、信息工具以及信息的获取使用过程中；C：数字鸿沟中，先进的技术成果不能为人们公正的分享；D：数字鸿沟使得信息富有者与信息贫困者之间产生的巨大差距”。多选题应检查所有选项，不能只选其中一项。"],"tip":"偏见看数据和结果，黑箱看解释，伦理看人的权利与责任。","source":""},"attachments":[]},{"number":141,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":1,"question":"文件“data04.xlsx”中的“Sheet1”中选中全部的“日期”（只要有效行数，除去列名）的区域表示法为（）。","answer":["D"],"dataset_description":"Excel表格文件“data04.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p04:141","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>文件“data04.xlsx”中的“Sheet1”中选中全部的“日期”（只要有效行数，除去列名）的区域表示法为（）。\u003c/p>","options":[{"label":"A","html":"A1:A520"},{"label":"B","html":"A1#A520"},{"label":"C","html":"A2:520"},{"label":"D","html":"A2:A520"}],"explanation":{"topic":"排除表头选择有效日期区域","paragraphs":["日期位于 A 列，第1行为表头，有效日期从第2行至第520行，因此完整区域为 A2:A520，选 D。","冒号连接两个合法的单元格地址；A1:A520 包含表头，A2:520 缺少第二端点的列字母，# 不是区域连接符。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data04.xlsx","href":"../materials/p04/data04.xlsx"}]},{"number":142,"type":"多选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":2,"question":"将网页数据爬取到Excel文件\"data04.xlsx\"后，可以将其保存为（）类型？（多选）","answer":["A","B","C","D"],"dataset_description":"Excel表格文件“data04.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p04:142","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>将网页数据爬取到Excel文件&quot;data04.xlsx&quot;后，可以将其保存为（）类型？（多选）\u003c/p>","options":[{"label":"A","html":"CSV"},{"label":"B","html":"XLSX"},{"label":"C","html":"XLS"},{"label":"D","html":"TXT"}],"explanation":{"topic":"将表格保存为不同格式","paragraphs":["CSV、XLSX、XLS、TXT 都能保存表格数据，因此四项全选。使用“另存为”，在文件类型中选择相应格式。","XLSX/XLS 可保留较多工作簿结构；CSV/TXT 是文本格式，通常只保存当前工作表的数据，不能完整保留图表、多工作表和格式。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data04.xlsx","href":"../materials/p04/data04.xlsx"}]},{"number":143,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":3,"question":"查找文件“data04.xlsx”中的“Sheet1”中“气象站气压（毫米汞柱）”的异常值（大于800的值）删除，视为缺失值后用下一个单元格数据进行修正，（如未有异常值则不用操作），所有操作进行后的数据平均值和求和分别为（）。","answer":["D"],"dataset_description":"Excel表格文件“data04.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p04:143","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>查找文件“data04.xlsx”中的“Sheet1”中“气象站气压（毫米汞柱）”的异常值（大于800的值）删除，视为缺失值后用下一个单元格数据进行修正，\u003c/span>\u003cspan>（如未有异常值则不用操作），\u003c/span>\u003cspan>所有操作进行后的数据平均值和求和分别为（）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"平均值：745.72，计数：520，求和：402218.6"},{"label":"B","html":"平均值：755.72，计数：520，求和：402218.6"},{"label":"C","html":"平均值：745.72，计数：520，求和：392218.6"},{"label":"D","html":"平均值：755.72，计数：520，求和：392218.6"}],"explanation":{"topic":"按阈值清洗气压","paragraphs":["气压在 C 列，先检查 =COUNTIF(C2:C520,\">800\")，素材没有超过800的值，所以无须修正。519个数值求和392218.6，均值约755.7198459，保留两位755.72，选 D。","平均值使用数值行 C2:C520，不应包含表头作为分母。"],"tip":"","warning":"选项“计数520”包含表头；实际数值记录为519条。","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data04.xlsx","href":"../materials/p04/data04.xlsx"}]},{"number":144,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":4,"question":"在文件\"data04.xlsx\"的工作表\"Sheet1\"中，在单元格H2中输入公式=B2+C2，则复制该公式到单元格H4后，H4中公式的相对引用情况是：","answer":["B"],"dataset_description":"Excel表格文件“data04.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p04:144","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>在文件&quot;data04.xlsx&quot;的工作表&quot;Sheet1&quot;中，在单元格H2中输入公式=B2+C2，则复制该公式到单元格H4后，H4中公式的相对引用情况是：\u003c/p>","options":[{"label":"A","html":"B2+C2"},{"label":"B","html":"B4+C4"},{"label":"C","html":"B4+C3"},{"label":"D","html":"B3+C4"}],"explanation":{"topic":"相对引用复制公式","paragraphs":["H2 的公式 =B2+C2 中，B2、C2 都没有 $，是相对引用。向下复制两行到 H4，两个行号各加2，列号不变，所以变为 =B4+C4，选 B。","若写成 $B$2+$C$2，才会在复制时固定原地址。"],"tip":"","warning":"","source":"https://support.microsoft.com/en-us/excel/excel-functions-alphabetical"},"attachments":[{"name":"data04.xlsx","href":"../materials/p04/data04.xlsx"}]},{"number":145,"type":"单选题","book":"《大数据分析实务初级教程（Ecxel篇）》","chapter":5,"question":"文件“data04.xlsx”中的“Sheet1” 将日期按照“年-月-日”和“HH:MM:SS”分开，分别在F和G列中操作，列名分别为“年月日”和“时间”，使用TEXT函数进行分离，数据格式分别为“yyyy-mm-dd”和“hh:mm:ss”。在新的工作表中创建数据透视图，轴(类别)选择“年月日”，值（平均值项）选择“大气温度（摄氏度）”，值（平均值项）选择“气象站气压（毫米汞柱）”，值（平均值项）选择“相对湿度（%）”，大气温度最高的一天的“气象站气压（毫米汞柱）”和“相对湿度（%）”分别为（）。","answer":["A"],"dataset_description":"Excel表格文件“data04.xlsx”收集了一个地区的2月份信息情况。工作表Sheet1包含5个特征数据：日期、大气温度（摄氏度）、气象站气压（毫米汞柱）、相对湿度（%）、classify。请根据该表格分析并解决以下问题。请点击下载素材。\nPS：以下每道题均是在原始数据基础上进行的，题干所涉及到的数据修改操作不继承到其他题中，每操作完一题需要复原数据集。只保留小数点后两位，采取四舍五入。","id":"p04:145","paperId":"p04","paperTitle":"Excel 模拟卷 04","question_html":"\u003cp>\u003cspan>文件“data04.xlsx”中的“Sheet1” 将日期按照“年-月-日”和“HH:MM:SS”分开，分别在F和G列中操作，列名分别为“年月日”和“时间”，使用TEXT函数进行分离，数据格式分别为“yyyy-mm-dd”和“hh:mm:ss”。在新的工作表中创建数据透视图，轴(类别)选择“年月日”，值（平均值项）选择“大气温度（摄氏度）”，值（平均值项）选择“气象站气压（毫米汞柱）”，值（平均值项）选择“相对湿度（%）”，大气温度最高的一天的“气象站气压（毫米汞柱）”和“相对湿度（%）”分别为（）。\u003c/span>\u003c/p>","options":[{"label":"A","html":"气象站气压：752.52，相对湿度：53.67"},{"label":"B","html":"气象站气压：758.46，相对湿度：55.57"},{"label":"C","html":"气象站气压：758   const PREFIX='excel-practice:v1:';
  function same(a,b){return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&[...a].sort().join('|')===[...b].sort().join('|');}
  function grade(questions,answers){
    const details=questions.map(q=>{const selected=Array.isArray(answers[q.id])?answers[q.id]:[];return {id:q.id,selected,correct:same(selected,q.answer),blank:selected.length===0};});
    const correct=details.filter(x=>x.correct).length,blank=details.filter(x=>x.blank).length;
    return {total:details.length,correct,blank,incorrect:details.length-correct-blank,score:details.length?Math.round(correct/details.length*10000)/100:0,details,wrongIds:details.filter(x=>!x.correct).map(x=>x.id)};
  }
  function updateWrongs(existing,questions,answers,now){
    const result=JSON.parse(JSON.stringify(existing||{}));

      else result[d.id]={id:d.id,wrongCount:(old?.wrongCount||0)+1,firstWrong:old?.firstWrong||now,lastWrong:now,lastReviewed:now,reviews:(old?.reviews||0)+1,masteredAt:null,lastSelection:d.selected};

  }

ton>${active.length?`<button class="btn" data-action="begin-wrongs">本卷错题 · ${active.length}</button>`:''}</div></div>`}<div class="panel"><h2>本次计分规则</h2><p class="muted">每题等权，答对题数 ÷ 本次题数 × 100。多选题全部选对才得分，未答计 0 分。成绩为练习分，不采用原网站未核实的考试题型权重。</p></div><a href="${isWrong?'index.html':'../index.html'}">← 返回全部试卷</a></main></div>`;

if(!ids.length){toast('当前没有待复习错题');return;}
const old=safeState(read('session:'+scope,null));
if(old&&!old.submitted&&!confirmed){showDialog('开始新的练习？','<p>这会替换当前未交卷的作答进度。已保存的错题与历史成绩会继续保留。</p>','<button class="btn" data-action="close-dialog">保留当前进度</button><button class="btn primary" data-action="confirm-new">开始新练习</button>');pending={ids,kind};return;}

}

r)?'回答正确':selected.length?'回答错误':'未作答'}</b></p><p>你的答案：${selected.length?selected.join('、'):'未答'}<br>${q.explanation?.warning?'原站答案（请看核对提示）':'正确答案'}：${q.answer.join('、')}</p><small>答案来源：网站官方答案标记</small></div>${explanation(q)}`:''}</main></div><nav class="nav-bottom"><button class="btn" data-action="previous" ${state.index===0?'disabled':''}>上一题</button><button class="btn quiet" data-action="grid">答题卡</button><button class="btn primary" data-action="next" ${show&&state.index===ids.length-1?'disabled':''}>${!show&&state.index===ids.length-1?'检查交卷':'下一题'}</button></nav>`;

function result(){const g=C.grade(current,state.answers);root.innerHTML=`<div class="shell">${topbar()}<main class="result"><div class="eyebrow">本次练习已完成</div><h1>${D.page==='wrongs'?'错题重刷成绩':esc(paper().title)}</h1><div class="score">${g.score}<small> 分</small></div><div class="result-rule">练习百分制 · 答对 ${g.correct} / ${g.total} 题 · 用时 ${time(state.elapsedMs)}</div>${notice()}<div class="stats"><div><strong>${g.correct}</strong><span>答对</span></div><div><strong>${g.incorrect}</strong><span>答错</span></div><div><strong>${g.blank}</strong><span>未答</span></div></div><div class="actions"><button class="btn primary" data-action="review-all">查看答案与解析</button>${g.wrongIds.length?'<button class="btn" data-action="review-wrong">查看本次错题</button><button class="btn" data-action="retry">重刷本次错题</button>':''}<button class="btn" data-action="intro">${D.page==='wrongs'?'返回错题本':'返回试卷入口'}</button></div><div class="saved-note">${g.wrongIds.length?`本次 ${g.wrongIds.length} 道错题／未答题已保存至错题本。`:'本次全部答对。之前收录的题已标为“已掌握”，历史仍保留。'}${storageFailed?' 当前浏览器不允许储存，请先解决上方提示。':' 下次打开同一浏览器即可继续复习。'}</div><p class="result-rule" style="margin-top:20px">计分规则：答对题数 ÷ 本次题数 × 100；多选题全部选对才得分。此分数为练习成绩，不是原网站正式考试评分。</p></main></div>`;}

function startStudy(ids){if(!ids.length){toast('暂无可背的题目');return;}studying=true;studyIds=ids;const saved=read('study:'+scope,null);studyIndex=saved&&ids.includes(saved.id)?ids.indexOf(saved.id):0;studyReveal=true;renderStudy();window.scrollTo(0,0);}

function exportProgress(){const backup={format:'excel-practice-backup',version:1,createdAt:Date.now(),entries:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(P))backup.entries[k.slice(P.length)]=JSON.parse(localStorage.getItem(k));}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Excel刷题进度与错题备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已导出，可保存到手机文件');}
async function importProgress(file){try{if(!file||file.size>10000000)throw Error('备份文件过大或未选择');const b=JSON.parse(await file.text());if(b.format!=='excel-practice-backup'||b.version!==1||!b.entries||typeof b.entries!=='object')throw Error('这不是本程序的备份文件');const checked={};for(const [k,v] of Object.entries(b.entries)){if(k==='wrongs'){if(!v||Array.isArray(v)||typeof v!=='object')throw Error('错题数据格式不正确');checked[k]={};for(const [id,w] of Object.entries(v)){if(!all[id]||w?.id!==id||!Number.isFinite(w.wrongCount)||w.wrongCount<1)throw Error('备份包含未知题目');checked[k][id]={id,wrongCount:w.wrongCount,firstWrong:Number(w.firstWrong)||Date.now(),lastWrong:Number(w.lastWrong)||Date.now(),lastReviewed:Number(w.lastReviewed)||Date.now(),reviews:Number(w.reviews)||0,masteredAt:w.masteredAt?Number(w.masteredAt):null,lastSelection:Array.isArray(w.lastSelection)?w.lastSelection.filter(x=>all[id].options.some(o=>o.label===x)):[]};}}else if(k.startsWith('study:')&&(papers.some(p=>k==='study:'+p.id)||k==='study:all-wrongs')){if(!v||!all[v.id])throw Error('背题进度格式不正确');checked[k]={id:v.id,at:Number(v.at)||Date.now()};}else if(k.startsWith('session:')&&(papers.some(p=>k==='session:'+p.id)||k==='session:all-wrongs')){if(v===null)continue;const s=safeState(v);if(!s)throw Error('作答进度格式不正确');checked[k]=s;}else if(k.startsWith('history:')&&(papers.some(p=>k==='history:'+p.id)||k==='history:all-wrongs')){if(!Array.isArray(v)||v.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100||!Number.isFinite(x.total)))throw Error('成绩记录格式不正确');checked[k]=v.slice(0,20);}}
pendingImport=checked;showDialog('导入备份',`<p>将导入 ${Object.keys(checked.wrongs||{}).length} 道错题历史，并恢复备份中的作答进度。</p><p class="muted">备份中的同名记录会覆盖当前记录。建议先导出当前备份。</p>`,'<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-import">确认导入</button>');}catch(e){toast('无法导入：'+e.message);}}
let pendingImport=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
switch(action){case'clear-wrongs':clearWrongDialog();break;case'confirm-clear-wrongs':write('wrongs',{});forget('session:all-wrongs');for(const p of papers){const s=read('session:'+p.id,null);if(s?.kind==='wrongs')forget('session:'+p.id);}state=null;current=[];review=false;reviewIds=null;closeDialog();intro();toast('全部错题及已掌握历史已清空');break;case'study-one':stash();startStudy([b.dataset.id]);break;case'begin-study':{stash();const range=$('input[name=range]:checked')?.value;startStudy(paper().questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id));break;}case'study-wrongs':stash();startStudy(activeWrongs(D.page==='wrongs'?null:D.paperId));break;case'study-prev':studyMove(studyIndex-1);break;case'study-next':studyMove(studyIndex+1);break;case'study-reveal':studyReveal=!studyReveal;renderStudy();break;case'study-jump':closeDialog();studyMove(Number(b.dataset.index));break;case'study-grid':showDialog('背题目录',`<div class="answer-grid">${studyIds.map((id,i)=>`<button class="grid-q ${i===studyIndex?'current':''}" data-action="study-jump" data-index="${i}">${all[id].number}</button>`).join('')}</div>`,'<button class="btn" data-action="close-dialog">返回背题</button>');break;case'close-dialog':closeDialog();break;case'begin-paper':{const p=paper(),range=$('input[name=range]:checked')?.value;begin(p.questions.filter(q=>range!=='operations'||q.number>=141).map(q=>q.id),range==='operations'?'operations':'full');break;}case'begin-wrongs':begin(activeWrongs(D.page==='wrongs'?null:D.paperId),'wrongs');break;case'confirm-new':if(pending){const v=pending;pending=null;begin(v.ids,v.kind,true);}break;case'resume':resume();break;case'previous':navigate(Math.max(0,state.index-1));break;case'next':if(state.index===navList().length-1)submitDialog();else navigate(state.index+1);break;case'grid':grid();break;case'jump':closeDialog();navigate(Number(b.dataset.index));break;case'submit-dialog':submitDialog();break;case'submit':submit();break;case'result':review=false;reviewIds=null;state.index=0;save();result();window.scrollTo(0,0);break;case'intro':review=false;intro();window.scrollTo(0,0);break;case'review-all':case'review-wrong':review=true;reviewIds=action==='review-wrong'?C.grade(current,state.answers).wrongIds:null;state.index=0;renderQuestion();window.scrollTo(0,0);break;case'retry':begin(C.grade(current,state.answers).wrongIds,'wrongs',true);break;case'restore':{const w=wrongs();if(w[b.dataset.id]){w[b.dataset.id].masteredAt=null;write('wrongs',w);intro();toast('已重新加入待复习');}break;}case'export':try{exportProgress();}catch{toast('当前浏览器无法导出，请换用系统浏览器');}break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){for(const[k,v]of Object.entries(pendingImport))write(k,v);pendingImport=null;closeDialog();home();toast('备份已导入');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';return;}if(e.target.name!=='answer'||!state||state.submitted||review)return;const q=all[state.ids[state.index]],label=e.target.value;let selected=state.answers[q.id]||[];selected=q.type==='多选题'?(e.target.checked?[...new Set([...selected,label])]:selected.filter(x=>x!==label)):[label];if(selected.length)state.answers[q.id]=selected;else delete state.answers[q.id];save();document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const meta=$('.quiz-meta');if(meta)meta.innerHTML=`已答 ${answeredCount()} / ${state.ids.length} 题 · <span id="timer">${time(state.elapsedMs)}</span>`;const bar=$('.progress-track>span');if(bar)bar.style.width=answeredCount()/state.ids.length*100+'%';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stash();tick=Date.now();});window.addEventListener('pagehide',stash);
setInterval(()=>{if(studying||!state||state.submitted||review||document.hidden){tick=Date.now();return;}const now=Date.now();state.elapsedMs+=Math.min(5000,Math.max(0,now-tick));tick=now;if($('#timer'))$('#timer').textContent=time(state.elapsedMs);if(Math.floor(state.elapsedMs/1000)%10===0)save();},1000);
window.addEventListener('storage',()=>{if(studying)return;if(D.page==='home')home();else if(!state||state.submitted)intro();});
if(D.page==='home')home();else intro();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register(D.page==='paper'?'../sw.js':'sw.js').catch(()=>{}));
})();
</script></body></html>
